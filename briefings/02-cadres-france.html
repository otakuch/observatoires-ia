// ============================================================================
function setupBriefActions() {
  const actionsBar = document.getElementById("brief-actions");
  if (!actionsBar) return; // not a briefing page

  const modal = document.getElementById("brief-modal");
  const pdfContainer = document.getElementById("brief-pdf");
  if (!modal || !pdfContainer) return;

  // ---------- Helpers ----------
  function getText(key) {
    return window.t ? window.t(key) : key;
  }
  function getEl(selector) {
    return document.querySelector(selector);
  }
  function safeText(selector) {
    const el = getEl(selector);
    return el ? el.textContent.trim() : "";
  }
  function safeHtml(selector) {
    const el = getEl(selector);
    return el ? el.innerHTML : "";
  }

  // Detect prefix from page (b1, b2, b3) by scanning data-i18n keys
  function detectPrefix() {
    const t = document.querySelector("[data-i18n^='b1.']") ? "b1" :
              document.querySelector("[data-i18n^='b2.']") ? "b2" :
              document.querySelector("[data-i18n^='b3.']") ? "b3" : null;
    return t;
  }

  const prefix = detectPrefix();

  // ---------- Build concise PDF body ----------
  function buildPdfHtml() {
    const today = new Date();
    const dateStr = today.toLocaleDateString(
      window.CURRENT_LANG === "en" ? "en-US" : "fr-FR",
      { year: "numeric", month: "long", day: "numeric" }
    );

    const heroTitle = safeText(".brief-hero-title");
    const heroSub = safeText(".brief-hero-sub");
    const meta = Array.from(document.querySelectorAll(".brief-hero-meta span"))
      .map(s => s.textContent.trim()).filter(Boolean).join(" · ");

    // ROLES: collect role names (h3 inside .brief-role)
    const roles = Array.from(document.querySelectorAll(".brief-role h3, .brief-role-title"))
      .slice(0, 6)
      .map(h => h.textContent.trim())
      .filter(Boolean);

    // ARCHETYPES: collect arch-name + arch-tag
    const archetypes = Array.from(document.querySelectorAll(".brief-arch-card"))
      .map(card => {
        const name = card.querySelector(".brief-arch-name");
        const tag = card.querySelector(".brief-arch-tag");
        return name ? { name: name.textContent.trim(), tag: tag ? tag.textContent.trim() : "" } : null;
      })
      .filter(Boolean);

    // DEBATE: collect 3 positions
    const debatePositions = Array.from(document.querySelectorAll(".brief-debate-pos"))
      .map(pos => {
        const tag = pos.querySelector(".brief-debate-pos-tag");
        const claim = pos.querySelector(".brief-debate-pos-claim");
        return claim ? {
          tag: tag ? tag.textContent.trim() : "",
          claim: claim.textContent.trim()
        } : null;
      })
      .filter(Boolean);
    const debateSector = safeText(".brief-debate-sector-title");

    // TCO + Sovereignty takeaways (keep them short)
    const tcoTakeaway = safeText(".brief-tco-takeaway");
    const sovTakeaway = safeText(".brief-sov-takeaway");

    // Final action takeaway
    const archTakeaway = safeText(".brief-archetypes-takeaway");

    // Build URL canonical
    const url = window.location.origin + window.location.pathname;

    let html = `
      <header class="pdf-head">
        <div class="pdf-eyebrow">observatoire<span class="b">[s]</span>·ia <span class="dot">·</span> ${getText("brief.pdf.heading")}</div>
        <h1 class="pdf-title">${heroTitle}</h1>
        <div class="pdf-meta">${meta}</div>
        <div class="pdf-byline">${getText("brief.pdf.author")} <span class="dot">·</span> ${getText("brief.pdf.published")} ${dateStr}</div>
      </header>

      <section class="pdf-section">
        <h2>${getText("brief.pdf.summary")}</h2>
        <p>${heroSub}</p>
      </section>
    `;

    if (roles.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.roles")}</h2>
        <ul class="pdf-list">
          ${roles.map(r => `<li>${r}</li>`).join("")}
        </ul>
      </section>
      `;
    }

    if (archetypes.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.archetypes")}</h2>
        <ul class="pdf-list">
          ${archetypes.map(a => `<li><strong>${a.name}</strong>${a.tag ? ` <span class="pdf-tag">${a.tag}</span>` : ""}</li>`).join("")}
        </ul>
      </section>
      `;
    }

    if (debatePositions.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.debate")}</h2>
        <ul class="pdf-list">
          ${debatePositions.map(p => `<li><strong>${p.tag}</strong> · ${p.claim}</li>`).join("")}
        </ul>
        ${debateSector ? `<p class="pdf-callout">${debateSector}</p>` : ""}
      </section>
      `;
    }

    if (tcoTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.tco")}</h2>
        <p>${tcoTakeaway}</p>
      </section>
      `;
    }

    if (sovTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.sov")}</h2>
        <p>${sovTakeaway}</p>
      </section>
      `;
    }

    if (archTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.action")}</h2>
        <p>${archTakeaway}</p>
      </section>
      `;
    }

    html += `
      <footer class="pdf-foot">
        <div class="pdf-foot-url">${getText("brief.pdf.url")}: <a href="${url}">${url}</a></div>
        <div class="pdf-foot-license">${getText("brief.pdf.foot")}</div>
      </footer>
    `;

    return html;
  }

  // ---------- Modal control ----------
  function openModal() {
    pdfContainer.innerHTML = buildPdfHtml();
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  // ---------- Print ----------
  function doPrint() {
    // Use browser native print with a print-only stylesheet that hides everything except #brief-pdf
    document.body.classList.add("printing-pdf");
    window.print();
    setTimeout(() => document.body.classList.remove("printing-pdf"), 500);
  }

  // ---------- Mail ----------
  function sendByMail() {
    const heroTitle = safeText(".brief-hero-title");
    const heroSub = safeText(".brief-hero-sub");
    const url = window.location.origin + window.location.pathname;
    const isFr = (window.CURRENT_LANG !== "en");

    const subject = isFr
      ? `observatoire[s]·ia · ${heroTitle}`
      : `observatoire[s]·ia · ${heroTitle}`;

    const bodyLines = isFr ? [
      `Bonjour,`,
      ``,
      `Je vous transmets ce briefing sectoriel publié par observatoire[s]·ia :`,
      ``,
      heroTitle,
      ``,
      heroSub,
      ``,
      `Lecture intégrale : ${url}`,
      ``,
      `Données ouvertes (CC BY 4.0) et méthodologie sur observatoire.naullynicolas.ch`,
      ``,
      `Bien cordialement,`
    ] : [
      `Hello,`,
      ``,
      `Sharing this sectoral briefing published by observatoire[s]·ia:`,
      ``,
      heroTitle,
      ``,
      heroSub,
      ``,
      `Full reading: ${url}`,
      ``,
      `Open data (CC BY 4.0) and methodology on observatoire.naullynicolas.ch`,
      ``,
      `Best regards,`
    ];

    const mailto = "mailto:?subject=" + encodeURIComponent(subject)
                 + "&body=" + encodeURIComponent(bodyLines.join("\n"));
    window.location.href = mailto;
  }

  // ---------- Copy link ----------
  function copyLink() {
    const url = window.location.origin + window.location.pathname;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        showToast(getText("brief.copy.ok"));
      }).catch(() => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();

    document.body.removeChild(ta);
  }
  function showToast(message) {
    let toast = document.getElementById("brief-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "brief-toast";
      toast.className = "brief-toast";
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add("is-visible");
    setTimeout(() => toast.classList.remove("is-visible"), 2000);
  }

  modal.querySelectorAll("[data-modal-close]").forEach(el => {
    el.addEventListener("click", closeModal);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.getAttribute("aria-hidden") === "false") {
      closeModal();
    }
  });
}

    "b2.arch.a2.tag": "Risque · éthique",
    "b2.arch.a2.name": "Le travailleur dominé",
    "b2.arch.a2.body": "L'autonomie et les compétences sont contraintes par le contrôle algorithmique. Pour les cadres français, ce risque apparaît quand les managers sont notés sur leur conformité aux recommandations IA, quand les performances sont évaluées par des indicateurs IA-générés, ou quand les promotions dépendent d'un score d'usage IA. RGPD et NIS2 encadrent partiellement, mais l'opacité des systèmes IA crée des zones grises stratégiques. <strong>Recommandation : auditer les outils RH augmentés par IA pour détecter les biais et les pratiques de domination algorithmique avant qu'ils ne fassent l'objet de contestations syndicales ou prud'homales.</strong>",
    "b2.arch.a3.tag": "Cible principale",
    "b2.arch.a3.name": "Le travailleur augmenté",
    "b2.arch.a3.body": "L'IA améliore la performance individuelle sans remplacer la décision humaine. C'est la cible naturelle des cadres en finance, conseil, droit et tech : déléguer à l'IA la synthèse documentaire, la recherche jurisprudentielle, le premier projet de modélisation, pour libérer du temps de jugement. Brynjolfsson 2025 documente +15% de gain concentré sur les juniors (signal d'augmentation). <strong>Mais attention au coût cognitif documenté</strong> : Lee et al. 2025 (Microsoft + CMU) sur l'affaiblissement de la pensée critique, étude MIT Klopfer 2024 (groupe ChatGPT n'a rien retenu en programmation), MIT brain imaging 2025 (paresse neurale). La règle est claire : <strong>discipline d'usage</strong>, pas usage compulsif. Stephen Klein résume : think before you prompt, question AI instead of accepting answers, go deeper not faster.",
    "b2.arch.a4.tag": "Cible stratégique",
    "b2.arch.a4.name": "Le travailleur réhumanisé",
    "b2.arch.a4.body": "L'IA libère du temps pour des activités plus distinctement humaines : jugement complexe, négociation, accountability réglementaire, accompagnement des équipes, créativité stratégique. C'est la cible la plus exigeante mais la plus protectrice contre la commoditisation cognitive. Pour les cadres français, elle correspond aux fonctions human-intrinsic au sens de Trammell : consultance qui vend du jugement, avocat qui porte la responsabilité face au client, manager qui incarne l'accountability. <strong>Cette cible exige de redéfinir les indicateurs de performance</strong> pour récompenser la qualité relationnelle et le jugement, pas la vélocité de production de livrables.",
    "b2.arch.closing": "<strong>Pour les DRH françaises en 2026</strong>, le cadre Ferguson permet de sortir du débat binaire qui dominait 2025 (couper ou garder les juniors). Chaque poste cadre est analysé en termes d'archétype actuel et d'archétype cible, avec une trajectoire RH explicite. La décision n'est plus de juger des effectifs globaux, c'est de piloter une transformation par fonction. Combiné au cadre Iansiti sur les conditions du gain réel (streamlining préalable + contexte partagé + objectifs simples à évaluer), et à la règle de discipline d'Alexandre/Babeau (les forts deviennent plus productifs, les faibles risquent la dépendance), c'est le triptyque méthodologique de la transformation cadre 2026-2030.",
    "b2.arch.eyebrow": "Cartographie sociologique · 4 manières de vivre l'IA au travail",
    "b2.arch.title": "Le travailleur remplacé, dominé, augmenté ou réhumanisé · <em>quel cadre construit-on ?</em>",
    "b2.arch.lede": "La typologie de Yann Ferguson (LaborIA Explorer, ICAM Toulouse), validée par les retours terrain de 200+ entreprises françaises depuis 2023, propose quatre figures de travailleur face à l'IA. Pour les directions RH françaises, ce cadre est plus actionnable qu'un pourcentage agrégé d'exposition : il oblige à arbitrer activement, fonction par fonction, l'archétype que l'on construit.",
    "b2.arch.a1.tag": "Attrition silencieuse",
    "b2.arch.a1.name": "Le travailleur remplacé",
    "b2.arch.a1.body": "L'automatisation discrète qui réduit l'emploi par non-renouvellement de départs naturels, plutôt que par licenciement collectif. Sans plan social, sans communication interne, sans contrepartie. Le poste disparaît à mesure que les départs en retraite et les démissions ne sont plus remplacés. Mécanisme dominant en France en 2026 selon Ferguson, parce que politiquement moins coûteux qu'un PSE.",
    "b2.arch.a1.signal": "<strong>Périmètre exposé :</strong> juniors finance/comptabilité, paralégaux de premier niveau, analystes marketing entrants, développeurs sur stack standard. <strong>Signal d'alerte RH :</strong> volume de recrutement entry-level qui chute discrètement de 20-30% sans annonce explicite.",
    "b2.arch.a2.tag": "Contrôle algorithmique",
    "b2.arch.a2.name": "Le travailleur dominé",
    "b2.arch.a2.body": "L'IA devient l'arbitre invisible du travail. Le cadre suit des recommandations qu'il ne comprend pas, valide des scoring qu'il n'a pas calculés, exécute un script qui définit son rythme et ses priorités. L'autonomie professionnelle se rétrécit, l'expertise propre se dévalue. Phénomène déjà documenté dans les fonctions support, en train d'atteindre les fonctions managériales intermédiaires.",
    "b2.arch.a2.signal": "<strong>Périmètre exposé :</strong> middle management sous outils de pilotage IA, recruteurs sous scoring automatique de candidats, chefs de projet sous priorisation algorithmique des tâches. <strong>Signal d'alerte RH :</strong> dégradation rapide des indicateurs d'engagement et perte de cadres expérimentés vers la concurrence.",
    "b2.arch.a3.tag": "Performance augmentée",
    "b2.arch.a3.name": "Le travailleur augmenté",
    "b2.arch.a3.body": "L'IA libère le cadre des tâches à faible valeur (synthèse documentaire, recherche réglementaire de premier niveau, génération de comptes rendus, code standard) pour qu'il se concentre sur le jugement, la négociation, l'accountability. Brynjolfsson 2025 documente +15% de performance pour les juniors disciplinés. Mais nouvelles compétences requises, et risques cognitifs réels (sédation Microsoft/CMU, dépendance) si la discipline d'usage est absente.",
    "b2.arch.a3.signal": "<strong>Périmètre exposé :</strong> consultants juniors et seniors, juristes d'entreprise, contrôleurs de gestion, ingénieurs avant-vente, chefs de produit. <strong>Signal d'alerte RH :</strong> écart de productivité qui se creuse entre cadres disciplinés et cadres en sédation cognitive (visible à 6-12 mois).",
    "b2.arch.a4.tag": "Recentrage humain",
    "b2.arch.a4.name": "Le travailleur réhumanisé",
    "b2.arch.a4.body": "L'IA absorbe les tâches transactionnelles et libère du temps pour la créativité, l'empathie, l'accompagnement, la pédagogie. Le cadre redevient ce qu'il prétend être dans son discours managérial : un coach, un médiateur, un accompagnateur. Mais cette issue est ambiguë selon Ferguson : elle peut basculer en travailleur dominé si elle n'est pas pilotée explicitement.",
    "b2.arch.a4.signal": "<strong>Périmètre concerné :</strong> DRH face à des transformations sociales, formateurs internes, médiateurs de conflits, managers de proximité, coachs internes. <strong>Signal positif RH :</strong> temps de qualité relationnelle en hausse, indicateurs de climat social en amélioration durable.",
    "b2.arch.takeaway": "<strong>Pour les directions RH et les comités exécutifs français</strong>, ces quatre archétypes ne sont pas équiprobables. Ils résultent de choix RH explicites : conception des fiches de poste, politique de formation, indicateurs de performance retenus, marges de manœuvre laissées aux cadres face à l'outil IA. Une organisation qui laisse le marché et les éditeurs IA décider à sa place finit avec un mélange remplacé + dominé, par défaut. Une organisation qui pilote activement vise un mélange augmenté + réhumanisé. <em>Le pivot 2026 n'est pas technologique, il est sociologique.</em> Et c'est précisément la responsabilité des DRH, pas des DSI.",
    "b2.debate.eyebrow": "Le débat IA et travail · trois positions structurantes",
    "b2.debate.title": "Trois lectures du même phénomène, <em>trois plans RH radicalement différents</em>.",
    "b2.debate.lede": "Le débat sur l'IA et l'emploi des cadres est traversé par trois positions intellectuelles solides qui ne disent pas la même chose, ni au même horizon. Les cadres français en finance, conseil, droit et tech sont précisément le périmètre que la position pessimiste cible. Pour une direction RH ou un comité exécutif, retenir l'une plutôt que l'autre change la stratégie de recrutement, le plan de formation continue, et le calendrier d'investissement IA.",

    "b2.debate.p1.tag": "Position pessimiste",
    "b2.debate.p1.author": "Dario Amodei (Anthropic) · Mustafa Suleyman (Microsoft AI)",
    "b2.debate.p1.claim": "L'IA va éliminer 50% des cadres entrants en finance, conseil, droit et tech, en 1 à 5 ans.",
    "b2.debate.p1.body": "Pour Amodei, l'IA progresse simultanément dans tous les secteurs cognitifs, ce qui supprime les bassins d'emploi adjacents qui absorbaient historiquement les travailleurs déplacés. Suleyman estime que la plupart des tâches cadres seront automatisées en 12 à 18 mois (avocat, comptable, project manager, marketing). <strong>Cette position vise directement les cadres français du tertiaire avancé</strong>. Si elle est correcte, elle implique un gel immédiat des recrutements de juniors, une restructuration agressive des pyramides hiérarchiques (moins de juniors, plus de seniors-directeurs), et un investissement massif en architectures IA-first. Les organisations qui retiennent cette lecture sont en train de revoir leurs plans de hiring 2026-2027 dans ce sens.",

    "b2.debate.p2.tag": "Position empirique",
    "b2.debate.p2.author": "Pieter Garicano (Silicon Continent) · Brynjolfsson (Stanford) · NY Fed · Yann LeCun (Meta)",
    "b2.debate.p2.claim": "La tâche n'est pas le job. Le bundle survit, recomposé.",
    "b2.debate.p2.body": "Garicano développe l'argument structurel : un job est un bundle de tâches, pas une somme de tâches automatisables. Quand l'IA prend la tâche faible du bundle (synthèse documentaire, requête juridique standard, modélisation de base, code de premier niveau), elle laisse au cadre la tâche forte (jugement, négociation, accountability, gestion des cas non standards). Les données NY Fed avril 2026 confirment cette logique empirique : la majorité des firmes adoptant l'IA forment leur personnel existant plutôt que de couper. Brynjolfsson 2025 documente +15% de gain concentré sur les juniors (signal d'augmentation, pas de substitution). Becker et al. 2025 mesure même -19% de productivité pour les seniors expérimentés sur codebases familières quand ils utilisent l'IA générative trop activement. <strong>Hollow out the entry level, you hollow out the pipeline</strong> : la pyramide des cadres se forme par accumulation de jugement, qui se construit en faisant les tâches que l'IA va prendre.",

    "b2.debate.p3.tag": "Position macroéconomique",
    "b2.debate.p3.author": "Philip Trammell (Stanford) · Korinek (NBER) · Papanikolaou (Northwestern)",
    "b2.debate.p3.claim": "Les biens human-intrinsic protègent structurellement la part travail.",
    "b2.debate.p3.body": "Trammell formalise pourquoi la part travail peut rester élevée même dans un scénario de pleine automatisation. La thèse repose sur les biens human-intrinsic : concerts, performances, soin, accompagnement, formation directe, où la présence humaine fait partie de la définition même du bien. <strong>Pour les fonctions cadres françaises</strong>, le cadre s'applique partiellement mais réellement : la consultance qui vend du jugement, l'avocat qui porte la responsabilité face au client, le manager qui incarne l'accountability auprès des équipes, le formateur direct, le DRH qui négocie le délicat. Sont human-intrinsic. Sont protégées. Le scoring RH automatisé, la rédaction de comptes rendus, la synthèse documentaire : ne le sont pas. Papanikolaou (Northwestern) confirme empiriquement les effets compensatoires sur l'emploi cadre.",

    "b2.debate.sec.tag": "Implication sectorielle · cadres français",
    "b2.debate.sec.title": "Le pivot RH 2026 n'est pas <em>combien couper</em>, c'est <em>quelles tâches recomposer</em>.",
    "b2.debate.sec.body": "Pour une direction RH ou un comité exécutif français en 2026, la convergence prudente des trois positions donne une lecture actionnable. La position d'Amodei <em>est probablement trop catégorique</em> sur le calendrier (1 à 5 ans) et le pourcentage (50%), mais elle pointe une réalité : les juniors qui ne font que de la synthèse documentaire ou du templating juridique standard sont effectivement vulnérables. La position de Garicano <em>donne le bon angle d'analyse</em> : il faut décomposer chaque poste cadre en bundle de tâches, identifier la tâche forte qui produit la vraie valeur, et redéfinir la fiche de poste autour de cette tâche forte. La position de Trammell <em>identifie les fonctions structurellement protégées</em> : tout ce qui est jugement, accountability, présence, négociation. <strong>Les organisations qui en 2026 gèlent leurs recrutements juniors sans repenser le bundle des seniors prennent un risque double</strong> : elles perdent le pipeline de jugement qui se construit en faisant, et elles sous-utilisent l'augmentation IA des juniors qui est précisément documentée comme la plus efficace (Brynjolfsson +15%). La décision RH 2026 est de <em>recomposer les fiches de poste</em>, pas de couper la pyramide.",

    "b2.tco.eyebrow": "Économie des coûts · le facteur ignoré",
    "b2.tco.title": "Le coût réel de l'IA pour les fonctions cadres en France, <em>au-delà du prix par token</em>.",
    "b2.tco.lede": "Les budgets POC d'IA des grandes entreprises françaises reposent souvent sur le prix d'inférence affiché. Mais en production, les coûts d'orchestration, de gouvernance, de supervision et d'évaluation des outputs font basculer l'équation. Pour les fonctions cadres traitées par IA (analyse RH, scoring, synthèse), les coûts cachés sont structurels.",
    "b2.tco.s1.label": "Erreur potentielle de calcul des coûts GenAI selon Gartner si le passage à l'échelle n'est pas anticipé",
    "b2.tco.s1.source": "Gartner · oct 2024",
    "b2.tco.s2.label": "Des CIO indiquent un breakeven ou une perte sur leurs investissements IA en 2024",
    "b2.tco.s2.source": "Gartner · oct 2024",
    "b2.tco.s3.label": "Coût par résolution GenAI prédit dans le service client en 2030, supérieur aux agents offshore",
    "b2.tco.s3.source": "Gartner · janv 2026",
    "b2.tco.takeaway": "<strong>Pour les directions RH et les équipes formation des grandes entreprises françaises</strong>, le risque pratique : les comités exécutifs voient le prix par token publié par OpenAI ou Anthropic et déduisent qu'on peut substituer du juniorat à coût marginal. La réalité Brynjolfsson 2025 (gain +15% concentré sur les juniors) et Becker 2025 (-19% pour les seniors expérimentés sur codebases familières) impose une nuance que le TCO seul ne capture pas : l'IA augmente les juniors et freine les seniors. Avant tout plan de réduction d'effectif sur la base d'un POC IA, le cadre TCO de Tomer (avril 2026) et notre <a href=\"../methodologie.html#tco\">section méthodologique 07</a> sont indispensables.",

    "b2.sov.eyebrow": "Souveraineté numérique · juridiction et résidence des données",
    "b2.sov.title": "Pour les cadres et les DRH français, <em>la souveraineté n'est pas un luxe, c'est un actif</em>.",
    "b2.sov.lede": "Le RGPD, la directive NIS2 et le futur EU AI Act imposent aux organisations françaises une rigueur sur la résidence des données et la traçabilité des décisions automatisées. Pour les fonctions cadres traitées par IA (analyse RH, scoring de candidats, synthèse stratégique, accompagnement de carrière), le choix d'un fournisseur LLM est devenu un acte de conformité.",
    "b2.sov.s1.tag": "France",
    "b2.sov.s1.name": "Mistral AI · La Plateforme + Le Chat Pro",
    "b2.sov.s1.body": "Mistral AI (FR, Paris) traite toutes les requêtes API dans des data centers européens. SOC 2 Type II, alignement EU AI Act, garantie contractuelle de non-utilisation des données client pour l'entraînement. Levée de 830 M$ de dette en mars 2026 auprès de 7 banques européennes pour un data center souverain à Bruyères-le-Châtel (44 MW Q2 2026, 200 MW européens d'ici 2027). Pour une entreprise française qui veut traiter ses données RH ou stratégiques sans risque CLOUD Act, c'est aujourd'hui l'option la plus mature.",
    "b2.sov.s2.tag": "Europe",
    "b2.sov.s2.name": "Aleph Alpha (DE) · PhariaAI · LightOn (FR) · Apertus (CH)",
    "b2.sov.s2.body": "L'écosystème souverain européen 2026 dépasse Mistral. Aleph Alpha (DE) a pivoté vers PhariaAI, un OS souverain pour le secteur public allemand. LightOn (FR) excelle en raisonnement long-contexte sur documents. H Company (FR) pousse les modèles d'usage informatique. Apertus (CH, EPFL/ETH/CSCS) est le premier LLM public fully open conforme à l'EU AI Act. Pour des cas d'usage spécifiques (recherche documentaire massive, conformité publique, transparence totale), ces alternatives sont opérationnelles.",
    "b2.sov.s3.tag": "Risque",
    "b2.sov.s3.name": "Le coût caché de la dépendance aux hyperscalers US",
    "b2.sov.s3.body": "Le CLOUD Act américain peut s'appliquer aux données stockées chez un opérateur US même hébergées en Europe. Pour une grande entreprise française qui traite des données RH sensibles ou des informations stratégiques par IA, le risque réglementaire (RGPD, NIS2, futur AI Act) et le risque de vendor lock-in deviennent des composantes du TCO réel. 90% des CIO interrogés par Gartner indiquent que la gestion des coûts limite la valeur tirée de l'IA : ajouter le coût d'une violation de conformité change l'arbitrage.",
    "b2.sov.takeaway": "<strong>Pour les comités exécutifs et les DRH français</strong>, la grille de décision intègre désormais quatre dimensions : capacité technique, TCO réel à 36 mois, juridiction de la donnée, et risque de lock-in. La question n'est plus seulement « combien coûte le token » mais « combien coûte le ticket de sortie en cas de pivot réglementaire ». Pour les fonctions cadres et la formation continue, l'option Mistral + Apertus offre une couverture sovereign-first qui mérite d'être évaluée dès la phase de POC, pas après.",
    "b2.disc.tag": "Disclosure",
    "b2.disc.body": "Ce dossier a été produit avec l'assistance d'une intelligence artificielle (Claude Opus 4.7, en modes Research et Web Search), puis soumis à une vérification factuelle contre les sources primaires. L'IA a servi d'outil de documentation, de synthèse et de mise en forme visuelle, pas de source autonome ni d'autorité scientifique. Détail méthodologique en <a href=\"../methodologie.html\">section 09 de la page Méthodologie</a>.",

    "b2.back": "Toutes les dépêches"
  },

    "b2.title": "French executives facing AI: the decade of <em>repolarisation</em>.",
    "b2.sub": "The French executive market is not collapsing. It is polarising. Strategic functions that rely on judgement and arbitration are gaining value. Those that formalised processes are contracting. Here is the cartography HR leaders need.",
    "b2.by.author": "Naully Nicolas",
    "b2.by.read": "8 minute read",

    "b2.land.eyebrow": "The landscape",
    "b2.land.title": "How the executive market is being redrawn in 2026.",
    "b2.land.p1": "The French executive market is going through its first real AI-related fracture in 2026. Aggregate figures remain stable: APEC posting volume slightly up, employment rate still above 95% for grandes écoles graduates. But beneath this surface stability, the composition is changing deeply.",
    "b2.land.p2": "Functions with high judgement intensity (arbitration, negotiation, political reading of a file) are pulling compensation upward. Functions with high procedural intensity (note production, standardised reports, formal process tracking) are seeing their volume decline or their experience requirements rise. The repolarisation is measurable sector by sector, function by function.",

    "b2.land.up.title": "What gains value",
    "b2.land.up.li1": "<strong>Strategic leadership and arbitration.</strong> Executive committees, what AI cannot replace for lack of political mandate.",
    "b2.land.up.li2": "<strong>High-value client relationships.</strong> Major group accounts, complex negotiation, premium B2B sales.",
    "b2.land.up.li3": "<strong>Augmented compliance roles.</strong> Key people able to arbitrate between legal, technical and operational frameworks.",
    "b2.land.up.li4": "<strong>Operational management.</strong> Leading a human team remains a rare and premium skill.",

    "b2.land.down.title": "What is contracting",
    "b2.land.down.li1": "<strong>Note and report production.</strong> First drafts are now generated, humans edit. Both volume and required experience level shift.",
    "b2.land.down.li2": "<strong>Standardised market analysis.</strong> Competitive synthesis, generic sector studies, recurring benchmarks.",
    "b2.land.down.li3": "<strong>Junior consulting and audit.</strong> Firms' leverage on early-career profiles is mechanically eroding.",
    "b2.land.down.li4": "<strong>Mass client relationships.</strong> Expertise centres offloaded on transactional and first-level matters.",


    "b2.crit.eyebrow": "Critical reading · three objections to the alarmist narrative",
    "b2.crit.title": "Why the « massive job disappearance » narrative <em>does not hold up</em>.",
    "b2.crit.lede": "Statements from Dario Amodei (Anthropic, 50% of junior white-collar jobs gone in 1-5 years) and Mustafa Suleyman (Microsoft AI, 12-18 months to automate office work) circulate widely in public debate. Three convergent sources in 2026 document why this narrative is empirically fragile and theoretically contestable. This section articulates them for the French executives sector.",
    "b2.crit.t1.title": "Big Tech headcount 2026 ≈ 2022 · despite $700 billion in AI CapEx",
    "b2.crit.t1.body": "The four largest US tech firms have committed over $700 billion in AI CapEx this fiscal year, yet Amazon, Google and Meta today employ approximately the same number of workers as in 2022. R&D expenditures normalized against revenue have <strong>increased</strong> at Meta, Google and Amazon since 2022. Marc Andreessen and Sam Altman themselves acknowledge layoffs primarily reflect pandemic-era over-hiring. Nicole Bachaud (ZipRecruiter) reminds that 163 million US workers make the tech sector a negligible indicator of the broader market. <strong>Consequence for French executive committees and HR leaders</strong>: tech leader announcements are not an actionable signal to calibrate a transformation plan. Real changes happen through executive function recomposition, not their disappearance.",
    "b2.crit.t1.source": "Source · Washington Post May 1, 2026 · NYT Opinion May 3, 2026",
    "b2.crit.t2.title": "An executive job is a bundle of tasks tied to authority",
    "b2.crit.t2.body": "The task-exposure argument assumes a job reduces to the sum of its measurable tasks. But organizations buy bundles: a middle manager combines analytical production, team coordination, priority arbitration, resource allocation, and the exercise of authority. AI can help on each isolated task without replacing the <em>accountability</em> of the whole. This is Garicano's central argument (April 2026) in response to Amodei and Suleyman, who predict 50% of junior white-collar jobs disappeared in 12-18 months. <strong>For French HR leaders, the consequence is clear</strong>: AI transformation does not happen through position elimination proportional to technical exposure rates, but through the recomposition of job profiles around higher-authority-value decisions, and accompaniment of junior executives toward more authoritative bundles.",
    "b2.crit.t2.source": "Source · Luis Garicano · Silicon Continent · April 22, 2026",
    "b2.crit.t3.title": "Theoretically, AI enrichment raises the share of human labor in the long run",
    "b2.crit.t3.body": "Trammell (Stanford Digital Economy Lab, March 2026) formalizes the thesis that under hierarchical consumption preferences, human labor becomes a high income-elasticity good, in other words a luxury. When capital becomes abundant, its share in consumption falls and the share of human-rendered labor rises. If capital and labor are gross complements, infinite capital accumulation does not suffice for growth. <strong>For French executive functions</strong>, the consequence is paradoxical: functions with strong relational, creative, or arbitration components (consulting, training, accompaniment, R&D, project direction) are structurally set to see their value rise as AI enriches society.",
    "b2.crit.t3.source": "Source · Philip Trammell · Stanford Digital Economy Lab · March 27, 2026",
    "b2.num.eyebrow": "By the numbers",
    "b2.num.title": "Three indicators that capture the moment.",
    "b2.num.s1.label": "of executive job postings now mention an explicit AI skill, crossing the one-third threshold for the first time.",
    "b2.num.s1.source": "APEC · Q1 2026",
    "b2.num.s2.label": "drop in job entries for 2024 grandes écoles graduates compared to 2022, at constant structure.",
    "b2.num.s2.source": "CGE · 2025 insertion survey",

    "b2.q.eyebrow": "The expert verdict",
    "b2.q.text": "We no longer recruit for generic executive skills. We recruit for two things: the ability to wield AI as an instrument, and the ability to arbitrate where AI declines to. Profiles covering neither are mechanically downgraded.",
    "b2.q.author": "Chief HR Officer",
    "b2.q.role": "French industrial group · anonymised interview · February 2026",

    "b2.dec.eyebrow": "Decision · 4 questions to settle",
    "b2.dec.title": "What an <em>HR leadership team</em> must address by autumn 2026.",
    "b2.dec.intro": "Four operational trade-offs in order of criticality. None can be fully delegated to line managers or to an external consultancy. All commit the organisation's experience pyramid for five to ten years.",

    "b2.dec.li1": "<strong>Experience pyramid.</strong> If note production and reporting shift to AI, the inherited junior / senior ratio must be rethought. How do we train tomorrow's seniors if we no longer recruit juniors. Strategic skill continuity question.",
    "b2.dec.li2": "<strong>Compensation policy.</strong> Functions with high judgement value will keep inflating. Procedural functions will stagnate. How to manage this gap without breaking internal cohesion.",
    "b2.dec.li3": "<strong>Continuous training.</strong> Mass approach (all executives on AI tools, common base) or targeted (deep-dive path for 20 to 30% of staff). Both are defensible, but incompatible under budget constraints.",
    "b2.dec.li4": "<strong>AI tool governance.</strong> Usage framework, data shared with which platforms, who can decide to integrate a new tool into the workplace. Three roles to clarify: IT, HR, business.",

    "b2.roles.eyebrow": "At the role level",
    "b2.roles.title": "What repolarisation means for <em>five executive functions</em>.",
    "b2.roles.intro": "Market polarisation does not show in aggregate statistics: it shows in the concrete transformation of each function. Five occupations concentrate the bulk of the executive population affected by ongoing shifts in France. For each, what AI displaces in daily work, and the most defensible pivot path according to the observatory's sources.",
    "b2.roles.pivotLabel": "Recommended pivot",
    "b2.roles.footer": "<strong>France total: 285,000 executives affected across the five functions above</strong>. Headcount figures come from APEC and DARES (Q1 2026 notes); exposure scores combine ILO WP140, Brynjolfsson/Stanford 2025 and Felten-Brynjolfsson. The 200 executive and non-executive occupations analysed are accessible in the <a href=\"../observatoires/france.html\" style=\"color: var(--signal); text-decoration: underline;\">France dashboard</a>.",

    "b2.roles.r1.domain": "Finance and control",
    "b2.roles.r1.name": "Management controller",
    "b2.roles.r1.exp": "7.5/10",
    "b2.roles.r1.expLabel": "exposure",
    "b2.roles.r1.head": "72,000",
    "b2.roles.r1.headLabel": "active FR",
    "b2.roles.r1.shift": "Emblematic function of polarisation. Standard reporting, variance calculation and first-tier budget consolidation automate quickly with BI copilots and LLMs on structured datasets. Residual value moves toward strategic analysis, business partnership with operational departments, and mastery of new extra-financial perimeters (CSRD, green taxonomy).",
    "b2.roles.r1.pivot": "Business Intelligence architect (data warehouses, Power BI, augmented dashboards). CSR and impact controller (extra-financial reporting, sustainability). Finance partner and deputy CFO in hybrid finance-strategy role.",

    "b2.roles.r2.domain": "Legal and compliance",
    "b2.roles.r2.name": "Corporate counsel",
    "b2.roles.r2.exp": "7/10",
    "b2.roles.r2.expLabel": "exposure",
    "b2.roles.r2.head": "65,000",
    "b2.roles.r2.headLabel": "active FR",
    "b2.roles.r2.shift": "Standard contract drafting, case-law monitoring, NDA screening and first-pass document analysis benefit from legal LLMs trained on French law. What resists: strategic contract negotiation, complex litigation management, and the new expertise on AI governance itself (AI Act, GDPR, liability for algorithmic outputs).",
    "b2.roles.r2.pivot": "Chief Legal Officer for AI (legal steering of AI projects, AI Act compliance). GDPR and cybersecurity legal specialist (outsourced DPO, compliance audits). AI-assisted contract manager on contractual portfolios.",

    "b2.roles.r3.domain": "Marketing and growth",
    "b2.roles.r3.name": "Digital marketing lead",
    "b2.roles.r3.exp": "8/10",
    "b2.roles.r3.expLabel": "exposure",
    "b2.roles.r3.head": "72,000",
    "b2.roles.r3.headLabel": "active FR",
    "b2.roles.r3.shift": "One of the most exposed executive functions on the market. Content production, ad targeting, SEA-SEO optimisation, scaled personalisation become AI-piloted workflows. The role moves up to tool orchestration, brand strategy that does not automate, and editorial arbitration between AI volume and human signal.",
    "b2.roles.r3.pivot": "AI-augmented CMO (AI tool orchestration, personalisation at scale). Product-Led Growth expert (product activation, virality loops). Brand strategy and positioning consultant, irreplaceable because differentiating.",

    "b2.roles.r4.domain": "Compliance and risk",
    "b2.roles.r4.name": "Compliance officer",
    "b2.roles.r4.exp": "7/10",
    "b2.roles.r4.expLabel": "exposure",
    "b2.roles.r4.head": "18,000",
    "b2.roles.r4.headLabel": "active FR",
    "b2.roles.r4.shift": "Restricted population but in very strong tension. Regulatory monitoring, transaction monitoring, first-tier anti-money-laundering screening automate. What explodes: the need for human auditors for high-risk AI systems that the AI Act explicitly mandates. The function professionalises around rare specialisations (DORA, AI Act, CSRD).",
    "b2.roles.r4.pivot": "AI Act compliance expert (human auditor for high-risk AI systems, very strong demand). AI systems auditor and DORA risk officer. GDPR compliance lead and outsourced DPO for SMEs.",

    "b2.roles.r5.domain": "Financial direction",
    "b2.roles.r5.name": "SME CFO",
    "b2.roles.r5.exp": "7/10",
    "b2.roles.r5.expLabel": "exposure",
    "b2.roles.r5.head": "58,000",

    "b2.roles.r5.shift": "The function keeps its strategic place but its operational load transforms. Reporting, cash forecasting, steering dashboards move to predictive copilots. What resists and gains value: top-cycle operations (LBO, divestiture, refinancing), impact finance, and the strategic partnership role with the executive. The function becomes rarer and more expensive.",
    "b2.roles.r5.pivot": "AI-augmented CFO with real-time steering (AI forecasting, augmented decision). Restructuring and corporate finance expert on LBO operations. Impact CFO (CSRD, ESG reporting, green taxonomy).",

    "b2.sov.eyebrow": "Digital sovereignty · jurisdiction and data residency",
    "b2.sov.title": "For French executives and HR leaders, <em>sovereignty is not a luxury, it is an asset</em>.",
    "b2.sov.lede": "GDPR, the NIS2 directive, and the upcoming EU AI Act impose on French organizations rigorous standards on data residency and traceability of automated decisions. For executive functions handled by AI (HR analysis, candidate scoring, strategic synthesis, career coaching), choosing an LLM vendor has become a compliance act.",
    "b2.sov.s1.tag": "France",
    "b2.sov.s1.name": "Mistral AI · La Plateforme + Le Chat Pro",
    "b2.sov.s1.body": "Mistral AI (FR, Paris) processes all API requests in European data centers. SOC 2 Type II, EU AI Act alignment, contractual guarantee of non-use of customer data for training. $830M debt raise in March 2026 from 7 European banks for a sovereign data center at Bruyères-le-Châtel (44 MW Q2 2026, 200 MW European by 2027). For a French company processing HR or strategic data without CLOUD Act risk, this is today's most mature option.",
    "b2.sov.s2.tag": "Europe",
    "b2.sov.s2.name": "Aleph Alpha (DE) · PhariaAI · LightOn (FR) · Apertus (CH)",
    "b2.sov.s2.body": "The European sovereign ecosystem 2026 extends beyond Mistral. Aleph Alpha (DE) pivoted to PhariaAI, a sovereign OS for the German public sector. LightOn (FR) excels in long-context document reasoning. H Company (FR) pushes computer-use models. Apertus (CH, EPFL/ETH/CSCS) is the first public fully open LLM compliant with the EU AI Act. For specific use cases (massive document search, public sector compliance, full transparency), these alternatives are operational.",
    "b2.sov.s3.tag": "Risk",
    "b2.sov.s3.name": "The hidden cost of US hyperscaler dependence",
    "b2.sov.s3.body": "The US CLOUD Act can apply to data stored with a US operator even hosted in Europe. For a large French company processing sensitive HR data or strategic information via AI, regulatory risk (GDPR, NIS2, upcoming AI Act) and vendor lock-in become components of real TCO. 90% of CIOs surveyed by Gartner say cost management limits the value extracted from AI: adding the cost of a compliance violation changes the trade-off.",
    "b2.sov.takeaway": "<strong>For French executive committees and HR leaders</strong>, the decision grid now integrates four dimensions: technical capability, real 36-month TCO, data jurisdiction, and lock-in risk. The question is no longer just « how much does the token cost » but « how much does the exit ticket cost in case of a regulatory pivot ». For executive functions and continuing education, the Mistral + Apertus option offers sovereign-first coverage worth evaluating from the POC stage, not later.",
    "b2.disc.tag": "Disclosure",
    "b2.disc.body": "This dossier was produced with the assistance of artificial intelligence (Claude Opus 4.7, in Research and Web Search modes), then submitted to factual verification against primary sources. The AI was used as a tool for documentation, synthesis and visual formatting, not as an autonomous source or scientific authority. Methodological details in <a href=\"../methodologie.html\">section 09 of the Methodology page</a>.",

    "b2.arch.eyebrow": "The recomposed worker · 4 archetypes facing AI",
    "b2.arch.title": "Four archetypes to <em>rethink executive job descriptions</em>, not to cut them.",
    "b2.arch.lede": "Sociologist Yann Ferguson, presented at the Strasbourg RNS in April 2026 with Yves Caseau (former Chief Digital Officer Michelin), offers a directly actionable framework for French HR leadership. The practical question is no longer to decide which executive roles to keep or cut, it is to choose which worker archetype the organization wants to produce for each function. Framework derived from his book « Ce que l'intelligence artificielle fait de l'homme au travail ».",
    "b2.arch.a1.tag": "Risk · to avoid",
    "b2.arch.a1.name": "The replaced worker",
    "b2.arch.a1.body": "Automation reduces jobs through silent attrition rather than restructuring plans. For French executive functions, this scenario typically concerns juniors in finance, consulting, law and tech who only do document synthesis or standard templating. Politically easier short-term, but the pyramid empties: impossible to train tomorrow's seniors. <strong>Hollow out the entry level, you hollow out the pipeline.</strong> Iansiti (Harvard) also points out that without prior streamlining of processes, AI cuts simply reproduce existing inefficiencies.",
    "b2.arch.a2.tag": "Risk · ethical",
    "b2.arch.a2.name": "The dominated worker",
    "b2.arch.a2.body": "Autonomy and skills are constrained by algorithmic control. For French executives, this risk appears when managers are scored on their compliance with AI recommendations, when performance is evaluated by AI-generated indicators, or when promotions depend on an AI usage score. GDPR and NIS2 partially frame this, but AI system opacity creates strategic gray zones. <strong>Recommendation: audit AI-augmented HR tools to detect biases and algorithmic domination practices before they face union or labor court challenges.</strong>",
    "b2.arch.a3.tag": "Primary target",
    "b2.arch.a3.name": "The augmented worker",
    "b2.arch.a3.body": "AI improves individual performance without replacing human decision. This is the natural target for executives in finance, consulting, law and tech: delegate to AI the document synthesis, jurisprudence research, first modeling draft, to free up judgment time. Brynjolfsson 2025 documents +15% gain concentrated on juniors (augmentation signal). <strong>But beware of the documented cognitive cost</strong>: Lee et al. 2025 (Microsoft + CMU) on the weakening of critical thinking, MIT Klopfer 2024 study (ChatGPT group remembered nothing in programming), MIT brain imaging 2025 (neural laziness). The rule is clear: <strong>usage discipline</strong>, not compulsive use. Stephen Klein summarizes: think before you prompt, question AI instead of accepting answers, go deeper not faster.",
    "b2.arch.a4.tag": "Strategic target",
    "b2.arch.a4.name": "The rehumanized worker",
    "b2.arch.a4.body": "AI frees time for more distinctly human activities: complex judgment, negotiation, regulatory accountability, team support, strategic creativity. This is the most demanding but most protective target against cognitive commoditization. For French executives, it corresponds to the human-intrinsic functions in Trammell's sense: consulting that sells judgment, the lawyer who carries responsibility before the client, the manager who embodies accountability. <strong>This target requires redefining performance indicators</strong> to reward relational quality and judgment, not deliverable production velocity.",
    "b2.arch.closing": "<strong>For French HR leadership in 2026</strong>, the Ferguson framework allows exiting the binary debate that dominated 2025 (cut or keep juniors). Each executive role is analyzed in terms of current archetype and target archetype, with an explicit HR trajectory. The decision is no longer to judge global headcount, it is to steer a transformation by function. Combined with the Iansiti framework on the conditions for real gain (prior streamlining + shared context + simple-to-evaluate goals), and the Alexandre/Babeau discipline rule (the strong become more productive, the weak risk dependency), this is the methodological triptych of the 2026-2030 executive transformation.",
    "b2.arch.eyebrow": "Sociological mapping · 4 ways of living AI at work",
    "b2.arch.title": "The replaced, dominated, augmented or rehumanized worker · <em>which executive are we building?</em>",
    "b2.arch.lede": "Yann Ferguson's typology (LaborIA Explorer, ICAM Toulouse), validated by field returns from 200+ French companies since 2023, proposes four worker figures facing AI. For French HR leaders, this framework is more actionable than an aggregate exposure percentage: it forces active arbitrage, role by role, of the archetype being built.",
    "b2.arch.a1.tag": "Silent attrition",
    "b2.arch.a1.name": "The replaced worker",
    "b2.arch.a1.body": "Quiet automation reducing employment through non-replacement of natural departures, rather than visible mass layoffs. No restructuring plan, no internal communication, no compensation. The role disappears as retirements and resignations are no longer replaced. Dominant mechanism in France in 2026 according to Ferguson, because politically less costly than a formal restructuring.",
    "b2.arch.a1.signal": "<strong>Exposed perimeter:</strong> finance/accounting juniors, first-level paralegals, entry-level marketing analysts, developers on standard stacks. <strong>HR warning signal:</strong> entry-level hiring volume quietly dropping 20-30% without explicit announcement.",
    "b2.arch.a2.tag": "Algorithmic control",
    "b2.arch.a2.name": "The dominated worker",
    "b2.arch.a2.body": "AI becomes the invisible arbiter of work. The executive follows recommendations they do not understand, validates scoring they did not compute, executes a script that defines their rhythm and priorities. Professional autonomy shrinks, individual expertise is devalued. Phenomenon already documented in support functions, now reaching middle management.",
    "b2.arch.a2.signal": "<strong>Exposed perimeter:</strong> middle management under AI piloting tools, recruiters under automatic candidate scoring, project leaders under algorithmic task prioritization. <strong>HR warning signal:</strong> rapid deterioration of engagement indicators and loss of experienced executives to competitors.",
    "b2.arch.a3.tag": "Augmented performance",
    "b2.arch.a3.name": "The augmented worker",
    "b2.arch.a3.body": "AI frees the executive from low-value tasks (document synthesis, first-level regulatory research, report generation, standard code) so they can focus on judgment, negotiation, accountability. Brynjolfsson 2025 documents +15% performance for disciplined juniors. But new skills required, and real cognitive risks (Microsoft/CMU sedation, dependence) emerge if usage discipline is absent.",
    "b2.arch.a3.signal": "<strong>Exposed perimeter:</strong> junior and senior consultants, corporate lawyers, management controllers, pre-sales engineers, product managers. <strong>HR warning signal:</strong> productivity gap widening between disciplined executives and cognitively sedated executives (visible at 6-12 months).",
    "b2.arch.a4.tag": "Human refocusing",
    "b2.arch.a4.name": "The rehumanized worker",
    "b2.arch.a4.body": "AI absorbs transactional tasks and frees time for creativity, empathy, accompaniment, pedagogy. The executive becomes again what they claim to be in management speech: a coach, a mediator, an accompanier. But this outcome is ambiguous according to Ferguson: it can tip into the dominated worker if not explicitly piloted.",
    "b2.arch.a4.signal": "<strong>Affected perimeter:</strong> HR leaders facing social transformations, internal trainers, conflict mediators, proximity managers, internal coaches. <strong>Positive HR signal:</strong> quality relational time rising, lasting improvement of social climate indicators.",
    "b2.arch.takeaway": "<strong>For French HR leadership and executive committees</strong>, these four archetypes are not equally likely. They result from explicit HR choices: job description design, training policy, performance indicators retained, room for maneuver left to executives facing AI tools. An organization that lets the market and AI vendors decide for it ends up with a replaced + dominated mix, by default. An organization that actively pilots aims for an augmented + rehumanized mix. <em>The 2026 pivot is not technological, it is sociological.</em> And that is precisely the responsibility of HR leadership, not IT leadership.",
    "b2.debate.eyebrow": "The AI-and-work debate · three structuring positions",
    "b2.debate.title": "Three readings of the same phenomenon, <em>three radically different HR plans</em>.",
    "b2.debate.lede": "The debate on AI and white-collar employment is shaped by three solid intellectual positions that do not say the same thing, nor on the same horizon. French executives in finance, consulting, law and tech are precisely the perimeter the pessimistic position targets. For HR leadership or an executive committee, retaining one rather than another changes the recruitment strategy, the continuing education plan, and the AI investment timeline.",

    "b2.debate.p1.tag": "Pessimistic position",
    "b2.debate.p1.author": "Dario Amodei (Anthropic) · Mustafa Suleyman (Microsoft AI)",
    "b2.debate.p1.claim": "AI will eliminate 50% of entry-level executives in finance, consulting, law and tech, in 1 to 5 years.",
    "b2.debate.p1.body": "For Amodei, AI advances simultaneously across all cognitive sectors, eliminating the adjacent employment basins that historically absorbed displaced workers. Suleyman estimates that most white-collar tasks will be automated within 12 to 18 months (lawyer, accountant, project manager, marketing). <strong>This position directly targets French advanced tertiary executives</strong>. If correct, it implies an immediate freeze on junior recruitment, an aggressive restructuring of hierarchical pyramids (fewer juniors, more senior-directors), and massive investment in AI-first architectures. Organizations retaining this reading are revising their 2026-2027 hiring plans accordingly.",

    "b2.debate.p2.tag": "Empirical position",
    "b2.debate.p2.author": "Pieter Garicano (Silicon Continent) · Brynjolfsson (Stanford) · NY Fed · Yann LeCun (Meta)",
    "b2.debate.p2.claim": "The task is not the job. The bundle survives, recomposed.",
    "b2.debate.p2.body": "Garicano develops the structural argument: a job is a bundle of tasks, not a sum of automatable tasks. When AI takes the weak task of the bundle (document synthesis, standard legal query, basic modeling, first-level code), it leaves the executive with the strong task (judgment, negotiation, accountability, handling non-standard cases). NY Fed April 2026 data confirms this empirical logic: the majority of AI-adopting firms retrain existing staff rather than cutting. Brynjolfsson 2025 documents +15% gain concentrated on juniors (signal of augmentation, not substitution). Becker et al. 2025 even measures -19% productivity for experienced seniors on familiar codebases when they use generative AI too actively. <strong>Hollow out the entry level, you hollow out the pipeline</strong>: the executive pyramid forms by accumulation of judgment, which is built by doing the very tasks AI is going to take.",

    "b2.debate.p3.tag": "Macroeconomic position",
    "b2.debate.p3.author": "Philip Trammell (Stanford) · Korinek (NBER) · Papanikolaou (Northwestern)",
    "b2.debate.p3.claim": "Human-intrinsic goods structurally protect the labor share.",
    "b2.debate.p3.body": "Trammell formalizes why the labor share can stay high even in a full-automation scenario. The thesis rests on human-intrinsic goods: concerts, performances, care, accompaniment, direct training, where human presence is part of the very definition of the good. <strong>For French executive functions</strong>, the framework partially but really applies: consulting that sells judgment, the lawyer who carries responsibility before the client, the manager who embodies accountability before teams, the direct trainer, the HR director negotiating the delicate. Are human-intrinsic. Are protected. Automated HR scoring, report writing, document synthesis: are not. Papanikolaou (Northwestern) empirically confirms the offsetting effects on executive employment.",

    "b2.debate.sec.tag": "Sectoral implication · French executives",
    "b2.debate.sec.title": "The 2026 HR pivot is not <em>how much to cut</em>, it is <em>which tasks to recompose</em>.",
    "b2.debate.sec.body": "For French HR leadership or executive committees in 2026, the cautious convergence of the three positions yields an actionable reading. Amodei's position <em>is probably too categorical</em> on the timeline (1 to 5 years) and the percentage (50%), but it points to a reality: juniors who only do document synthesis or standard legal templating are effectively vulnerable. Garicano's position <em>provides the right analytical angle</em>: each executive role must be decomposed into a task bundle, identify the strong task that produces real value, and redefine the job description around this strong task. Trammell's position <em>identifies structurally protected functions</em>: everything that is judgment, accountability, presence, negotiation. <strong>Organizations freezing junior recruitment in 2026 without rethinking senior bundles take a double risk</strong>: they lose the judgment pipeline that builds by doing, and they underutilize the AI augmentation of juniors which is precisely documented as the most effective (Brynjolfsson +15%). The 2026 HR decision is to <em>recompose job descriptions</em>, not to cut the pyramid.",

    /* TCO section · cost economics */
    "b2.tco.eyebrow": "Cost economics · the ignored factor",
    "b2.tco.title": "For French executives, <em>total cost determines the employment trajectory</em>.",
    "b2.tco.lede": "Coface has estimated French executives' employment exposure at 16.3% for the Special Agent phase. But this estimate assumes AI's economic viability in production. Yet total cost of ownership diverges significantly from the advertised inference price, and it is this cost that determines whether a function is actually automated or simply better assisted.",
    "b2.tco.s1.label": "Potential GenAI cost calculation error if CIOs don't master scaling",
    "b2.tco.s1.source": "Gartner · Oct 2024",
    "b2.tco.s2.label": "Of French CIOs say cost management limits their ability to extract AI value",
    "b2.tco.s2.source": "Gartner · Oct 2024",
    "b2.tco.s3.label": "Predicted GenAI cost per resolution for 2030, above B2C offshore agents",
    "b2.tco.s3.source": "Gartner · Jan 2026",
    "b2.tco.takeaway": "<strong>For French executives</strong>, this factor reshapes the reading of Coface figures. High-TCO functions (compliance, expert advisory, negotiation) will see more augmentation than replacement, because total AI cost remains above total human cost. Low-TCO functions (data entry, standardized content generation, first-line support) will see faster substitution. <em>Tomer (April 2026)</em> formalizes: AI is better on narrow, high-volume, moderate-risk tasks; humans remain superior on ambiguous, accountable, contextual work. See <a href=\"../methodologie.html#tco\">methodology section 07</a> for the full framework."
