<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Dispatch·iA #003 · Horlogerie premium et gouvernance IA · observatoire[s]·ia</title>
<meta name="description" content="Le Dispatch·iA Light · Édition libre. Horlogerie premium et gouvernance IA : l.épreuve de la désirabilité. Q2 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2EEE5;
  --paper-2: #ECE7DC;
  --ink: #11110F;
  --ink-2: #2A2A26;
  --muted: #8B8579;
  --rule: #D9D2C2;
  --signal: #D03C2F;
  --teal: #1F3A3D;
  --highlight: #F7E27D;
  --max-w: 1280px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: "Instrument Sans", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  background-image: radial-gradient(circle at 1px 1px, rgba(17,17,15,0.04) 1px, transparent 0);
  background-size: 22px 22px;
}
::selection { background: var(--signal); color: var(--paper); }
a { color: inherit; text-decoration: none; }
.mono { font-family: "JetBrains Mono", monospace; font-size: 0.78em; letter-spacing: 0.02em; }
.serif { font-family: "Fraunces", serif; font-variation-settings: "opsz" 96, "SOFT" 50; }

/* ───────── NAV ───────── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(242, 238, 229, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
}
.nav-inner {
  max-width: var(--max-w); margin: 0 auto;
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.logo {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 24, "SOFT" 0;
  font-weight: 500; font-size: 19px;
  letter-spacing: -0.01em; color: var(--ink); white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: opacity 0.15s ease;
}
.logo:hover { opacity: 0.7; }
.logo:hover .bracket { color: var(--signal); }
.logo .bracket { color: var(--signal); font-weight: 600; transition: color 0.15s ease; }
.logo .dot { color: var(--muted); margin: 0 0.15em; }

.nav-links {
  display: flex; gap: 22px; align-items: center;
  font-size: 13.5px; font-weight: 500;
}
.nav-links a {
  color: var(--ink-2); position: relative; padding: 4px 0;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.current { color: var(--signal); }
.nav-links a.current::after {
  content: ""; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1.5px; background: var(--signal);
}

.nav-actions { display: flex; gap: 14px; align-items: center; }
.lang-toggle {
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  background: transparent; border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 14px; cursor: pointer;
  display: flex; gap: 8px; color: var(--ink);
  transition: border-color 0.2s;
}
.lang-toggle:hover { border-color: var(--ink); }
.lang-toggle span.active { color: var(--signal); font-weight: 500; }
.lang-toggle span:not(.active) { color: var(--muted); }

.menu-btn {
  display: none; background: transparent;
  border: 1px solid var(--rule);
  width: 38px; height: 38px; border-radius: 8px;
  cursor: pointer; align-items: center; justify-content: center;
}
.menu-btn span { display: block; width: 16px; height: 1.5px; background: var(--ink); position: relative; }
.menu-btn span::before, .menu-btn span::after {
  content: ""; position: absolute; left: 0; width: 16px; height: 1.5px; background: var(--ink);
}
.menu-btn span::before { top: -5px; }
.menu-btn span::after { top: 5px; }

.mobile-menu {
  display: none; position: fixed; inset: 0;
  background: var(--paper); z-index: 100;
  padding: 80px 32px 32px;
  flex-direction: column; gap: 28px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-family: "Fraunces", serif; font-size: 32px; font-weight: 400; color: var(--ink);
}
.mobile-menu .close-btn {
  position: absolute; top: 18px; right: 18px;
  background: transparent; border: 1px solid var(--rule);
  width: 38px; height: 38px; border-radius: 8px;
  cursor: pointer; font-size: 20px; color: var(--ink);
}

/* ───────── HERO ───────── */
.hero {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px 60px; position: relative;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 28px;
}
.hero-eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--signal); }

.hero-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(44px, 7vw, 96px);
  line-height: 0.96; letter-spacing: -0.025em;
  margin-bottom: 28px; max-width: 980px;
}
.hero-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.hero-title .accent-bracket { color: var(--signal); font-weight: 500; }

.hero-lede {
  font-size: clamp(17px, 1.6vw, 21px); line-height: 1.5;
  max-width: 640px; color: var(--ink-2); margin-bottom: 40px;
}

.btn {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 16px 28px; border-radius: 999px;
  font-weight: 500; font-size: 15px;
  transition: background 0.2s, transform 0.2s, color 0.2s, border-color 0.2s;
  cursor: pointer; font-family: inherit; border: none;
}
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--signal); transform: translateY(-1px); }
.btn-secondary {
  background: transparent; border: 1px solid var(--ink); color: var(--ink);
}
.btn-secondary:hover { background: var(--ink); color: var(--paper); }
.btn .arrow { transition: transform 0.2s; }
.btn:hover .arrow { transform: translateX(4px); }

.cta-row { display: flex; gap: 14px; flex-wrap: wrap; }

/* ───────── COUNTRY TEASERS (Home) ───────── */
.country-teasers {
  max-width: var(--max-w); margin: 60px auto;
  padding: 0 32px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
}
.country-card {
  border: 1px solid var(--rule);
  background: var(--paper);
  padding: 40px;
  display: flex; flex-direction: column; gap: 20px;
  transition: background 0.2s, border-color 0.2s;
  position: relative; overflow: hidden;
  cursor: pointer;
}
.country-card:hover { background: var(--paper-2); border-color: var(--ink); }
.country-card-flag {
  font-size: 32px;
  display: flex; align-items: center; gap: 14px;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted);
}
.country-card-flag .emoji { font-size: 28px; }
.country-card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(36px, 4.5vw, 56px);
  line-height: 1; letter-spacing: -0.02em;
}
.country-card-num {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink-2);
  display: flex; gap: 18px; flex-wrap: wrap;
}
.country-card-num strong {
  font-family: "Fraunces", serif;
  font-size: 28px; font-weight: 500; color: var(--signal);
  margin-right: 4px;
}
.country-card-cta {
  margin-top: auto;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px;
  transition: gap 0.2s, color 0.2s;
}
.country-card:hover .country-card-cta { gap: 14px; color: var(--signal); }

/* ───────── STATS ───────── */
.stats {
  max-width: var(--max-w); margin: 40px auto 0;
  padding: 0 32px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat {
  padding: 36px 24px;
  border-right: 1px solid var(--rule);
  position: relative;
}
.stat:last-child { border-right: none; }
.stat-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-weight: 500;
  font-size: clamp(48px, 6vw, 76px);
  line-height: 1; letter-spacing: -0.03em;
  display: flex; align-items: baseline; gap: 6px;
}
.stat-num .unit { font-size: 0.45em; color: var(--signal); font-weight: 400; }
.stat-num .sign { color: var(--signal); font-size: 0.6em; }
.stat-label {
  margin-top: 14px; font-size: 14px; line-height: 1.4; max-width: 280px;
}
.stat-source {
  margin-top: 14px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* ───────── MANIFESTO ───────── */
.manifesto {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
  display: grid; grid-template-columns: 200px 1fr; gap: 60px;
}
.manifesto-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
  padding-top: 8px;
}
.manifesto-text {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 60;
  font-weight: 300;
  font-size: clamp(22px, 2.6vw, 32px);
  line-height: 1.35; letter-spacing: -0.01em;
  max-width: 880px;
}
.manifesto-text p { margin-bottom: 0.6em; }
.manifesto-text p:last-child { margin-bottom: 0; }
.manifesto-text strong {
  font-weight: 500;
  background: linear-gradient(180deg, transparent 60%, var(--highlight) 60%);
  padding: 0 2px;
}

/* ───────── SECTION HEADS ───────── */
.section-head {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px 32px;
  border-top: 1px solid var(--rule);
}
.section-head.no-border { border-top: none; padding-top: 60px; }
.section-eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--signal);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 12px;
}
.section-eyebrow::before {
  content: "§"; font-family: "Fraunces", serif;
  font-size: 18px; color: var(--ink);
}
.section-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(34px, 5vw, 58px);
  line-height: 1; letter-spacing: -0.02em;
  margin-bottom: 24px;
}
.section-sub {
  font-size: 17px; color: var(--ink-2);
  max-width: 640px; line-height: 1.5;
}

/* ───────── FILTERS ───────── */
.filters {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 32px;
  display: flex; gap: 32px; flex-wrap: wrap; align-items: center;
}
.filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.filter-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-right: 8px;
}
.chip {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; border: 1px solid var(--rule);
  background: transparent; padding: 7px 13px;
  border-radius: 999px; cursor: pointer;
  color: var(--ink-2); transition: all 0.18s;
}
.chip:hover { border-color: var(--ink); }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ───────── CARDS GRID ───────── */
.cards-grid {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 100px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
  border-top: 1px solid var(--rule);
  border-left: 1px solid var(--rule);
}
.card {
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 32px 28px 28px; background: var(--paper);
  position: relative;
  display: flex; flex-direction: column; gap: 14px;
  min-height: 280px;
  transition: background 0.2s; cursor: pointer;
}
.card:hover { background: var(--paper-2); }
.card-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.flag { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.flag-dot { width: 8px; height: 8px; border-radius: 50%; }
.flag-ch .flag-dot { background: var(--signal); }
.flag-fr .flag-dot { background: var(--teal); }
.card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500; font-size: 24px;
  line-height: 1.1; letter-spacing: -0.01em;
}
.card-org { font-size: 13px; color: var(--muted); font-style: italic; }
.card-desc { font-size: 14px; line-height: 1.5; color: var(--ink-2); flex: 1; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.card-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  background: var(--paper-2); padding: 4px 8px;
  border-radius: 4px; color: var(--ink-2);
}
.card-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 8px; padding-top: 14px;
  border-top: 1px dashed var(--rule);
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.card-footer .visit { color: var(--signal); }
.card-empty-state {
  grid-column: 1 / -1;
  padding: 80px 32px; text-align: center;
  font-family: "Fraunces", serif; font-style: italic;
  color: var(--muted);
}

/* ───────── KPI ROW (country dashboards) ───────── */
.kpi-row {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 60px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.kpi {
  background: var(--paper);
  padding: 32px 28px;
  display: flex; flex-direction: column; gap: 10px;
}
.kpi-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
}
.kpi-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-weight: 500;
  font-size: clamp(40px, 5vw, 60px);
  line-height: 1; letter-spacing: -0.02em;
  display: flex; align-items: baseline; gap: 6px;
}
.kpi-num .unit { font-size: 0.45em; color: var(--signal); font-weight: 400; }
.kpi-num .sign { color: var(--signal); font-size: 0.6em; }
.kpi-label { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.kpi-source {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-top: auto;
}

/* ───────── CONTEXT BLOCK (institutional context on country pages) ───────── */
.context-block {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 70px 32px 90px;
  border-top: 1px solid var(--rule);
}
.context-grid {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 60px;
}
.context-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding-top: 8px;
}
.context-content h3 {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(30px, 3.6vw, 44px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 30px;
}
.context-content h3 em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.context-content p {
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink-2);
  max-width: 760px;
  margin-bottom: 18px;
}
.context-content p:last-of-type {
  margin-bottom: 0;
}
.context-key-facts {
  margin-top: 40px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  max-width: 760px;
}
.kf-item {
  background: var(--paper);
  padding: 22px 22px;
}
.kf-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 20;
  font-size: 28px;
  font-weight: 500;
  color: var(--signal);
  line-height: 1;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}
.kf-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  line-height: 1.4;
}

/* CTA row inside dash-header */
.dash-cta-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 32px;
}
.dash-header {
  max-width: var(--max-w); margin: 0 auto;
  padding: 70px 32px 30px;
}
.dash-flag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 12px;
}
.dash-flag .emoji { font-size: 28px; }
.dash-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(48px, 7vw, 84px);
  line-height: 0.95; letter-spacing: -0.025em;
  margin-bottom: 24px;
}
.dash-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.dash-lede {
  font-size: clamp(17px, 1.5vw, 19px);
  max-width: 720px; color: var(--ink-2);
}

/* ───────── CHART (mini sparkline / bar) ───────── */
.chart-block {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 80px;
}
.bar-chart { display: flex; flex-direction: column; gap: 14px; }
.bar-row {
  display: grid;
  grid-template-columns: 200px 1fr 60px;
  align-items: center; gap: 16px;
  font-size: 14px;
}
.bar-track {
  height: 28px; background: var(--paper-2);
  position: relative; overflow: hidden;
  border: 1px solid var(--rule);
}
.bar-fill {
  height: 100%; background: var(--ink);
  position: relative;
  transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.bar-fill.signal { background: var(--signal); }
.bar-fill.teal { background: var(--teal); }
.bar-value {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink); text-align: right;
}

/* ───────── COMPARISON TABLE ───────── */
.compare-table-wrap {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 100px;
  overflow-x: auto;
}
table.compare {
  width: 100%; border-collapse: collapse;
  font-size: 14px; min-width: 720px;
  border: 1px solid var(--rule);
}
table.compare th {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); text-align: left;
  padding: 16px 20px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--rule);
  font-weight: 500;
}
table.compare th.country-ch { color: var(--signal); }
table.compare th.country-fr { color: var(--teal); }
table.compare td {
  padding: 18px 20px;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
}
table.compare tr:last-child td { border-bottom: none; }
table.compare td.dim {
  font-family: "Fraunces", serif;
  font-size: 16px; font-weight: 500;
}
table.compare td.gap {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--signal); font-weight: 500;
}

/* ───────── SYNTHESE (dark) ───────── */
.synthese {
  background: var(--ink); color: var(--paper);
  padding: 100px 0;
}
.synthese-inner { max-width: var(--max-w); margin: 0 auto; padding: 0 32px; }
.synthese .section-eyebrow { color: var(--signal); }
.synthese .section-eyebrow::before { color: var(--paper); }
.synthese .section-title { color: var(--paper); }
.synthese .section-sub { color: rgba(242, 238, 229, 0.7); }
.table-wrap {
  margin-top: 48px; overflow-x: auto;
  border: 1px solid rgba(242, 238, 229, 0.15);
}
table.synth {
  width: 100%; border-collapse: collapse;
  font-size: 14px; min-width: 720px;
}
table.synth th {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--signal); text-align: left;
  padding: 16px 20px;
  background: rgba(242, 238, 229, 0.03);
  border-bottom: 1px solid rgba(242, 238, 229, 0.15);
  font-weight: 500;
}
table.synth td {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(242, 238, 229, 0.08);
  vertical-align: top;
}
table.synth tr:hover td { background: rgba(242, 238, 229, 0.03); }
table.synth td.name {
  font-family: "Fraunces", serif;
  font-size: 16px; font-weight: 500;
}
table.synth td .pill {
  display: inline-block;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; padding: 3px 8px;
  border-radius: 3px;
  background: rgba(242, 238, 229, 0.1);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* ───────── FIELD REPORT ───────── */
.field-report {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
}
.field-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 32px; margin-top: 48px;
}
.field-card {
  border-top: 2px solid var(--ink);
  padding-top: 24px;
  display: flex; flex-direction: column; gap: 12px;
  cursor: pointer; transition: opacity 0.2s;
}
.field-card:hover { opacity: 0.75; }
.field-card-meta {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  display: flex; justify-content: space-between;
}
.field-card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 40;
  font-weight: 400; font-size: 26px;
  line-height: 1.15; letter-spacing: -0.01em;
}
.field-card-excerpt { font-size: 15px; line-height: 1.5; color: var(--ink-2); }
.field-card-link {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--signal); margin-top: 8px;
}

/* ───────── ABOUT ───────── */
.about {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
  border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr 1fr; gap: 80px;
}
.about-text {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 60;
  font-weight: 300;
  font-size: clamp(20px, 2.2vw, 28px);
  line-height: 1.4; letter-spacing: -0.01em;
}
.about-text .accent-bracket { color: var(--signal); font-weight: 500; }
.about-actions {
  display: flex; flex-direction: column;
  gap: 14px; align-items: flex-start; padding-top: 12px;
}

/* ───────── CROSS LINK (bottom of country page) ───────── */
.cross-link {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px;
  border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 32px;
}
.cross-link h3 {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(28px, 3.5vw, 42px);
  line-height: 1.1; letter-spacing: -0.02em;
}
.cross-link h3 em {
  font-style: italic;
  font-variation-settings: "opsz" 60, "SOFT" 100;
  color: var(--signal);
}

/* ───────── BRIEF·iA · LIGHT (magazine-inspired) ───────── */
.brief-hero {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 60px 32px 50px;
}
.brief-hero-meta {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 24px;
}
.brief-hero-meta .meta-num {
  color: var(--signal);
  font-weight: 500;
}
.brief-hero-meta .meta-edition {
  color: var(--ink);
  border: 1px solid var(--rule);
  padding: 3px 10px;
  border-radius: 999px;
}
.brief-hero-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(40px, 6.5vw, 78px);
  line-height: 0.98;
  letter-spacing: -0.025em;
  margin-bottom: 24px;
  max-width: 1000px;
}
.brief-hero-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.brief-hero-sub {
  font-size: clamp(18px, 2vw, 24px);
  line-height: 1.4;
  color: var(--ink-2);
  max-width: 820px;
  margin-bottom: 32px;
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 50;
  font-weight: 300;
}
.brief-byline {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding-top: 20px;
  border-top: 1px solid var(--rule);
}
.brief-byline strong {
  color: var(--ink);
  font-weight: 500;
}
.brief-section {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 70px 32px;
  border-top: 1px solid var(--rule);
}
.brief-section-eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 16px;
}
.brief-section-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(30px, 4.5vw, 52px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 28px;
  max-width: 800px;
}
.brief-section-title em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.brief-section p {
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 820px;
  margin-bottom: 18px;
}
.brief-section p:last-of-type { margin-bottom: 0; }
.brief-section p strong { color: var(--ink); font-weight: 500; }
.brief-twocol {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  margin-top: 40px;
}
.brief-twocol-block h4 {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--signal);
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule);
}
.brief-twocol-block ul { list-style: none; padding: 0; }
.brief-twocol-block li {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-2);
  padding: 10px 0;
  border-bottom: 1px dashed var(--rule);
}
.brief-twocol-block li:last-child { border-bottom: none; }
.brief-twocol-block li strong {
  color: var(--ink);
  font-weight: 500;
  display: block;
  margin-bottom: 2px;
}
.brief-numbers-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 32px;
}
.brief-stat {
  background: var(--paper);
  padding: 36px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.brief-stat-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-size: clamp(60px, 8vw, 96px);
  line-height: 0.95;
  letter-spacing: -0.03em;
  color: var(--ink);
  font-weight: 500;
}
.brief-stat-num .unit {
  font-size: 0.4em;
  color: var(--signal);
  vertical-align: super;
  margin-left: 2px;
}
.brief-stat-num .sign { color: var(--signal); font-size: 0.7em; }
.brief-stat-label {
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink-2);
  flex: 1;
}
.brief-stat-source {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding-top: 14px;
  border-top: 1px dashed var(--rule);
}
.brief-quote {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 60;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(24px, 3.2vw, 38px);
  line-height: 1.3;
  letter-spacing: -0.01em;
  max-width: 920px;
  color: var(--ink);
  margin-bottom: 24px;
  margin-top: 24px;
}
.brief-quote::before {
  content: "“";
  font-size: 1.4em;
  color: var(--signal);
  vertical-align: -0.1em;
}
.brief-quote::after {
  content: "”";
  font-size: 1.4em;
  color: var(--signal);
  vertical-align: -0.1em;
}
.brief-quote-author {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-2);
}
.brief-quote-author strong {
  color: var(--ink);
  font-weight: 500;
}
.brief-quote-author span { color: var(--muted); margin-left: 8px; }
.brief-checklist {
  margin-top: 40px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.brief-checklist-item {
  background: var(--paper);
  padding: 28px;
  display: flex;
  gap: 18px;
}
.brief-checklist-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 20;
  font-size: 36px;
  line-height: 1;
  color: var(--signal);
  font-weight: 500;
  flex-shrink: 0;
}
.brief-checklist-text {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-2);
}
.brief-checklist-text strong {
  display: block;
  color: var(--ink);
  font-weight: 500;
  margin-bottom: 6px;
  font-family: "Fraunces", serif;
  font-size: 18px;
}
.brief-toolkit-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 40px;
}
.brief-tool {
  background: var(--paper);
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: background 0.2s;
}
.brief-tool:hover { background: var(--paper-2); }
.brief-tool-cat {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.brief-tool-name {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500;
  font-size: 22px;
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.brief-tool-desc {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
}

/* DISPATCH SOURCES - traceability block */
.brief-sources {
  background: var(--paper-2);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding-top: 60px;
  padding-bottom: 60px;
  margin-top: 40px;
}
.brief-sources-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 40px;
}
.brief-source-card {
  background: var(--paper);
  padding: 24px 28px;
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 24px;
  align-items: start;
  transition: background 0.2s;
}
.brief-source-card:hover { background: var(--paper-2); }
.brief-source-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 60;
  font-weight: 400;
  font-size: 32px;
  color: var(--signal);
  line-height: 1;
  padding-top: 4px;
}
.brief-source-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.brief-source-label {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500;
  font-size: 18px;
  line-height: 1.3;
  color: var(--ink);
}
.brief-source-cited {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
  font-style: italic;
}
.brief-source-cited strong {
  font-style: normal;
  color: var(--ink);
  font-weight: 500;
}
.brief-source-links {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 6px;
}
.brief-source-links a {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 6px 10px;
  border: 1px solid var(--rule);
  background: var(--paper);
  transition: border-color 0.2s, background 0.2s;
}
.brief-source-links a:hover {
  border-color: var(--signal);
  background: var(--paper-2);
}
@media (max-width: 720px) {
  .brief-source-card {
    grid-template-columns: 40px 1fr;
    gap: 16px;
    padding: 20px;
  }
  .brief-source-num { font-size: 24px; }
}

.brief-paywall {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 90px 32px;
  border-top: 1px solid var(--rule);
}
.brief-paywall-inner {
  background: var(--ink);
  color: var(--paper);
  padding: 60px 50px;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 60px;
  position: relative;
  overflow: hidden;
}
.brief-paywall-inner::before {
  content: "EXECUTIVE";
  position: absolute;
  top: 24px;
  right: 30px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--signal);
}
.brief-paywall-eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--signal);
  margin-bottom: 18px;
}
.brief-paywall-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(28px, 3.6vw, 42px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 24px;
  color: var(--paper);
}
.brief-paywall-title em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.brief-paywall-desc {
  font-size: 16px;
  line-height: 1.6;
  color: rgba(242, 238, 229, 0.75);
  margin-bottom: 24px;
  max-width: 560px;
}
.brief-paywall ul { list-style: none; padding: 0; margin: 0; }
.brief-paywall ul li {
  font-size: 14px;
  line-height: 1.5;
  color: rgba(242, 238, 229, 0.85);
  padding: 10px 0 10px 24px;
  position: relative;
  border-bottom: 1px dashed rgba(242, 238, 229, 0.15);
}
.brief-paywall ul li::before {
  content: "→";
  position: absolute;
  left: 0;
  color: var(--signal);
}
.brief-paywall ul li:last-child { border-bottom: none; }
.brief-paywall-price {
  background: rgba(242, 238, 229, 0.05);
  border: 1px solid rgba(242, 238, 229, 0.15);
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-self: start;
}
.brief-paywall-price-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}
.brief-paywall-price-value {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-size: 64px;
  line-height: 0.95;
  font-weight: 500;
  color: var(--paper);
  letter-spacing: -0.02em;
}
.brief-paywall-price-value .currency {
  font-size: 0.4em;
  color: var(--signal);
  margin-right: 6px;
  vertical-align: top;
  letter-spacing: 0;
}
.brief-paywall-price-alt {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(242, 238, 229, 0.6);
  padding-bottom: 14px;
  border-bottom: 1px dashed rgba(242, 238, 229, 0.15);
}
.brief-paywall-buy {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--signal);
  color: var(--paper);
  padding: 14px 18px;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
  transition: background 0.2s;
}
.brief-paywall-buy:hover { background: #ED5448; color: var(--paper); }
.brief-paywall-note {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: rgba(242, 238, 229, 0.5);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  text-align: center;
  margin-top: 4px;
}
.brief-back {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 32px 80px;
  text-align: center;
}
@media (max-width: 960px) {
  .brief-hero { padding: 40px 20px 32px; }
  .brief-section, .brief-numbers, .brief-quote-section, .brief-checklist-section, .brief-toolkit-section { padding: 50px 20px; }
  .brief-twocol { grid-template-columns: 1fr; gap: 32px; }
  .brief-numbers-grid { grid-template-columns: 1fr; }
  .brief-checklist { grid-template-columns: 1fr; }
  .brief-toolkit-grid { grid-template-columns: 1fr; }
  .brief-paywall { padding: 60px 20px; }
  .brief-paywall-inner {
    grid-template-columns: 1fr;
    gap: 40px;
    padding: 40px 28px;
  }
  .brief-paywall-inner::before { top: 16px; right: 20px; }
  .brief-back { padding: 0 20px 50px; }
}

/* ───────── FOOTER ───────── */
footer {
  border-top: 1px solid var(--rule);
  padding: 40px 32px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.foot-inner {
  max-width: var(--max-w); margin: 0 auto;
  display: flex; justify-content: space-between;
  align-items: center; flex-wrap: wrap; gap: 16px;
}
.foot-links { display: flex; gap: 20px; }
.foot-links a { color: var(--ink-2); transition: color 0.2s; }
.foot-links a:hover { color: var(--signal); }
.foot-version { color: var(--ink-2); }

/* ───────── BRIEFINGS · CATALOG LIST ───────── */
.briefings-list {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 32px 100px;
}
.briefing-row {
  display: grid;
  grid-template-columns: 90px 1fr 200px;
  gap: 40px;
  padding: 36px 0;
  border-top: 1px solid var(--rule);
  align-items: start;
}
.briefing-row:last-child { border-bottom: 1px solid var(--rule); }
.briefing-row.upcoming { opacity: 0.55; }
.briefing-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 20;
  font-weight: 500;
  font-size: 56px;
  line-height: 0.9;
  color: var(--ink);
  letter-spacing: -0.03em;
}
.briefing-row.upcoming .briefing-num { color: var(--muted); }
.briefing-meta {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.briefing-meta .pill-sector {
  color: var(--signal);
  font-weight: 500;
}
.briefing-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 30;
  font-weight: 500;
  font-size: 28px;
  line-height: 1.15;
  letter-spacing: -0.015em;
  margin-bottom: 12px;
  color: var(--ink);
}
.briefing-title a { color: inherit; transition: color 0.2s; }
.briefing-title a:hover { color: var(--signal); }
.briefing-summary {
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink-2);
  max-width: 640px;
}
.briefing-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-start;
  padding-top: 4px;
}
.briefing-action-line {
  display: flex;
  align-items: center;
  gap: 8px;

.briefing-action-line .label { color: var(--muted); width: 50px; }
.briefing-action-line a {

}
.briefing-action-line a:hover { color: var(--signal); border-color: var(--signal); }
.briefing-action-line a.exec { color: var(--signal); border-color: var(--signal); }
.briefing-action-line .price {
  color: var(--ink);

/* ───────── BRIEFINGS · DOCUMENT VIEW ───────── */
.briefing-classification {

  flex-wrap: wrap;

}
.briefing-classification .clss-cell { display: flex; gap: 8px; align-items: center; }
.briefing-classification .clss-label { color: var(--muted); }
.briefing-classification .clss-value { color: var(--paper); font-weight: 500; }
.briefing-classification .clss-value.signal { color: var(--signal); }

.briefing-doc {
  max-width: 920px;
  margin: 0 auto;
  padding: 70px 32px;
}
.briefing-doc-title {

}
.briefing-doc-title em {

}
.briefing-brief {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 60;

  line-height: 1.4;
  color: var(--ink);

}
.briefing-byline {

  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;

  flex-wrap: wrap;

}
.briefing-byline strong { color: var(--ink); font-weight: 500; }

.briefing-section {
  margin-bottom: 56px;
}
.briefing-section-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 20;
  font-size: 14px;
  font-weight: 500;
  color: var(--signal);
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  display: block;
}
.briefing-section-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 30;
  font-weight: 500;
  font-size: clamp(24px, 2.6vw, 32px);
  line-height: 1.1;
  letter-spacing: -0.015em;
  margin-bottom: 24px;
  text-transform: uppercase;

}
.briefing-section p {
  font-size: 17px;
  line-height: 1.65;
  color: var(--ink-2);
  margin-bottom: 18px;
  max-width: 760px;
}
.briefing-section p strong { color: var(--ink); font-weight: 500; }
.briefing-section p em {
  font-style: italic;
  color: var(--ink);
}

.briefing-findings {
  list-style: none;
  padding: 0;
  margin: 0;

}
.briefing-findings li {

}

.briefing-findings li::before {

  top: 18px;
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 20;
  font-size: 26px;
  font-weight: 500;

  letter-spacing: -0.02em;
}
.briefing-findings li strong { color: var(--ink); font-weight: 500; }

.briefing-implications {

}

}
.implication-block:last-child { border-bottom: 1px solid var(--rule); }
.implication-audience {

  font-size: 11px;

  letter-spacing: 0.1em;
  color: var(--signal);
  font-weight: 500;
  padding-top: 4px;
}
.implication-text {
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink-2);
  max-width: 700px;
}
.implication-text strong { color: var(--ink); font-weight: 500; }

.briefing-sources {
  list-style: none;
  padding: 0;
  margin: 0;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink-2);
}
.briefing-sources li {
  padding-left: 20px;
  position: relative;
  margin-bottom: 6px;
}
.briefing-sources li::before {
  content: "·";
  position: absolute;
  left: 0;
  color: var(--signal);

}

/* ───────── EXEC EDITION CTA BLOCK ───────── */
.exec-cta {

  padding: 56px 48px;

}

}
.exec-cta-title em {

.exec-cta-features {

}
.exec-cta-features li {
  padding-left: 22px;
  position: relative;
  margin-bottom: 8px;
}
.exec-cta-features li::before {
  content: "→";
  position: absolute;
  left: 0;
  color: var(--signal);
  font-weight: 500;
}

.exec-price-card {
  background: rgba(242, 238, 229, 0.05);
  border: 1px solid rgba(242, 238, 229, 0.15);
  padding: 32px;
}
.exec-price-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--signal);

}
.exec-price-value {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;

}
.exec-price-currency {

}
.exec-price-alt {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;

}
.exec-price-buy {

.exec-price-sub {

@media (max-width: 960px) {

/* ============================================== */
/* CONTACT FORM */
/* ============================================== */
.contact-form-section {
  max-width: 760px;
  margin: 0 auto;
  padding: 60px 32px 80px;
}
.contact-form {
  display: flex;
  flex-direction: column;
  gap: 32px;
}
.form-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.form-row.form-row-half {
  flex: 1;
}
.form-row-double {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
}
.form-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.form-label .required {
  color: var(--signal);
  margin-left: 4px;
}
.form-input,
.form-select,
.form-textarea {
  font-family: "Instrument Sans", system-ui, sans-serif;
  font-size: 16px;
  color: var(--ink);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 10px 0 12px;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
  font-weight: 400;
  line-height: 1.4;
}
.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-bottom-color: var(--signal);
}
.form-input::placeholder,
.form-textarea::placeholder {
  color: var(--muted);
  font-style: italic;
}
.form-select {
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%23D03C2F' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 4px center;
  background-size: 12px;
  padding-right: 28px;
  cursor: pointer;
}
.form-textarea {
  border: 1px solid var(--rule);
  padding: 14px 16px;
  resize: vertical;
  min-height: 160px;
  font-family: "Instrument Sans", system-ui, sans-serif;
}
.form-textarea:focus {
  border-color: var(--signal);
}
.form-actions {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
  margin-top: 16px;
  padding-top: 32px;
  border-top: 1px solid var(--rule);
}
.form-submit {
  font-family: "Instrument Sans", system-ui, sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.02em;
  background: var(--ink);
  color: var(--paper);
  border: none;
  padding: 14px 28px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  transition: background 0.2s;
}
.form-submit:hover {
  background: var(--signal);
}
.form-submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.form-note {
  font-size: 12px;
  color: var(--muted);
  font-style: italic;
  max-width: 380px;
  line-height: 1.5;
}
.form-feedback {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 14px 18px;

  margin-bottom: 24px;
  display: none;
}
.form-feedback.visible { display: block; }
@media (max-width: 720px) {

  .form-actions { flex-direction: column; align-items: flex-start; }

/* ============================================== */
/* RESPONSIVE COMPLETION                          */
/* Tablet: 768-960px · Mobile: 560px · Phone: 380px */
/* ============================================== */

@media (max-width: 960px) {
  /* Briefings list catalog: stack on tablet */
  .briefing-row {
    grid-template-columns: 60px 1fr;
    gap: 18px;
    padding: 28px 0;
  }
  .briefing-num { font-size: 36px; }
  .briefing-actions {
    grid-column: 1 / -1;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 8px;
  }

  /* Method grid section · stack tag above content */
  .method-section { padding: 0 20px 40px; }
  .method-grid {
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 36px 0;
  }
  .method-content h3 { font-size: 24px; }

  .brief-hero h1, .brief-title { font-size: 32px; line-height: 1.15; }
  .brief-meta { flex-wrap: wrap; gap: 8px; }
  .brief-meta-num { font-size: 11px; }

  /* Brief stats: stack vertically with full-width number */
  .brief-stat-num { font-size: 56px; }

  /* Sources cards · already responsive, tightening padding */
  .brief-source-card {
    grid-template-columns: 40px 1fr;
    gap: 16px;
    padding: 20px;
  }
  .brief-source-num { font-size: 24px; }
  .brief-source-links { gap: 8px; }
  .brief-source-links a { font-size: 10px; padding: 5px 8px; }

  /* Comparer table needs horizontal scroll on tablet */
  .compare-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .compare-table { min-width: 600px; }

  /* Cross-link CTAs stack */
  .cross-link h3 { font-size: 26px; }

  /* About actions: ensure buttons can wrap */
  .about-actions { gap: 10px; }
  .about-actions .btn { font-size: 13px; padding: 10px 16px; }

  /* Form: full width inputs, smaller padding */
  .contact-form-section { padding: 30px 20px 60px; }
  .form-row-double { grid-template-columns: 1fr; gap: 24px; }
  .form-actions {
    flex-direction: column;
    align-items: stretch;
    gap: 18px;
  }
  .form-submit { justify-content: center; }
  .form-note { max-width: 100%; }
}

@media (max-width: 720px) {

  }

  .stat-label { font-size: 12px; }

  .method-content h4 { font-size: 16px; }

  }

}

/* Prevent horizontal scroll on any page */

/* Ensure long words break gracefully on narrow screens */

.method-content p, .method-content h3, .method-content h4 {

  word-wrap: break-word;

  font-size: max(16px, 1rem);
}

/* ============================================== */
/* EDITORIAL DISCLOSURE · per-dispatch micro block */
/* ============================================== */
.brief-disclosure {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 32px 32px 60px;
  border-top: 1px dashed var(--rule);
  margin-top: 0;
}
.brief-disclosure-inner {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 40px;
  align-items: start;
  padding-top: 32px;
}
.brief-disclosure-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding-top: 4px;
}
.brief-disclosure-body {
  font-size: 13px;
  line-height: 1.65;
  color: var(--muted);
  max-width: 720px;
  font-style: italic;
}
.brief-disclosure-body strong {
  color: var(--ink-2);
  font-weight: 500;
  font-style: normal;
}
.brief-disclosure-body a {
  color: var(--signal);
  border-bottom: 1px solid var(--rule);
  font-style: normal;
  transition: border-color 0.2s;
}
.brief-disclosure-body a:hover { border-color: var(--signal); }
@media (max-width: 720px) {
  .brief-disclosure { padding: 24px 20px 40px; }
  .brief-disclosure-inner {
    grid-template-columns: 1fr;
    gap: 12px;
    padding-top: 24px;
  }
  .brief-disclosure-body { font-size: 12px; }
}

/* Nav avec 10 items : passer en mobile menu plus tôt */
@media (max-width: 1100px) {
  .nav-links { display: none; }
  .menu-btn { display: flex; }
}

/* Base method-content typography (was missing) */
.method-content { font-family: "Instrument Sans", sans-serif; }
.method-content h3 {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 0;
  font-size: 28px; font-weight: 500;
  line-height: 1.2;
  margin: 0 0 18px 0;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.method-content h3 em {
  font-style: italic;
  font-variation-settings: "opsz" 36, "SOFT" 50;
  color: var(--signal);
}
.method-content h4 {
  font-family: "Instrument Sans", sans-serif;
  font-size: 18px; font-weight: 600;
  margin: 24px 0 8px 0;
  color: var(--ink);
}
.method-content p {
  font-size: 15.5px;
  line-height: 1.65;
  margin: 0 0 16px 0;
  color: var(--ink-2);
}
.method-content p:last-child { margin-bottom: 0; }
.method-content ul {
  margin: 12px 0 16px 0;
  padding-left: 22px;
}
.method-content li {
  font-size: 15.5px;
  line-height: 1.65;
  margin-bottom: 8px;
  color: var(--ink-2);
}
.method-content a { color: var(--signal); text-decoration: underline; text-decoration-thickness: 1px; }
.method-content a:hover { text-decoration-thickness: 2px; }
.method-content strong { color: var(--ink); font-weight: 600; }

// Page-level translations are merged in by each page before init()
window.PAGE_I18N = window.PAGE_I18N || { fr: {}, en: {} };

let CURRENT_LANG = localStorage.getItem("obs-lang") || "fr";

function t(key) {
  const merged = {
    ...I18N[CURRENT_LANG],
    ...(window.PAGE_I18N[CURRENT_LANG] || {})
  };
  return merged[key] || key;
}

function applyI18n() {
  document.documentElement.lang = CURRENT_LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    const html = el.hasAttribute("data-i18n-html");
    const value = t(key);
    if (html) el.innerHTML = value;
    else el.textContent = value;
  });
  document.querySelectorAll(".lang-toggle span").forEach((s) => {
    s.classList.toggle("active", s.getAttribute("data-lang") === CURRENT_LANG);
  });
  // Re-render dynamic sections if the page has a hook
  if (typeof window.onLangChange === "function") window.onLangChange(CURRENT_LANG);
}

function setupLangToggle() {
  const toggle = document.getElementById("langToggle");
  if (!toggle) return;
  toggle.addEventListener("click", () => {
    CURRENT_LANG = CURRENT_LANG === "fr" ? "en" : "fr";
    localStorage.setItem("obs-lang", CURRENT_LANG);
    applyI18n();
  });
}

function setupMobileMenu() {
  const menuBtn = document.getElementById("menuBtn");
  const closeBtn = document.getElementById("closeMenu");
  const mobileMenu = document.getElementById("mobileMenu");
  if (!menuBtn || !mobileMenu) return;
  menuBtn.addEventListener("click", () => mobileMenu.classList.add("open"));
  if (closeBtn) closeBtn.addEventListener("click", () => mobileMenu.classList.remove("open"));
  mobileMenu.querySelectorAll("a").forEach((a) => {
    a.addEventListener("click", () => mobileMenu.classList.remove("open"));
  });
}

function setupReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add("visible");
    });
  }, { threshold: 0.1 });
  document.querySelectorAll(".manifesto-text, .section-title, .stat, .kpi, .card, .field-card, .country-card, .dash-title")
    .forEach((el) => {
      el.classList.add("reveal");
      observer.observe(el);
    });
}

// Detect if we're in a subfolder (observatoires/ or briefings/) and build relative root
function rootPath() {
  // Pages in /observatoires/ or /briefings/ have one extra path segment
  const path = window.location.pathname;
  return (path.includes("/observatoires/") || path.includes("/briefings/")) ? "../" : "";
}
