<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Dispatch·iA #003 · Horlogerie premium et gouvernance IA · observatoire[s]·ia</title>
<meta name="description" content="Le Dispatch·iA · Horlogerie premium et gouvernance IA : l'épreuve de la désirabilité. Dépêche intégrale, Q2 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2EEE5;
  --paper-2: #ECE7DC;
  --ink: #11110F;
  --ink-2: #2A2A26;
  --muted: #8B8579;
  --rule: #D9D2C2;
  --signal: #D03C2F;
  --teal: #1F3A3D;
  --highlight: #F7E27D;
  --max-w: 1280px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: "Instrument Sans", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  background-image: radial-gradient(circle at 1px 1px, rgba(17,17,15,0.04) 1px, transparent 0);
  background-size: 22px 22px;
}
::selection { background: var(--signal); color: var(--paper); }
a { color: inherit; text-decoration: none; }
.mono { font-family: "JetBrains Mono", monospace; font-size: 0.78em; letter-spacing: 0.02em; }
.serif { font-family: "Fraunces", serif; font-variation-settings: "opsz" 96, "SOFT" 50; }

/* ───────── NAV ───────── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(242, 238, 229, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
}
.nav-inner {
  max-width: var(--max-w); margin: 0 auto;
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.logo {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 24, "SOFT" 0;
  font-weight: 500; font-size: 19px;
  letter-spacing: -0.01em; color: var(--ink); white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: opacity 0.15s ease;
}
.logo:hover { opacity: 0.7; }
.logo:hover .bracket { color: var(--signal); }
.logo .bracket { color: var(--signal); font-weight: 600; transition: color 0.15s ease; }
.logo .dot { color: var(--muted); margin: 0 0.15em; }

.nav-links {
  display: flex; gap: 22px; align-items: center;
  font-size: 13.5px; font-weight: 500;
}
.nav-links a {
  color: var(--ink-2); position: relative; padding: 4px 0;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.current { color: var(--signal); }
.nav-links a.current::after {
  content: ""; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1.5px; background: var(--signal);
}

.nav-actions { display: flex; gap: 14px; align-items: center; }
.lang-toggle {
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  background: transparent; border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 14px; cursor: pointer;
  display: flex; gap: 8px; color: var(--ink);
  transition: border-color 0.2s;
}
.lang-toggle:hover { border-color: var(--ink); }
.lang-toggle span.active { color: var(--signal); font-weight: 500; }
.lang-toggle span:not(.active) { color: var(--muted); }

.menu-btn {
  display: none; background: transparent;
  border: 1px solid var(--rule);
  width: 38px; height: 38px; border-radius: 8px;
  cursor: pointer; align-items: center; justify-content: center;
}
.menu-btn span { display: block; width: 16px; height: 1.5px; background: var(--ink); position: relative; }
.menu-btn span::before, .menu-btn span::after {
  content: ""; position: absolute; left: 0; width: 16px; height: 1.5px; background: var(--ink);
}
.menu-btn span::before { top: -5px; }
.menu-btn span::after { top: 5px; }

.mobile-menu {
  display: none; position: fixed; inset: 0;
  background: var(--paper); z-index: 100;
  padding: 80px 32px 32px;
  flex-direction: column; gap: 28px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-family: "Fraunces", serif; font-size: 32px; font-weight: 400; color: var(--ink);
}
.mobile-menu .close-btn {
  position: absolute; top: 18px; right: 18px;
  background: transparent; border: 1px solid var(--rule);
  width: 38px; height: 38px; border-radius: 8px;
  cursor: pointer; font-size: 20px; color: var(--ink);
}

/* ───────── HERO ───────── */
.hero {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px 60px; position: relative;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 28px;
}
.hero-eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--signal); }

.hero-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(44px, 7vw, 96px);
  line-height: 0.96; letter-spacing: -0.025em;
  margin-bottom: 28px; max-width: 980px;
}
.hero-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.hero-title .accent-bracket { color: var(--signal); font-weight: 500; }

.hero-pitch {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 28, "SOFT" 0;
  font-style: italic;
  font-size: clamp(18px, 1.5vw, 22px);
  line-height: 1.4;
  max-width: 720px;
  color: var(--ink);
  margin: 0 0 28px 0;
  letter-spacing: -0.01em;
}

.hero-lede {
  font-size: clamp(17px, 1.6vw, 21px); line-height: 1.5;
  max-width: 640px; color: var(--ink-2); margin-bottom: 40px;
}

.btn {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 16px 28px; border-radius: 999px;
  font-weight: 500; font-size: 15px;
  transition: background 0.2s, transform 0.2s, color 0.2s, border-color 0.2s;
  cursor: pointer; font-family: inherit; border: none;
}
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--signal); transform: translateY(-1px); }
.btn-secondary {
  background: transparent; border: 1px solid var(--ink); color: var(--ink);
}
.btn-secondary:hover { background: var(--ink); color: var(--paper); }
.btn .arrow { transition: transform 0.2s; }
.btn:hover .arrow { transform: translateX(4px); }

.cta-row { display: flex; gap: 14px; flex-wrap: wrap; }

/* ───────── COUNTRY TEASERS (Home) ───────── */
.country-teasers {
  max-width: var(--max-w); margin: 60px auto;
  padding: 0 32px;
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px;
}
.country-card {
  border: 1px solid var(--rule);
  background: var(--paper);
  padding: 40px;
  display: flex; flex-direction: column; gap: 20px;
  transition: background 0.2s, border-color 0.2s;
  position: relative; overflow: hidden;
  cursor: pointer;
}
.country-card:hover { background: var(--paper-2); border-color: var(--ink); }
.country-card-flag {
  font-size: 32px;
  display: flex; align-items: center; gap: 14px;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted);
}
.country-card-flag .emoji { font-size: 28px; }
.country-card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(36px, 4.5vw, 56px);
  line-height: 1; letter-spacing: -0.02em;
}
.country-card-num {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink-2);
  display: flex; gap: 18px; flex-wrap: wrap;
}
.country-card-num strong {
  font-family: "Fraunces", serif;
  font-size: 28px; font-weight: 500; color: var(--signal);
  margin-right: 4px;
}
.country-card-cta {
  margin-top: auto;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px;
  transition: gap 0.2s, color 0.2s;
}
.country-card:hover .country-card-cta { gap: 14px; color: var(--signal); }

/* ───────── STATS ───────── */
.stats {
  max-width: var(--max-w); margin: 40px auto 0;
  padding: 0 32px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat {
  padding: 36px 24px;
  border-right: 1px solid var(--rule);
  position: relative;
}
.stat:last-child { border-right: none; }
.stat-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-weight: 500;
  font-size: clamp(48px, 6vw, 76px);
  line-height: 1; letter-spacing: -0.03em;
  display: flex; align-items: baseline; gap: 6px;
}
.stat-num .unit { font-size: 0.45em; color: var(--signal); font-weight: 400; }
.stat-num .sign { color: var(--signal); font-size: 0.6em; }
.stat-label {
  margin-top: 14px; font-size: 14px; line-height: 1.4; max-width: 280px;
}
.stat-source {
  margin-top: 14px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* ───────── MANIFESTO ───────── */
.manifesto {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
  display: grid; grid-template-columns: 200px 1fr; gap: 60px;
}
.manifesto-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
  padding-top: 8px;
}
.manifesto-text {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 60;
  font-weight: 300;
  font-size: clamp(22px, 2.6vw, 32px);
  line-height: 1.35; letter-spacing: -0.01em;
  max-width: 880px;
}
.manifesto-text p { margin-bottom: 0.6em; }
.manifesto-text p:last-child { margin-bottom: 0; }
.manifesto-text strong {
  font-weight: 500;
  background: linear-gradient(180deg, transparent 60%, var(--highlight) 60%);
  padding: 0 2px;
}

/* ───────── SECTION HEADS ───────── */
.section-head {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px 32px;
  border-top: 1px solid var(--rule);
}
.section-head.no-border { border-top: none; padding-top: 60px; }
.section-eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--signal);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 12px;
}
.section-eyebrow::before {
  content: "§"; font-family: "Fraunces", serif;
  font-size: 18px; color: var(--ink);
}
.section-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(34px, 5vw, 58px);
  line-height: 1; letter-spacing: -0.02em;
  margin-bottom: 24px;
}
.section-sub {
  font-size: 17px; color: var(--ink-2);
  max-width: 640px; line-height: 1.5;
}

/* ───────── FILTERS ───────── */
.filters {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 32px;
  display: flex; gap: 32px; flex-wrap: wrap; align-items: center;
}
.filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.filter-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-right: 8px;
}
.chip {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; border: 1px solid var(--rule);
  background: transparent; padding: 7px 13px;
  border-radius: 999px; cursor: pointer;
  color: var(--ink-2); transition: all 0.18s;
}
.chip:hover { border-color: var(--ink); }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ───────── CARDS GRID ───────── */
.cards-grid {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 100px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
  border-top: 1px solid var(--rule);
  border-left: 1px solid var(--rule);
}
.card {
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 32px 28px 28px; background: var(--paper);
  position: relative;
  display: flex; flex-direction: column; gap: 14px;
  min-height: 280px;
  transition: background 0.2s; cursor: pointer;
}
.card:hover { background: var(--paper-2); }
.card-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.flag { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.flag-dot { width: 8px; height: 8px; border-radius: 50%; }
.flag-ch .flag-dot { background: var(--signal); }
.flag-fr .flag-dot { background: var(--teal); }
.card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500; font-size: 24px;
  line-height: 1.1; letter-spacing: -0.01em;
}
.card-org { font-size: 13px; color: var(--muted); font-style: italic; }
.card-desc { font-size: 14px; line-height: 1.5; color: var(--ink-2); flex: 1; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.card-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  background: var(--paper-2); padding: 4px 8px;
  border-radius: 4px; color: var(--ink-2);
}
.card-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 8px; padding-top: 14px;
  border-top: 1px dashed var(--rule);
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.card-footer .visit { color: var(--signal); }
.card-empty-state {
  grid-column: 1 / -1;
  padding: 80px 32px; text-align: center;
  font-family: "Fraunces", serif; font-style: italic;
  color: var(--muted);
}

/* ───────── KPI ROW (country dashboards) ───────── */
.kpi-row {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 60px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.kpi {
  background: var(--paper);
  padding: 32px 28px;
  display: flex; flex-direction: column; gap: 10px;
}
.kpi-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
}
.kpi-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-weight: 500;
  font-size: clamp(40px, 5vw, 60px);
  line-height: 1; letter-spacing: -0.02em;
  display: flex; align-items: baseline; gap: 6px;
}
.kpi-num .unit { font-size: 0.45em; color: var(--signal); font-weight: 400; }
.kpi-num .sign { color: var(--signal); font-size: 0.6em; }
.kpi-label { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.kpi-source {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-top: auto;
}

/* ───────── CONTEXT BLOCK (institutional context on country pages) ───────── */
.context-block {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 70px 32px 90px;
  border-top: 1px solid var(--rule);
}
.context-grid {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 60px;
}
.context-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding-top: 8px;
}
.context-content h3 {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(30px, 3.6vw, 44px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 30px;
}
.context-content h3 em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.context-content p {
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink-2);
  max-width: 760px;
  margin-bottom: 18px;
}
.context-content p:last-of-type {
  margin-bottom: 0;
}
.context-key-facts {
  margin-top: 40px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  max-width: 760px;
}
.kf-item {
  background: var(--paper);
  padding: 22px 22px;
}
.kf-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 20;
  font-size: 28px;
  font-weight: 500;
  color: var(--signal);
  line-height: 1;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}
.kf-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  line-height: 1.4;
}

/* CTA row inside dash-header */
.dash-cta-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 32px;
}
.dash-header {
  max-width: var(--max-w); margin: 0 auto;
  padding: 70px 32px 30px;
}
.dash-flag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 12px;
}
.dash-flag .emoji { font-size: 28px; }
.dash-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(48px, 7vw, 84px);
  line-height: 0.95; letter-spacing: -0.025em;
  margin-bottom: 24px;
}
.dash-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.dash-lede {
  font-size: clamp(17px, 1.5vw, 19px);
  max-width: 720px; color: var(--ink-2);
}

/* ───────── CHART (mini sparkline / bar) ───────── */
.chart-block {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 80px;
}
.bar-chart { display: flex; flex-direction: column; gap: 14px; }
.bar-row {
  display: grid;
  grid-template-columns: 200px 1fr 60px;
  align-items: center; gap: 16px;
  font-size: 14px;
}
.bar-track {
  height: 28px; background: var(--paper-2);
  position: relative; overflow: hidden;
  border: 1px solid var(--rule);
}
.bar-fill {
  height: 100%; background: var(--ink);
  position: relative;
  transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.bar-fill.signal { background: var(--signal); }
.bar-fill.teal { background: var(--teal); }
.bar-value {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink); text-align: right;
}

/* ───────── COMPARISON TABLE ───────── */
.compare-table-wrap {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 100px;
  overflow-x: auto;
}
table.compare {
  width: 100%; border-collapse: collapse;
  font-size: 14px; min-width: 720px;
  border: 1px solid var(--rule);
}
table.compare th {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); text-align: left;
  padding: 16px 20px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--rule);
  font-weight: 500;
}
table.compare th.country-ch { color: var(--signal); }
table.compare th.country-fr { color: var(--teal); }
table.compare td {
  padding: 18px 20px;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
}
table.compare tr:last-child td { border-bottom: none; }
table.compare td.dim {
  font-family: "Fraunces", serif;
  font-size: 16px; font-weight: 500;
}
table.compare td.gap {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--signal); font-weight: 500;
}

/* ───────── SYNTHESE (dark) ───────── */
.synthese {
  background: var(--ink); color: var(--paper);
  padding: 100px 0;
}
.synthese-inner { max-width: var(--max-w); margin: 0 auto; padding: 0 32px; }
.synthese .section-eyebrow { color: var(--signal); }
.synthese .section-eyebrow::before { color: var(--paper); }
.synthese .section-title { color: var(--paper); }
.synthese .section-sub { color: rgba(242, 238, 229, 0.7); }
.table-wrap {
  margin-top: 48px; overflow-x: auto;
  border: 1px solid rgba(242, 238, 229, 0.15);
}
table.synth {
  width: 100%; border-collapse: collapse;
  font-size: 14px; min-width: 720px;
}
table.synth th {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--signal); text-align: left;
  padding: 16px 20px;
  background: rgba(242, 238, 229, 0.03);
  border-bottom: 1px solid rgba(242, 238, 229, 0.15);
  font-weight: 500;
}
table.synth td {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(242, 238, 229, 0.08);
  vertical-align: top;
}
table.synth tr:hover td { background: rgba(242, 238, 229, 0.03); }
table.synth td.name {
  font-family: "Fraunces", serif;
  font-size: 16px; font-weight: 500;
}
table.synth td .pill {
  display: inline-block;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; padding: 3px 8px;
  border-radius: 3px;
  background: rgba(242, 238, 229, 0.1);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* ───────── FIELD REPORT ───────── */
.field-report {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
}
.field-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 32px; margin-top: 48px;
}
.field-card {
  border-top: 2px solid var(--ink);
  padding-top: 24px;
  display: flex; flex-direction: column; gap: 12px;
  cursor: pointer; transition: opacity 0.2s;
}
.field-card:hover { opacity: 0.75; }
.field-card-meta {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  display: flex; justify-content: space-between;
}
.field-card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 40;
  font-weight: 400; font-size: 26px;
  line-height: 1.15; letter-spacing: -0.01em;
}
.field-card-excerpt { font-size: 15px; line-height: 1.5; color: var(--ink-2); }
.field-card-link {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--signal); margin-top: 8px;
}

/* ───────── ABOUT ───────── */
.about {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
  border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr 1fr; gap: 80px;
}
.about-text {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 60;
  font-weight: 300;
  font-size: clamp(20px, 2.2vw, 28px);
  line-height: 1.4; letter-spacing: -0.01em;
}
.about-text .accent-bracket { color: var(--signal); font-weight: 500; }
.about-actions {
  display: flex; flex-direction: column;
  gap: 14px; align-items: flex-start; padding-top: 12px;
}

/* ───────── CROSS LINK (bottom of country page) ───────── */
.cross-link {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px;
  border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 32px;
}
.cross-link h3 {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(28px, 3.5vw, 42px);
  line-height: 1.1; letter-spacing: -0.02em;
}
.cross-link h3 em {
  font-style: italic;
  font-variation-settings: "opsz" 60, "SOFT" 100;
  color: var(--signal);
}

/* ───────── BRIEF·iA · LIGHT (magazine-inspired) ───────── */
.brief-hero {

}
.brief-hero-meta {

  font-family: "JetBrains Mono", monospace;
  font-size: 11px;

  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 24px;
}
.brief-hero-meta .meta-num {
  color: var(--signal);
  font-weight: 500;
}
.brief-hero-meta .meta-edition {
  color: var(--ink);
  border: 1px solid var(--rule);
  padding: 3px 10px;
  border-radius: 999px;
}
.brief-hero-title {
  font-family: "Fraunces", serif;

  letter-spacing: -0.025em;
  margin-bottom: 24px;

}
.brief-hero-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.brief-hero-sub {
  font-size: clamp(18px, 2vw, 24px);
  line-height: 1.4;
  color: var(--ink-2);
  max-width: 820px;

  font-weight: 300;
}
.brief-byline {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;

  text-transform: uppercase;

  border-top: 1px solid var(--rule);

.brief-byline strong {

.brief-section {
  max-width: var(--max-w);

}
.brief-section-eyebrow {

  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 16px;
}
.brief-section-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(30px, 4.5vw, 52px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 28px;
  max-width: 800px;
}
.brief-section-title em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.brief-section p {
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink-2);

}

.brief-twocol {

}
.brief-twocol-block h4 {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  text-transform: uppercase;

  margin-bottom: 16px;

  border-bottom: 1px solid var(--rule);
}
.brief-twocol-block ul { list-style: none; padding: 0; }
.brief-twocol-block li {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-2);
  padding: 10px 0;
  border-bottom: 1px dashed var(--rule);
}

.brief-twocol-block li strong {
  color: var(--ink);

}
.brief-numbers-grid {
  display: grid;

  gap: 1px;

}
.brief-stat {
  background: var(--paper);
  padding: 36px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.brief-stat-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-size: clamp(60px, 8vw, 96px);

  letter-spacing: -0.03em;
  color: var(--ink);
  font-weight: 500;
}
.brief-stat-num .unit {
  font-size: 0.4em;
  color: var(--signal);
  vertical-align: super;
  margin-left: 2px;
}
.brief-stat-num .sign { color: var(--signal); font-size: 0.7em; }
.brief-stat-label {
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink-2);
  flex: 1;
}
.brief-stat-source {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding-top: 14px;
  border-top: 1px dashed var(--rule);
}
.brief-quote {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 60;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(24px, 3.2vw, 38px);
  line-height: 1.3;
  letter-spacing: -0.01em;
  max-width: 920px;
  color: var(--ink);
  margin-bottom: 24px;
  margin-top: 24px;
}
.brief-quote::before {
  content: "“";
  font-size: 1.4em;
  color: var(--signal);
  vertical-align: -0.1em;
}
.brief-quote::after {
  content: "”";
  font-size: 1.4em;
  color: var(--signal);
  vertical-align: -0.1em;
}
.brief-quote-author {
  font-family: "JetBrains Mono", monospace;

  text-transform: uppercase;
  letter-spacing: 0.1em;

}
.brief-quote-author strong {
  color: var(--ink);
  font-weight: 500;
}
.brief-quote-author span { color: var(--muted); margin-left: 8px; }
.brief-checklist {
  margin-top: 40px;

  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.brief-checklist-item {
  background: var(--paper);
  padding: 28px;
  display: flex;
  gap: 18px;
}
.brief-checklist-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 20;
  font-size: 36px;
  line-height: 1;
  color: var(--signal);
  font-weight: 500;
  flex-shrink: 0;
}
.brief-checklist-text {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-2);
}
.brief-checklist-text strong {
  display: block;
  color: var(--ink);
  font-weight: 500;
  margin-bottom: 6px;
  font-family: "Fraunces", serif;
  font-size: 18px;
}
.brief-toolkit-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 40px;
}
.brief-tool {
  background: var(--paper);
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: background 0.2s;
}
.brief-tool:hover { background: var(--paper-2); }
.brief-tool-cat {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.brief-tool-name {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500;
  font-size: 22px;
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.brief-tool-desc {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
}

/* DISPATCH SOURCES - traceability block */
.brief-sources {
  background: var(--paper-2);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding-top: 60px;
  padding-bottom: 60px;
  margin-top: 40px;
}
.brief-sources-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 40px;
}
.brief-source-card {
  background: var(--paper);
  padding: 24px 28px;
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 24px;
  align-items: start;
  transition: background 0.2s;
}
.brief-source-card:hover { background: var(--paper-2); }
.brief-source-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 60;
  font-weight: 400;
  font-size: 32px;
  color: var(--signal);
  line-height: 1;
  padding-top: 4px;
}
.brief-source-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.brief-source-label {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500;
  font-size: 18px;
  line-height: 1.3;
  color: var(--ink);
}
.brief-source-cited {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
  font-style: italic;
}
.brief-source-cited strong {
  font-style: normal;
  color: var(--ink);
  font-weight: 500;
}
.brief-source-links {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 6px;
}
.brief-source-links a {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 6px 10px;
  border: 1px solid var(--rule);
  background: var(--paper);
  transition: border-color 0.2s, background 0.2s;
}
.brief-source-links a:hover {
  border-color: var(--signal);
  background: var(--paper-2);
}
@media (max-width: 720px) {
  .brief-source-card {
    grid-template-columns: 40px 1fr;
    gap: 16px;
    padding: 20px;
  }
  .brief-source-num { font-size: 24px; }
}

.brief-paywall {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 90px 32px;
  border-top: 1px solid var(--rule);
}

  color: var(--paper);
  padding: 60px 50px;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 60px;
  position: relative;
  overflow: hidden;
}
.brief-paywall-inner::before {
  content: "EXECUTIVE";
  position: absolute;
  top: 24px;
  right: 30px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--signal);
}
.brief-paywall-eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--signal);
  margin-bottom: 18px;
}
.brief-paywall-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(28px, 3.6vw, 42px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 24px;
  color: var(--paper);
}
.brief-paywall-title em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.brief-paywall-desc {
  font-size: 16px;
  line-height: 1.6;
  color: rgba(242, 238, 229, 0.75);
  margin-bottom: 24px;

}
.brief-paywall ul { list-style: none; padding: 0; margin: 0; }
.brief-paywall ul li {
  font-size: 14px;
  line-height: 1.5;

  border-bottom: 1px dashed rgba(242, 238, 229, 0.15);
}
.brief-paywall ul li::before {
  content: "→";

  color: var(--signal);
}
.brief-paywall ul li:last-child { border-bottom: none; }
.brief-paywall-price {
  background: rgba(242, 238, 229, 0.05);
  border: 1px solid rgba(242, 238, 229, 0.15);
  padding: 32px 28px;

  flex-direction: column;
  gap: 14px;
  align-self: start;
}
.brief-paywall-price-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}
.brief-paywall-price-value {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-size: 64px;
  line-height: 0.95;
  font-weight: 500;
  color: var(--paper);
  letter-spacing: -0.02em;
}
.brief-paywall-price-value .currency {
  font-size: 0.4em;
  color: var(--signal);
  margin-right: 6px;
  vertical-align: top;
  letter-spacing: 0;
}
.brief-paywall-price-alt {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(242, 238, 229, 0.6);
  padding-bottom: 14px;
  border-bottom: 1px dashed rgba(242, 238, 229, 0.15);
}
.brief-paywall-buy {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--signal);
  color: var(--paper);
  padding: 14px 18px;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;

}
.brief-paywall-buy:hover { background: #ED5448; color: var(--paper); }
.brief-paywall-note {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;

}
.brief-back {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 32px 80px;
  text-align: center;
}
@media (max-width: 960px) {
  .brief-hero { padding: 40px 20px 32px; }
  .brief-section, .brief-numbers, .brief-quote-section, .brief-checklist-section, .brief-toolkit-section { padding: 50px 20px; }

  .brief-checklist { grid-template-columns: 1fr; }

  .brief-paywall-inner {

    padding: 40px 28px;
  }
  .brief-paywall-inner::before { top: 16px; right: 20px; }
  .brief-back { padding: 0 20px 50px; }

/* ───────── FOOTER ───────── */
footer {
  border-top: 1px solid var(--rule);
  margin-top: 40px;
  font-family: "JetBrains Mono", monospace;

  max-width: var(--max-w); margin: 0 auto;

}
.foot-col { display: flex; flex-direction: column; gap: 10px; }
.foot-col-brand .foot-brand {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 28, "SOFT" 0;

  font-size: 22px;
  color: var(--ink);
  letter-spacing: -0.01em;
}

  color: var(--signal);
}

  color: var(--signal);
}

  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.5;

}
.foot-col-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  margin-bottom: 4px;

.foot-col-links a {
  font-family: "Instrument Sans", sans-serif;
  font-size: 14px;

.foot-col-meta {
  font-size: 12px;

}

  flex-direction: column;
  gap: 2px;
  margin-bottom: 12px;
}
.foot-update strong {

  font-weight: 600;
  font-size: 13px;
  font-family: "Instrument Sans", sans-serif;
  letter-spacing: 0;
  text-transform: none;

.foot-license { margin-bottom: 6px; color: var(--teal); }
.foot-version { color: var(--ink-3); }

.foot-bottom {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 20px 32px 32px;
  border-top: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;

/* ───────── BRIEFINGS · CATALOG LIST ───────── */

}
.briefing-title {

.briefing-action-line .label { color: var(--muted); width: 50px; }

}
.briefing-action-line a:hover { color: var(--signal); border-color: var(--signal); }
.briefing-action-line a.exec { color: var(--signal); border-color: var(--signal); }
.briefing-action-line .price {
  color: var(--ink);

/* ───────── BRIEFINGS · DOCUMENT VIEW ───────── */

.briefing-section {

}

}
.briefing-section-title {

.briefing-sources {

  font-size: 13px;

}

}
.briefing-sources li::before {

.exec-price-card {

/* ============================================== */
/* CONTACT FORM */
/* ============================================== */
.contact-form-section {

}
.contact-form {
  display: flex;

  gap: 32px;

.form-row {

}

@media (max-width: 960px) {

  }

  .about-actions { gap: 10px; }

  .filters {
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }
  .filter-group { flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 6px 12px; }

  /* Foot mobile is handled by the dedicated @media (max-width: 720px) block at the end of this file */

  /* Context block tighter */
  .context-content h3 { font-size: 22px; }
  .context-content p { font-size: 15px; }

  /* KPI numbers smaller on phone */
  .kpi-num { font-size: 36px; }
  .kpi-label { font-size: 12px; }

  /* Bar charts stay readable */
  .bar-row { grid-template-columns: 1fr; gap: 4px; padding: 8px 0; }
  .bar-row > span:first-child { font-size: 12px; font-weight: 500; }
  .bar-row .bar-bar { margin: 4px 0; }
  .bar-row > span:last-child { text-align: left; font-size: 11px; }
}

@media (max-width: 480px) {
  /* Phone · most aggressive tightening */
  body { font-size: 15px; }
  .hero-title, .dash-title { font-size: 30px; }
  .stat-num { font-size: 36px; }
  .stat-label { font-size: 12px; }
  .nav-inner { padding: 12px 16px; }
  .logo { font-size: 16px; }
  .lang-toggle { font-size: 11px; }

  /* Mobile menu text larger */
  .mobile-menu a { font-size: 22px; padding: 14px 20px; }

  /* Brief hero numbers wrap better */
  .brief-stat-num { font-size: 44px; }
  .brief-stat-label { font-size: 12px; }

  /* Cards stack and tighten */
  .card { min-height: auto; padding: 20px 16px; }
  .field-card { padding: 18px 16px; }

  /* Method grid extra tight */
  .method-content h3 { font-size: 22px; }
  .method-content h4 { font-size: 16px; }
  .method-content p { font-size: 14px; }
  .method-content li { font-size: 14px; }

  /* About actions full-width on phone */
  .about-actions {
    flex-direction: column;
    align-items: stretch;
  }
  .about-actions .btn { text-align: center; justify-content: center; }
}

/* Improve touch targets on touch devices */
@media (hover: none) and (pointer: coarse) {
  .btn, .chip, .menu-btn, .lang-toggle button {
    min-height: 44px;
  }
  .nav-links a { padding: 10px 12px; }
  .field-card-link { padding: 4px 0; }
}

/* Prevent horizontal scroll on any page */
html, body { overflow-x: hidden; max-width: 100vw; }

/* Ensure long words break gracefully on narrow screens */
.field-card-title, .card-title, .brief-source-label,
.method-content p, .method-content h3, .method-content h4 {
  overflow-wrap: break-word;
  word-wrap: break-word;

/* Forms · prevent iOS zoom on focus */

}

window.VEILLE_DATA = [{"date":"2026-04-28","source":"Singh Tomer · Working Paper","country":"INT","title":{"fr":"Travail humain face à l'IA : un cadre par coût total de possession (TCO) et adéquation des tâches","en":"Human Labor Versus AI: A Total Cost of Ownership and Task-Suitability Framework"},"excerpt":{"fr":"Synthèse théorique majeure : la comparaison « salaire vs prix par token » est trompeuse. Le bon critère économique est le coût total de possession par résultat acceptable. Le TCO de l'IA inclut l'inférence, l'intégration, l'orchestration, la gouvernance, la supervision, l'évaluation, la vérification, l'escalade humaine et la refonte organisationnelle. Articule les preuves empiriques de divergence : Noy & Zhang 2023 (+40% writing), Brynjolfsson 2025 (+15% support agents, surtout les juniors), Becker et al. 2025 (-19% productivité pour les développeurs OSS expérimentés sur codebases familières). Cite la prédiction Gartner d'une sous-estimation des coûts GenAI de 500% à 1000%, et le seuil de 3$ par résolution dépassé en 2030.","en":"Major theoretical synthesis: comparing « salary vs token price » is misleading. The correct economic criterion is total cost of ownership per acceptable outcome. AI TCO includes inference, integration, orchestration, governance, oversight, evaluation, verification, human escalation, and organizational redesign. Articulates the divergent empirical evidence: Noy & Zhang 2023 (+40% writing), Brynjolfsson 2025 (+15% support agents, especially juniors), Becker et al. 2025 (-19% productivity for experienced OSS developers on familiar codebases). Cites Gartner's prediction of GenAI cost underestimation by 500% to 1000%, and the $3 per resolution threshold exceeded by 2030."},"url":"https://arxiv.org/abs/2511.singh-tomer-tco-framework","ai_type":"generative"},{"date":"2026-01-26","source":"Gartner · Patrick Quinlan","country":"INT","title":{"fr":"Le coût par résolution de la GenAI dépassera celui des agents humains offshore en 2030","en":"GenAI Cost Per Resolution to Exceed Offshore Human Agent Costs by 2030"},"excerpt":{"fr":"Prédiction de référence chez Gartner : d'ici 2030, le coût par résolution de la GenAI dans le service client dépassera 3$, plus cher que de nombreux agents humains offshore B2C. Trois facteurs : explosion des coûts de data centers, fin des prix subventionnés vers la rentabilité chez les éditeurs IA, et complexité croissante des cas d'usage qui consomment plus de tokens et exigent du talent plus coûteux. Patrick Quinlan : « Le ROI sur ces investissements est loin d'être garanti. L'automatisation totale sera prohibitivement coûteuse pour la plupart des organisations. » Gartner prédit aussi qu'en 2028, les pressions réglementaires sur le droit de parler à un humain feront croître le volume d'interactions assistées de 30%. Pour 90% des CIO, gérer les coûts limite désormais la valeur tirée de l'IA.","en":"Reference prediction from Gartner: by 2030, GenAI cost per resolution in customer service will exceed $3, higher than many B2C offshore human agents. Three drivers: exploding data center costs, end of subsidized pricing toward profitability among AI vendors, and rising use case complexity consuming more tokens and requiring more expensive talent. Patrick Quinlan: « ROI on those investments is far from guaranteed. Full automation will be prohibitively expensive for most organizations. » Gartner also predicts that by 2028, regulatory pressure on the right to speak to a human will increase assisted interaction volume by 30%. For 90% of CIOs, managing costs now limits the value extracted from AI."},"url":"https://www.gartner.com/en/newsroom/press-releases/2026-01-26-gartner-predicts-genai-cost-per-resolution-for-customer-service-will-exceed-offshore-human-agent-costs-by-2030","ai_type":"generative"},{"date":"2025-09-02","source":"EPFL · ETH Zurich · CSCS","country":"CH","title":{"fr":"Apertus : un modèle de langage suisse, fully open et conforme à l'EU AI Act","en":"Apertus: a Fully Open Swiss Language Model, Compliant with the EU AI Act"},"excerpt":{"fr":"Lancement du premier grand modèle de langage suisse public (8B et 70B paramètres), entièrement open : architecture, poids, données d'entraînement et recettes documentées. Entraîné sur 15 trillions de tokens dont 40% non anglophones, couvrant plus de 1000 langues incluant le suisse-allemand et le romanche. Développé par EPFL, ETH Zurich et CSCS, financé à hauteur de 20 millions CHF par la Confédération jusqu'en 2028. Hébergé par Swisscom sur sa plateforme IA souveraine helvétique. Conçu dès l'origine pour respecter l'EU AI Act, le droit suisse de protection des données et les opt-outs créateurs. Plus d'un million de téléchargements depuis le lancement. Mai 2026 : déploiement de Meditron au CHUV pour la décision clinique aux urgences. C'est le pilier technique de la stratégie de souveraineté IA suisse.","en":"Launch of Switzerland's first public large language model (8B and 70B parameters), fully open: architecture, weights, training data and recipes documented. Trained on 15 trillion tokens of which 40% non-English, covering over 1000 languages including Swiss German and Romansh. Developed by EPFL, ETH Zurich and CSCS, funded by the Swiss Confederation to the tune of CHF 20 million through 2028. Hosted by Swisscom on its sovereign Swiss AI platform. Designed from the start to comply with the EU AI Act, Swiss data protection law, and creator opt-outs. Over one million downloads since launch. May 2026: deployment of Meditron at CHUV for clinical decision support in emergency rooms. The technical pillar of Switzerland's AI sovereignty strategy."},"url":"https://ethz.ch/en/news-and-events/eth-news/news/2025/09/press-release-apertus-a-fully-open-transparent-multilingual-language-model.html","ai_type":"generative"},{"date":"2026-03-30","source":"Mistral AI · Le Monde · European Business Magazine","country":"INT","title":{"fr":"Mistral AI lève 830 M$ en dette auprès de 7 banques européennes pour son data center souverain","en":"Mistral AI Raises $830M in Debt from 7 European Banks for Its Sovereign Data Center"},"excerpt":{"fr":"Plus grosse opération de dette d'une entreprise IA européenne à ce jour, et première levée par dette pour Mistral. Consortium remarquable : BNP Paribas, Crédit Agricole CIB, HSBC, MUFG, Bpifrance, La Banque Postale et Natixis CIB - six européennes plus une japonaise, aucune banque US. Finance 13 800 GPU Nvidia GB300 pour le premier data center à Bruyères-le-Châtel près de Paris (44 MW, ouverture Q2 2026). Mensch s'engage à déployer 200 MW de capacité de calcul européen d'ici 2027. Stratégie : devenir le 3e fournisseur souverain européen de calcul IA derrière OVHcloud et Scaleway. Pour les clients régulés (gouvernements, défense, finance), c'est l'alternative sérieuse aux hyperscalers américains qui ne peuvent pas garantir une infrastructure sous juridiction européenne. Valorisation Mistral : 13,7 milliards de dollars, plus d'1 milliard de revenus prévus en 2026.","en":"Largest debt operation by a European AI company to date, and Mistral's first debt raise. Notable consortium: BNP Paribas, Crédit Agricole CIB, HSBC, MUFG, Bpifrance, La Banque Postale and Natixis CIB - six European institutions plus one Japanese, no US bank. Funds 13,800 Nvidia GB300 GPUs for the first data center at Bruyères-le-Châtel near Paris (44 MW, opening Q2 2026). Mensch commits to deploying 200 MW of European compute capacity by 2027. Strategy: become Europe's third sovereign AI compute provider behind OVHcloud and Scaleway. For regulated clients (governments, defense, finance), this is the serious alternative to US hyperscalers that cannot guarantee European-jurisdiction infrastructure. Mistral valuation: $13.7 billion, more than $1 billion in projected 2026 revenue."},"url":"https://europeanbusinessmagazine.com/business/business-mistral-ai-830-million-debt-financing-european-banks-paris-data-center/","ai_type":"generative"},{"date":"2026-02-27","source":"Index.dev · BenchLM · EuropeanStack (synthèse)","country":"INT","title":{"fr":"Cartographie des LLM européens : Mistral, Aleph Alpha, Apertus, Minerva, PhariaAI, LightOn","en":"Mapping European LLMs: Mistral, Aleph Alpha, Apertus, Minerva, PhariaAI, LightOn"},"excerpt":{"fr":"Synthèse de l'écosystème LLM européen 2026. L'Europe ne court pas la même course que les US ou la Chine. Forces : open-weight, performance multilingue, conformité réglementaire, résidence des données. Mistral (FR) reste le plus avancé en benchmarks. Aleph Alpha (DE) s'est repositionnée sur PhariaAI, un OS souverain pour le secteur public. Apertus (CH) est le modèle de référence sur la transparence et la conformité EU AI Act. Minerva (IT) est le seul LLM italien entraîné from scratch. LightOn (FR) excelle en raisonnement long-contexte sur documents. H Company (FR) pousse les modèles d'usage informatique. Verdict : pour une organisation avec des opérations dans l'UE, le choix sovereign-first n'est plus utopique en 2026. Pour les industries régulées (finance, santé, défense, secteur public), c'est devenu un prérequis de gouvernance.","en":"Synthesis of the European LLM ecosystem 2026. Europe is not racing the same race as the US or China. Strengths: open-weight, multilingual performance, regulatory compliance, data residency. Mistral (FR) remains the most benchmark-advanced. Aleph Alpha (DE) repositioned on PhariaAI, a sovereign OS for the public sector. Apertus (CH) is the reference model for transparency and EU AI Act compliance. Minerva (IT) is the only Italian LLM trained from scratch. LightOn (FR) excels in long-context document reasoning. H Company (FR) pushes computer-use models. Verdict: for an EU-operating organization, the sovereign-first choice is no longer utopian in 2026. For regulated industries (finance, healthcare, defense, public sector), it has become a governance prerequisite."},"url":"https://www.index.dev/blog/european-llms-top-models","ai_type":"generative"},{"date":"2026-04-25","source":"Financial Times · John Burn-Murdoch","country":"INT","title":{"fr":"Ce que rate le récit du « jobpocalypse » IA","en":"What the AI 'jobpocalypse' narrative misses"},"excerpt":{"fr":"Burn-Murdoch démontre par les chiffres historiques (BLS, James Bessen) que l'effet productivité-emploi dépend du rapport demande/offre dans chaque secteur, pas de la seule capacité technique de l'IA. Les logiciels et les services pro ont vu productivité et emploi croître ensemble (demande latente), tandis que la manufacture a vu l'emploi reculer (demande satisfaite). La radiologie et la santé restent protégées par la régulation. Critique radicale des prédictions basées uniquement sur les task-based exposure scores.","en":"Burn-Murdoch shows through historical BLS data and James Bessen's research that the productivity-employment relationship depends on demand/supply dynamics within each sector, not on AI's technical capability alone. Software and professional services saw both productivity and employment rise (pent-up demand), while manufacturing saw employment fall (satiated demand). Radiology and healthcare remain protected by regulation. Radical critique of predictions based solely on task-based exposure scores."},"url":"https://www.ft.com/content/8d3b02a3-c929-46a1-b79e-dbcdb1d10e15","ai_type":"generative"},{"date":"2026-04-23","source":"Focaldata · Financial Times Workforce AI Tracker · Wave 1","country":"INT","title":{"fr":"Two-Tier Transformation : comment l'IA change le travail au Royaume-Uni et aux États-Unis","en":"Two-Tier Transformation: How AI is Changing Work in the UK and US"},"excerpt":{"fr":"Première vague d'un tracker mensuel UK+US (n=4 119, février-mars 2026). 65% des actifs ont utilisé l'IA au moins une fois, mais moins de 1/5 quotidiennement. Distribution L-shape : grande majorité d'usagers rares + petite minorité de power users. Productivité IA marché : +3,5% (Tech +7,8%, Finance +5,1%). Effet formation +37 pts d'usage quotidien, mais seulement 14% ont reçu une formation formelle. Managers UK pessimistes (-25% prévoient réduction) vs US optimistes (+28% prévoient hausse). Scénarios ABC : Augmentation, Bifurcation (probable), Crash.","en":"First wave of monthly UK+US tracker (n=4,119, February-March 2026). 65% of workers have used AI at least once, but fewer than 1/5 daily. L-shaped distribution: large majority of rare users + small minority of power users. Market AI productivity: +3.5% (Tech +7.8%, Finance +5.1%). Training effect +37 pts daily usage, but only 14% have received formal training. UK managers pessimistic (-25% expect reduction) vs US optimistic (+28% expect increase). ABC scenarios: Augmentation, Bifurcation (likely), Crash."},"url":"https://focaldata.com","ai_type":"generative"},{"date":"2026-04-23","source":"Angestellte Schweiz · DemoSCOPE","country":"CH","title":{"fr":"Insécurité de l'emploi perçue et responsabilités · enquête nationale","en":"Perceived job insecurity and responsibilities · national survey"},"excerpt":{"fr":"Enquête représentative auprès de 1 028 actifs des trois régions linguistiques (23-30 mars 2026). 75% se sentent en sécurité, mais 24% perçoivent une dégradation sur 12 mois. L'IA est citée comme cause individuelle #1 d'insécurité (catégorie technologique 22%). Introduction d'outils IA déclarée dans 17% des environnements de travail, avec un écart frappant : 9% dans les TPE de moins de 10 salariés contre 24% dans les entreprises de 250+. La formation continue reste la mesure jugée la plus efficace (M=3.27/4).","en":"Representative survey of 1,028 active workers across the three language regions (23-30 March 2026). 75% feel secure, but 24% perceive a deterioration over 12 months. AI is cited as the #1 individual cause of insecurity (technology category 22%). AI tool introduction reported in 17% of work environments, with a striking gap: 9% in SMEs under 10 employees vs 24% in companies of 250+. Continuing education remains the measure deemed most effective (M=3.27/4)."},"url":"https://www.angestellte.ch","ai_type":"generative"},{"date":"2026-04-15","source":"NBER · Yin, Vu, Persico (w35110)","country":"INT","title":{"fr":"Quelle (in)stabilité des scores d'exposition LLM ? Evidence d'une réplication multi-modèles","en":"How (un)Stable Are LLM Occupational Exposure Scores? Evidence from Multi-Model Replication"},"excerpt":{"fr":"Démonstration que les mesures d'exposition à l'IA basées sur les LLM auto-évaluatifs sont hautement fragiles. Trois modèles frontière appliquant la même rubrique sur les mêmes tâches produisent une divergence d'un facteur 3,6 sur l'exposition moyenne, avec un accord descendant à 57%. Cette instabilité altère les conclusions empiriques en aval : les coefficients en panel diff-in-diff varient d'un facteur 2,4 selon l'annotateur, et les estimations county-level passent d'un effet négatif significatif à un effet positif non significatif selon le modèle utilisé. Conclusion radicale : traiter les LLM en évolution comme des instruments statiques est risqué.","en":"Demonstration that LLM-based self-assessed AI exposure measures are highly fragile. Three frontier models applying the same rubric on identical tasks produce a 3.6-fold divergence in mean exposure, with agreement as low as 57%. This instability alters downstream empirical conclusions: difference-in-differences coefficients vary 2.4-fold across annotators, and county-level estimates flip from significant negative to insignificant positive depending on the model. Radical conclusion: treating evolving LLMs as static instruments is risky."},"url":"https://www.nber.org/papers/w35110","ai_type":"generative"},{"date":"2026-04-15","source":"British Progress · Pedro Serôdio","country":"INT","title":{"fr":"L'IA et le marché du travail britannique : l'état des preuves","en":"AI and the UK labour market: the evidence so far"},"excerpt":{"fr":"Rapport synthétisant les données disponibles sur l'impact de l'IA sur l'emploi au Royaume-Uni. Conclusion : peu de signes d'effets agrégés massifs, malgré 54% des PME britanniques utilisant l'IA selon BCC. Les prédictions Goldman Sachs (+7% PIB mondial) et McKinsey (12 millions de transitions) reposent sur ce que l'IA pourrait faire si toutes les organisations l'adoptaient pleinement. La réalité observée est plus étroite et plus collaborative. Divergence frappante entre exposition prédite (forte chez les professionnels et managers) et usage réel (en retard).","en":"Report synthesizing available data on AI's impact on UK employment. Conclusion: few signs of massive aggregate effects, despite 54% of UK SMEs using AI per BCC. Goldman Sachs (+7% world GDP) and McKinsey (12 million transitions) predictions rest on what AI could do if all organizations adopted it fully. Observed reality is narrower and more collaborative. Striking divergence between predicted exposure (high for professionals and managers) and actual usage (lagging)."},"url":"https://britishprogress.org/reports/ai-and-the-uk-labour-market-the-evidence-so-far","ai_type":"generative"},{"date":"2026-04-15","source":"Stanford HAI","country":"INT","title":{"fr":"AI Index Report 2026·neuvième édition","en":"AI Index Report 2026·ninth edition"},"excerpt":{"fr":"Plus de 400 pages de données vetées. Adoption générative à 53% en 3 ans (plus rapide que PC ou Internet). 88% des organisations utilisent désormais l'IA. Écart de perception : 73% des experts US sont positifs sur l'impact emploi, contre 23% du grand public.","en":"Over 400 pages of vetted data. Generative AI adoption at 53% within 3 years (faster than PC or internet). 88% of organisations now use AI. Perception gap: 73% of US experts are positive about employment impact, vs only 23% of the general public."},"url":"https://hai.stanford.edu/ai-index/2026-ai-index-report","ai_type":"generative"},{"date":"2026-04-15","source":"APEC","country":"FR","title":{"fr":"Perspectives 2026 du recrutement cadre·IT en redémarrage","en":"2026 executive recruitment outlook·IT picking up"},"excerpt":{"fr":"305 800 recrutements cadres prévus en 2026 (+4%). Cadres IT : 61 160 recrutements (+4%). Reprise relative·encore loin du sommet 2023 (330 400). Trois moteurs explicites : transformation numérique, cybersécurité, montée en puissance de l'IA. Profils juniors peu favorisés (+1%).","en":"305,800 executive recruitments expected in 2026 (+4%). IT executives: 61,160 hirings (+4%). Relative pickup·still below the 2023 peak (330,400). Three explicit drivers: digital transformation, cybersecurity, AI ramp-up. Junior profiles disadvantaged (+1%)."},"url":"https://corporate.apec.fr/home/nos-etudes/toutes-nos-etudes/les-cadres-et-l'ia.html","ai_type":"generative"},{"date":"2026-04-12","source":"PwC","country":"INT","title":{"fr":"AI Jobs Barometer 2025·France 1ère en Europe","en":"AI Jobs Barometer 2025·France 1st in Europe"},"excerpt":{"fr":"Analyse de près d'un milliard d'offres d'emploi sur six continents. France : 166 000 offres IA en 2024, devant l'Allemagne (147 000) et le Royaume-Uni (125 000). Offres IA × 10 en Suisse entre 2018 et 2024 (2 000 → 20 000). Prime salariale IA : jusqu'à +56% par rapport aux postes équivalents.","en":"Analysis of nearly one billion job postings across six continents. France: 166,000 AI postings in 2024, ahead of Germany (147,000) and UK (125,000). AI postings × 10 in Switzerland between 2018 and 2024 (2,000 → 20,000). AI salary premium: up to +56% versus equivalent positions."},"url":"https://www.pwc.fr/fr/publications/series/ai-jobs-barometer.html","ai_type":"generative"},{"date":"2026-04-10","source":"Roboto · Analyse fournisseurs LLM","country":"FR","title":{"fr":"La taxe linguistique française : +60% de tokens vs anglais sur les principaux LLM","en":"The French linguistic tax: +60% tokens vs English on major LLMs"},"excerpt":{"fr":"Analyse comparative documentée : pour une tâche d'agent identique (message utilisateur 100 mots + prompt système 500 mots + réponse 200 mots), le contenu en anglais consomme 1 040 tokens contre 1 664 tokens en français, soit +60%. Cette « taxe linguistique » provient du Byte Pair Encoding utilisé par les LLM, optimisé sur des corpus majoritairement anglophones. À l'échelle de millions d'appels d'agents par mois, cette surcharge devient un facteur de coût majeur pour les organisations francophones (France et Suisse romande). L'écart tarifaire entre modèles a aussi explosé : entre GPT-5.2 Pro à 168$/M tokens en sortie et Gemini Flash-Lite à 0,40$/M, l'écart atteint 420×, pour des modèles tous deux commercialisés comme « assistants IA ». Conséquence stratégique : les organisations francophones doivent maîtriser la sélection de modèles encore plus rigoureusement que les anglophones.","en":"Documented comparative analysis: for an identical agent task (100-word user message + 500-word system prompt + 200-word response), English content consumes 1,040 tokens vs 1,664 in French, a +60% increase. This « linguistic tax » comes from the Byte Pair Encoding used by LLMs, optimized on predominantly English corpora. At scale of millions of agent calls per month, this overhead becomes a major cost factor for French-speaking organizations (France and Romandie). The pricing spread between models has also exploded: between GPT-5.2 Pro at $168/M output tokens and Gemini Flash-Lite at $0.40/M, the gap reaches 420×, for models both marketed as « AI assistants ». Strategic consequence: French-speaking organizations must master model selection even more rigorously than English-speaking ones."},"url":"https://www.roboto.fr/blog/tokens-ia-comment-les-fournisseurs-vous-font-payer-60-de-plus","ai_type":"generative"},{"date":"2026-04-10","source":"Coface · OEM","country":"FR","title":{"fr":"Emplois, compétences, valeur : ce que l'IA est en train de bouleverser","en":"Jobs, skills, value: what AI is disrupting"},"excerpt":{"fr":"Étude conjointe Coface / Observatoire des Emplois Menacés et Émergents. 16,3% des emplois français exposés à 2-5 ans (≈ 5 millions). 3,8% déjà fragilisés par l'IA générative actuelle. Méthodologie tâche par tâche sur 923 professions. Métiers qualifiés en première ligne, contrairement aux vagues précédentes.","en":"Joint Coface / OEM study. 16.3% of French jobs exposed within 2-5 years (≈ 5 million). 3.8% already weakened by current generative AI. Task-by-task methodology on 923 occupations. Qualified jobs on the front line, unlike previous waves."},"url":"https://www.coface.fr/actualites-economie-conseils/emplois-competences-valeur-ce-que-l-ia-est-en-train-de-bouleverser","ai_type":"agentic"},{"date":"2026-04-08","source":"France Stratégie · DARES","country":"FR","title":{"fr":"Les Métiers en 2030·révision post-IA générative","en":"Jobs in 2030·post-generative AI revision"},"excerpt":{"fr":"Mise à jour du rapport prospectif coréalisé par France Stratégie et la DARES. 800 000 postes à pourvoir par an d'ici 2030, dont 90% liés aux départs en retraite. 115 000 postes d'ingénieurs informatiques nets supplémentaires (+26%). Métiers de la santé en première ligne des recrutements.","en":"Update to the prospective report co-authored by France Stratégie and DARES. 800,000 positions to be filled per year by 2030, 90% linked to retirements. 115,000 additional net IT engineering positions (+26%). Healthcare occupations on the front line of recruitment."},"url":"https://www.strategie-plan.gouv.fr/publications/metiers-2030","ai_type":"automation_broad"},{"date":"2026-04-02","source":"Swiss AI Center · HES-SO","country":"CH","title":{"fr":"Adoption de l'IA dans les PME suisses·bilan 2026","en":"AI adoption in Swiss SMEs·2026 review"},"excerpt":{"fr":"Centre dédié à l'accélération de l'adoption IA par les PME. PME = 3 millions d'emplois dans 590 000 entreprises (60% population active). Obstacles documentés : manque de connaissances, accès aux compétences locales, sécurité des données. AI Days 23-25 mars 2026 à Martigny et Fribourg.","en":"Centre dedicated to accelerating AI adoption by SMEs. SMEs = 3 million jobs in 590,000 companies (60% of the active population). Documented barriers: lack of knowledge, access to local skills, data security. AI Days 23-25 March 2026 in Martigny and Fribourg."},"url":"https://www.hes-so.ch/swiss-ai-center","ai_type":"generative"},{"date":"2026-04-01","source":"OFS · Statistique de l'emploi","country":"CH","title":{"fr":"STATEM Q1 2026·places vacantes et prévisions d'emploi","en":"STATEM Q1 2026·vacancies and employment forecasts"},"excerpt":{"fr":"Statistique trimestrielle officielle. Recul des places vacantes (-16,4% sur un an au T1 2025). Indicateur de prévision d'emploi à 1,042 (vs 1,05 l'an précédent). Chômage BIT 4,7% (vs 4,3%). Source de référence pour les indicateurs Suisse de l'observatoire.","en":"Official quarterly statistics. Vacancies declining (-16.4% year-on-year in Q1 2025). Employment forecast indicator at 1.042 (vs 1.05 the previous year). ILO unemployment 4.7% (vs 4.3%). Reference source for the observatory's Swiss indicators."},"url":"https://www.bfs.admin.ch/bfs/fr/home/statistiques/industrie-services/entreprises-emplois/statistique-emploi/places-vacantes.html","ai_type":"automation_broad"},{"date":"2026-03-25","source":"Gartner · Will Sommer","country":"INT","title":{"fr":"Le LLM Cost Paradox : tokens -90% d'ici 2030, mais coûts d'inférence en hausse","en":"The LLM Cost Paradox: tokens -90% by 2030, but inference costs rising"},"excerpt":{"fr":"Gartner prédit que d'ici 2030, l'inférence sur un LLM de 1 trillion de paramètres coûtera aux fournisseurs plus de 90% de moins qu'en 2025. Mais cette baisse de coût unitaire ne sera PAS répercutée sur les clients enterprise. Les modèles agentiques consomment 5 à 30 fois plus de tokens par tâche qu'un chatbot standard. Conclusion : la consommation de tokens augmentera plus vite que le prix unitaire ne baissera, et les coûts globaux d'inférence augmenteront. Citation directe : « Les CPO ne doivent pas confondre la déflation des tokens commodity avec la démocratisation du raisonnement frontière. Tandis que l'intelligence commoditisée tend vers un coût quasi nul, le compute nécessaire au raisonnement avancé reste rare. »","en":"Gartner predicts that by 2030, inference on a 1-trillion-parameter LLM will cost providers over 90% less than in 2025. But this unit-cost decline will NOT be passed on to enterprise customers. Agentic models consume 5-30x more tokens per task than a standard chatbot. Conclusion: token consumption will rise faster than unit prices fall, and overall inference costs will rise. Direct quote: « CPOs should not confuse the deflation of commodity tokens with the democratization of frontier reasoning. As commoditized intelligence trends toward near-zero cost, the compute and systems needed to support advanced reasoning remain scarce. »"},"url":"https://www.gartner.com/en/newsroom/press-releases/2026-03-25-gartner-predicts-that-by-2030-performing-inference-on-an-llm-with-1-trillion-parameters-will-cost-genai-providers-over-90-percent-less-than-in-2025","ai_type":"generative"},{"date":"2026-03-25","source":"TrueFoundry · cost of generative AI guide","country":"INT","title":{"fr":"Les coûts cachés de la GenAI et comment les contrôler","en":"The Hidden Costs of GenAI and How to Control Them"},"excerpt":{"fr":"Guide opérationnel publié en mars 2026 qui décompose les coûts cachés de la GenAI en plusieurs strates invisibles dans les modèles financiers initiaux. Citant la recherche IBM : les coûts informatiques devraient augmenter de 89% entre 2023 et 2025, dont 70% des dirigeants citent la GenAI comme moteur principal. Tous les dirigeants interrogés ont déjà annulé ou reporté au moins une initiative GenAI pour des raisons de coûts. Près de 10% des prompts envoyés aux modèles GenAI publics contiennent des informations sensibles d'entreprise, créant un risque de conformité financièrement matériel rarement modélisé. Les coûts de gouvernance ne sont pas une checklist ponctuelle mais un coût opérationnel continu, fortement sous-estimé en production.","en":"Operational guide published March 2026 that decomposes the hidden costs of GenAI into multiple strata invisible in initial financial models. Citing IBM research: computing costs are expected to rise 89% between 2023 and 2025, with 70% of executives citing GenAI as the primary driver. Every executive surveyed had already cancelled or postponed at least one GenAI initiative due to costs. Nearly 10% of prompts sent to public GenAI models contain sensitive enterprise information, creating a materially financial compliance risk rarely modeled. Governance costs are not a one-time checklist but a continuous operational cost, largely underestimated in production."},"url":"https://www.truefoundry.com/blog/cost-of-generative-ai","ai_type":"generative"},{"date":"2026-03-25","source":"DARES · LaborIA","country":"FR","title":{"fr":"Comment l'IA transforme les pratiques de recrutement","en":"How AI transforms recruitment practices"},"excerpt":{"fr":"Travaux du LaborIA (Ministère du Travail × Inria) sur l'usage des algorithmes dans le recrutement. Biais documentés, équité dans les recommandations d'emploi, hommes vs femmes. Régulation et encadrement des solutions IA en RH. Études de cas sur 250 décideurs RH.","en":"LaborIA (Ministry of Labour × Inria) work on algorithm use in recruitment. Documented biases, fairness in job recommendations, men vs women. Regulation and oversight of HR AI solutions. Case studies on 250 HR decision-makers."},"url":"https://dares.travail-emploi.gouv.fr/evenement/comment-lintelligence-artificielle-transforme-les-pratiques-de-recrutement","ai_type":"generative"},{"date":"2026-03-16","source":"AISuperior · LLM Inference Cost 2026","country":"INT","title":{"fr":"Le LLM Cost Paradox : prix unitaire -10×, consommation +100×","en":"The LLM Cost Paradox: unit price -10×, consumption +100×"},"excerpt":{"fr":"Documentation empirique du paradoxe d'inflation des coûts. Le prix par token a baissé de 10× entre 2022 et 2026 (de 60$/M à 0,06$/M pour des modèles équivalents à GPT-3 sur MMLU), mais la consommation de tokens par requête a augmenté de 100× pour certains usages. Mécanisme principal : les reasoning models cachent leur consommation interne. Une question simple peut consommer 10 000 tokens de raisonnement pour une réponse de 200 tokens, soit 50× plus que ce que la sortie visible suggère. Cas extrême documenté : 600 tokens consommés pour générer 2 mots de sortie. Conclusion : les startups dont les modèles de pricing reposent sur l'économie traditionnelle des tokens font face à une compression de marge ; un client à 20$/mois peut générer 18-25$ de coûts d'inférence en pic.","en":"Empirical documentation of the cost inflation paradox. Per-token price dropped 10× between 2022 and 2026 (from $60/M to $0.06/M for GPT-3-equivalent models on MMLU), but token consumption per request rose 100× for some workloads. Main mechanism: reasoning models hide internal consumption. A simple question can consume 10,000 reasoning tokens for a 200-token response, 50× more than visible output suggests. Documented extreme case: 600 tokens to generate 2 words of output. Conclusion: startups whose pricing relies on traditional token economics face margin compression; a $20/month customer can generate $18-25 in peak inference costs."},"url":"https://aisuperior.com/llm-token-cost/","ai_type":"generative"},{"date":"2026-02-26","source":"Financial Times · Burn-Murdoch & O'Connor","country":"INT","title":{"fr":"Sait-on vraiment quels métiers sont les plus exposés à l'IA ?","en":"Do we really know which jobs are most at risk from AI?"},"excerpt":{"fr":"Critique méthodologique majeure : les sept mesures d'exposition par tâches (Eloundou OpenAI, Anthropic Economic Index, AIOE, Yale Budget Lab, etc.) s'accordent sur les métiers peu exposés mais divergent fortement sur les plus exposés. Au-delà de la capacité technique, trois facteurs pèsent : autonomie du travailleur, régulation institutionnelle (radiologie, thérapie), et effets de second ordre sur la demande. Citation centrale de David Autor (2003) : les technologies remplacent les exécutants de specs, complémentent les définisseurs.","en":"Major methodological critique: the seven task-based exposure measures (Eloundou OpenAI, Anthropic Economic Index, AIOE, Yale Budget Lab, etc.) agree on low-exposure jobs but diverge sharply on the most exposed. Beyond technical capability, three factors matter: worker autonomy, institutional regulation (radiology, therapy), and second-order demand effects. Central citation from David Autor (2003): technologies replace those who execute specs, complement those who define them."},"url":"https://www.ft.com/content/f55c4eba-6e10-4283-8eae-e9f475048b37","ai_type":"generative"},{"date":"2026-02-19","source":"Yale Budget Lab · Gimbel, Kendall, Kulsakdinun","country":"INT","title":{"fr":"L'exposition à l'IA sur le marché du travail : que sait-on vraiment ?","en":"Labor Market AI Exposure: What Do We Know?"},"excerpt":{"fr":"Étude systématique comparant 7 métriques d'exposition à l'IA (Eloundou OpenAI, Felten AIOE, Webb, Eisfeldt, Tomlinson Microsoft Copilot, etc.) sur 867 métiers SOC 2018. Conclusion en trois points : les métriques s'accordent largement, mais elles divergent davantage sur les métiers fortement exposés. Le désaccord porte sur l'ampleur de l'exposition, pas sur le fait qu'un métier soit exposé. L'exposition n'indique pas qu'un métier sera automatisé, seulement qu'il pourrait être impacté. Exemples canoniques : les plombiers ont une variance de 0,03 (consensus total sur faible exposition), les programmeurs informatiques ont 0,48 (désaccord majeur sur l'ampleur). Données ouvertes téléchargeables.","en":"Systematic study comparing 7 AI exposure metrics (Eloundou OpenAI, Felten AIOE, Webb, Eisfeldt, Tomlinson Microsoft Copilot, etc.) across 867 SOC 2018 occupations. Three key takeaways: metrics broadly agree, but disagree more on highly exposed occupations. Disagreement is about magnitude, not whether an occupation is exposed. Exposure does not indicate which jobs AI will automate, only where AI could have an impact. Canonical examples: plumbers have variance 0.03 (full consensus on low exposure), computer programmers have 0.48 (major disagreement on magnitude). Open data downloadable."},"url":"https://budgetlab.yale.edu/research/labor-market-ai-exposure-what-do-we-know","ai_type":"generative"},{"date":"2025-11-20","source":"Gartner · Hung LeHong","country":"INT","title":{"fr":"Coûts GenAI : les organisations sous-estiment de 500% à 1000% le coût total réel","en":"GenAI costs: organizations underestimate true total cost by 500% to 1000%"},"excerpt":{"fr":"Mesure structurante : les organisations qui ne maîtrisent pas la mise à l'échelle de leurs coûts GenAI font des erreurs de calcul de l'ordre de 500% à 1000%. 72% des CIO interrogés rapportent que leur organisation a fait du break-even ou perdu de l'argent sur ses investissements IA. La moitié des organisations abandonnent leurs efforts pour cause de dérapage des coûts. Ces erreurs ne portent pas sur le prix du token mais sur la combinaison consommation × intégration × gouvernance × supervision humaine × conformité. Recommandation Gartner : créer des proofs of concept qui testent la mise à l'échelle des coûts, pas seulement le fonctionnement de la technologie.","en":"Structural finding: organizations that don't master the scaling of their GenAI costs make calculation errors of 500% to 1000%. 72% of surveyed CIOs report their organization has broken even or lost money on AI investments. Half of organizations abandon their efforts due to cost overruns. These errors are not about token pricing but about the combination of consumption × integration × governance × human oversight × compliance. Gartner recommendation: create proofs of concept that test how costs will scale, not just how the technology works."},"url":"https://www.gartner.com/en/articles/ai-value","ai_type":"generative"},{"date":"2025-11-19","source":"Gartner · Arun Chandrasekaran","country":"INT","title":{"fr":"Les angles morts critiques de la GenAI que les CIO doivent traiter en urgence","en":"Critical GenAI Blind Spots That CIOs Must Urgently Address"},"excerpt":{"fr":"Gartner identifie en novembre 2025 dix angles morts de l'adoption GenAI, dont la dette technique générée par l'IA, le shadow AI (69% des organisations en ont des indices), le verrouillage fournisseur, et l'érosion des compétences. Prédiction marquante : d'ici 2030, 50% des entreprises feront face à des retards d'upgrades IA et/ou des coûts de maintenance croissants à cause d'une dette technique GenAI non gérée. « Le coût punitif élevé de maintenance, correction ou remplacement des artefacts générés par IA, qu'il s'agisse de code, contenu ou design, peut éroder le ROI promis par la GenAI. »","en":"Gartner identifies in November 2025 ten GenAI adoption blind spots, including AI-generated technical debt, shadow AI (69% of organizations show signs), vendor lock-in, and skills erosion. Notable prediction: by 2030, 50% of enterprises will face delayed AI upgrades and/or rising maintenance costs due to unmanaged GenAI technical debt. 'The punitively high cost of maintaining, fixing or replacing AI-generated artifacts such as code, content and design can erode GenAI's promised ROI.'"},"url":"https://www.gartner.com/en/newsroom/press-releases/2025-11-19-gartner-identifies-critical-genai-blind-spots-that-cios-must-urgently-address0","ai_type":"generative"},{"date":"2024-10-21","source":"Gartner · Mary Mesaglio & Hung LeHong","country":"INT","title":{"fr":"Erreur de calcul de coûts IA de 500% à 1000% : le risque que les CIO sous-estiment","en":"500% to 1000% AI Cost Calculation Error: The Risk CIOs Underestimate"},"excerpt":{"fr":"Source primaire de la statistique la plus citée sur les coûts cachés de l'IA. Sur la base d'une enquête Gartner de 451 leaders technologiques senior puis 300 CIO en juin-juillet 2024 : 90% des CIO déclarent que la gestion des coûts limite leur capacité à dégager de la valeur de l'IA, 72% rapportent que leur organisation a fait du break-even ou perdu de l'argent sur ses investissements IA. Citation décisive de l'analyste Hung LeHong : « si les CIO ne comprennent pas comment leurs coûts GenAI vont scaler, Gartner estime qu'ils peuvent faire une erreur de 500% à 1000% dans leurs calculs de coûts. » Cette statistique est devenue la référence pour parler des coûts cachés de l'IA en entreprise.","en":"Primary source for the most-cited statistic on AI hidden costs. Based on a Gartner survey of 451 senior tech leaders and then 300 CIOs in June-July 2024: 90% of CIOs say cost management limits their ability to extract value from AI, 72% report that their organization has broken even or lost money on AI investments. Decisive quote from analyst Hung LeHong: 'if CIOs don't understand how their GenAI costs will scale, Gartner estimates they could make a 500% to 1000% error in their cost calculations.' This statistic has become the reference for enterprise AI hidden costs."},"url":"https://www.gartner.com/en/newsroom/press-releases/2024-10-21-gartner-identifies-four-emerging-challenges-to-delivering-value-from-ai-safely-and-at-scale","ai_type":"generative"}];
