// Page-level translations are merged in by each page before init()
window.PAGE_I18N = window.PAGE_I18N || { fr: {}, en: {} };

let CURRENT_LANG = localStorage.getItem("obs-lang") || "fr";

function t(key) {
  const merged = {
    ...I18N[CURRENT_LANG],
    ...(window.PAGE_I18N[CURRENT_LANG] || {})
  };
  return merged[key] || key;
}

function applyI18n() {
  document.documentElement.lang = CURRENT_LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    const html = el.hasAttribute("data-i18n-html");
    const value = t(key);
    if (html) el.innerHTML = value;
    else el.textContent = value;
  });
  document.querySelectorAll(".lang-toggle span").forEach((s) => {
    s.classList.toggle("active", s.getAttribute("data-lang") === CURRENT_LANG);
  });
  // Re-render dynamic sections if the page has a hook
  if (typeof window.onLangChange === "function") window.onLangChange(CURRENT_LANG);
}

function setupLangToggle() {
  const toggle = document.getElementById("langToggle");
  if (!toggle) return;
  toggle.addEventListener("click", () => {
    CURRENT_LANG = CURRENT_LANG === "fr" ? "en" : "fr";
    localStorage.setItem("obs-lang", CURRENT_LANG);
    applyI18n();
  });
}

function setupMobileMenu() {
  const menuBtn = document.getElementById("menuBtn");
  const closeBtn = document.getElementById("closeMenu");
  const mobileMenu = document.getElementById("mobileMenu");
  if (!menuBtn || !mobileMenu) return;
  menuBtn.addEventListener("click", () => mobileMenu.classList.add("open"));
  if (closeBtn) closeBtn.addEventListener("click", () => mobileMenu.classList.remove("open"));
  mobileMenu.querySelectorAll("a").forEach((a) => {
    a.addEventListener("click", () => mobileMenu.classList.remove("open"));
  });
}

function setupReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add("visible");
    });
  }, { threshold: 0.1 });
  document.querySelectorAll(".manifesto-text, .section-title, .stat, .kpi, .card, .field-card, .country-card, .dash-title")
    .forEach((el) => {
      el.classList.add("reveal");
      observer.observe(el);
    });
}

// Detect if we're in a subfolder (observatoires/ or briefings/) and build relative root

  // Pages in /observatoires/ or /briefings/ have one extra path segment
  const path = window.location.pathname;
  return (path.includes("/observatoires/") || path.includes("/briefings/")) ? "../" : "";
}

    "b3.src.s1.label": "Fédération de l'industrie horlogère suisse (FH) · Statistiques 2025 · janvier 2026",
    "b3.src.s1.cited": "Citée pour le chiffre <strong>-1,7% des exportations horlogères suisses en 2025 (25,6 Md CHF)</strong>, deuxième année consécutive de repli. Volumes -4,8% (-740 000 unités). Source officielle des douanes fédérales.",
    "b3.src.s2.label": "Le Temps · Résultats trimestriels Richemont · 15 janvier 2026",
    "b3.src.s2.cited": "Citée pour le chiffre <strong>+7% pour les spécialités horlogères Richemont</strong> (IWC, Jaeger-LeCoultre, Vacheron Constantin, A. Lange & Söhne, Panerai, Piaget, Roger Dubuis). Premier rebond significatif depuis 18 mois.",
    "b3.src.s3.label": "Kearney · 2026 Global Luxury Industry Outlook · janvier 2026",
    "b3.src.s3.cited": "Citée pour le chiffre <strong>+16,2% / an d'investissement IA dans le luxe sur dix ans</strong>, et 90% des dirigeants considérant l'IA comme essentielle. Échantillon : 200+ dirigeants luxe interrogés.",
    "b3.src.primary": "Source primaire ↗",
    "b3.src.note": "Note. Les chiffres présentés ici sont arrondis. Les marges d'incertitude et les méthodologies détaillées de chaque source sont accessibles sur la page Méthodologie. Sources complémentaires citées : Bain-Altagamma, Deloitte Global Powers of Luxury 2026, Reuters, Reed Smith, France-Épargne, Carnets du Luxe, ORIGYN, Arianee, WiseKey.",

    "b3.tco.eyebrow": "Économie des coûts · le facteur ignoré",
    "b3.tco.title": "Le coût réel de l'IA dans le luxe et l'horlogerie premium, <em>au-delà du prix par token</em>.",
    "b3.tco.lede": "Les expériences clients VIP, les recommandations personnalisées et l'authentification de produits par IA exigent une qualité d'inférence et une supervision humaine que les budgets POC sous-estiment systématiquement. Pour le luxe, le coût d'un mauvais output peut détruire en un instant un capital de marque construit en décennies.",
    "b3.tco.s1.label": "Erreur potentielle de calcul des coûts GenAI selon Gartner si le passage à l'échelle n'est pas anticipé",
    "b3.tco.s1.source": "Gartner · oct 2024",
    "b3.tco.s2.label": "Des CIO indiquent un breakeven ou une perte sur leurs investissements IA en 2024",
    "b3.tco.s2.source": "Gartner · oct 2024",
    "b3.tco.s3.label": "Coût par résolution GenAI prédit dans le service client en 2030, supérieur aux agents offshore",
    "b3.tco.s3.source": "Gartner · janv 2026",
    "b3.tco.takeaway": "<strong>Pour les directions des marques d'horlogerie premium et de luxe</strong>, l'enjeu spécifique : les expériences clients VIP, les recommandations personnalisées et l'authentification de produits par IA exigent une qualité d'inférence et une supervision humaine que le prix par token publié ne reflète pas. Le coût total par interaction haut de gamme peut atteindre 10 à 20 fois le coût POC. Le pivot stratégique de <em>Quinlan (Gartner, janvier 2026)</em> s'applique parfaitement au luxe : utiliser l'IA pour augmenter la valeur perçue de la relation, jamais pour rogner sur l'expérience client. Le cadre TCO de Tomer (avril 2026) et notre <a href=\"../methodologie.html#tco\">section méthodologique 07</a> formalisent les composantes à modéliser.",

    "b3.sov.eyebrow": "Souveraineté numérique · juridiction et résidence des données",
    "b3.sov.title": "Pour le luxe et l'horlogerie premium, <em>la souveraineté est cohérente avec la promesse de marque</em>.",
    "b3.sov.lede": "Une marque d'horlogerie premium qui revendique le « Swiss Made » et la traçabilité de chaque composant ne peut pas, sans incohérence narrative, traiter ses données clients VIP ou ses informations design sensibles dans une infrastructure dont la juridiction n'est pas garantie. La souveraineté numérique devient un actif de marque, au même titre que la manufacture interne ou la traçabilité de l'or éthique.",
    "b3.sov.s1.tag": "Suisse",
    "b3.sov.s1.name": "Apertus + Swisscom Sovereign AI",
    "b3.sov.s1.body": "Apertus (EPFL, ETH Zurich, CSCS, septembre 2025) est le premier LLM public suisse fully open : 8B et 70B paramètres, 1000+ langues incluant le suisse-allemand. Conforme à l'EU AI Act, à la LPD suisse et aux opt-outs créateurs. Hébergé sur la plateforme IA souveraine de Swisscom. Pour les Maisons horlogères qui veulent traiter des données clients VIP ou des archives design (croquis de mouvement, archives historiques, base CRM patrimoniale) sous juridiction strictement helvétique, c'est l'option qui aligne IA et promesse de marque Swiss Made.",
    "b3.sov.s2.tag": "Europe",
    "b3.sov.s2.name": "Mistral AI · pour les marchés européens",
    "b3.sov.s2.body": "Mistral AI (FR, Paris) traite toutes les requêtes API dans des data centers européens. Pour les marques horlogères premium qui opèrent fortement sur les marchés européens (boutiques flagship Paris, Milan, Genève), Mistral offre une couverture multilingue native (français, allemand, italien, espagnol) avec garantie contractuelle de non-utilisation des données client pour l'entraînement. Levée de 830 M$ de dette en mars 2026 pour 200 MW de capacité européenne en 2027.",
    "b3.sov.s3.tag": "Cohérence",
    "b3.sov.s3.name": "Le récit Swiss Made et la donnée sous juridiction étrangère",
    "b3.sov.s3.body": "L'horlogerie premium vend de la patience, de la précision, de la traçabilité. Une marque qui investit dans la traçabilité de chaque composant horloger mais qui externalise le traitement de ses données clients VIP vers une infrastructure US s'expose à un risque narratif autant que réglementaire. La presse spécialisée (WatchPro, Le Temps, Forbes Watches) commence à interroger ces choix. Les ventes Singapore-China-Middle East exigent désormais souvent des engagements explicites de résidence européenne ou suisse.",
    "b3.sov.takeaway": "<strong>Pour les comités exécutifs des Maisons horlogères premium</strong>, la grille de décision intègre la souveraineté comme une composante stratégique. Apertus et Swisscom Sovereign AI permettent de garder l'IA conforme à la promesse Swiss Made. Mistral couvre les marchés européens en restant en juridiction UE. L'investissement initial est plus élevé, mais le coût d'opportunité d'un incident de souveraineté qui contredirait le récit de marque est, lui, considérable.",

    "b3.disc.eyebrow": "Disclosure éditoriale",
    "b3.disc.body": "Ce dossier a été produit avec l'assistance d'une intelligence artificielle (Claude Opus 4.7, en modes Research et Web Search), puis soumis à une vérification factuelle contre les sources primaires. L'IA a servi d'outil de documentation, de synthèse et de mise en forme visuelle, pas de source autonome ni d'autorité scientifique. Détails méthodologiques en <a href=\"../methodologie.html\">section 03 de la page Méthodologie</a>.",

    "b3.back": "Toutes les dépêches"

  en: {
    "b3.meta.num": "The Dispatch·iA #003",
    "b3.meta.sector": "Luxury & Watchmaking",
    "b3.meta.country": "🇨🇭 Switzerland",
    "b3.meta.date": "Q2 2026",
    "b3.meta.edition": "Open Intelligence",

    "b3.title": "Premium watchmaking and AI: the test of <em>desirability</em>.",
    "b3.sub": "The luxury market is going through its toughest quarter since 2008 in 2026. For Swiss premium watchmaking houses, AI governance is no longer a compliance issue: it is now a desirability issue. Three fronts open simultaneously. Here is what an executive committee needs to know before the next Watches & Wonders.",
    "b3.by.author": "Naully Nicolas",
    "b3.by.read": "7 minute read",
    "b3.by.sources": "12 primary sources",

    "b3.land.eyebrow": "The landscape",
    "b3.land.title": "What premium watchmaking is <em>actually</em> going through in 2026.",
    "b3.land.p1": "The Swiss watchmaking industry closed 2025 with a second consecutive year of decline (-1.7%, to CHF 25.6 billion in exports), with volumes down 4.8% (-740,000 units) and employment down 1.3%. Q1 2026 confirms the pressure: -1.0% over three months (CHF 6.2bn), China down more than a third in two years, generalised partial unemployment in Jura subcontracting. The high-end segment (>CHF 3,000 export price) is down 1.9%, a sign that even the sanctuary of rarity is weakening.",
    "b3.land.p2": "But behind this cyclical crisis, a strong signal: Richemont's specialist watchmakers division grew +7% in March 2026 (first rebound in 18 months), driven by A. Lange & Söhne and Vacheron Constantin. Cartier and Van Cleef jewellery up +14%. Value is shifting clearly toward heritage rarity and VIP experience. Three AI fronts open simultaneously for houses: regulatory (European AI Act), operational (Shadow AI in boutiques and manufactures), and strategic (agentic commerce challenging the watch purchase ritual).",

    "b3.land.up.title": "What is settling in",
    "b3.land.up.li1": "<strong>AI + blockchain authentication.</strong> ORIGYN (Neuchâtel), Arianee (Vacheron, Breitling), WiseKey (Hublot since 2010). Response to USD 2 billion in annual losses from counterfeiting.",
    "b3.land.up.li2": "<strong>Augmented clienteling.</strong> AI CRM for boutique advisors: ultra-VIP appointment preparation, recommendations based on purchase history, real-time quadrilingual translation.",
    "b3.land.up.li3": "<strong>Forecasting and orchestration of rarity.</strong> Demand prediction by reference, market, segment, to adjust production to the desired level of desirability (Kearney: central 2026 objective).",
    "b3.land.up.li4": "<strong>AI-certified secondary market.</strong> Watchfinder (Richemont), Chrono24, WatchBox: visual authentication via computer vision on each piece's unique biometric fingerprint.",

    "b3.land.down.title": "What is slowing down",
    "b3.land.down.li1": "<strong>Young watchmaker recruitment.</strong> -1.3% sectoral employment in 2025, Jura subcontracting in partial unemployment. Concerns about transmission of know-how.",
    "b3.land.down.li2": "<strong>Generic AI marketing.</strong> Product visuals generated without manual validation. High reputational risk: a fake movement visual on Instagram can collapse a brand capital.",
    "b3.land.down.li3": "<strong>Outsourcing outside the EU.</strong> Ultra-high net worth client data (UHNW): reinforced sovereignty requirements, AI Act + Swiss nGDPR in force in 2026.",
    "b3.land.down.li4": "<strong>Unframed agentic commerce.</strong> Existential risk for the boutique ritual: an AI agent negotiating a Vacheron Patrimony in place of the client breaks the emotional contract built over decades.",

    "b3.num.eyebrow": "By the numbers",
    "b3.num.title": "Three indicators that summarise the year.",
    "b3.num.s1.label": "Swiss watch exports in 2025, second consecutive year of decline (to CHF 25.6 billion). Volumes -4.8% (-740,000 watches).",
    "b3.num.s1.source": "Federation of the Swiss Watch Industry (FH) · January 2026",
    "b3.num.s2.label": "growth for Richemont specialist watchmakers in fiscal Q3 2026 (October-December 2025). First significant rebound in 18 months, led by A. Lange & Söhne and Vacheron Constantin.",
    "b3.num.s2.source": "Le Temps · Richemont quarterly results · January 2026",
    "b3.num.s3.label": "annual growth in luxury AI investment over the next decade. 90% of luxury executives consider AI essential.",
    "b3.num.s3.source": "Kearney · 2026 Global Luxury Industry Outlook",

    "b3.q.eyebrow": "Expert verdict",
    "b3.q.text": "For luxury, AI governance is not a compliance issue, it is a desirability issue. A house deploying AI outside its standards risks more than a fine: it erodes brand capital built over decades. Conversely, those who can articulate craftsmanship, governed AI and radical transparency will create a new tier of differentiation.",
    "b3.q.author": "Director of digital transformation",
    "b3.q.role": "premium watchmaking manufacture · Vallée de Joux · anonymised interview · April 2026",

    "b3.dec.eyebrow": "Decision · 4 questions to address",
    "b3.dec.title": "What a <em>house executive committee</em> must decide before Watches & Wonders 2027.",
    "b3.dec.intro": "Four operational arbitrations, in order of criticality. None can be fully delegated to IT or an external consultancy. All commit the house's identity over the decade-long horizon characteristic of premium watchmaking.",

    "b3.dec.li1": "<strong>AI usage perimeter in creation.</strong> Which models authorised on upstream phases (design, prototyping), forbidden on identity phases (dial, signature calibre). Decision required before any AI-using marketing communication.",
    "b3.dec.li2": "<strong>Digital authentication standard.</strong> Adopt ORIGYN, Arianee, WiseKey or develop a proprietary solution (Ulysse Nardin model). Structuring decision: a market standard will emerge by 2027 and freeze positions.",
    "b3.dec.li3": "<strong>Agentic commerce policy.</strong> Authorise, frame or forbid AI agents on online boutiques. Existential question: agentics automate the worst enemy of luxury (purchase without ritual). Three Swiss houses interviewed are preparing a charter.",
    "b3.dec.li4": "<strong>UHNW data sovereignty.</strong> Architecture of ultra-high net worth client data. European AI Act in full application, Swiss nGDPR 2026, US biometric tightening. Hosting and model choices to validate in executive committee with compliance.",

    "b3.roles.eyebrow": "At the role level",
    "b3.roles.title": "What <em>governed desirability</em> means for five luxury occupations.",
    "b3.roles.intro": "A house's AI governance choices play out in the daily work of five families of occupations. The irreducible artisan, boutique commerce, brand construction, digital experience, narrative orchestration. For each, what AI displaces, and the most defensible pivot path according to the Swiss observatory's sources.",
    "b3.roles.pivotLabel": "Recommended pivot",
    "b3.roles.footer": "<strong>Switzerland total: 69,500 active workers across the five occupations above</strong>, covering the watchmaking ecosystem and its support fabric (premium retail, communication, design). Headcount figures come from the FSO (STATEM Q1 2026) and the watchmaking industry's Convention patronale. The 324 occupations of the NP 2010 nomenclature are accessible in the <a href=\"../observatoires/suisse.html\" style=\"color: var(--signal); text-decoration: underline;\">Swiss dashboard</a>.",

    "b3.roles.r1.domain": "Industry and production",
    "b3.roles.r1.name": "Watchmaker",
    "b3.roles.r1.exp": "2/10",
    "b3.roles.r1.expLabel": "exposure",
    "b3.roles.r1.head": "10,000",
    "b3.roles.r1.headLabel": "active CH",
    "b3.roles.r1.shift": "The artisan gesture resists, and that is a brand strategy as much as a technical reality. What changes around the watchmaker is the working environment: computer vision for optical quality control, generative AI for complex movement design, digital simulation before prototyping. The hand stays human, the ecosystem becomes hybrid. Traditional haute horlogerie (complications, restoration of historical pieces) gains brand value against the automated precision industry.",
    "b3.roles.r1.pivot": "Master watchmaker in haute horlogerie (complications, restoration of historical timepieces). Optical quality control technician with computer vision mastery. Watchmaking training lead (CIFOM, watchmaking schools, CFC).",

    "b3.roles.r2.domain": "Trade, sales and marketing",
    "b3.roles.r2.name": "Luxury boutique specialist seller",
    "b3.roles.r2.exp": "5/10",
    "b3.roles.r2.expLabel": "exposure",
    "b3.roles.r2.head": "28,000",
    "b3.roles.r2.headLabel": "active CH",
    "b3.roles.r2.shift": "Standard pre-sales, client qualification, appointment booking and post-purchase follow-up move to augmented CRM copilots. What resists, and what the house must protect: the boutique ritual, knowledge of the UHNW client, the ability to tell a piece's story, to arbitrate between actual availability and waiting list. The seller becomes a curator of experience more than a transaction technician.",
    "b3.roles.r2.pivot": "Premium technical product expert (watchmaking, jewellery, audiology). Luxury client advisor specialising in UHNW experience and loyalty. In-house sales and commercial techniques trainer.",

    "b3.roles.r3.domain": "Communication, media, translation",
    "b3.roles.r3.name": "Brand manager",
    "b3.roles.r3.exp": "5/10",
    "b3.roles.r3.expLabel": "exposure",
    "b3.roles.r3.head": "6,000",
    "b3.roles.r3.headLabel": "active CH",
    "b3.roles.r3.shift": "Occupation at the heart of this dispatch's subject. AI governance becomes a brand positioning issue, not just a compliance one. The brand manager arbitrates the use of generative AI in visual creation, sets the rules of coexistence between AI and human signature, anticipates the reputational pressure of a use perceived as degrading. The skill shifts in nature: less campaigns and calendars, more brand doctrine in the face of AI.",
    "b3.roles.r3.pivot": "Marketing and brand strategy director (brand P&L, portfolio architecture). Brand purpose and impact expert (CSR, engaged communication, B Corp). Global brand consultant on brand extension and emerging markets.",

    "b3.roles.r4.domain": "Audiovisual and digital content",
    "b3.roles.r4.name": "UX/UI designer",
    "b3.roles.r4.exp": "7/10",
    "b3.roles.r4.expLabel": "exposure",
    "b3.roles.r4.head": "22,000",
    "b3.roles.r4.headLabel": "active CH",
    "b3.roles.r4.shift": "Strong exposure to generative AI tools on wireframing, prototyping, asset production. The designer's value in a luxury environment shifts toward what cannot be reproduced: consistency with a hundred-year-old house identity, the fineness of the connected boutique experience, arbitration between accessibility and desirability, stewardship of a design system that survives generations of tools.",
    "b3.roles.r4.pivot": "UX and product experience director (product design, discovery, roadmap). Accessibility and inclusive design expert (WCAG, audits, diverse personas). Design system lead (tokens, components, design governance at scale).",

    "b3.roles.r5.domain": "Communication, media, translation",
    "b3.roles.r5.name": "Communication director / CMO",
    "b3.roles.r5.exp": "6/10",
    "b3.roles.r5.expLabel": "exposure",
    "b3.roles.r5.head": "3,500",
    "b3.roles.r5.headLabel": "active CH",
    "b3.roles.r5.shift": "Restricted population but with strong amplification effect. Corporate communication production, competitive intelligence, press release drafting move to copilots. What becomes the primary function: orchestrating the house's AI transformation from within, steering crisis communication on AI-ethics topics, defending narrative coherence when AI marketing pushes for volume. The CMO becomes guardian of tempo.",
    "b3.roles.r5.pivot": "Chief Digital Officer in AI transformation (corporate digital steering, MAS Management HES). Public relations and corporate affairs director (cantonal and federal lobbying, SPRI Berne). Independent AI and communication consultant for Swiss SMEs and foundations.",

    "b3.tools.eyebrow": "AI as a lever",
    "b3.tools.title": "Six <em>tools</em> used by watchmaking houses that move forward.",
    "b3.tools.intro": "Selection observed in real deployments at Richemont, Hermès Horloger, Audemars Piguet and three independent manufactures interviewed. Mastery is not in the choice of tool, but in the definition of the use case and the governance it imposes.",

    "b3.tools.t1.cat": "Authentication",
    "b3.tools.t1.name": "ORIGYN · AI biometric fingerprint",
    "b3.tools.t1.desc": "High-definition computer vision on each piece, unforgeable digital signature, blockchain certificate. Adopted by WatchBox on the secondary market.",

    "b3.tools.t2.cat": "VIP clienteling",
    "b3.tools.t2.name": "Augmented boutique CRM",
    "b3.tools.t2.desc": "VIP appointment preparation: purchase history, declared preferences, personal events, recommendations of pieces compatible with existing collection.",

    "b3.tools.t3.cat": "Forecast & rarity",
    "b3.tools.t3.name": "Proprietary models + ESPA data",
    "b3.tools.t3.desc": "Demand prediction by reference, market, price segment. Allows orchestration of production while respecting the rarity dramaturgy specific to each collection.",

    "b3.tools.t4.cat": "Creation & design",
    "b3.tools.t4.name": "Confined generative AI",
    "b3.tools.t4.desc": "Strictly upstream use: aesthetic variant exploration, stylistic research. Final decision and signature always human. No identity element generated by AI.",

    "b3.tools.t5.cat": "After-sales service",
    "b3.tools.t5.name": "AI triage of after-sales requests",
    "b3.tools.t5.desc": "Automatic classification of requests (revision, repair, expertise), assignment to the competent specialist watchmaker. Reduces delays on complex requests.",

    "b3.tools.t6.cat": "Anti-counterfeiting",
    "b3.tools.t6.name": "Computer vision on parallel market",
    "b3.tools.t6.desc": "Automated monitoring of platforms (eBay, Chrono24, Vinted): detection of suspicious pieces, legal alert. Supports the FH anti-counterfeiting service (Michel Arnoux).",

    "b3.act.eyebrow": "Going further",
    "b3.act.title": "From diagnosis to <em>action</em>.",
    "b3.act.lede": "This dispatch sets the frame. To move from observation to decision, two bridges depending on your need.",
    "b3.act.c1.tag": "Custom Dispatch",
    "b3.act.c1.title": "A dispatch tailored to your house",
    "b3.act.c1.desc": "The Dispatch·iA format applied to your exact perimeter: anonymised peer benchmark, AI Act and Swiss nGDPR risk mapping for your UHNW data, use case prioritisation matrix adapted to your brand identity, positioning scenarios facing agentic commerce. Delivered within fifteen days. Quote on request.",
    "b3.act.c1.cta": "Request a quote →",
    "b3.act.c2.tag": "Operational implementation",
    "b3.act.c2.title": "From governance to architecture",
    "b3.act.c2.desc": "House executive committee support: AI usage policy, customer data governance, internal tools design (CRM, anti-counterfeit, forecast), boutique and workshop team training. Half-day or full-mission interventions. First conversation free.",
    "b3.act.c2.cta": "Discuss implementation →",

    "b3.src.eyebrow": "Appendix · Sources & traceability",
    "b3.src.title": "Every cited figure, open to <em>verification</em>.",
    "b3.src.intro": "A dispatch is only worth its verifiable figures. Every indicator in this dispatch is linked below to its original publication. Primary sources fully cited, no paywall, no withholding.",
    "b3.src.s1.label": "Federation of the Swiss Watch Industry (FH) · 2025 Statistics · January 2026",
    "b3.src.s1.cited": "Cited for the figure <strong>-1.7% in Swiss watch exports in 2025 (CHF 25.6 billion)</strong>, second consecutive year of decline. Volumes -4.8% (-740,000 units). Official source: Swiss federal customs.",
    "b3.src.s2.label": "Le Temps · Richemont quarterly results · 15 January 2026",
    "b3.src.s2.cited": "Cited for the figure <strong>+7% for Richemont specialist watchmakers</strong> (IWC, Jaeger-LeCoultre, Vacheron Constantin, A. Lange & Söhne, Panerai, Piaget, Roger Dubuis). First significant rebound in 18 months.",
    "b3.src.s3.label": "Kearney · 2026 Global Luxury Industry Outlook · January 2026",
    "b3.src.s3.cited": "Cited for the figure <strong>+16.2%/year of luxury AI investment over ten years</strong>, and 90% of executives considering AI essential. Sample: 200+ luxury executives interviewed.",
    "b3.src.primary": "Primary source ↗",
    "b3.src.note": "Note. Figures presented here are rounded. Uncertainty margins and detailed methodologies for each source are accessible on the Methodology page. Complementary sources cited: Bain-Altagamma, Deloitte Global Powers of Luxury 2026, Reuters, Reed Smith, France-Épargne, Carnets du Luxe, ORIGYN, Arianee, WiseKey.",

    "b3.disc.eyebrow": "Editorial disclosure",
    "b3.disc.body": "This dossier was produced with the assistance of artificial intelligence (Claude Opus 4.7, in Research and Web Search modes), then submitted to factual verification against primary sources. The AI was used as a tool for documentation, synthesis and visual formatting, not as an autonomous source or scientific authority. Methodological details in <a href=\"../methodologie.html\">section 03 of the Methodology page</a>.",


    "b3.sov.eyebrow": "Digital sovereignty · jurisdiction and data residency",
    "b3.sov.title": "For premium luxury and watchmaking, <em>sovereignty is consistent with the brand promise</em>.",
    "b3.sov.lede": "A premium watchmaking brand that claims « Swiss Made » and component traceability cannot, without narrative inconsistency, process VIP client data or sensitive design information in infrastructure whose jurisdiction is not guaranteed. Digital sovereignty becomes a brand asset, on par with in-house manufacturing or ethical gold traceability.",
    "b3.sov.s1.tag": "Switzerland",
    "b3.sov.s1.name": "Apertus + Swisscom Sovereign AI",
    "b3.sov.s1.body": "Apertus (EPFL, ETH Zurich, CSCS, September 2025) is Switzerland's first public fully open LLM: 8B and 70B parameters, 1000+ languages including Swiss German. Compliant with the EU AI Act, Swiss data protection law, and creator opt-outs. Hosted on Swisscom's sovereign AI platform. For watchmaking houses processing VIP client data or design archives (movement sketches, historical archives, heritage CRM base) under strictly Swiss jurisdiction, this is the option that aligns AI with the Swiss Made brand promise.",
    "b3.sov.s2.tag": "Europe",
    "b3.sov.s2.name": "Mistral AI · for European markets",
    "b3.sov.s2.body": "Mistral AI (FR, Paris) processes all API requests in European data centers. For premium watchmaking brands operating heavily in European markets (flagship boutiques Paris, Milan, Geneva), Mistral offers native multilingual coverage (French, German, Italian, Spanish) with a contractual guarantee of non-use of customer data for training. $830M debt raise in March 2026 for 200 MW of European capacity by 2027.",
    "b3.sov.s3.tag": "Consistency",
    "b3.sov.s3.name": "The Swiss Made narrative and foreign-jurisdiction data",
    "b3.sov.s3.body": "Premium watchmaking sells patience, precision, traceability. A brand investing in the traceability of every watchmaking component but outsourcing VIP client data processing to US infrastructure exposes itself to narrative risk as much as regulatory risk. The specialized press (WatchPro, Le Temps, Forbes Watches) is beginning to question these choices. Singapore-China-Middle East sales now often require explicit European or Swiss residency commitments.",
