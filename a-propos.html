    "ab.title": "Pourquoi <em>ce</em> projet, par <em>qui</em>, et comment <em>contribuer</em>.",
    "ab.lede": "Cette page répond à trois questions simples. Pourquoi cette cartographie existe-t-elle. Qui la maintient. Et comment vous pouvez l'enrichir, la corriger ou la critiquer.",

    "ab.why.tag": "Le pourquoi",
    "ab.why.title": "Une cartographie née d'un <em>trou</em> dans les sources.",
    "ab.why.text": "<p><em>Cet observatoire est un constat personnel et factuel.</em> Comme consultant en intelligence artificielle, j'opère depuis plusieurs années entre la Suisse et la France auprès de dirigeants, d'équipes RH, de collectivités et de chercheurs. Tous me posent des questions presque identiques : que va devenir tel métier, telle équipe, telle administration ? Faut-il former, recruter, restructurer, et selon quel calendrier ? Les réponses existent. Elles sont produites par l'OFS, la DARES, France Stratégie, l'EPFL, le SEFRI, France Travail, l'APEC, la CNIL, l'Inria. Elles sont précises, sourcées, méthodologiquement rigoureuses. Elles sont surtout dispersées entre une douzaine d'institutions et largement invisibles pour les acteurs qu'elles concernent.</p><p>Aucune cartographie francophone ne rassemblait ces sources de manière cohérente, ne les comparait entre les deux pays, ni ne signalait explicitement leurs biais. Le débat public sur l'IA et le travail naviguait dans un brouillard d'estimations américaines relayées sans contexte, ou de fragments institutionnels lus en isolation. Les actifs concernés, qui sont pourtant les premiers exposés, n'avaient aucun moyen simple d'accéder à cette information.</p><p>Ce projet est ma tentative de combler ce trou. Il ne produit aucun chiffre nouveau. Il agrège, il traduit, il compare, il critique ceux qui existent. Il est gratuit, sans publicité, sans tracker, sous licence ouverte. C'est un bien commun, modestement contribué.</p>",
    "ab.kf1": "Cartographies francophones préexistantes",
    "ab.kf2": "Observatoires CH + FR cartographiés",
    "ab.kf3": "Pays comparés explicitement (CH + FR)",

    "ab.frame.eyebrow": "Le cadre · 4 angles de lecture",
    "ab.frame.title": "Lire l'IA et le travail, c'est <em>croiser quatre angles</em>.",
    "ab.frame.sub": "L'observatoire ne se contente pas d'agréger des chiffres. Il propose un cadre analytique qui structure leur lecture, articulé en trois dimensions empiriques et une mise en garde stratégique. Ce cadre est ce qui permet à un score d'exposition isolé de devenir une décision actionnable.",

    "ab.frame.d1.tag": "Trajectoire de demande",
    "ab.frame.d1.title": "L'exposition ne prédit pas la trajectoire.",
    "ab.frame.d1.body": "Un métier très exposé techniquement à l'IA peut voir sa demande augmenter si l'IA enrichit les ménages qui dépensent davantage dans ces services. C'est <strong>l'effet-revenu</strong> formalisé par Imas et Comin (Stanford, 2026). Un cuisinier gastronomique à 6/10 d'exposition est dans une meilleure position qu'un analyste crédit à 7/10. Le score d'exposition seul, pris en isolation, est insuffisant pour anticiper la pression réelle sur l'emploi. Trois profils possibles : <em>demande en hausse</em> (soins, hospitalité, artisanat, formation, services personnels), <em>demande stable</em> (droit, architecture, management, ingénierie), <em>pression baissière</em> (saisie, contenu générique, traitement administratif standardisé).",

    "ab.frame.d2.tag": "Secteur relationnel",
    "ab.frame.d2.title": "L'IA crée aussi des gagnants.",
    "ab.frame.d2.body": "Les métiers à forte nécessité humaine relationnelle (soins, hospitalité haut de gamme, artisanat, thérapie, formation directe, performance vivante) bénéficient structurellement de la transition IA. Quand l'IA baisse le coût des biens standardisés, les ménages réallouent leur budget vers la présence et l'attention humaines. Ce n'est pas <em>protégé de l'IA</em>, c'est <strong>bénéficiaire indirect</strong> de l'IA via l'effet-revenu. Cette nuance est stratégiquement décisive pour les directions RH : trop d'organisations négligent ces métiers dans leurs plans de transformation, alors qu'ils sont les leviers de différenciation à long terme face à la commoditisation IA des fonctions standardisées.",

    "ab.frame.d3.tag": "Type d'IA",
    "ab.frame.d3.title": "Toutes les IA n'affectent pas les mêmes métiers.",
    "ab.frame.d3.body": "Trois familles aux impacts très différents. <strong>L'IA générative</strong> (LLMs) affecte les métiers de production de contenu, de synthèse, de rédaction, de code standard. <strong>L'IA spécialisée</strong> (machine learning sur données structurées) affecte les métiers de détection, scoring, classification. <strong>La robotique IA</strong> affecte les métiers physiques répétitifs. Un radiologue n'est pas affecté par ChatGPT, il est affecté par des modèles de vision par ordinateur entraînés sur des millions d'images médicales. Un journaliste n'est pas concerné par l'IA de diagnostic médical. Confondre ces familles produit des prédictions imprécises et des décisions RH mal calibrées.",

    "ab.frame.d4.tag": "TCO et souveraineté · le 4e angle mort",
    "ab.frame.d4.title": "Le récit « IA = baisse mécanique des coûts » <em>ne tient déjà plus</em>.",
    "ab.frame.d4.body": "Comparer un prix par token avec un salaire est une erreur d'analyse. Le <strong>coût total de possession</strong> de l'IA inclut l'orchestration, l'intégration, la gouvernance, la supervision humaine, l'évaluation, la vérification, l'escalade et la refonte organisationnelle (Singh Tomer, 2026). Gartner prédit une sous-estimation des coûts GenAI de 500% à 1000%, et un coût par résolution dépassant 3 dollars en 2030. 72% des CIO sont en breakeven ou en perte sur leurs investissements IA. À cela s'ajoute la <strong>question de souveraineté</strong> : pour une organisation européenne, choisir un fournisseur LLM est devenu une décision de gouvernance, pas seulement technique. L'écosystème souverain européen 2026 (Mistral en France, Apertus en Suisse, Aleph Alpha, Minerva, PhariaAI, LightOn) est devenu une option crédible, et pour les industries régulées un prérequis.",

    "ab.who.eyebrow": "Le qui · Naully Nicolas",
    "ab.who.title": "Le <em>porteur</em> du projet.",
    "ab.who.sub": "Le projet est porté par une seule personne. Voici son parcours, sa posture et la méthode qu'il met au service des organisations.",

    "ab.who.consult.tag": "Le consultant",
    "ab.who.consult.title": "Consultant, conférencier, auteur dans le numérique.",
    "ab.who.consult.p1": "L'intelligence artificielle n'est pas d'abord un sujet technologique. C'est un sujet de décision, de gouvernance et de survie stratégique.",
    "ab.who.consult.p2": "Depuis plus de 20 ans, j'évolue au cœur de systèmes complexes : multinationales, institutions internationales, environnements à forte exigence opérationnelle, mais aussi sept années dans l'urgence pré-hospitalière, où une mauvaise décision ne se corrige pas dans un PowerPoint.",
    "ab.who.consult.p3": "Aujourd'hui, j'accompagne les dirigeants de PME, les organisations publiques et les structures sensibles confrontés à une même difficulté : trop de bruit, trop de promesses, trop peu de méthode.",
    "ab.who.consult.p4": "Mon rôle n'est pas de vous impressionner avec le futur. Il est de vous aider à reprendre la main sur le présent.",
    "ab.who.consult.p5": "J'aide les décideurs à cadrer, gouverner et déployer l'intelligence artificielle avec discernement, agilité et maîtrise. Mon approche s'appuie sur deux décennies de terrain numérique, une lecture stratégique des transformations en cours, et une méthode inspirée de l'histoire, de la pensée stratégique et des réalités opérationnelles.",
    "ab.who.consult.p6": "Concrètement, j'interviens sur trois leviers :",
    "ab.who.consult.li1": "<strong>Conférences et keynotes.</strong> Pour donner des repères clairs, ouvrir le débat et faire monter le niveau de compréhension sur les enjeux réels de l'IA.",
    "ab.who.consult.li2": "<strong>Ateliers de direction et workshops.</strong> Pour structurer la gouvernance, identifier les cas d'usage prioritaires, clarifier les risques et transformer les intuitions en décisions concrètes.",
    "ab.who.consult.li3": "<strong>Accompagnement stratégique.</strong> Pour aider les organisations à adopter l'IA sans perdre la maîtrise de leurs opérations, de leurs données et de leurs arbitrages.",
    "ab.who.consult.p7": "Je suis également l'auteur de <em>Guérill-IA</em> et <em>Darwinisme numérique</em>, deux travaux consacrés aux transformations stratégiques provoquées par l'intelligence artificielle.",
    "ab.who.consult.punch": "Le sujet n'est plus de savoir si l'IA va changer les organisations. Le sujet est de savoir <em>lesquelles sauront s'y préparer avec lucidité</em>.",

    "ab.who.disclosure.tag": "Disclosure éditoriale",
    "ab.who.disclosure.title": "Comment <em>ce site</em> est produit.",
    "ab.who.disclosure.p1": "Cohérence oblige : un projet qui documente l'IA et le travail doit être transparent sur la manière dont il utilise lui-même l'IA. Ce site est produit avec l'assistance d'une intelligence artificielle (Claude Opus 4.7, en modes Research et Web Search), puis soumis à une vérification factuelle contre les sources primaires.",
    "ab.who.disclosure.p2": "L'IA sert d'outil de documentation, de synthèse et de mise en forme visuelle. Elle ne sert ni de source autonome, ni d'autorité scientifique. Toutes les données chiffrées présentées dans les dashboards, les dépêches et les fichiers JSON ouverts proviennent de sources primaires (DARES, OFS, INSEE, Stanford HAI, Coface, APEC, EPFL, ESPA, etc.) et sont vérifiées manuellement avant publication.",
    "ab.who.disclosure.p3": "Cette posture suit la même règle que celle imposée aux observatoires intégrés à la cartographie : <strong>publier ses sources et sa méthodologie de manière vérifiable</strong>. Une cartographie qui n'expose pas son propre processus de fabrication serait incohérente avec ce qu'elle exige des autres.",

    "ab.princ.eyebrow": "Trois principes",
    "ab.princ.title": "Comment on travaille.",
    "ab.princ.sub": "Trois règles non négociables qui structurent l'ensemble du projet, des choix d'inclusion à la publication des données brutes.",

    "ab.princ.p1.tag": "Sources primaires",
    "ab.princ.p1.title": "Ne jamais citer une source de seconde main.",
    "ab.princ.p1.body": "Tout chiffre publié dans les dashboards, les dépêches sectorielles ou les fichiers JSON ouverts est tracé jusqu'à sa publication originelle. Pas de commentateur intermédiaire, pas de presse spécialisée qui paraphrase un communiqué. Si un chiffre n'est pas vérifiable contre une source primaire (institution, papier académique, dépêche officielle, dataset téléchargeable), il n'est pas publié. Cette règle ralentit le rythme éditorial mais protège la fiabilité de l'ensemble. Conséquence pratique : chaque carte de la veille pointe vers la source directe, jamais vers un résumé. La page Méthodologie expose en détail la <a href=\"methodologie.html\">hiérarchie des sources</a> appliquée (Tier 1 institutionnel, Tier 2 académique, Tier 3 sectoriel, Tier 4 prospectif).",

    "ab.princ.p2.tag": "Biais explicités",
    "ab.princ.p2.title": "Documenter les limites avec autant de soin que les résultats.",
    "ab.princ.p2.body": "Une cartographie qui ne reconnaît pas ses propres limites n'est pas rigoureuse, elle est militante. La page Méthodologie expose neuf biais structurels que l'observatoire reconnaît : non-représentativité des observatoires existants, instabilité des scores d'exposition (NBER w35110 démontre une divergence ×3,6 entre 3 LLM frontière sur la même tâche), désaccord entre méthodes (Yale Budget Lab, février 2026 : variance 0,03 vs 0,48 selon les métiers), risques de surinterprétation des chiffres ronds, biais d'agrégation, etc. Chaque carte de la veille est taguée par <code>ai_type</code> (générative, spécialisée, robotique) et chaque rapport sectoriel précise ses propres caveats. Les sources qui ne respectent pas leurs propres caveats sont signalées dans les fiches.",

    "ab.princ.p3.tag": "Données ouvertes",
    "ab.princ.p3.title": "Tout publier sous CC BY 4.0, sans paywall.",
    "ab.princ.p3.body": "Les datasets de l'observatoire (524 métiers cartographiés, 23 indicateurs, 40 jalons timeline, 38 économistes référencés, 27 rapports de veille) sont publiés en JSON ouvert sous licence Creative Commons CC BY 4.0. Téléchargeables, citables, modifiables, commercialisables. Les Dispatches sectoriels sont en accès intégral, sans paywall ni abonnement. Le code du site est disponible sur <a href=\"https://github.com/otakuch/observatoires-ia\" target=\"_blank\" rel=\"noopener\">GitHub (otakuch/observatoires-ia)</a>. Cette ouverture n'est pas un acte commercial : c'est la condition de cohérence avec les deux principes précédents. Une cartographie qui exige des sources primaires de tous mais qui restreint elle-même l'accès à ses propres données ne tiendrait pas debout.",

    "ab.contrib.eyebrow": "Le comment",
    "ab.contrib.title": "Comment <em>contribuer</em>.",
    "ab.contrib.sub": "Cette cartographie est un travail vivant. Quatre voies de contribution concrètes, par ordre croissant d'engagement. Toutes sont créditées dans la version suivante.",

    "ab.contrib.signal.tag": "Signaler",
    "ab.contrib.signal.title": "Signaler un observatoire manquant.",
    "ab.contrib.signal.body": "Le plus simple. Si vous connaissez un observatoire CH ou FR sur l'emploi, la formation, la gouvernance ou les statistiques liées à l'IA, qui satisfait aux critères d'inclusion (voir Méthodologie 01), envoyez-moi le nom et l'URL par email. Je vérifie, je rédige la fiche, je crédite la contribution. Le tour est joué en moins d'une semaine.",

    "ab.contrib.fix.tag": "Corriger",
    "ab.contrib.fix.title": "Corriger une donnée ou un libellé.",
    "ab.contrib.fix.body": "Une date de mise à jour erronée, un libellé d'organisation imprécis, un domaine mal classé, une description obsolète, une URL cassée. Ouvrez une issue sur le dépôt GitHub <a href=\"https://github.com/otakuch/observatoires-ia\" target=\"_blank\" rel=\"noopener\">otakuch/observatoires-ia</a>, ou écrivez à <a href=\"mailto:sayhi@naullynicolas.ch\">sayhi@naullynicolas.ch</a> avec la correction proposée et la source qui la justifie. Les corrections factuelles vérifiables sont toujours appliquées.",

    "ab.contrib.bias.tag": "Documenter un biais",
    "ab.contrib.bias.title": "Pointer un biais méthodologique.",
    "ab.contrib.bias.body": "Particulièrement bienvenu. Si vous identifiez un biais méthodologique non documenté dans la page Méthodologie, ou un biais documenté mais sous-estimé, faites-le savoir. La rigueur d'une cartographie se mesure à sa capacité à reconnaître ses propres limites. Toute contribution de cette nature est intégrée dans la version suivante du site avec mention explicite du contributeur, et figure dans le journal des modifications publié sur GitHub.",

    "ab.contrib.translate.tag": "Traduire",
    "ab.contrib.translate.title": "Améliorer ou compléter la version anglaise.",
    "ab.contrib.translate.body": "Le site est bilingue par construction, mais la traduction EN reste perfectible, en particulier sur les terminologies institutionnelles spécifiquement suisses ou françaises (ROME, PCS-ESE, NSP, SEFRI, brevet fédéral). Les contributions de relecture, de correction terminologique ou d'ajout de précision sont les bienvenues, particulièrement pour les utilisateurs anglophones travaillant sur les marchés CH et FR.",

    "ab.contact.text": "Une remarque, une contribution, une critique, ou simplement envie d'échanger ? <span class=\"accent-bracket\">[</span>Écrivez-moi<span class=\"accent-bracket\">]</span>.",
    "ab.contact.email": "sayhi@naullynicolas.ch",
    "ab.contact.github": "GitHub · otakuch",
  },
  en: {
    "ab.tag": "",
    "ab.title": "Why <em>this</em> project, by <em>whom</em>, and how to <em>contribute</em>.",
    "ab.lede": "This page answers three simple questions. Why this cartography exists. Who maintains it. And how you can enrich, correct or criticise it.",

    "ab.why.tag": "The why",
    "ab.why.title": "A cartography born from a <em>gap</em> in the sources.",
    "ab.why.text": "<p><em>This observatory is a personal and factual observation.</em> As an AI consultant, I have been operating between Switzerland and France for several years, working with executives, HR teams, public bodies and researchers. They all ask me almost identical questions: what will become of this occupation, this team, this administration? Should we train, hire, restructure, and on what timeline? The answers exist. They are produced by FSO, DARES, France Stratégie, EPFL, SERI, France Travail, APEC, CNIL, Inria. They are precise, sourced, methodologically rigorous. They are also scattered across a dozen institutions and largely invisible to the actors they concern.</p><p>No French-speaking cartography brought these sources together coherently, compared them across the two countries, or explicitly flagged their biases. Public debate on AI and work was navigating a fog of American estimates relayed without context, or institutional fragments read in isolation. The workers concerned, who are the most exposed, had no simple way to access this information.</p><p>This project is my attempt to fill that gap. It produces no new figures. It aggregates, translates, compares and critiques those that already exist. It is free, ad-free, tracker-free, and openly licensed. It is a modestly contributed common good.</p>",
    "ab.kf1": "Pre-existing French-language cartographies",
    "ab.kf2": "CH + FR observatories mapped",
    "ab.kf3": "Countries explicitly compared (CH + FR)",

    "ab.frame.eyebrow": "The frame · 4 reading angles",
    "ab.frame.title": "Reading AI and work means <em>crossing four angles</em>.",
    "ab.frame.sub": "The observatory does not merely aggregate figures. It proposes an analytical frame structuring how to read them, articulated in three empirical dimensions and one strategic warning. This frame is what allows an isolated exposure score to become an actionable decision.",

    "ab.frame.d1.tag": "Demand trajectory",
    "ab.frame.d1.title": "Exposure does not predict trajectory.",
    "ab.frame.d1.body": "An occupation highly exposed to AI technically can see its demand grow if AI enriches the households who spend more on these services. This is the <strong>income effect</strong> formalized by Imas and Comin (Stanford, 2026). A fine-dining chef at 6/10 exposure is in a better position than a credit analyst at 7/10. The exposure score alone, taken in isolation, is insufficient to anticipate real employment pressure. Three possible profiles: <em>rising demand</em> (care, hospitality, craft, training, personal services), <em>stable demand</em> (law, architecture, management, engineering), <em>declining pressure</em> (data entry, generic content, standardized administrative processing).",

    "ab.frame.d2.tag": "Relational sector",
    "ab.frame.d2.title": "AI also creates winners.",
    "ab.frame.d2.body": "Occupations with strong human relational necessity (care, premium hospitality, craft, therapy, direct training, live performance) structurally benefit from the AI transition. When AI lowers the cost of standardized goods, households reallocate their budget toward presence and human attention. This is not <em>protected from AI</em>, it is <strong>indirect beneficiary</strong> of AI through the income effect. This nuance is strategically decisive for HR leadership: too many organizations neglect these occupations in their transformation plans, when they are precisely the long-term differentiation levers against the AI commoditization of standardized functions.",

    "ab.frame.d3.tag": "AI type",
    "ab.frame.d3.title": "Not all AI affects the same occupations.",
    "ab.frame.d3.body": "Three families with very different impacts. <strong>Generative AI</strong> (LLMs) affects content production, synthesis, writing, standard code occupations. <strong>Specialized AI</strong> (machine learning on structured data) affects detection, scoring, classification occupations. <strong>Robotic AI</strong> affects repetitive physical occupations. A radiologist is not affected by ChatGPT, they are affected by computer vision models trained on millions of medical images. A journalist is not concerned by medical diagnostic AI. Conflating these families produces imprecise predictions and ill-calibrated HR decisions.",

    "ab.frame.d4.tag": "TCO and sovereignty · the 4th blind spot",
    "ab.frame.d4.title": "The « AI = mechanical cost reduction » narrative <em>no longer holds</em>.",
    "ab.frame.d4.body": "Comparing a token price with a salary is an analytical error. AI's <strong>total cost of ownership</strong> includes orchestration, integration, governance, human oversight, evaluation, verification, escalation, and organizational redesign (Singh Tomer, 2026). Gartner predicts a 500% to 1000% underestimation of GenAI costs, and a cost per resolution exceeding $3 by 2030. 72% of CIOs are at breakeven or loss on their AI investments. To this is added the <strong>sovereignty question</strong>: for a European organization, choosing an LLM vendor has become a governance decision, not just a technical one. The European sovereign ecosystem 2026 (Mistral in France, Apertus in Switzerland, Aleph Alpha, Minerva, PhariaAI, LightOn) has become a credible option, and for regulated industries a prerequisite.",

    "ab.who.eyebrow": "The who · Naully Nicolas",
    "ab.who.title": "The <em>person</em> behind the project.",
    "ab.who.sub": "The project is run by a single person. Here is the path, the stance and the method brought to organisations.",

    "ab.who.consult.tag": "The consultant",
    "ab.who.consult.title": "Consultant, speaker, digital author.",
    "ab.who.consult.p1": "Artificial intelligence is not first and foremost a technological topic. It is a topic of decision, governance and strategic survival.",
    "ab.who.consult.p2": "For over twenty years, I have operated at the heart of complex systems: multinationals, international institutions, environments with high operational demands, as well as seven years in pre-hospital emergency response, where a wrong decision cannot be fixed in a PowerPoint.",
    "ab.who.consult.p3": "Today, I work with the executives of SMEs, public organisations and sensitive structures facing the same difficulty: too much noise, too many promises, too little method.",
    "ab.who.consult.p4": "My role is not to impress you with the future. It is to help you regain control over the present.",
    "ab.who.consult.p5": "I help decision-makers frame, govern and deploy artificial intelligence with discernment, agility and mastery. My approach builds on two decades of digital field experience, a strategic reading of ongoing transformations, and a method inspired by history, strategic thinking and operational realities.",
    "ab.who.consult.p6": "Concretely, I work along three levers:",
    "ab.who.consult.li1": "<strong>Conferences and keynotes.</strong> To set clear bearings, open the debate and raise the level of understanding on AI's actual stakes.",
    "ab.who.consult.li2": "<strong>Executive workshops.</strong> To structure governance, identify priority use cases, clarify risks and turn intuitions into concrete decisions.",
    "ab.who.consult.li3": "<strong>Strategic accompaniment.</strong> To help organisations adopt AI without losing control over their operations, their data or their judgement calls.",
    "ab.who.consult.p7": "I am also the author of <em>Guérill-IA</em> and <em>Darwinisme numérique</em>, two works dedicated to the strategic transformations brought about by artificial intelligence.",
    "ab.who.consult.punch": "The question is no longer whether AI will change organisations. The question is <em>which ones will know how to prepare for it with lucidity</em>.",

    "ab.who.disclosure.tag": "Editorial disclosure",
    "ab.who.disclosure.title": "How <em>this site</em> is produced.",
    "ab.who.disclosure.p1": "For consistency: a project that documents AI and work must be transparent about how it uses AI itself. This site is produced with the assistance of an artificial intelligence (Claude Opus 4.7, in Research and Web Search modes), then submitted to factual verification against primary sources.",
    "ab.who.disclosure.p2": "AI is used as a tool for documentation, synthesis and visual formatting. It is neither an autonomous source nor a scientific authority. All quantitative data presented in the dashboards, dispatches and open JSON files come from primary sources (DARES, FSO, INSEE, Stanford HAI, Coface, APEC, EPFL, ESPA, etc.) and are manually verified before publication.",
    "ab.who.disclosure.p3": "This stance follows the same rule imposed on observatories integrated into the cartography: <strong>publish sources and methodology in a verifiable way</strong>. A cartography that does not expose its own production process would be inconsistent with what it requires of others.",

    "ab.princ.eyebrow": "Three principles",
    "ab.princ.title": "How we work.",
    "ab.princ.sub": "Three non-negotiable rules that structure the entire project, from inclusion choices to the publication of raw data.",

    "ab.princ.p1.tag": "Primary sources",
    "ab.princ.p1.title": "Never cite a second-hand source.",
    "ab.princ.p1.body": "Every figure published in the dashboards, sectoral dispatches, or open JSON files is traced back to its original publication. No intermediate commentator, no specialized press paraphrasing a release. If a figure cannot be verified against a primary source (institution, academic paper, official release, downloadable dataset), it is not published. This rule slows the editorial pace but protects the reliability of the whole. Practical consequence: every veille card points to the direct source, never to a summary. The Methodology page details the <a href=\"methodologie.html\">source hierarchy</a> applied (Tier 1 institutional, Tier 2 academic, Tier 3 sectoral, Tier 4 prospective).",

    "ab.princ.p2.tag": "Explicit biases",
    "ab.princ.p2.title": "Document limits with as much care as findings.",
    "ab.princ.p2.body": "A cartography that does not acknowledge its own limits is not rigorous, it is militant. The Methodology page exposes nine structural biases the observatory recognizes: non-representativeness of existing observatories, instability of exposure scores (NBER w35110 demonstrates a ×3.6 divergence between 3 frontier LLMs on the same task), disagreement between methods (Yale Budget Lab, February 2026: variance 0.03 vs 0.48 depending on occupations), risks of round-figure overinterpretation, aggregation biases, etc. Every veille card is tagged by <code>ai_type</code> (generative, specialized, robotic) and every sectoral report specifies its own caveats. Sources that do not respect their own caveats are flagged in the entries.",

    "ab.princ.p3.tag": "Open data",
    "ab.princ.p3.title": "Publish everything under CC BY 4.0, no paywall.",

const PRINCIPLES = [
  {
    title: { fr: "Sources primaires uniquement", en: "Primary sources only" },
    desc: {
      fr: "Chaque observatoire référencé renvoie directement à sa publication officielle. Pas de reformulation, pas d'intermédiaire, pas de SEO.",
      en: "Every referenced observatory links directly to its official publication. No reformulation, no intermediary, no SEO."

  },
  {
    title: { fr: "Bilingue dès le premier jour", en: "Bilingual from day one" },
    desc: {
      fr: "FR et EN comme citoyens de première classe. Le bilingue n'est pas une option ajoutée à la fin, c'est l'architecture.",
      en: "FR and EN as first-class citizens. Bilingualism is not an afterthought, it is the architecture."
    }
  },
  {
    title: { fr: "Données ouvertes", en: "Open data" },
    desc: {
      fr: "L'agrégation est publiée en JSON sous licence CC BY. Vous pouvez la copier, la forker, la corriger. Le dépôt GitHub est ouvert.",
      en: "The aggregation is published as JSON under CC BY. You can copy it, fork it, correct it. The GitHub repo is open."
    }
  }
];

function renderPrinc() {
  const grid = document.getElementById("princGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const lang = window.CURRENT_LANG;
  PRINCIPLES.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.cursor = "default";

    const meta = document.createElement("div");
    meta.className = "card-meta mono";
    const num = document.createElement("span");
    num.textContent = String(i + 1).padStart(2, "0");
    num.style.color = "var(--signal)";
    num.style.fontFamily = "Fraunces, serif";
    num.style.fontSize = "20px";
    meta.appendChild(num);
    card.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = p.title[lang];
    card.appendChild(title);

    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = p.desc[lang];
    card.appendChild(desc);

    grid.appendChild(card);
  });
}

window.onLangChange = renderPrinc;
initSite("about");
renderPrinc();
</script>
