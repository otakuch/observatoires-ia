@import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap');
/* ==================================================================== */
/* CIEL & MARINE · couche de charte · v1.1 · 18 octobre 2026            */
/* Source canonique : assets/ciel-marine.css                            */
/* Injectée en fin de <head> par tools/inject_cm.py, entre marqueurs.   */
/* Bloc purement additif : le retirer restitue Encre & ardoise à        */
/* l'identique. Aucune donnée, aucun script, aucun balisage modifié :   */
/* surcharge par ordre de source et par jetons uniquement.              */
/*                                                                      */
/* Une couleur, un sens (adapté) :                                      */
/*   marine  = structure (navigation, en-têtes, pied de page)           */
/*   bleu    = interactif, et rien d'autre (--signal)                   */
/*   acier   = emphase éditoriale (--accent)                            */
/*   orange  = exposition et risque, réservé à l'analyse (--exp-*)      */
/* Contrastes vérifiés par calcul (WCAG 2.1), voir le rapport.          */
/* ==================================================================== */

/* --- 1 · Jetons · thème clair ---------------------------------------- */
:root{
  --cm-navy:#103454; --cm-navy-soft:#184864; --cm-band:#30709C;
  --cm-sky:#43A5E4; --cm-on-sky:#0E2D49; --cm-sky-light:#89C4E9;
  --cm-on-navy:#FFFFFF; --cm-on-navy-muted:#D9E4F2;
  --cm-orange:#D97706; --cm-blue:#359BDB; --cm-green:#1F9134;
  --cm-sans:"Figtree","Instrument Sans","Helvetica Neue",Arial,sans-serif;

  --paper:#FFFFFF; --paper-2:#F4FAFD; --surface:#FFFFFF;
  --paper-rgb:255,255,255;
  --rule:#E3EEF6; --rule-strong:#103454;
  --ink:#1A1D21; --ink-sec:#5F6368; --ink-2:#5F6368; --ink-3:#647092; --muted:#647092;
  --ink-rgb:26,29,33;
  --signal:#1C77BA; --signal-hover:#155E94; --on-signal:#FFFFFF; --signal-rgb:28,119,186;
  --accent:#30709C; --teal:#30709C;
  --exp-1:#FFF1DD; --exp-2:#FFD49A; --exp-3:#FFAE4D; --exp-4:#E67E00; --exp-5:#8F4A00;
  --on-exp:#1A1D21; --on-exp-5:#FFFFFF;
  --risk:#A85A00; --highlight:#FFF3D6;
  --t1:#103454; --t2:#30709C; --t3:#7D6430; --t4:#8C5049;
  --r-1:4px; --r-2:8px;
  --shadow-1:0 8px 24px rgba(16,52,84,.08);
  --font-sans:var(--cm-sans); --font-serif:var(--cm-sans);
}

/* --- 2 · Jetons · thème sombre (dérivé du marine) --------------------- */
html[data-theme="dark"]{
  --cm-navy:#0F2A44; --cm-navy-soft:#133556;
  --paper:#0B1E31; --paper-2:#0F2A44; --surface:#102B45;
  --paper-rgb:11,30,49;
  --rule:#1C3F60; --rule-strong:#EEF4FA;
  --ink:#EEF4FA; --ink-sec:#B7C6D6; --ink-2:#B7C6D6; --ink-3:#93A6C0; --muted:#93A6C0;
  --ink-rgb:238,244,250;
  --signal:#6EB7E5; --signal-hover:#9DCDEF; --on-signal:#0B1E31; --signal-rgb:110,183,229;
  --accent:#89C4E9; --teal:#89C4E9;
  --cm-orange:#FFB04D; --cm-blue:#5BB1E8; --cm-green:#4CC266;
  --risk:#FFB04D; --highlight:#3A2F1A;
  --t1:#9FC4DE; --t2:#89C4E9; --t3:#C7AC72; --t4:#D49186;
  --shadow-1:0 8px 24px rgba(0,0,0,.35);
}

/* --- 3 · Typographie : une famille sans, la chasse fixe gardée pour les sources --- */
body, body *:not(.mono):not(.mono *):not(code):not(pre):not(kbd):not(.ds-badge){
  font-family:var(--cm-sans) !important;
}
body{ background-image:none !important; }
h1,h2,h3,.hero-title,.dash-title,.frame-title,.debate-title,.warning-title,
.section-title,.ds-title,.dispatch-tease-title{ font-weight:600 !important; letter-spacing:-.015em; }
h1 em,h2 em,h3 em,.hero-title em,.dash-title em,.frame-title em,.debate-title em,
.section-title em,.warning-title em,.dispatch-tease-title em,.ds-title em{ font-style:normal !important; }
.hero-pitch,.dash-lede{ font-style:normal !important; }
/* Emphase éditoriale : acier partout, ciel sur les fonds marine (voir 5, 9, 10) */
body em{ color:var(--accent) !important; }

/* --- 4 · Navigation marine ---------------------------------------------- */
.nav{ background:var(--cm-navy) !important; border-bottom:0 !important; backdrop-filter:none; -webkit-backdrop-filter:none; }
#siteNav .logo{ color:var(--cm-on-navy); font-weight:700; }
#siteNav .logo .bracket,#siteNav .logo:hover .bracket{ color:var(--cm-sky); }
#siteNav .logo .dot{ color:var(--cm-sky-light); }
#siteNav .nav-links > a,#siteNav .nav-dropdown-toggle{ color:var(--cm-on-navy-muted); background:transparent; }
#siteNav .nav-links > a:hover,#siteNav .nav-links > a.current,
#siteNav .nav-dropdown-toggle:hover,#siteNav .nav-dropdown-toggle.current{ color:var(--cm-on-navy); }
#siteNav .nav-links > a.current::after{ background:var(--cm-sky); height:2px; }
#siteNav .nav-dropdown.current .nav-dropdown-toggle,#siteNav .nav-dropdown:hover .nav-dropdown-toggle{ color:var(--cm-on-navy); }
#siteNav .nav-dropdown-menu{ background:var(--surface); border-color:var(--rule); box-shadow:var(--shadow-1); }
#siteNav .nav-dropdown-menu a{ color:var(--ink-2); }
#siteNav .nav-dropdown-menu a:hover,#siteNav .nav-dropdown-menu a.current{ color:var(--signal); background:var(--paper-2); }
#siteNav .lang-toggle{ border-color:rgba(255,255,255,.28); color:var(--cm-on-navy-muted); }
#siteNav .lang-toggle:hover{ border-color:var(--cm-sky); }
#siteNav .lang-toggle span.active{ color:var(--cm-sky); }
#siteNav .lang-toggle span:not(.active){ color:var(--cm-on-navy-muted); }
#siteNav .menu-btn{ border-color:rgba(255,255,255,.28); }
#siteNav .menu-btn span,#siteNav .menu-btn span::before,#siteNav .menu-btn span::after{ background:var(--cm-on-navy); }
.nav a:focus-visible,.nav button:focus-visible{ outline:2px solid var(--cm-sky); outline-offset:3px; border-radius:6px; }

/* --- 5 · En-têtes de page en bande marine pleine largeur --------------- */
.hero,.dash-header{
  background:var(--cm-navy); color:var(--cm-on-navy);
  box-shadow:0 0 0 100vmax var(--cm-navy); clip-path:inset(0 -100vmax);
  margin-bottom:56px !important; padding-bottom:64px !important;
}
.hero-title,.dash-title{ color:var(--cm-on-navy); font-size:clamp(36px,5.2vw,64px) !important; line-height:1.06 !important; }
.hero-title em,.dash-title em,.hero-title .accent-bracket,.hero em,.dash-header em,
.dispatch-tease-inner em,.debate-takeaway em,.reinvent-cta-block em,footer#siteFooter em{ color:var(--cm-sky) !important; }
.hero-pitch,.dash-lede{ color:var(--cm-on-navy-muted) !important; }
.hero-eyebrow,.dash-flag,.hero [class*="eyebrow"],.dash-header [class*="eyebrow"]{ color:var(--cm-sky-light) !important; }
.hero-eyebrow::before{ background:var(--cm-sky); }
.hero a:not(.btn),.dash-header a:not(.btn){ color:var(--cm-sky-light); }
.hero .btn-primary,.dash-header .btn-primary{
  background:var(--cm-sky); color:var(--cm-on-sky); border:0;
  box-shadow:0 6px 16px rgba(67,165,228,.35); font-weight:600;
}
.hero .btn-primary:hover,.dash-header .btn-primary:hover{ background:#5CB4EA; color:var(--cm-on-sky); }
.hero .btn-secondary,.dash-header .btn-secondary{
  background:transparent; color:var(--cm-on-navy); border:1.5px solid var(--cm-sky-light);
}
.hero .btn-secondary:hover,.dash-header .btn-secondary:hover{ background:rgba(255,255,255,.08); color:var(--cm-on-navy); border-color:var(--cm-on-navy); }
.hero :focus-visible,.dash-header :focus-visible{ outline:2px solid var(--cm-sky); outline-offset:3px; }

/* --- 6 · Boutons ------------------------------------------------------- */
.btn{ font-weight:600; }
.btn-primary{ background:var(--signal); color:var(--on-signal); }
.btn-primary:hover{ background:var(--signal-hover); color:var(--on-signal); }
.btn-secondary{ border:1.5px solid var(--signal); color:var(--signal); }
.btn-secondary:hover{ background:var(--signal); color:var(--on-signal); }
.ds-cta{ border-radius:999px; text-transform:none; letter-spacing:0; font-size:15px; font-weight:600; }
.ds-cta--secondary{ border-color:var(--signal); color:var(--signal); }

/* --- 7 · Chiffres clés : une couleur par chiffre, cartes flottantes ---- */
.stats{ border:0 !important; }
.stats-grid{ gap:20px; }
.stat{ background:var(--surface); border:0 !important; border-radius:var(--r-2); box-shadow:var(--shadow-1); }
.stat:nth-child(3n+1) .stat-num{ color:var(--cm-orange); }
.stat:nth-child(3n+2) .stat-num{ color:var(--cm-blue); }
.stat:nth-child(3n+3) .stat-num{ color:var(--cm-green); }
.stat-num .unit,.stat-num .sign{ color:inherit; opacity:.75; }
.kpi-row{ background:transparent !important; border:0 !important; gap:20px !important; }
.kpi{ background:var(--surface) !important; border-radius:var(--r-2); box-shadow:var(--shadow-1); }

/* --- 8 · Cartes et panneaux ------------------------------------------- */
.frame-card,.warning-card,.debate-col,.ds-source-card,.ds-dispatch-card,.ds-job-card,
.field-card,.brief-card,.dl-card,.obs-card,.card{ border-radius:var(--r-2); }
.frame-card,.ds-source-card,.ds-dispatch-card,.field-card,.brief-card,.dl-card,.obs-card{ box-shadow:var(--shadow-1); border-color:var(--rule); }
.ds-note{ border-left:0; border-radius:20px; background:var(--paper-2); }

/* --- 9 · Blocs sombres : marine au lieu de l'encre ---------------------- */
.dispatch-tease-inner,.debate-takeaway,.reinvent-cta-block{
  background:var(--cm-navy) !important; color:var(--cm-on-navy) !important; border-radius:20px;
}
.dispatch-tease-inner::before{ display:none; }
.debate-takeaway{ border-left:0 !important; }
.dispatch-tease-inner *,.debate-takeaway *,.reinvent-cta-block h4,.reinvent-cta-block p{ color:inherit; }
.dispatch-tease-lede,.reinvent-cta-block p{ color:var(--cm-on-navy-muted) !important; }
.dispatch-tease-tag{ color:var(--cm-sky-light) !important; border-color:var(--cm-sky-light) !important; }
.dispatch-tease-title em{ color:var(--cm-sky) !important; }
.dispatch-tease-actions .btn-primary{ background:var(--cm-sky); color:var(--cm-on-sky); }
.dispatch-tease-actions .btn-secondary{ color:var(--cm-on-navy); border-color:var(--cm-sky-light); }
.reinvent-cta-block a{ color:var(--cm-sky-light) !important; border-bottom-color:var(--cm-sky-light) !important; }

/* --- 10 · Pied de page marine ----------------------------------------- */
footer#siteFooter{
  background:var(--cm-navy) !important; color:var(--cm-on-navy-muted);
  border-top:0; text-transform:none; letter-spacing:0; font-size:14px;
}
footer#siteFooter a{ color:var(--cm-on-navy); }
footer#siteFooter a:hover{ color:var(--cm-sky-light); }
footer#siteFooter .foot-brand{ color:var(--cm-on-navy) !important; font-weight:700; }
footer#siteFooter .bracket{ color:var(--cm-sky) !important; }
footer#siteFooter .dot{ color:var(--cm-sky-light) !important; }
footer#siteFooter .foot-col-label{ color:var(--cm-sky-light); text-transform:uppercase; letter-spacing:.08em; font-size:12px; }
footer#siteFooter .foot-tagline,footer#siteFooter .foot-update,footer#siteFooter .foot-license,
footer#siteFooter .foot-version,footer#siteFooter .foot-bottom{ color:var(--cm-on-navy-muted); }
footer#siteFooter strong{ color:var(--cm-on-navy); }
footer#siteFooter .foot-bottom{ border-top-color:rgba(255,255,255,.14); }

/* --- 11 · Menu mobile --------------------------------------------------- */
.mobile-menu{ background:var(--cm-navy) !important; }
.mobile-menu a,.mobile-menu .close-btn{ color:var(--cm-on-navy) !important; }
.mobile-menu .mobile-group-label{ color:var(--cm-sky-light) !important; }

/* --- 12 · Divers -------------------------------------------------------- */
::selection{ background:var(--cm-sky); color:var(--cm-on-sky); }
@media (max-width:640px){
  .hero,.dash-header{ margin-bottom:40px !important; padding-bottom:48px !important; }
  .stats-grid,.kpi-row{ gap:12px !important; }
}

/* ==================================================================== */
/* v1.1 · 18 octobre 2026 · lecture, alignement, responsive, graphiques */
/* ==================================================================== */

/* --- 13 · Mesure de lecture ------------------------------------------- */
/* --measure était appelé par les blocs ds-* sans être défini : les lignes  */
/* couraient sur toute la largeur. 68 caractères, plafond et non largeur.   */
:root{ --measure:68ch; --cm-gutter:32px; }
@media (max-width:960px){ :root{ --cm-gutter:20px; } }
p,li,dd,blockquote,
.manifesto-text,.stat-label,.kpi-label,.dl-desc,.field-card-excerpt{ max-width:var(--measure); }
/* Règles de page plus spécifiques (760 px, 100 %) : le plafond l'emporte  */
.method-content p,.method-content li,.context-content p,.reinvent-intro p,
.rdr-sub,.rdr-deck,.caveat,.method-caveat,.frame-lede,.debate-lede,.warning-lede,
.expgap-readline,.diff-summary-text,.cmp-dim-lede,.eu-lede,.eu-note,.eu-caveat,
.pt-question-body,.pt-questions-lede,.brief-source-cited,.debate-takeaway p,
.warning-footer,.frame-footer-text{ max-width:var(--measure) !important; }
/* Les intertitres restent sur une ligne et demie au plus */
.section-title,.ds-title,.frame-title,.debate-title,.warning-title{ max-width:32ch; text-wrap:balance; }
.dash-title,.hero-title{ max-width:22ch; text-wrap:balance; }
.section-sub,.ds-lede,.dash-lede,.hero-pitch,.frame-lede,.debate-lede,.warning-lede{ max-width:62ch; text-wrap:pretty; }
p,li{ text-wrap:pretty; }
/* Blocs centrés : le plafond reste centré */
[style*="text-align: center"] > p,[style*="text-align:center"] > p{ margin-left:auto; margin-right:auto; }
/* Interlignage courant homogène */
main p,section p,article p,.method-content p,.method-content li{ line-height:1.62; }

/* --- 14 · Une seule marge gauche par largeur d'écran ------------------- */
/* Blocs ds-* et appel final : le texte s'alignait 32 px plus à gauche que  */
/* le reste de la page. Sous-titres imbriqués : 32 px plus à droite.        */
section[style*="padding: var(--s-8) 24px"]{ padding-left:0 !important; padding-right:0 !important; }
section[style*="padding: var(--s-8) 24px"] > div[style*="max-width: var(--max-w)"],
.closing-cta-inner{ padding-left:var(--cm-gutter); padding-right:var(--cm-gutter); box-sizing:border-box; }
.closing-cta{ padding-left:0 !important; padding-right:0 !important; }
.expgap-section > .section-head,.reinvent-section > .section-head,
.rdr-section > .section-head,.rdr-section .rdr-inner{ padding-left:0 !important; padding-right:0 !important; }
/* Grilles « étiquette | texte » : l'étiquette passe au-dessus, une colonne */
.manifesto{ grid-template-columns:minmax(0,1fr) !important; gap:16px !important; }
.manifesto-tag{ position:static !important; }
.manifesto-text{ font-size:clamp(19px,1.9vw,24px) !important; line-height:1.5 !important; max-width:38em; }
.manifesto .manifesto-text + .manifesto-text{ margin-top:20px; }
.context-grid{ grid-template-columns:minmax(0,1fr) !important; gap:16px !important; }
.context-grid > :first-child{ position:static !important; }
.context-content{ max-width:none; }
.context-content h3{ max-width:28ch; }

/* --- 15 · Cartes de veille --------------------------------------------- */
/* Les cartes étaient forcées en display:block par le script : le titre     */
/* tronqué débordait sur le résumé et la date se coupait en deux.           */
.field-card{ display:flex !important; flex-direction:column; gap:10px; min-height:0 !important; }
.field-card-meta{ flex-wrap:wrap; gap:4px 14px; font-size:11.5px; line-height:1.45; }
.field-card-meta > span:first-child{ white-space:nowrap; }
.field-card-title{ display:-webkit-box !important; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; line-height:1.25 !important; max-height:3.75em !important; min-height:0 !important; height:auto !important; padding:0 !important; flex:none; }
.field-card-excerpt{ font-size:15px; }
.field-card-link{ font-size:12.5px; }

/* --- 16 · Tailles minimales de lecture --------------------------------- */
.section-sub{ font-size:16px !important; line-height:1.55; text-transform:none; letter-spacing:0; }
.stat-label,.kpi-label,.kf-label,.eu-kpi-lab,.card-org,.mml-text,.aitype-summary-jobs{ font-size:14px !important; line-height:1.5; }
.caveat,.method-caveat,.form-note,.rdr-insight-text,.rdr-scalenote,.rdr-deck,.rdr-sub{ font-size:14px !important; line-height:1.55; }
.method-source,.eu-src,.rdr-source,.eumap-meta,.eu-c-geo{ font-size:12.5px !important; line-height:1.55; }

/* --- 17 · Graphiques : palette Ciel & Marine --------------------------- */
/* Les scripts écrivent des couleurs Encre & ardoise en attribut SVG ;      */
/* une règle CSS l'emporte sur un attribut de présentation.                 */
svg [fill="#11110F"]{ fill:var(--ink); }
svg [stroke="#11110F"]{ stroke:var(--ink); }
/* Effet emploi (France, Suisse) : exposition = orange, recrutements :      */
/* hausse = acier, baisse = brun d'exposition forte                         */
#expgapChart [fill="#B5C0BA"],#expgapChart [fill="#B7C5C7"],.expgap-box-theoretical{ fill:var(--exp-3); background:var(--exp-3) !important; }
body:not(:has(.cmp-dim-head)) #expgapChart [fill="#1F3A3D"]{ fill:var(--cm-band); }
body:not(:has(.cmp-dim-head)) #expgapChart [fill="#D03C2F"],.expgap-box-observed{ fill:var(--risk); background:var(--risk) !important; }
/* Comparer : Suisse = ciel, France = marine, hausse = vert                 */
body:has(.cmp-dim-head) #expgapChart [fill="#D03C2F"]{ fill:var(--cm-sky); }
body:has(.cmp-dim-head) #expgapChart [fill="#1F3A3D"]{ fill:var(--cm-navy); }
body:has(.cmp-dim-head) #expgapChart [fill="#3A6B5F"]{ fill:var(--cm-green); }
/* Radars : les deux séries devenaient deux bleus voisins.                 */
/* Exposition technique = orange (exposition), adoption = marine.           */
.rdr-fill-blue{ fill:var(--exp-4); }
.rdr-stroke-blue{ stroke:var(--exp-4); }
.rdr-dot-blue{ fill:var(--exp-4); }
.rdr-fill-red{ fill:var(--cm-navy); }
.rdr-stroke-red{ stroke:var(--cm-navy); }
.rdr-dot-red{ fill:var(--cm-navy); }
.rdr-legend [data-layer="blue"] i{ background:var(--exp-4) !important; }
.rdr-legend [data-layer="red"] i{ background:var(--cm-navy) !important; }
html[data-theme="dark"] .rdr-legend [data-layer="red"] i{ background:#103454 !important; box-shadow:0 0 0 1px #89C4E9; }
.rdr-legend small{ font-size:11px !important; }
/* Carte européenne : rampe séquentielle bleue, clair = faible            */
.eumap-section [fill="#E8E2D2"],.eumap-section [style*="fill: rgb(232, 226, 210)"]{ fill:#EAF5FC !important; }

@media (max-width:960px){

.dl-grid--datasets{ margin-bottom:24px; }

/* v1.2 · 18 octobre 2026 · pleine largeur sur ordinateur               */
/* ==================================================================== */

/* --- 20 · Textes et blocs sur toute la largeur du conteneur ----------- */
/* Les plafonds de lecture (68ch, 62ch, 760 px) laissaient un vide à      */
/* droite de chaque bloc. Le conteneur commun (--max-w, 1280 px) fixe     */
/* seul la largeur ; tout ce qui est dedans l'occupe entièrement.         */
:root,body{ --measure:none; }
p,li,dd,dt,blockquote,figcaption,h1,h2,h3,h4,h5,h6,
.manifesto-text,.stat-label,.kpi-label,.dl-desc,.field-card-excerpt,
.section-title,.ds-title,.frame-title,.debate-title,.warning-title,.dash-title,.hero-title,
.section-sub,.ds-lede,.dash-lede,.hero-pitch,.hero-lede,.frame-lede,.debate-lede,.warning-lede,
.method-content p,.method-content li,.context-content p,.context-content h3,.reinvent-intro p,
.rdr-sub,.rdr-deck,.caveat,.method-caveat,.method-source,
.expgap-readline,.diff-summary-text,.cmp-dim-lede,.eu-lede,.eu-note,.eu-caveat,.eu-src,
.pt-question,.pt-question-body,.pt-questions-lede,.brief-source-cited,.debate-takeaway p,
.warning-footer,.frame-footer-text,.briefing-summary,
.context-key-facts{ max-width:none !important; }
/* Blocs autonomes (formulaire, blocs Europe) : conteneur commun, marges  */
/* intérieures alignées sur le reste de la page.                          */
.contact-form-section,.eu-block{ max-width:var(--max-w,1280px) !important; margin-left:auto !important; margin-right:auto !important;
  padding-left:var(--cm-gutter) !important; padding-right:var(--cm-gutter) !important; box-sizing:border-box; }
/* Bulles d'aide : elles gardent leur propre largeur */
.rdr-tt p,.rdr-tt li,[role="tooltip"] p{ max-width:inherit !important; }
.frame-footer,.debate-head,.cmp-dim-head,.pt-questions-head{ max-width:none !important; }
.sg-wrap{ max-width:var(--max-w,1280px) !important; }
/* Grilles « numéro de section | contenu » : le repère passe au-dessus et  */
/* le contenu reprend toute la largeur, comme le manifeste et le contexte. */
.method-grid{ grid-template-columns:minmax(0,1fr) !important; gap:16px !important; }
.method-grid > :first-child{ position:static !important; }
/* Grilles élargies : un nombre de colonnes qui remplit chaque rangée.    */
@media (min-width:1100px){
  div[style*="auto-fit"]:has(> :nth-child(6):last-child){ grid-template-columns:repeat(3,minmax(0,1fr)) !important; }
  .field-grid:has(> :nth-child(3):last-child){ grid-template-columns:repeat(3,minmax(0,1fr)) !important; }
  .cards-grid:has(> :nth-child(8):last-child){ grid-template-columns:repeat(4,minmax(0,1fr)) !important; }
}

[data-theme="dark"] .debate-takeaway,[data-theme="dark"] .debate-takeaway p,

  --ink:#FFFFFF; --ink-sec:#D9E4F2; --muted:#B9CBE0; --rule:rgba(255,255,255,.18);
  --signal:#89C4E9; --accent:#89C4E9; --sia-cream:#D9E4F2; --sia-coral:#43A5E4;

/* Cartes et encadrés posés dans la bande */
.hero .kpi,.masthead .kpi,.hero [class*="-card"],.masthead [class*="-card"]{
  --tx:#1A1D21; --tx-sec:#5F6368; --tx-mut:#647092; --br:#E3EEF6; --ink-1:#1A1D21; --ink-2:#5F6368; --ink-3:#647092;

.hero .indep-label,.masthead .indep-label{ color:var(--cm-sky-light) !important; }

.hero-author-info strong,.hero-author-info b,.hero-author-info > :first-child{ color:#FFFFFF !important; }
.hero-author-mark{ background:var(--cm-sky) !important; color:var(--cm-on-sky) !important; border-color:var(--cm-sky) !important; }
/* Barre de navigation interne du #006 */
nav.nav:not(#siteNav){ background:var(--cm-navy) !important; border-color:rgba(255,255,255,.12) !important;

/* Contrôles des 08 à 10 : texte clair forcé */
.controls,.controls .mono,.controls span{ color:#D9E4F2 !important; }
/* Dépêches 01 à 04 : en-tête en bande marine, comme les pages du site */
.brief-hero{
  background:var(--cm-navy); color:#FFFFFF;
  box-shadow:0 0 0 100vmax var(--cm-navy); clip-path:inset(0 -100vmax);
  padding-bottom:48px !important; margin-bottom:48px !important;
  --ink:#FFFFFF; --ink-2:#D9E4F2; --ink-sec:#D9E4F2; --ink-3:#B9CBE0; --muted:#B9CBE0; --rule:rgba(255,255,255,.18);

}
.brief-hero-title,.brief-hero h1{ color:#FFFFFF !important; }
.brief-hero-title em,.brief-hero em{ color:var(--cm-sky) !important; }
.brief-hero-sub,.brief-byline,.brief-hero-meta,.brief-hero-meta *{ color:#D9E4F2 !important; }
.brief-byline strong{ color:#FFFFFF !important; }
.brief-byline,.brief-hero-meta{ border-color:rgba(255,255,255,.18) !important; }
.brief-hero .meta-edition{ border-color:var(--cm-sky-light) !important; color:var(--cm-sky-light) !important; }

.brief-action{ background:var(--cm-sky) !important; color:var(--cm-on-sky) !important; border:1.5px solid var(--cm-sky) !important; border-radius:999px; font-weight:600; }
.brief-action--ghost{ background:transparent !important; color:#FFFFFF !important; border-color:var(--cm-sky-light) !important; }
.brief-action:focus-visible{ outline:2px solid var(--cm-sky); outline-offset:3px; }
/* Barre de progression de lecture */
.progress,#progress,#prog{ background:var(--cm-sky) !important; }

/* Pieds de page des dépêches et barre des matrices : marine */
body > footer:not(.pdf-foot):not(#siteFooter),footer.foot,.site-footer,.site-nav{
  --bg:#103454; --bg-alt:#103454; --sf:#103454;
  --tx:#FFFFFF; --tx-sec:#D9E4F2; --tx-mut:#B9CBE0; --br:rgba(255,255,255,.18); --br-strong:rgba(255,255,255,.32);
  --ac:#43A5E4; --ink-1:#FFFFFF; --ink-2:#D9E4F2; --ink-3:#B9CBE0; --ink-rule:rgba(255,255,255,.18);
  --ink:#FFFFFF; --ink-sec:#D9E4F2; --muted:#B9CBE0; --rule:rgba(255,255,255,.18); --signal:#89C4E9; --accent:#89C4E9;
  background:var(--cm-navy) !important; color:#D9E4F2; border-color:transparent !important;
}
body > footer:not(.pdf-foot):not(#siteFooter) a,footer.foot a,.site-footer a,.site-nav a{ color:#FFFFFF; }
.site-nav .logo .bracket,.site-footer .foot-brand .bracket{ color:var(--cm-sky) !important; }
.site-nav .logo{ color:#FFFFFF !important; }
.site-nav .menu-btn span,.site-nav .menu-btn span::before,.site-nav .menu-btn span::after{ background:#FFFFFF !important; }

/* Bandes sombres d'origine (encre) : marine, dans les deux thèmes */
section.tldr,section.cta,.brief-sponsor-section{
  --tx:#FFFFFF; --tx-sec:#D9E4F2; --tx-mut:#B9CBE0; --br:rgba(255,255,255,.18); --ac:#43A5E4;
  --paper:#FFFFFF; --ink:#103454; --signal:#89C4E9; --accent:#89C4E9;
  background:var(--cm-navy) !important; color:#FFFFFF;
}
.brief-sponsor-section .lede,.brief-sponsor-body,.brief-sponsor-sig-role{ color:#D9E4F2 !important; }
.brief-sponsor-eyebrow{ color:var(--cm-sky-light) !important; }
section.cta .cta-card{ background:rgba(255,255,255,.06) !important; border-color:rgba(255,255,255,.22) !important; }
section.cta .cta-card-title{ color:var(--cm-sky-light) !important; }
section.cta .cta-deck,section.cta p{ color:#D9E4F2 !important; }
/* Pastilles sur fond ciel : texte marine foncé (le blanc tombait à 2,7:1) */
.hb-coral,.hero .badge,.brief-sponsor-badge,.lang button[aria-pressed="true"],.ctrl[aria-pressed="true"]{
  background:var(--cm-sky) !important; color:var(--cm-on-sky) !important;
}
.brief-sponsor-badge .dot{ color:var(--cm-on-sky) !important; }
/* Étiquettes de série et encadrés posés dans les bandes marine */
.dispatch-tag,.dispatch-tag *{ color:var(--tx) !important; }
.hero .limites-strip,.masthead .limites-strip{ background:rgba(255,255,255,.08) !important; border-color:rgba(255,255,255,.24) !important; }
.hero .limites-strip a,.hero .limites-strip-mark{ color:var(--cm-sky-light) !important; }
body > footer :is(b,strong),footer.foot :is(b,strong),.site-footer :is(b,strong){ color:#FFFFFF !important; }

.badge-alt{ background:var(--cm-sky) !important; color:var(--cm-on-sky) !important; }
section.tldr .tldr-src,section.tldr .tldr-foot{ color:#B9CBE0 !important; }
section.tldr .tldr-anchor{ color:var(--cm-sky-light) !important; }
html[data-theme="dark"] .brief-kpi-conf.c1{ color:#4CC266 !important; border-color:#4CC266 !important; }

/* Matrices : liste mobile et infobulle */
.mobile-legend{ background:var(--bg-alt) !important; }
.tt{ background:var(--cm-navy) !important; color:#FFFFFF; }

/* --- 5 · Boutons et liens ---------------------------------------------- */
a{ text-underline-offset:2px; }
.cta a,.cta-card a,a.call-link,.btn-copy,[class*="cta"] a[href]{ border-radius:999px; }

/* --- 6 · Graphiques : couleurs écrites en attribut par les scripts ------ */
svg [fill="#B8312F" i]{ fill:var(--ac); }       svg [stroke="#B8312F" i]{ stroke:var(--ac); }
svg [fill="#BF6B04" i]{ fill:var(--amber); }    svg [stroke="#BF6B04" i]{ stroke:var(--amber); }
svg [fill="#2D6A4F" i]{ fill:var(--green); }    svg [stroke="#2D6A4F" i]{ stroke:var(--green); }
svg [fill="#1A1A1A" i],svg [fill="#11110F" i]{ fill:var(--tx,var(--ink)); }
svg [stroke="#1A1A1A" i],svg [stroke="#11110F" i]{ stroke:var(--tx,var(--ink)); }
svg [fill="#5B5B5B" i]{ fill:var(--tx-sec); }   svg [fill="#8A8A8A" i],svg [fill="#7A7A7A" i]{ fill:var(--tx-mut,var(--muted)); }
svg [stroke="#8A8A8A" i],svg [stroke="#7A7A7A" i]{ stroke:var(--tx-mut,var(--muted)); }
svg [fill="#C9C2B5" i]{ fill:var(--br-strong); } svg [stroke="#C9C2B5" i]{ stroke:var(--br-strong); }
svg [fill="#E5E0D8" i]{ fill:var(--br); }       svg [stroke="#E5E0D8" i]{ stroke:var(--br); }
svg [fill="#003081" i]{ fill:var(--cm-navy); }  svg [stroke="#003081" i]{ stroke:var(--cm-navy); }
svg [fill="#F56476" i]{ fill:var(--cm-sky); }   svg [stroke="#F56476" i]{ stroke:var(--cm-sky); }
svg [fill="#2C5578" i]{ fill:var(--signal); }   svg [stroke="#2C5578" i]{ stroke:var(--signal); }
svg [fill="#D03C2F" i]{ fill:var(--exp-4); }    svg [stroke="#D03C2F" i]{ stroke:var(--exp-4); }
svg [fill="#1F3A3D" i]{ fill:var(--cm-navy); }  svg [stroke="#1F3A3D" i]{ stroke:var(--cm-navy); }
html[data-theme="dark"] svg [fill="#003081" i],html[data-theme="dark"] svg [fill="#1F3A3D" i],
[data-theme="dark"] svg [fill="#003081" i],[data-theme="dark"] svg [fill="#1F3A3D" i]{ fill:var(--cm-sky-light); }

/* --- 7 · Lecture et responsive ----------------------------------------- */
.table-scroll,[class*="table-wrap"]{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
@media (max-width:960px){
  .cite{ white-space:normal !important; overflow-wrap:anywhere; }
  .site-nav,.site-nav-inner,.site-footer{ margin-left:0 !important; margin-right:0 !important; width:auto !important; max-width:100% !important; box-sizing:border-box; }
}
@media (max-width:720px){
  table{ display:block; max-width:100%; overflow-x:auto; }
  svg{ max-width:100%; height:auto; }
  .controls .wrap,.controls .col{ flex-wrap:wrap; gap:8px; }
}

/* --- 8 · Pleine largeur sur ordinateur (18 octobre 2026) --------------- */
/* Les dépêches et briefings plafonnaient textes et blocs entre 680 et   */
/* 1 000 px dans un conteneur de 1 280 px. Un seul conteneur, 1 280 px,  */
/* et tout ce qu'il contient l'occupe entièrement.                       */
:root,body{ --measure:none; --w-col:calc(var(--max-w,1280px) - 64px); --maxw:1280px; --gut:32px;
  --pf-grid:1280px; --pf-wide:none; --pf-medium:none; --pf-prose:none; }
p,li,dd,dt,blockquote,figcaption,h1,h2,h3,h4,h5,h6,
.standfirst,.lede,.deck,.section-deck,.hero-deck,.hero-author,.hero-title,.cta-deck,
.tldr-foot,.tldr-head,.indep-block,.source-body,.section-content,.sub,
.brief-hero-title,.brief-hero-sub,.brief-quote,.brief-quote-author,.brief-checklist,
.brief-twocol,.brief-roles-grid,.brief-roles-footer,.brief-critical-inner,
.brief-critical-item,.brief-critical-source,.brief-critical-item-source,.brief-sources-item,
.brief-source-cited,.brief-cta-head,.brief-cta-grid,.brief-cta-followup,
[class^="brief-"][class$="-eyebrow"],[class^="brief-"][class*="-eyebrow "],
[class^="brief-"][class$="-title"],[class^="brief-"][class$="-lede"],
[class^="brief-"][class*="-grid"],[class^="brief-"][class$="-synthesis"],
[class^="brief-"][class$="-sector"],[class^="brief-"][class$="-takeaway"],
.brief-section-eyebrow,.brief-section-title,
.frame-footer,.debate-head,.cmp-dim-head,.pt-questions-head,.honest-box,.brief-sources-list{ max-width:none !important; }
/* Blocs plafonnés en style en ligne dans les dépêches */
.wrap div[style*="max-width"],.wrap p[style*="max-width"],.wrap h2[style*="max-width"],
.section-content div[style*="max-width"]{ max-width:none !important; }
/* Conteneurs à 1 200 ou 680 px alignés sur le conteneur commun */
.nav-inner,.foot-inner,.breadcrumb-inner,.dispatch-banner-inner,.sg-wrap{ max-width:var(--max-w,1280px) !important; }
/* Rail « § 01 / rubrique » des dépêches : repère au-dessus, contenu sur  */
/* toute la largeur, comme sur les pages principales.                     */
.wrap > .section-head:has(> .section-num){ grid-template-columns:minmax(0,1fr) !important; gap:12px !important; margin-bottom:32px !important; }
.wrap > .section-content{ margin-left:0 !important; }
.section-num{ position:static !important; }
/* Une seule famille de texte : le chapô « presse » du #005 était en Tinos */
.lede,.lede p{ font-family:"Figtree",system-ui,sans-serif !important; }
/* Grilles élargies : un nombre de colonnes qui remplit chaque rangée.    */
@media (min-width:1100px){
  .keyfigs:has(> :nth-child(8):last-child){ grid-template-columns:repeat(4,minmax(0,1fr)) !important; }
  .brief-bcgmap-grid:has(> :nth-child(6):last-child){ grid-template-columns:repeat(3,minmax(0,1fr)) !important; }
  .brief-debate-grid:has(> :nth-child(4):last-child),
  .brief-archetypes-grid:has(> :nth-child(4):last-child),
  .brief-arch-grid:has(> :nth-child(4):last-child){ grid-template-columns:repeat(4,minmax(0,1fr)) !important; }
  .brief-chempirie-grid--2col:has(> :nth-child(9):last-child){ grid-template-columns:repeat(3,minmax(0,1fr)) !important; }
}

/* --- 9 · Dépêche #002 post-factum : jetons « pf » du prototype --------- */

/* crème sous un titre blanc, logo et menu marine sur fond marine.        */
:root,body{

body .brief-hero .brief-byline,body .brief-hero .brief-byline *{ color:var(--cm-on-navy-muted) !important; }
#siteNav .logo{ color:var(--cm-on-navy) !important; }

body .brief-sov em,body .brief-sov i{ color:var(--cm-sky-light) !important; }
/* Pourcentages des segments BCG : orange trop clair sur blanc            */
.brief-bcg-seg-pct{ color:var(--risk) !important; }
[data-theme="dark"] .brief-bcg-seg-pct{ color:#FFB04D !important; }
body .brief-sov-card-tag{ color:var(--cm-sky-light) !important; }
footer .foot-col-label{ color:var(--cm-on-navy-muted) !important; }
body footer .foot-license,body footer .foot-version,body footer .foot-bottom span{ color:var(--cm-on-navy-muted) !important; }
/* Matrices : le contenu s'alignait 32 px à gauche du logo               */
body > .wrap{ padding-left:var(--cm-gutter,32px); padding-right:var(--cm-gutter,32px); box-sizing:border-box; }
/* Bandes pleine largeur : contenu aligné sur la marge commune (112 px à  */
/* 1 440 px), sans double marge intérieure ni débord jusqu'au bord.       */
.brief-sponsor-inner{ max-width:calc(var(--max-w,1280px) - 64px) !important; }

.brief-cta-actions > .section-head{ padding-left:0 !important; padding-right:0 !important; }
/* Couleurs écrites en style en ligne (barres, pastilles) : même table de */
/* correspondance que pour les SVG (section 6).                           */
[style*="background:#f56476" i]{ background:var(--cm-sky) !important; color:var(--cm-on-sky) !important; }
