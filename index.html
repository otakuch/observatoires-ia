<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>observatoire[s]·ia · Comprendre l'impact des IA sur le travail · Suisse & France</title>
<meta name="description" content="524 métiers cartographiés, 14 observatoires institutionnels CH et FR référencés, données ouvertes CC BY 4.0. Une lecture factuelle plutôt qu'émotionnelle de l'impact des IA sur le travail.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2EEE5;
  --paper-2: #ECE7DC;
  --ink: #11110F;
  --ink-2: #2A2A26;
  --muted: #8B8579;
  --rule: #D9D2C2;
  --signal: #D03C2F;
  --teal: #1F3A3D;
  --highlight: #F7E27D;
  --max-w: 1280px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: "Instrument Sans", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  background-image: radial-gradient(circle at 1px 1px, rgba(17,17,15,0.04) 1px, transparent 0);
  background-size: 22px 22px;
}
::selection { background: var(--signal); color: var(--paper); }
a { color: inherit; text-decoration: none; }
.mono { font-family: "JetBrains Mono", monospace; font-size: 0.78em; letter-spacing: 0.02em; }
.serif { font-family: "Fraunces", serif; font-variation-settings: "opsz" 96, "SOFT" 50; }

/* ───────── NAV ───────── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(242, 238, 229, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
}
.nav-inner {
  max-width: var(--max-w); margin: 0 auto;
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.logo {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 24, "SOFT" 0;
  font-weight: 500; font-size: 19px;
  letter-spacing: -0.01em; color: var(--ink); white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: opacity 0.15s ease;
}
.logo:hover { opacity: 0.7; }
.logo:hover .bracket { color: var(--signal); }
.logo .bracket { color: var(--signal); font-weight: 600; transition: color 0.15s ease; }
.logo .dot { color: var(--muted); margin: 0 0.15em; }

.nav-links {
  display: flex; gap: 22px; align-items: center;
  font-size: 13.5px; font-weight: 500;
}
.nav-links a {
  color: var(--ink-2); position: relative; padding: 4px 0;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.current { color: var(--signal); }
.nav-links a.current::after {
  content: ""; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1.5px; background: var(--signal);
}

.nav-actions { display: flex; gap: 14px; align-items: center; }
.lang-toggle {
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  background: transparent; border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 14px; cursor: pointer;
  display: flex; gap: 8px; color: var(--ink);
  transition: border-color 0.2s;
}
.lang-toggle:hover { border-color: var(--ink); }
.lang-toggle span.active { color: var(--signal); font-weight: 500; }
.lang-toggle span:not(.active) { color: var(--muted); }

.menu-btn {
  display: none; background: transparent;
  border: 1px solid var(--rule);
  width: 38px; height: 38px; border-radius: 8px;
  cursor: pointer; align-items: center; justify-content: center;
}
.menu-btn span { display: block; width: 16px; height: 1.5px; background: var(--ink); position: relative; }
.menu-btn span::before, .menu-btn span::after {
  content: ""; position: absolute; left: 0; width: 16px; height: 1.5px; background: var(--ink);
}
.menu-btn span::before { top: -5px; }
.menu-btn span::after { top: 5px; }

.mobile-menu {
  display: none; position: fixed; inset: 0;
  background: var(--paper); z-index: 100;
  padding: 80px 32px 32px;
  flex-direction: column; gap: 28px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-family: "Fraunces", serif; font-size: 32px; font-weight: 400; color: var(--ink);
}
.mobile-menu .close-btn {
  position: absolute; top: 18px; right: 18px;
  background: transparent; border: 1px solid var(--rule);
  width: 38px; height: 38px; border-radius: 8px;
  cursor: pointer; font-size: 20px; color: var(--ink);
}

/* ───────── HERO ───────── */
.hero {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px 60px; position: relative;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 28px;
}
.hero-eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--signal); }

.hero-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(44px, 7vw, 96px);
  line-height: 0.96; letter-spacing: -0.025em;
  margin-bottom: 28px; max-width: 980px;
}
.hero-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.hero-title .accent-bracket { color: var(--signal); font-weight: 500; }

.hero-pitch {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 28, "SOFT" 0;
  font-style: italic;
  font-size: clamp(18px, 1.5vw, 22px);
  line-height: 1.4;
  max-width: 720px;
  color: var(--ink);
  margin: 0 0 28px 0;
  letter-spacing: -0.01em;
}

.hero-lede {
  font-size: clamp(17px, 1.6vw, 21px); line-height: 1.5;
  max-width: 640px; color: var(--ink-2); margin-bottom: 40px;
}

.btn {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 16px 28px; border-radius: 999px;
  font-weight: 500; font-size: 15px;
  transition: background 0.2s, transform 0.2s, color 0.2s, border-color 0.2s;
  cursor: pointer; font-family: inherit; border: none;
}
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--signal); transform: translateY(-1px); }
.btn-secondary {
  background: transparent; border: 1px solid var(--ink); color: var(--ink);
}
.btn-secondary:hover { background: var(--ink); color: var(--paper); }
.btn .arrow { transition: transform 0.2s; }
.btn:hover .arrow { transform: translateX(4px); }

.cta-row { display: flex; gap: 14px; flex-wrap: wrap; }

/* ───────── COUNTRY TEASERS (Home) ───────── */
.country-teasers {
  max-width: var(--max-w); margin: 60px auto;
  padding: 0 32px;
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px;
}
.country-card {
  border: 1px solid var(--rule);
  background: var(--paper);
  padding: 40px;
  display: flex; flex-direction: column; gap: 20px;
  transition: background 0.2s, border-color 0.2s;
  position: relative; overflow: hidden;
  cursor: pointer;
}
.country-card:hover { background: var(--paper-2); border-color: var(--ink); }
.country-card-flag {
  font-size: 32px;
  display: flex; align-items: center; gap: 14px;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted);
}
.country-card-flag .emoji { font-size: 28px; }
.country-card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(36px, 4.5vw, 56px);
  line-height: 1; letter-spacing: -0.02em;
}
.country-card-num {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink-2);
  display: flex; gap: 18px; flex-wrap: wrap;
}
.country-card-num strong {
  font-family: "Fraunces", serif;
  font-size: 28px; font-weight: 500; color: var(--signal);
  margin-right: 4px;
}
.country-card-cta {
  margin-top: auto;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px;
  transition: gap 0.2s, color 0.2s;
}
.country-card:hover .country-card-cta { gap: 14px; color: var(--signal); }

/* ───────── STATS ───────── */
.stats {
  max-width: var(--max-w); margin: 40px auto 0;
  padding: 0 32px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat {
  padding: 36px 24px;
  border-right: 1px solid var(--rule);
  position: relative;
}
.stat:last-child { border-right: none; }
.stat-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-weight: 500;
  font-size: clamp(48px, 6vw, 76px);
  line-height: 1; letter-spacing: -0.03em;
  display: flex; align-items: baseline; gap: 6px;
}
.stat-num .unit { font-size: 0.45em; color: var(--signal); font-weight: 400; }
.stat-num .sign { color: var(--signal); font-size: 0.6em; }
.stat-label {
  margin-top: 14px; font-size: 14px; line-height: 1.4; max-width: 280px;
}
.stat-source {
  margin-top: 14px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* ───────── MANIFESTO ───────── */
.manifesto {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
  display: grid; grid-template-columns: 200px 1fr; gap: 60px;
}
.manifesto-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
  padding-top: 8px;
}
.manifesto-text {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 60;
  font-weight: 300;
  font-size: clamp(22px, 2.6vw, 32px);
  line-height: 1.35; letter-spacing: -0.01em;
  max-width: 880px;
}
.manifesto-text p { margin-bottom: 0.6em; }
.manifesto-text p:last-child { margin-bottom: 0; }
.manifesto-text strong {
  font-weight: 500;
  background: linear-gradient(180deg, transparent 60%, var(--highlight) 60%);
  padding: 0 2px;
}

/* ───────── SECTION HEADS ───────── */
.section-head {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px 32px;
  border-top: 1px solid var(--rule);
}
.section-head.no-border { border-top: none; padding-top: 60px; }
.section-eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--signal);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 12px;
}
.section-eyebrow::before {
  content: "§"; font-family: "Fraunces", serif;
  font-size: 18px; color: var(--ink);
}
.section-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(34px, 5vw, 58px);
  line-height: 1; letter-spacing: -0.02em;
  margin-bottom: 24px;
}
.section-sub {
  font-size: 17px; color: var(--ink-2);
  max-width: 640px; line-height: 1.5;
}

/* ───────── FILTERS ───────── */
.filters {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 32px;
  display: flex; gap: 32px; flex-wrap: wrap; align-items: center;
}
.filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.filter-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-right: 8px;
}
.chip {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; border: 1px solid var(--rule);
  background: transparent; padding: 7px 13px;
  border-radius: 999px; cursor: pointer;
  color: var(--ink-2); transition: all 0.18s;
}
.chip:hover { border-color: var(--ink); }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ───────── CARDS GRID ───────── */
.cards-grid {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 100px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
  border-top: 1px solid var(--rule);
  border-left: 1px solid var(--rule);
}
.card {
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 32px 28px 28px; background: var(--paper);
  position: relative;
  display: flex; flex-direction: column; gap: 14px;
  min-height: 280px;
  transition: background 0.2s; cursor: pointer;
}
.card:hover { background: var(--paper-2); }
.card-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.flag { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.flag-dot { width: 8px; height: 8px; border-radius: 50%; }
.flag-ch .flag-dot { background: var(--signal); }
.flag-fr .flag-dot { background: var(--teal); }
.card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500; font-size: 24px;
  line-height: 1.1; letter-spacing: -0.01em;
}
.card-org { font-size: 13px; color: var(--muted); font-style: italic; }
.card-desc { font-size: 14px; line-height: 1.5; color: var(--ink-2); flex: 1; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.card-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  background: var(--paper-2); padding: 4px 8px;
  border-radius: 4px; color: var(--ink-2);
}
.card-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 8px; padding-top: 14px;
  border-top: 1px dashed var(--rule);
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.card-footer .visit { color: var(--signal); }
.card-empty-state {
  grid-column: 1 / -1;
  padding: 80px 32px; text-align: center;
  font-family: "Fraunces", serif; font-style: italic;
  color: var(--muted);
}

/* ───────── KPI ROW (country dashboards) ───────── */
.kpi-row {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 60px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.kpi {
  background: var(--paper);
  padding: 32px 28px;
  display: flex; flex-direction: column; gap: 10px;
}
.kpi-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
}
.kpi-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-weight: 500;
  font-size: clamp(40px, 5vw, 60px);
  line-height: 1; letter-spacing: -0.02em;
  display: flex; align-items: baseline; gap: 6px;
}
.kpi-num .unit { font-size: 0.45em; color: var(--signal); font-weight: 400; }
.kpi-num .sign { color: var(--signal); font-size: 0.6em; }
.kpi-label { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.kpi-source {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-top: auto;
}

/* ───────── CONTEXT BLOCK (institutional context on country pages) ───────── */
.context-block {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 70px 32px 90px;
  border-top: 1px solid var(--rule);
}
.context-grid {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 60px;
}
.context-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding-top: 8px;
}
.context-content h3 {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(30px, 3.6vw, 44px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 30px;
}
.context-content h3 em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.context-content p {
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink-2);
  max-width: 760px;
  margin-bottom: 18px;
}
.context-content p:last-of-type {
  margin-bottom: 0;
}
.context-key-facts {
  margin-top: 40px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  max-width: 760px;
}
.kf-item {
  background: var(--paper);
  padding: 22px 22px;
}
.kf-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 20;
  font-size: 28px;
  font-weight: 500;
  color: var(--signal);
  line-height: 1;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}
.kf-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  line-height: 1.4;
}

/* CTA row inside dash-header */
.dash-cta-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 32px;
}
.dash-header {
  max-width: var(--max-w); margin: 0 auto;
  padding: 70px 32px 30px;
}
.dash-flag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 12px;
}
.dash-flag .emoji { font-size: 28px; }
.dash-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(48px, 7vw, 84px);
  line-height: 0.95; letter-spacing: -0.025em;
  margin-bottom: 24px;
}
.dash-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.dash-lede {
  font-size: clamp(17px, 1.5vw, 19px);
  max-width: 720px; color: var(--ink-2);
}

/* ───────── CHART (mini sparkline / bar) ───────── */
.chart-block {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 80px;
}
.bar-chart { display: flex; flex-direction: column; gap: 14px; }
.bar-row {
  display: grid;
  grid-template-columns: 200px 1fr 60px;
  align-items: center; gap: 16px;
  font-size: 14px;
}
.bar-track {
  height: 28px; background: var(--paper-2);
  position: relative; overflow: hidden;
  border: 1px solid var(--rule);
}
.bar-fill {
  height: 100%; background: var(--ink);
  position: relative;
  transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.bar-fill.signal { background: var(--signal); }
.bar-fill.teal { background: var(--teal); }
.bar-value {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink); text-align: right;
}

/* ───────── COMPARISON TABLE ───────── */
.compare-table-wrap {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 100px;
  overflow-x: auto;
}
table.compare {
  width: 100%; border-collapse: collapse;
  font-size: 14px; min-width: 720px;
  border: 1px solid var(--rule);
}
table.compare th {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); text-align: left;
  padding: 16px 20px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--rule);
  font-weight: 500;
}
table.compare th.country-ch { color: var(--signal); }
table.compare th.country-fr { color: var(--teal); }
table.compare td {
  padding: 18px 20px;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
}
table.compare tr:last-child td { border-bottom: none; }
table.compare td.dim {
  font-family: "Fraunces", serif;
  font-size: 16px; font-weight: 500;
}
table.compare td.gap {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--signal); font-weight: 500;
}

/* ───────── SYNTHESE (dark) ───────── */
.synthese {
  background: var(--ink); color: var(--paper);
  padding: 100px 0;
}
.synthese-inner { max-width: var(--max-w); margin: 0 auto; padding: 0 32px; }
.synthese .section-eyebrow { color: var(--signal); }
.synthese .section-eyebrow::before { color: var(--paper); }
.synthese .section-title { color: var(--paper); }
.synthese .section-sub { color: rgba(242, 238, 229, 0.7); }
.table-wrap {
  margin-top: 48px; overflow-x: auto;
  border: 1px solid rgba(242, 238, 229, 0.15);
}
table.synth {
  width: 100%; border-collapse: collapse;
  font-size: 14px; min-width: 720px;
}
table.synth th {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--signal); text-align: left;
  padding: 16px 20px;
  background: rgba(242, 238, 229, 0.03);
  border-bottom: 1px solid rgba(242, 238, 229, 0.15);
  font-weight: 500;
}
table.synth td {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(242, 238, 229, 0.08);
  vertical-align: top;
}
table.synth tr:hover td { background: rgba(242, 238, 229, 0.03); }
table.synth td.name {
  font-family: "Fraunces", serif;
  font-size: 16px; font-weight: 500;
}
table.synth td .pill {
  display: inline-block;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; padding: 3px 8px;
  border-radius: 3px;
  background: rgba(242, 238, 229, 0.1);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* ───────── FIELD REPORT ───────── */
.field-report {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
}
.field-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 32px; margin-top: 48px;
}
.field-card {
  border-top: 2px solid var(--ink);
  padding-top: 24px;
  display: flex; flex-direction: column; gap: 12px;
  cursor: pointer; transition: opacity 0.2s;
}
.field-card:hover { opacity: 0.75; }
.field-card-meta {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  display: flex; justify-content: space-between;
}
.field-card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 40;
  font-weight: 400; font-size: 26px;
  line-height: 1.15; letter-spacing: -0.01em;
}
.field-card-excerpt { font-size: 15px; line-height: 1.5; color: var(--ink-2); }
.field-card-link {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--signal); margin-top: 8px;
}

/* ───────── ABOUT ───────── */
.about {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
  border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr 1fr; gap: 80px;
}
.about-text {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 60;
  font-weight: 300;
  font-size: clamp(20px, 2.2vw, 28px);
  line-height: 1.4; letter-spacing: -0.01em;
}
.about-text .accent-bracket { color: var(--signal); font-weight: 500; }
.about-actions {
  display: flex; flex-direction: column;
  gap: 14px; align-items: flex-start; padding-top: 12px;
}

/* ───────── CROSS LINK (bottom of country page) ───────── */
.cross-link {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px;
  border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 32px;
}
.cross-link h3 {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(28px, 3.5vw, 42px);
  line-height: 1.1; letter-spacing: -0.02em;
}
.cross-link h3 em {
  font-style: italic;
  font-variation-settings: "opsz" 60, "SOFT" 100;
  color: var(--signal);
}

/* ───────── BRIEF·iA · LIGHT (magazine-inspired) ───────── */

}

  color: var(--muted);
  margin-bottom: 24px;
}
.brief-hero-meta .meta-num {
  color: var(--signal);
  font-weight: 500;
}
.brief-hero-meta .meta-edition {
  color: var(--ink);
  border: 1px solid var(--rule);

}
.brief-hero-title {
  font-family: "Fraunces", serif;

}
.brief-hero-title em {

}
.brief-hero-sub {

  color: var(--ink-2);

}
.brief-byline {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;

  text-transform: uppercase;

.brief-section {

  color: var(--signal);

  letter-spacing: 0.12em;
  margin-bottom: 16px;
}
.brief-section-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(30px, 4.5vw, 52px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 28px;
  max-width: 800px;
}
.brief-section-title em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.brief-section p {
  font-size: 17px;

}

.brief-twocol {

}
.brief-twocol-block h4 {

  text-transform: uppercase;

}
.brief-twocol-block ul { list-style: none; padding: 0; }
.brief-twocol-block li {
  font-size: 15px;

}

.brief-twocol-block li strong {

}
.brief-numbers-grid {

}
.brief-stat {
  background: var(--paper);

  flex-direction: column;

}
.brief-stat-num {

  font-variation-settings: "opsz" 144, "SOFT" 20;

  letter-spacing: -0.03em;
  color: var(--ink);
  font-weight: 500;
}
.brief-stat-num .unit {
  font-size: 0.4em;
  color: var(--signal);
  vertical-align: super;
  margin-left: 2px;
}
.brief-stat-num .sign { color: var(--signal); font-size: 0.7em; }
.brief-stat-label {
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink-2);
  flex: 1;
}
.brief-stat-source {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;

  padding-top: 14px;
  border-top: 1px dashed var(--rule);
}
.brief-quote {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 60;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(24px, 3.2vw, 38px);
  line-height: 1.3;
  letter-spacing: -0.01em;
  max-width: 920px;
  color: var(--ink);
  margin-bottom: 24px;
  margin-top: 24px;
}
.brief-quote::before {
  content: "“";
  font-size: 1.4em;
  color: var(--signal);
  vertical-align: -0.1em;
}
.brief-quote::after {
  content: "”";
  font-size: 1.4em;
  color: var(--signal);
  vertical-align: -0.1em;
}
.brief-quote-author {
  font-family: "JetBrains Mono", monospace;

  text-transform: uppercase;

}
.brief-quote-author strong {

}
.brief-quote-author span { color: var(--muted); margin-left: 8px; }
.brief-checklist {

  gap: 1px;

}
.brief-checklist-item {
  background: var(--paper);
  padding: 28px;
  display: flex;
  gap: 18px;
}
.brief-checklist-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 20;
  font-size: 36px;
  line-height: 1;
  color: var(--signal);
  font-weight: 500;
  flex-shrink: 0;
}
.brief-checklist-text {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-2);
}
.brief-checklist-text strong {
  display: block;
  color: var(--ink);
  font-weight: 500;
  margin-bottom: 6px;
  font-family: "Fraunces", serif;
  font-size: 18px;
}
.brief-toolkit-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 40px;
}
.brief-tool {
  background: var(--paper);
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: background 0.2s;
}
.brief-tool:hover { background: var(--paper-2); }
.brief-tool-cat {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.brief-tool-name {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500;
  font-size: 22px;
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.brief-tool-desc {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
}

/* DISPATCH SOURCES - traceability block */
.brief-sources {
  background: var(--paper-2);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding-top: 60px;
  padding-bottom: 60px;
  margin-top: 40px;
}
.brief-sources-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 40px;
}
.brief-source-card {
  background: var(--paper);
  padding: 24px 28px;
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 24px;
  align-items: start;
  transition: background 0.2s;
}
.brief-source-card:hover { background: var(--paper-2); }
.brief-source-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 60;
  font-weight: 400;
  font-size: 32px;
  color: var(--signal);
  line-height: 1;
  padding-top: 4px;
}
.brief-source-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.brief-source-label {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500;
  font-size: 18px;
  line-height: 1.3;
  color: var(--ink);
}
.brief-source-cited {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
  font-style: italic;
}
.brief-source-cited strong {
  font-style: normal;
  color: var(--ink);
  font-weight: 500;
}
.brief-source-links {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 6px;
}
.brief-source-links a {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 6px 10px;
  border: 1px solid var(--rule);
  background: var(--paper);
  transition: border-color 0.2s, background 0.2s;
}
.brief-source-links a:hover {
  border-color: var(--signal);
  background: var(--paper-2);
}
@media (max-width: 720px) {
  .brief-source-card {
    grid-template-columns: 40px 1fr;
    gap: 16px;
    padding: 20px;
  }
  .brief-source-num { font-size: 24px; }
}

.brief-paywall {
  max-width: var(--max-w);
  margin: 0 auto;

}

  color: var(--paper);

  grid-template-columns: 1.5fr 1fr;
  gap: 60px;

  overflow: hidden;
}
.brief-paywall-inner::before {
  content: "EXECUTIVE";
  position: absolute;
  top: 24px;
  right: 30px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--signal);
}
.brief-paywall-eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--signal);
  margin-bottom: 18px;
}
.brief-paywall-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(28px, 3.6vw, 42px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 24px;
  color: var(--paper);
}
.brief-paywall-title em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.brief-paywall-desc {
  font-size: 16px;
  line-height: 1.6;

}

.brief-paywall ul li {
  font-size: 14px;

}
.brief-paywall ul li::before {

}
.brief-paywall ul li:last-child { border-bottom: none; }
.brief-paywall-price {
  background: rgba(242, 238, 229, 0.05);
  border: 1px solid rgba(242, 238, 229, 0.15);
  padding: 32px 28px;

  flex-direction: column;

  align-self: start;
}
.brief-paywall-price-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;

.brief-paywall-price-value {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;

  color: var(--paper);
  letter-spacing: -0.02em;
}
.brief-paywall-price-value .currency {
  font-size: 0.4em;
  color: var(--signal);
  margin-right: 6px;

  letter-spacing: 0;
}
.brief-paywall-price-alt {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;

  padding-bottom: 14px;
  border-bottom: 1px dashed rgba(242, 238, 229, 0.15);
}
.brief-paywall-buy {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--signal);
  color: var(--paper);
  padding: 14px 18px;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;

}
.brief-paywall-buy:hover { background: #ED5448; color: var(--paper); }
.brief-paywall-note {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;

}
.brief-back {

  margin: 0 auto;
  padding: 0 32px 80px;

}
@media (max-width: 960px) {
  .brief-hero { padding: 40px 20px 32px; }

  .brief-paywall-inner::before { top: 16px; right: 20px; }

/* ───────── FOOTER ───────── */
footer {
  border-top: 1px solid var(--rule);
  margin-top: 40px;
  font-family: "JetBrains Mono", monospace;

.foot-col-brand .foot-brand {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 28, "SOFT" 0;

  letter-spacing: -0.01em;

}

  color: var(--signal);
}

}
.foot-col-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  margin-bottom: 4px;

.foot-col-meta {
  font-size: 12px;

.foot-license { margin-bottom: 6px; color: var(--teal); }

.foot-bottom {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 20px 32px 32px;
  border-top: 1px solid var(--rule);

/* ───────── BRIEFINGS · CATALOG LIST ───────── */

.briefing-meta {

}
.briefing-title {

.briefing-actions {

.briefing-action-line {

}
.briefing-action-line a:hover { color: var(--signal); border-color: var(--signal); }
.briefing-action-line a.exec { color: var(--signal); border-color: var(--signal); }
.briefing-action-line .price {
  color: var(--ink);

/* ───────── BRIEFINGS · DOCUMENT VIEW ───────── */

.briefing-section {

}

  font-variation-settings: "opsz" 60, "SOFT" 20;

}
.briefing-section-title {

.briefing-sources {

  font-size: 13px;

}

  padding-left: 20px;

}
.briefing-sources li::before {

.exec-price-card {

.contact-form-section {

}
.contact-form {

  /* Filters stack neatly */
  .filters {
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }
  .filter-group { flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 6px 12px; }

  /* Foot mobile is handled by the dedicated @media (max-width: 720px) block at the end of this file */

  /* Context block tighter */
  .context-content h3 { font-size: 22px; }
  .context-content p { font-size: 15px; }

  /* KPI numbers smaller on phone */
  .kpi-num { font-size: 36px; }
  .kpi-label { font-size: 12px; }

  /* Bar charts stay readable */
  .bar-row { grid-template-columns: 1fr; gap: 4px; padding: 8px 0; }
  .bar-row > span:first-child { font-size: 12px; font-weight: 500; }
  .bar-row .bar-bar { margin: 4px 0; }
  .bar-row > span:last-child { text-align: left; font-size: 11px; }
}

@media (max-width: 480px) {
  /* Phone · most aggressive tightening */
  body { font-size: 15px; }
  .hero-title, .dash-title { font-size: 30px; }
  .stat-num { font-size: 36px; }
  .stat-label { font-size: 12px; }
  .nav-inner { padding: 12px 16px; }
  .logo { font-size: 16px; }
  .lang-toggle { font-size: 11px; }

  /* Mobile menu text larger */
  .mobile-menu a { font-size: 22px; padding: 14px 20px; }

  /* Brief hero numbers wrap better */
  .brief-stat-num { font-size: 44px; }
  .brief-stat-label { font-size: 12px; }

  /* Cards stack and tighten */
  .card { min-height: auto; padding: 20px 16px; }
  .field-card { padding: 18px 16px; }

  /* Method grid extra tight */
  .method-content h3 { font-size: 22px; }
  .method-content h4 { font-size: 16px; }
  .method-content p { font-size: 14px; }
  .method-content li { font-size: 14px; }

  /* About actions full-width on phone */
  .about-actions {
    flex-direction: column;
    align-items: stretch;
  }
  .about-actions .btn { text-align: center; justify-content: center; }
}

/* Improve touch targets on touch devices */
@media (hover: none) and (pointer: coarse) {
  .btn, .chip, .menu-btn, .lang-toggle button {
    min-height: 44px;
  }
  .nav-links a { padding: 10px 12px; }
  .field-card-link { padding: 4px 0; }
}

/* Prevent horizontal scroll on any page */
html, body { overflow-x: hidden; max-width: 100vw; }

/* Ensure long words break gracefully on narrow screens */
.field-card-title, .card-title, .brief-source-label,
.method-content p, .method-content h3, .method-content h4 {
  overflow-wrap: break-word;
  word-wrap: break-word;
}

/* Forms · prevent iOS zoom on focus */
.form-input, .form-select, .form-textarea {
  font-size: max(16px, 1rem);
}

}
.brief-action {
  font-family: "Instrument Sans", sans-serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.01em;
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--ink);
  padding: 9px 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.18s, color 0.18s, transform 0.12s;

}
.brief-action:hover {
  background: var(--signal);

  transform: translateY(-1px);
}
.brief-action:focus-visible {

}

}

  color: var(--paper);
  border-color: var(--ink);
  transform: translateY(-1px);
}
@media (max-width: 600px) {
  .brief-actions { flex-direction: column; align-items: stretch; }

/* ============================================== */
/* BRIEF MODAL · PDF preview popup                */
/* ============================================== */
.brief-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: stretch;
  justify-content: center;
}
.brief-modal[aria-hidden="false"] {
  display: flex;
}
.brief-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(17, 17, 15, 0.62);
  backdrop-filter: blur(2px);
  cursor: pointer;
}
.brief-modal-window {
  position: relative;
  width: min(900px, 100%);
  max-width: 900px;
  margin: 24px;
  background: var(--paper);
  border: 1px solid var(--ink);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 48px);
  box-shadow: 0 20px 60px rgba(17, 17, 15, 0.4);
}
.brief-modal-bar {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--ink);
  background: var(--paper);
}
.brief-modal-bar-left {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-3);
}
.brief-modal-bar-right {
  display: flex;
  gap: 10px;
  align-items: center;
}
.brief-modal-print {
  font-family: "Instrument Sans", sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: var(--signal);
  color: var(--paper);
  border: 1px solid var(--signal);
  padding: 8px 16px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.18s, transform 0.12s;
}
.brief-modal-print:hover {
  background: var(--ink);
  border-color: var(--ink);
  transform: translateY(-1px);
}
.brief-modal-close {
  background: transparent;
  border: none;
  font-size: 28px;
  line-height: 1;
  color: var(--ink);
  cursor: pointer;
  padding: 0 4px;
  font-family: serif;
}
.brief-modal-close:hover { color: var(--signal); }
.brief-modal-scroll {
  flex: 1 1 auto;
  overflow: auto;
  background: #FAFAF7;
  padding: 36px 24px;
}

}
.brief-pdf .pdf-list li::before {

  left: 0;

}

  letter-spacing: 0.08em;

}

  margin-top: 10px !important;
  padding: 10px 14px;

}

/* ============================================== */
/* BRIEF TOAST · feedback after copy              */
/* ============================================== */
.brief-toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--paper);
  padding: 12px 20px;
  font-size: 13px;
  font-family: "Instrument Sans", sans-serif;
  border-radius: 999px;
  z-index: 1100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  box-shadow: 0 8px 24px rgba(17, 17, 15, 0.3);
}
.brief-toast.is-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============================================== */
/* PRINT STYLES · isolate #brief-pdf              */
/* When body has .printing-pdf, only #brief-pdf prints */
/* ============================================== */
@media print {
  body.printing-pdf > *:not(.brief-modal) { display: none !important; }
  body.printing-pdf .brief-modal-backdrop,
  body.printing-pdf .brief-modal-bar { display: none !important; }
  body.printing-pdf .brief-modal {
    position: static !important;
    display: block !important;
  }
  body.printing-pdf .brief-modal-window {
    position: static !important;
    margin: 0 !important;
    border: none !important;
    max-height: none !important;
    box-shadow: none !important;
  }
  body.printing-pdf .brief-modal-scroll {
    overflow: visible !important;
    padding: 0 !important;
    background: white !important;
  }
  body.printing-pdf .brief-pdf {
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
    max-width: none !important;
  }
  body.printing-pdf .brief-pdf .pdf-section h2 { color: black !important; }
  body.printing-pdf .brief-pdf .pdf-list li::before { color: black !important; }
  body.printing-pdf .brief-pdf .pdf-title em { color: black !important; }
  body.printing-pdf .brief-pdf .pdf-section p em { color: black !important; }
  @page {
    size: A4;
    margin: 18mm 16mm;
  }
}

window.VEILLE_DATA = [{"date":"2025-06-15","source":"Colombus Consulting · Oracle · HEG-Genève · Observatoire Data & IA en Suisse 2025","country":"CH","title":{"fr":"Observatoire Data et IA en Suisse 2025 · 52% des entreprises déploient l'IA à l'échelle, mais 70% identifient la culture comme premier frein","en":"Swiss Data and AI Observatory 2025 · 52% of Companies Deploy AI at Scale, but 70% Identify Culture as the Primary Barrier"},"excerpt":{"fr":"Étude longitudinale de référence menée entre janvier et avril 2025 par Colombus Consulting, Oracle et la Haute École de gestion de Genève auprès d'un panel de plus de 100 organisations suisses (tous secteurs, toutes tailles, couverture géographique nationale). Méthodologie reproduite à l'identique de l'édition 2024 pour permettre une mesure rigoureuse des évolutions sur 12 mois. C'est la seule source CH qui mesure la maturité organisationnelle réelle de l'adoption IA en entreprise, complémentaire des sources sur les effets de substitution (KOF/ETH) et sur la création d'emplois IA (HSLU). Résultats structurants : 52% des entreprises CH ont déployé des assistants ou modules de génération de contenu à l'échelle (vs 21% en 2024, +31 points), tandis que les pilotes reculent de 28 points, signe que la phase exploratoire cède la place à une adoption opérationnelle. 62% des dirigeants se déclarent désormais bons à très bons sur les concepts IA (vs 37% en 2024, +25 points). 62% jugent leur qualité de données bonne à excellente (vs 48%, +14 points). Mais 70% identifient encore la culture et l'organisation comme principal frein, pas la technique. 58% reconnaissent une mesure du ROI IA basique ou inexistante (vs 74%, -16 points), preuve que la maturité financière progresse moins vite que la maturité technique. 35% seulement intègrent l'IA au plan stratégique long-terme. 77% des usages restent concentrés sur le client et le marketing, 33% touchent les fonctions support. 80% des entreprises avec données imparfaites tirent quand même un avantage tangible de l'IA. 64% ambitionnent de suivre l'AI Act européen (vs 56%). Légère avance pour le secteur des services financiers et assurances. Constat éditorial : aucune différence significative entre secteurs sur la capacité de l'IA à résoudre des problèmes complexes, ce qui montre que la maturité interne et les compétences sont les véritables moteurs.","en":"Reference longitudinal study conducted between January and April 2025 by Colombus Consulting, Oracle and the Geneva School of Business Administration (HEG) on a panel of over 100 Swiss organizations (all sectors, all sizes, national geographic coverage). Methodology identically reproduced from the 2024 edition to enable rigorous measurement of 12-month evolution. This is the only CH source measuring the real organizational maturity of AI adoption in companies, complementary to sources on substitution effects (KOF/ETH) and AI job creation (HSLU). Structuring results: 52% of Swiss companies have deployed AI assistants or content generation modules at scale (vs 21% in 2024, +31pp), while pilots dropped 28pp, sign that the exploratory phase is giving way to operational adoption. 62% of executives now declare themselves good to very good on AI concepts (vs 37% in 2024, +25pp). 62% rate their data quality as good to excellent (vs 48%, +14pp). But 70% still identify culture and organization as the main barrier, not technique. 58% acknowledge a basic or nonexistent AI ROI measure (vs 74%, -16pp), evidence that financial maturity progresses slower than technical maturity. Only 35% integrate AI into the long-term strategic plan. 77% of uses remain concentrated on customer and marketing, 33% touch support functions. 80% of companies with imperfect data still derive a tangible advantage from AI. 64% aim to follow the European AI Act (vs 56%). Slight lead for the financial services and insurance sector. Editorial finding: no significant difference between sectors in AI's ability to solve complex problems, showing that internal maturity and skills are the real drivers."},"url":"https://www.colombus-consulting.com/en/observatoire-data-ia-en-suisse-2025/","ai_type":"generative"},{"date":"2026-03-15","source":"OpinionWay pour Kelio · Baromètre IA et RH 2026 · 3e vague","country":"FR","title":{"fr":"Baromètre IA et RH 2026 · 33% des DRH français utilisent l'IA · 42% des actifs se sentent menacés","en":"AI and HR Barometer 2026 · 33% of French HR Leaders Use AI · 42% of Workers Feel Threatened"},"excerpt":{"fr":"Étude OpinionWay pour Kelio publiée en mars 2026 (3e vague longitudinale, ISO 20252). Double échantillon représentatif : 306 DRH d'entreprises privées de 20 salariés et plus, et 1 071 Français représentatifs. Source FR la plus complète sur la perception croisée IA-RH-grand public. Résultats DRH : 33% utilisent l'IA dans leurs fonctions RH (vs 24% en 2025, 9% en 2024, soit +24 points en 2 ans). 42% utilisent ou aimeraient utiliser, mais seulement 6% en usage important. Adoption fortement corrélée à la taille : 22% pour les entreprises de 20 à 49 salariés, 44% pour 250 et plus, 9% dans la construction. Freins principaux : confidentialité 39%, incompatibilité 19%, manque de formation 17%. Confiance DRH dans la qualité de l'IA : 47% (stable depuis 2024). Confiance dans le recrutement : seulement 4% (le recrutement doit rester humain pour 51% des DRH). Résultats actifs : 42% se sentent menacés à long terme, dont 30% plutôt menacés et 12% très menacés. Écart de perception majeur DRH/équipes : 22% des DRH se sentent menacés vs 42% des actifs.","en":"OpinionWay study for Kelio published in March 2026 (3rd longitudinal wave, ISO 20252). Dual representative sample: 306 HR directors from private companies with 20+ employees, and 1,071 representative French citizens. Most complete FR source on cross-perception AI-HR-general public. HR results: 33% use AI in their HR functions (vs 24% in 2025, 9% in 2024, i.e. +24pp in 2 years). 42% use or would like to use, but only 6% in significant use. Adoption strongly correlated with size: 22% for 20-49 employee companies, 44% for 250+, 9% in construction. Main barriers: confidentiality 39%, incompatibility 19%, lack of training 17%. HR confidence in AI quality: 47% (stable since 2024). Confidence in recruitment: only 4% (recruitment must remain human for 51% of HR). Worker results: 42% feel threatened long-term, of which 30% rather threatened and 12% very threatened. Major DRH/teams perception gap: 22% of HR feel threatened vs 42% of workers."},"url":"https://www.kelio.com/fr/blog/barometre-ia-rh-2026","ai_type":"generative"},{"date":"2026-04-15","source":"Assemblée nationale · Commission des affaires sociales · Table ronde RH-IA","country":"FR","title":{"fr":"Table ronde IA et GRH · Ferguson, Goulard, Lamri · clivage 30%/70% shadow IA · sens du travail","en":"AI and HRM Round Table · Ferguson, Goulard, Lamri · 30%/70% Shadow AI Divide · Meaning at Work"},"excerpt":{"fr":"Table ronde de la Commission des affaires sociales de l'Assemblée nationale (15 avril 2026). Trois intervenants : Yann Ferguson (LaborIA, Inria), Enora Goulard (Ascend Partners, cabinet RH), Jérémy Lamri (Lab-RH, docteur en psychologie). Trois apports majeurs. (1) Clivage shadow IA : environ 30% des salariés combinent usage officiel et shadow IA (profils agentifs qui percutent et adoptent naturellement), environ 70% restent bloqués dans un réflexe Google sans usage formé. Ce clivage est corrélé à l'agentivité, pas à l'âge · observation contre-intuitive face aux idées reçues sur les générations. (2) Sens du travail : les compétences 4C (créativité, communication, coopération, esprit critique) deviennent le différenciateur structurel. (3) Cadre transversal : la transformation IA est un défi managérial avant d'être technologique. Implication directe pour les directions RH : la formation à l'IA n'est pas un sujet outillage mais un sujet d'équipement cognitif des équipes pour qu'elles puissent développer une posture critique face aux outputs IA.","en":"Round table of the Social Affairs Committee of the French National Assembly (15 April 2026). Three speakers: Yann Ferguson (LaborIA, Inria), Enora Goulard (Ascend Partners, HR consultancy), Jérémy Lamri (Lab-RH, PhD in psychology). Three major contributions. (1) Shadow AI divide: approximately 30% of employees combine official use and shadow AI (agentic profiles who push through and adopt naturally), approximately 70% remain stuck in a Google reflex without trained use. This divide is correlated with agency, not age · counter-intuitive observation against prevailing ideas on generations. (2) Meaning at work: 4C skills (creativity, communication, cooperation, critical thinking) become the structural differentiator. (3) Cross-cutting framework: AI transformation is a managerial challenge before being a technological one. Direct implication for HR leadership: AI training is not a tooling subject but a cognitive equipment subject for teams to develop a critical posture toward AI outputs."},"url":"https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/cion-soc/l17cion-soc2526017","ai_type":"generative"},{"date":"2025-04-15","source":"Assemblée nationale · Commission des affaires sociales · Audition économistes","country":"FR","title":{"fr":"Audition Marquier/Bunel/Baquero · cadre 2 forces IA · risque effet ciseaux finances publiques","en":"Marquier/Bunel/Baquero Hearing · 2-Force AI Framework · Public Finance Scissors Risk"},"excerpt":{"fr":"Audition de la Commission des affaires sociales de l'Assemblée nationale (avril 2025) avec trois économistes : Axelle Marquier (INSEE/ENS), Simon Bunel (INC/ENS), Lor Baquero (UNEDIC). Cadre analytique structurant en 2 forces : automatisation (la machine substitue l'humain sur des tâches cognitives complexes · rupture nette par rapport aux vagues précédentes) et émergence de nouveaux métiers (destruction créatrice schumpétérienne). Constat clé : aucun consensus chiffré entre économistes (Acemoglu Nobel 2024 estime ~5% d'impact net, OCDE 27% emplois à risque élevé en France, FMI 60% emplois exposés en définition large, Goldman Sachs 17-30%). Apport majeur de Marquier : risque d'effet ciseaux sur les finances publiques françaises. Le modèle social français est financé sur les cotisations salariales, en particulier sur les hauts salaires. Si les emplois les mieux rémunérés (cadres) disparaissent même temporairement (2-5 ans de transition), l'État subit une double pression : hausse simultanée des dépenses indemnisation chômage et baisse des recettes hauts salaires. Cadre directement actionnable pour les politiques publiques 2026-2030.","en":"Hearing of the Social Affairs Committee of the French National Assembly (April 2025) with three economists: Axelle Marquier (INSEE/ENS), Simon Bunel (INC/ENS), Lor Baquero (UNEDIC). Structuring analytical framework with 2 forces: automation (machine substitutes human on complex cognitive tasks · clear break from previous waves) and emergence of new occupations (Schumpeterian creative destruction). Key finding: no quantified consensus among economists (Acemoglu Nobel 2024 estimates ~5% net impact, OECD 27% high-risk jobs in France, IMF 60% exposed jobs in broad definition, Goldman Sachs 17-30%). Marquier's major contribution: scissors-effect risk on French public finances. The French social model is financed on wage contributions, particularly on high salaries. If best-paid jobs (executives) disappear even temporarily (2-5 years transition), the State faces double pressure: simultaneous rise in unemployment benefits expenses and fall in high-salary revenues. Framework directly actionable for 2026-2030 public policies."},"url":"https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/cion-soc","ai_type":"generative"},{"date":"2026-04-08","source":"Coface · Observatoire des Métiers · Arquié, Duthoit, Subileau","country":"FR","title":{"fr":"Coface/OEM · 3,8% des emplois français exposés aujourd'hui · 16,3% à 2-5 ans · 5 millions d'emplois menacés","en":"Coface/OEM · 3.8% of French Jobs Exposed Today · 16.3% in 2-5 Years · 5 Million Jobs Threatened"},"excerpt":{"fr":"Rapport Coface (assureur-crédit français) en partenariat avec l'Observatoire des Métiers : « Emplois, compétences, valeur : ce que l'IA est en train de bouleverser » (avril 2026). Auteurs : Axelle Arquié (Centre d'études prospectives et d'informations internationales), Aurélien Duthoit (Coface), Pierre Subileau. Méthodologie task-based la plus rigoureuse disponible sur la France : 923 professions, 12 pays comparés, décomposition en actions élémentaires reproductible. Deux horizons documentés : aujourd'hui 3,8% des emplois français significativement exposés, à 2-5 ans 16,3% (passage à l'IA agentique), soit environ 5 millions d'emplois menacés en France. Spécificité française : l'IA agentique cible le haut de l'échelle salariale (top 10%), à la différence des vagues d'automatisation précédentes qui touchaient les bas salaires. France à 1/3 de l'intensité IA américaine selon les chiffres comparables (St. Louis Fed Bick/Blandin/Deming, mars 2026). Cadre quantitatif central pour la décision RH 2026-2030 en France.","en":"Coface report (French credit insurer) in partnership with the Observatoire des Métiers: 'Jobs, skills, value: what AI is disrupting' (April 2026). Authors: Axelle Arquié (Centre for Prospective Studies and International Information), Aurélien Duthoit (Coface), Pierre Subileau. Most rigorous task-based methodology available on France: 923 occupations, 12 compared countries, reproducible elementary action decomposition. Two documented horizons: today 3.8% of French jobs significantly exposed, at 2-5 years 16.3% (transition to agentic AI), i.e. approximately 5 million jobs threatened in France. French specificity: agentic AI targets the top of the salary scale (top 10%), unlike previous automation waves that hit low salaries. France at 1/3 of US AI intensity per comparable figures (St. Louis Fed Bick/Blandin/Deming, March 2026). Central quantitative framework for 2026-2030 HR decisions in France."},"url":"https://www.coface.com/news-publications/business-risk-dashboard/emplois-competences-valeur-ce-que-l-ia-est-en-train-de-bouleverser","ai_type":"generative"},{"date":"2026-04-14","source":"Alex Imas · Chicago Booth · Substack Ghosts of Electricity","country":"INT","title":{"fr":"What will be scarce? · économie post-commodité · secteur relationnel et prime d'exclusivité humaine","en":"What Will Be Scarce? · Post-Commodity Economics · Relational Sector and Human Exclusivity Premium"},"excerpt":{"fr":"Article majeur d'Alex Imas (Chicago Booth, économiste comportemental) publié sur Substack le 14 avril 2026. S'appuie sur l'économie du changement structurel (Comin, Lashkari et Mestieri, Econometrica 2021). Thèse centrale : quand l'IA automatise la production de biens standardisés (commodités), les prix baissent et les revenus réels des ménages augmentent. Ces ménages réorientent leur consommation vers des biens et services à élasticité-revenu supérieure à 1, c'est-à-dire des biens dont la part dans la dépense croît avec le revenu. Or ces biens sont massivement non automatisables : expérience humaine personnalisée, accompagnement long, performance live, soin, éducation directe, hospitalité haut de gamme, artisanat. Conclusion : la rareté ne disparaît pas avec l'IA, elle se déplace de la production de commodités vers la production d'exclusivité humaine. Cadre théorique direct pour comprendre pourquoi le luxe, le conseil patrimonial, l'enseignement direct et le soin résistent structurellement à l'automatisation. Convergent avec Trammell (Stanford 2026) sur la persistance de la part travail.","en":"Major article by Alex Imas (Chicago Booth, behavioral economist) published on Substack on 14 April 2026. Based on the economics of structural change (Comin, Lashkari and Mestieri, Econometrica 2021). Central thesis: when AI automates production of standardized goods (commodities), prices fall and household real incomes rise. These households reorient consumption toward goods and services with income elasticity greater than 1, i.e. goods whose share in spending grows with income. Yet these goods are massively non-automatable: personalized human experience, long-form accompaniment, live performance, care, direct education, premium hospitality, craft. Conclusion: scarcity does not disappear with AI, it shifts from commodity production to human exclusivity production. Direct theoretical framework to understand why luxury, wealth advisory, direct teaching and care structurally resist automation. Converges with Trammell (Stanford 2026) on the persistence of the labor share."},"url":"https://aimas.substack.com/p/what-will-be-scarce","ai_type":"generative"},{"date":"2025-06-15","source":"PwC · AI Jobs Barometer 2025 · France","country":"FR","title":{"fr":"PwC AI Jobs Barometer 2025 · France numéro 1 en Europe · +273% d'offres IA · prime salariale +56%","en":"PwC AI Jobs Barometer 2025 · France Number 1 in Europe · +273% AI Job Listings · +56% Salary Premium"},"excerpt":{"fr":"Baromètre annuel PwC sur les emplois IA en France (juin 2025). La France ressort en première position européenne sur la dynamique de création d'emplois IA. 166 000 offres d'emploi liées à l'IA recensées en France en 2025. Croissance impressionnante : +273% d'offres IA depuis 2022 (sortie publique de ChatGPT). Prime salariale documentée : +56% d'écart entre les emplois exigeant des compétences IA et leurs équivalents sans IA, écart le plus élevé d'Europe. Cette dynamique positive coexiste avec les chiffres Coface/OEM 2026 sur l'exposition (3,8% à 16,3%) : la France crée massivement des emplois IA spécialisés tandis qu'elle voit certains métiers exposés se transformer. Confirme empiriquement le cadre des 2 forces présenté par Marquier/Bunel/Baquero devant l'Assemblée nationale (avril 2025).","en":"PwC annual barometer on AI jobs in France (June 2025). France ranks first in Europe on AI job creation dynamics. 166,000 AI-related job listings recorded in France in 2025. Impressive growth: +273% AI listings since 2022 (public release of ChatGPT). Documented salary premium: +56% gap between jobs requiring AI skills and their non-AI equivalents, the highest gap in Europe. This positive dynamic coexists with Coface/OEM 2026 exposure figures (3.8% to 16.3%): France massively creates specialized AI jobs while seeing certain exposed occupations transform. Empirically confirms the 2-force framework presented by Marquier/Bunel/Baquero to the National Assembly (April 2025)."},"url":"https://www.pwc.com/gx/en/issues/artificial-intelligence/ai-jobs-barometer.html","ai_type":"generative"},{"date":"2025-09-15","source":"LinkedIn · AI Report France 2025","country":"FR","title":{"fr":"LinkedIn AI Report France 2025 · 42% des emplois protégés · 33% profondément transformés · 523 milliards de dollars de capacité libérable","en":"LinkedIn AI Report France 2025 · 42% of Jobs Protected · 33% Deeply Transformed · 523 Billion Dollars of Releasable Capacity"},"excerpt":{"fr":"Rapport LinkedIn « L'IA en France : moteur de transformation des compétences » (septembre 2025). Cartographie de référence sur le marché du travail français. Trois chiffres clés. (1) 42% des emplois français sont structurellement protégés des effets de l'IA (peu d'exposition technique des tâches centrales). (2) 33% des emplois seront profondément transformés (recomposition substantielle des fiches de poste sans disparition). (3) 523 milliards de dollars de capacité productive libérable d'ici 2030 si l'adoption IA atteint le scénario médian. Cadre quantitatif positif qui complète les chiffres Coface/OEM (16,3% emplois exposés à 2-5 ans) en montrant le contrepoids structurel : la transformation génère une capacité productive nouvelle qui peut être réinvestie dans des activités à forte valeur. Implication directe pour les directions RH : l'arbitrage 2026-2030 n'est pas entre cuts ou augmentation, mais entre transformation gérée ou transformation subie.","en":"LinkedIn report 'AI in France: Driver of Skills Transformation' (September 2025). Reference cartography on the French labor market. Three key figures. (1) 42% of French jobs are structurally protected from AI effects (low technical exposure of core tasks). (2) 33% of jobs will be deeply transformed (substantial recomposition of job descriptions without disappearance). (3) 523 billion dollars of productive capacity releasable by 2030 if AI adoption reaches the median scenario. Positive quantitative framework that complements Coface/OEM figures (16.3% exposed jobs at 2-5 years) by showing the structural counterweight: transformation generates new productive capacity that can be reinvested in high-value activities. Direct implication for HR leadership: the 2026-2030 arbitrage is not between cuts or augmentation, but between managed transformation or suffered transformation."},"url":"https://economicgraph.linkedin.com/research/ai-report-france-2025","ai_type":"generative"},{"date":"2025-10-15","source":"KOF Institut · ETH Zurich · Kläui & Siegenthaler · Étude #186","country":"CH","title":{"fr":"Première étude académique rigoureuse mesurant empiriquement l'impact de l'IA sur le marché du travail suisse · +27% chômage et −38% offres dans les métiers très exposés","en":"First Rigorous Academic Study Empirically Measuring AI's Impact on the Swiss Labor Market · +27% Unemployment and −38% Job Listings in Highly Exposed Occupations"},"excerpt":{"fr":"Étude #186 du KOF Institut de l'ETH Zurich, financée par le Fonds national suisse de la recherche (projet 100018-232103). Méthodologie Difference-in-Differences (event-study, régression de Poisson) sur deux sources : registre chômage SECO par profession ISCO-19 (4-Steller) septembre 2010 - août 2025, et insertions d'emploi en ligne x28 AG septembre 2016 - août 2025. Mesure d'exposition β d'Eloundou et al. 2024 appliquée pour la première fois à la nomenclature ISCO-08 suisse, complétée par l'Anthropic Economic Index basé sur l'usage réel observé sur Claude.ai. Résultats : +27% de chômeurs dans les métiers très exposés vs peu exposés (population <50 ans, septembre 2024 - août 2025), −38% d'offres d'emploi dans les métiers très exposés (60-70% du niveau pré-LLM), doublement du chômage chez les <50 ans dans les métiers fortement exposés depuis novembre 2022 (sortie ChatGPT). Effets particulièrement marqués chez les programmeurs d'applications, développeurs logiciels, analystes système (presque doublement), recruteurs, journalistes, marketing. Les jeunes 20-49 ans sont 2× plus impactés que les 50-65 ans. Top 10 métiers exposés (β-Eloundou) : programmeurs applications 0,94 ; DBA développeurs base de données 0,91 ; développeurs web/multimédia 0,88 ; développeurs logiciels 0,87 ; bureau de la paie 0,84 ; comptables non académiques 0,78 ; bureau de la comptabilité 0,78 ; webmasters 0,77 ; auteurs 0,75 ; administrateurs systèmes 0,70. La KOF souligne que cette analyse isole les effets de substitution directe dans les métiers fortement exposés (les perdants potentiels) et ne quantifie pas les effets agrégés d'augmentation, de réallocation ou les nouveaux emplois créés. Sur la même période, l'emploi total CH a augmenté de +7,4%. Les deux lectures sont complémentaires.","en":"Study #186 from KOF Institute, ETH Zurich, funded by the Swiss National Science Foundation (project 100018-232103). Difference-in-Differences methodology (event-study, Poisson regression) on two sources: SECO unemployment registry by occupation ISCO-19 (4-Steller) September 2010 - August 2025, and x28 AG online job listings September 2016 - August 2025. Exposure measure β from Eloundou et al. 2024 applied for the first time to the Swiss ISCO-08 nomenclature, complemented by the Anthropic Economic Index based on real usage observed on Claude.ai. Results: +27% unemployed in highly exposed occupations vs lightly exposed (population <50 years, September 2024 - August 2025), −38% job listings in highly exposed occupations (60-70% of pre-LLM level), doubling of unemployment among <50 years in highly exposed occupations since November 2022 (ChatGPT release). Effects particularly marked for application programmers, software developers, system analysts (near doubling), recruiters, journalists, marketing. Young people 20-49 are 2× more impacted than 50-65. Top 10 exposed occupations (β-Eloundou): application programmers 0.94; DBA database developers 0.91; web/multimedia developers 0.88; software developers 0.87; payroll office 0.84; non-academic accountants 0.78; accounting office 0.78; webmasters 0.77; authors 0.75; system administrators 0.70. KOF emphasizes this analysis isolates direct substitution effects in highly exposed occupations (potential losers) and does not quantify aggregate augmentation, reallocation effects, or newly created jobs. Over the same period, Swiss total employment grew +7.4%. The two readings are complementary."},"url":"https://kof.ethz.ch/en/forecasts-and-indicators/studies/kof-studien.html","ai_type":"generative"},{"date":"2025-09-15","source":"HSLU · Hochschule Luzern Applied AI Center · Swiss AI Jobs Report 2025","country":"CH","title":{"fr":"Swiss AI Jobs Report 2025 · 4 703 annonces IA analysées · +400 offres par mois · Zurich concentre 37% des emplois IA suisses","en":"Swiss AI Jobs Report 2025 · 4,703 AI Job Listings Analyzed · +400 Listings per Month · Zurich Concentrates 37% of Swiss AI Jobs"},"excerpt":{"fr":"Premier baromètre académique de la création d'emplois IA en Suisse. Applied AI Center de la Hochschule Luzern (HSLU) en partenariat avec x28 AG et la Local AI Community LAC. Analyse de 4 703 annonces d'emploi IA publiées entre juillet 2024 et juin 2025. Demande de talents IA en explosion : plus de 400 offres IA par mois depuis début 2025, sélection rigoureuse en 2 à 4 rounds avec études de cas techniques, master ou doctorat souvent requis pour Data Scientist, centaines de candidatures par poste avec fermeture en une semaine. Concentration géographique forte : Zurich 1 773 postes (37%), Genève 536 (11%), Berne 512 (11%), Bâle-Ville 448 (10%), Vaud 281 (6%), Zoug 229 (5%). Top secteurs (>60% des offres IA dans 5 secteurs) : informatique 1 205, finance 552, recherche et éducation 435, pharma et chimie 298, conseil 296, assurances 252. Compétences les plus demandées : Data Engineering, Data Science, Machine Learning, analyse de données, Cloud Computing, Software Engineering, NLP. Cette étude documente le contrepoids structurel positif aux effets de substitution mesurés par la KOF : la Suisse crée des emplois IA spécialisés à un rythme soutenu, principalement concentrés dans les hubs urbains et les secteurs du tertiaire avancé.","en":"First academic barometer of AI job creation in Switzerland. Applied AI Center of Hochschule Luzern (HSLU) in partnership with x28 AG and Local AI Community LAC. Analysis of 4,703 AI job listings published between July 2024 and June 2025. AI talent demand exploding: over 400 AI job listings per month since early 2025, rigorous selection in 2-4 rounds with technical case studies, master's or PhD often required for Data Scientist, hundreds of applications per role with closing within one week. Strong geographic concentration: Zurich 1,773 positions (37%), Geneva 536 (11%), Bern 512 (11%), Basel-City 448 (10%), Vaud 281 (6%), Zug 229 (5%). Top sectors (>60% of AI listings in 5 sectors): IT 1,205, finance 552, research and education 435, pharma and chemistry 298, consulting 296, insurance 252. Most demanded skills: Data Engineering, Data Science, Machine Learning, data analysis, Cloud Computing, Software Engineering, NLP. This study documents the structural positive counterweight to substitution effects measured by KOF: Switzerland creates specialized AI jobs at a sustained pace, primarily concentrated in urban hubs and advanced tertiary sectors."},"url":"https://www.hslu.ch/en/lucerne-school-of-information-technology/research/applied-ai/swiss-ai-jobs-report/","ai_type":"generative"},{"date":"2026-03-25","source":"BNS · Banque nationale suisse · enquête conjoncturelle trimestrielle Q1 2026","country":"CH","title":{"fr":"BNS Q1 2026 · 1 entreprise sur 5 a déjà besoin de moins de personnel à cause de l'IA · vision slow-burn","en":"SNB Q1 2026 · 1 in 5 Companies Already Need Less Staff Due to AI · Slow-Burn Vision"},"excerpt":{"fr":"Enquête conjoncturelle trimestrielle de la Banque nationale suisse publiée au Q1 2026, relayée par Bloomberg et SWI swissinfo le 25 mars 2026. Échantillon n=241 entreprises suisses. Constat : seules 1/5 des entreprises (20%) déclarent avoir besoin de moins de personnel à cause de l'IA, les changements sont typiquement légers, vision slow-burn avec un effet progressif anticipé sur les années à venir. La BNS identifie cinq secteurs et fonctions principalement affectés : cabinets de conseil, développement logiciel, fonctions support, ressources humaines et comptabilité, départements juridiques et services de traduction. Dans certains cas, les services marketing peuvent aussi être assurés par moins de personnel. Convergence forte avec les conclusions KOF/ETH (programmeurs, fonctions support, marketing). Lecture officielle de l'institution monétaire suisse : effet réel mais mesuré, pas de désorganisation systémique. À mettre en regard de l'étude AXA/Sotomo 2025 sur les PME (ratio 5 postes créés pour 1 supprimé) et de l'étude KOF/ETH (effets distributionnels significatifs sur les métiers très exposés).","en":"Quarterly business cycle survey from the Swiss National Bank published in Q1 2026, relayed by Bloomberg and SWI swissinfo on 25 March 2026. Sample n=241 Swiss companies. Finding: only 1/5 companies (20%) declare needing less staff due to AI, changes are typically light, slow-burn vision with progressive effect anticipated over coming years. SNB identifies five sectors and functions primarily affected: consulting firms, software development, support functions, human resources and accounting, legal departments and translation services. In some cases, marketing services can also be provided by fewer staff. Strong convergence with KOF/ETH conclusions (programmers, support functions, marketing). Official reading from the Swiss monetary institution: real but measured effect, no systemic disruption. To be set against the AXA/Sotomo 2025 SME study (ratio 5 jobs created for 1 cut) and the KOF/ETH study (significant distributional effects on highly exposed occupations)."},"url":"https://www.snb.ch/en/services-events/news/economic-news","ai_type":"generative"},{"date":"2026-05-01","source":"SWI swissinfo · Leutenegger / Sturm KOF + Deloitte CH + Kirchschläger UNIL","country":"CH","title":{"fr":"L'IA va-t-elle sécuriser ou ébranler la prospérité suisse ? · pénurie de 300 000 travailleurs d'ici 2050","en":"Will AI Secure or Shake Swiss Prosperity? · Shortage of 300,000 Workers by 2050"},"excerpt":{"fr":"Article de fond de SWI swissinfo (Marc Leutenegger, mai 2026) intégrant trois voix d'autorité suisses sur l'avenir de l'IA. Jan-Egbert Sturm (directeur KOF/ETH Zurich depuis 2005) identifie quatre risques majeurs pour la Suisse : vieillissement de la population, changement climatique, déglobalisation, intelligence artificielle. L'IA est le seul de ces quatre risques qui est aussi une opportunité. Les gains de productivité de l'IA pourraient atténuer les effets négatifs des trois autres tendances. Étude Deloitte CH : pénurie de 300 000 travailleurs d'ici 2050, productivité requise +1,2% par an (soit 4× le rythme actuel). Dans ce contexte, l'IA n'est pas une menace mais un outil nécessaire. Peter G. Kirchschläger (éthicien, Université de Lucerne) propose une vision pessimiste : 50-70% des emplois pourraient disparaître, avec une proposition de Revenu de Base Inconditionnel financé par taxe IA et data. Marc Beierschoder (Deloitte CH) propose une vision modérée : WEF Future of Jobs 2025 prévoit 92M emplois perdus mais 170M créés mondialement d'ici 2030, soit un solde net de +78M. Cadre de référence pour le débat suisse 2026.","en":"Major SWI swissinfo article (Marc Leutenegger, May 2026) integrating three authoritative Swiss voices on the future of AI. Jan-Egbert Sturm (KOF/ETH Zurich director since 2005) identifies four major risks for Switzerland: population aging, climate change, deglobalization, artificial intelligence. AI is the only of these four risks that is also an opportunity. AI productivity gains could mitigate negative effects of the other three trends. Deloitte CH study: shortage of 300,000 workers by 2050, required productivity +1.2% per year (i.e. 4× current pace). In this context, AI is not a threat but a necessary tool. Peter G. Kirchschläger (ethicist, University of Lucerne) offers a pessimistic vision: 50-70% of jobs could disappear, with proposal of Universal Basic Income funded by AI and data tax. Marc Beierschoder (Deloitte CH) offers moderate vision: WEF Future of Jobs 2025 forecasts 92M jobs lost but 170M created globally by 2030, net balance of +78M. Reference framework for the 2026 Swiss debate."},"url":"https://www.swissinfo.ch/eng/business/will-ai-secure-or-shake-swiss-prosperity/","ai_type":"generative"},{"date":"2026-04-03","source":"Boston Consulting Group · BCG Henderson Institute","country":"INT","title":{"fr":"L'IA va remodeler plus d'emplois qu'elle n'en remplacera · cartographie en 6 segments AI Labor Disruption","en":"AI Will Reshape More Jobs Than It Replaces · 6-Segment AI Labor Disruption Mapping"},"excerpt":{"fr":"Étude microéconomique majeure de BCG sur 1 500 rôles Revelio Labs représentant 165 millions d'emplois US. Cadre quantitatif décisif pour les directions RH : 50% à 55% des emplois US seront remodelés par l'IA en 2 à 3 ans, mais seulement 10% à 15% éliminés en 4 à 5 ans. Six segments AI Labor Disruption : Amplified 5%, Rebalanced 14%, Divergent 12%, Substituted 12%, Enabled 23%, Limited-Exposure 34%. Le cadre articule trois forces : potentiel d'automatisation des tâches (rubrique en 5 critères), substitution vs augmentation (jugement humain et structure du processus), et expansibilité de la demande (loi de Jevons appliquée au travail). Alerte centrale sur la coupe des effectifs entry-level qui détruit le pipeline de talent senior. Quatre impératifs CEO : intégrer la stratégie workforce dans la stratégie compétitive, recentrer l'automatisation sur la refonte plutôt que la coupe, mettre upskilling/reskilling au cœur, anticiper le décalage temporel entre potentiel et adoption.","en":"Major BCG microeconomic study on 1,500 Revelio Labs roles representing 165 million US jobs. Decisive quantitative framework for HR leadership: 50% to 55% of US jobs will be reshaped by AI in 2 to 3 years, but only 10% to 15% eliminated in 4 to 5 years. Six AI Labor Disruption segments: Amplified 5%, Rebalanced 14%, Divergent 12%, Substituted 12%, Enabled 23%, Limited-Exposure 34%. The framework articulates three forces: task automation potential (5-criteria rubric), substitution vs augmentation (human judgment and process structure), and demand expandability (Jevons paradox applied to labor). Central warning on entry-level cuts destroying senior talent pipeline. Four CEO imperatives: embed workforce strategy in competitive strategy, refocus automation on redesign rather than cuts, place upskilling/reskilling at core, anticipate the temporal gap between potential and adoption."},"url":"https://www.bcg.com/publications/2026/ai-will-reshape-more-jobs-than-it-replaces","ai_type":"generative"},{"date":"2026-02-02","source":"AISI · UK AI Security Institute · Future of Work Unit","country":"INT","title":{"fr":"Mesure expérimentale des gains de productivité IA sur les tâches professionnelles · étude RCT sur taxonomie O*NET","en":"Measuring AI-Driven Productivity Gains for Workplace Tasks · RCT Study on O*NET Taxonomy"},"excerpt":{"fr":"Première étude RCT (essai contrôlé randomisé) du UK AI Security Institute sur 500 participants représentatifs de la population active britannique. Méthodologie originale : utilisation des Generalised Work Activities du référentiel O*NET (4 catégories : Information Input, Work Output, Interacting with Others, Mental Processes) avec 4 tâches expérimentales conçues pour transcender les domaines métier. Résultats moyens : +25% de qualité (score), +61% de points par minute, mais aucune différence statistiquement significative sur le temps total. La variance par tâche est critique : Task 4 (interpréter le sens d'une information) +102% productivité, Task 3 (planification et priorisation stratégique) aucun gain significatif. Met en évidence les capacités jagged des systèmes IA : excellents sur l'analyse synthétique structurée, encore en retrait sur les outputs ouverts et stratégiques. Cadre méthodologique de référence pour la nouvelle UK AI and the Future of Work Unit lancée fin 2025.","en":"First RCT (randomized controlled trial) study from the UK AI Security Institute on 500 participants representative of the British workforce. Original methodology: using O*NET Generalised Work Activities (4 categories: Information Input, Work Output, Interacting with Others, Mental Processes) with 4 experimental tasks designed to transcend professional domains. Average results: +25% quality (score), +61% points per minute, but no statistically significant difference on total time. Variance by task is critical: Task 4 (interpreting information meaning) +102% productivity, Task 3 (strategic planning and prioritization) no significant gain. Highlights the jagged capabilities of AI systems: excellent on structured synthetic analysis, still lagging on open-ended and strategic outputs. Reference methodological framework for the new UK AI and the Future of Work Unit launched late 2025."},"url":"https://www.aisi.gov.uk/blog/ai-and-the-future-of-work-measuring-ai-driven-productivity-gains-for-workplace-tasks","ai_type":"generative"},{"date":"2025-02-11","source":"Labo Société Numérique · ANCT · gouvernement français","country":"FR","title":{"fr":"Dossie
