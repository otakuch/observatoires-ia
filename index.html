ois facteurs pèsent : autonomie du travailleur, régulation institutionnelle (radiologie, thérapie), et effets de second ordre sur la demande. Citation centrale de David Autor (2003) : les technologies remplacent les exécutants de specs, complémentent les définisseurs.","en":"Major methodological critique: the seven task-based exposure measures (Eloundou OpenAI, Anthropic Economic Index, AIOE, Yale Budget Lab, etc.) agree on low-exposure jobs but diverge sharply on the most exposed. Beyond technical capability, three factors matter: worker autonomy, institutional regulation (radiology, therapy), and second-order demand effects. Central citation from David Autor (2003): technologies replace those who execute specs, complement those who define them."},"url":"https://www.ft.com/content/f55c4eba-6e10-4283-8eae-e9f475048b37","ai_type":"generative"},{"date":"2026-02-19","source":"Yale Budget Lab · Gimbel, Kendall, Kulsakdinun","country":"INT","title":{"fr":"L'exposition à l'IA sur le marché du travail : que sait-on vraiment ?","en":"Labor Market AI Exposure: What Do We Know?"},"excerpt":{"fr":"Étude systématique comparant 7 métriques d'exposition à l'IA (Eloundou OpenAI, Felten AIOE, Webb, Eisfeldt, Tomlinson Microsoft Copilot, etc.) sur 867 métiers SOC 2018. Conclusion en trois points : les métriques s'accordent largement, mais elles divergent davantage sur les métiers fortement exposés. Le désaccord porte sur l'ampleur de l'exposition, pas sur le fait qu'un métier soit exposé. L'exposition n'indique pas qu'un métier sera automatisé, seulement qu'il pourrait être impacté. Exemples canoniques : les plombiers ont une variance de 0,03 (consensus total sur faible exposition), les programmeurs informatiques ont 0,48 (désaccord majeur sur l'ampleur). Données ouvertes téléchargeables.","en":"Systematic study comparing 7 AI exposure metrics (Eloundou OpenAI, Felten AIOE, Webb, Eisfeldt, Tomlinson Microsoft Copilot, etc.) across 867 SOC 2018 occupations. Three key takeaways: metrics broadly agree, but disagree more on highly exposed occupations. Disagreement is about magnitude, not whether an occupation is exposed. Exposure does not indicate which jobs AI will automate, only where AI could have an impact. Canonical examples: plumbers have variance 0.03 (full consensus on low exposure), computer programmers have 0.48 (major disagreement on magnitude). Open data downloadable."},"url":"https://budgetlab.yale.edu/research/labor-market-ai-exposure-what-do-we-know","ai_type":"generative"},{"date":"2025-11-20","source":"Gartner · Hung LeHong","country":"INT","title":{"fr":"Coûts GenAI : les organisations sous-estiment de 500% à 1000% le coût total réel","en":"GenAI costs: organizations underestimate true total cost by 500% to 1000%"},"excerpt":{"fr":"Mesure structurante : les organisations qui ne maîtrisent pas la mise à l'échelle de leurs coûts GenAI font des erreurs de calcul de l'ordre de 500% à 1000%. 72% des CIO interrogés rapportent que leur organisation a fait du break-even ou perdu de l'argent sur ses investissements IA. La moitié des organisations abandonnent leurs efforts pour cause de dérapage des coûts. Ces erreurs ne portent pas sur le prix du token mais sur la combinaison consommation × intégration × gouvernance × supervision humaine × conformité. Recommandation Gartner : créer des proofs of concept qui testent la mise à l'échelle des coûts, pas seulement le fonctionnement de la technologie.","en":"Structural finding: organizations that don't master the scaling of their GenAI costs make calculation errors of 500% to 1000%. 72% of surveyed CIOs report their organization has broken even or lost money on AI investments. Half of organizations abandon their efforts due to cost overruns. These errors are not about token pricing but about the combination of consumption × integration × governance × human oversight × compliance. Gartner recommendation: create proofs of concept that test how costs will scale, not just how the technology works."},"url":"https://www.gartner.com/en/articles/ai-value","ai_type":"generative"},{"date":"2025-11-19","source":"Gartner · Arun Chandrasekaran","country":"INT","title":{"fr":"Les angles morts critiques de la GenAI que les CIO doivent traiter en urgence","en":"Critical GenAI Blind Spots That CIOs Must Urgently Address"},"excerpt":{"fr":"Gartner identifie en novembre 2025 dix angles morts de l'adoption GenAI, dont la dette technique générée par l'IA, le shadow AI (69% des organisations en ont des indices), le verrouillage fournisseur, et l'érosion des compétences. Prédiction marquante : d'ici 2030, 50% des entreprises feront face à des retards d'upgrades IA et/ou des coûts de maintenance croissants à cause d'une dette technique GenAI non gérée. « Le coût punitif élevé de maintenance, correction ou remplacement des artefacts générés par IA, qu'il s'agisse de code, contenu ou design, peut éroder le ROI promis par la GenAI. »","en":"Gartner identifies in November 2025 ten GenAI adoption blind spots, including AI-generated technical debt, shadow AI (69% of organizations show signs), vendor lock-in, and skills erosion. Notable prediction: by 2030, 50% of enterprises will face delayed AI upgrades and/or rising maintenance costs due to unmanaged GenAI technical debt. 'The punitively high cost of maintaining, fixing or replacing AI-generated artifacts such as code, content and design can erode GenAI's promised ROI.'"},"url":"https://www.gartner.com/en/newsroom/press-releases/2025-11-19-gartner-identifies-critical-genai-blind-spots-that-cios-must-urgently-address0","ai_type":"generative"},{"date":"2024-10-21","source":"Gartner · Mary Mesaglio & Hung LeHong","country":"INT","title":{"fr":"Erreur de calcul de coûts IA de 500% à 1000% : le risque que les CIO sous-estiment","en":"500% to 1000% AI Cost Calculation Error: The Risk CIOs Underestimate"},"excerpt":{"fr":"Source primaire de la statistique la plus citée sur les coûts cachés de l'IA. Sur la base d'une enquête Gartner de 451 leaders technologiques senior puis 300 CIO en juin-juillet 2024 : 90% des CIO déclarent que la gestion des coûts limite leur capacité à dégager de la valeur de l'IA, 72% rapportent que leur organisation a fait du break-even ou perdu de l'argent sur ses investissements IA. Citation décisive de l'analyste Hung LeHong : « si les CIO ne comprennent pas comment leurs coûts GenAI vont scaler, Gartner estime qu'ils peuvent faire une erreur de 500% à 1000% dans leurs calculs de coûts. » Cette statistique est devenue la référence pour parler des coûts cachés de l'IA en entreprise.","en":"Primary source for the most-cited statistic on AI hidden costs. Based on a Gartner survey of 451 senior tech leaders and then 300 CIOs in June-July 2024: 90% of CIOs say cost management limits their ability to extract value from AI, 72% report that their organization has broken even or lost money on AI investments. Decisive quote from analyst Hung LeHong: 'if CIOs don't understand how their GenAI costs will scale, Gartner estimates they could make a 500% to 1000% error in their cost calculations.' This statistic has become the reference for enterprise AI hidden costs."},"url":"https://www.gartner.com/en/newsroom/press-releases/2024-10-21-gartner-identifies-four-emerging-challenges-to-delivering-value-from-ai-safely-and-at-scale","ai_type":"generative"}];

let CURRENT_LANG = localStorage.getItem("obs-lang") || "fr";

function t(key) {
  const merged = {
    ...I18N[CURRENT_LANG],
    ...(window.PAGE_I18N[CURRENT_LANG] || {})
  };
  return merged[key] || key;
}

function applyI18n() {
  document.documentElement.lang = CURRENT_LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    const html = el.hasAttribute("data-i18n-html");
    const value = t(key);
    if (html) el.innerHTML = value;
    else el.textContent = value;
  });
  document.querySelectorAll(".lang-toggle span").forEach((s) => {
    s.classList.toggle("active", s.getAttribute("data-lang") === CURRENT_LANG);
  });
  // Re-render dynamic sections if the page has a hook
  if (typeof window.onLangChange === "function") window.onLangChange(CURRENT_LANG);
}

function setupLangToggle() {
  const toggle = document.getElementById("langToggle");
  if (!toggle) return;
  toggle.addEventListener("click", () => {
    CURRENT_LANG = CURRENT_LANG === "fr" ? "en" : "fr";
    localStorage.setItem("obs-lang", CURRENT_LANG);
    applyI18n();
  });
}

function setupMobileMenu() {
  const menuBtn = document.getElementById("menuBtn");
  const closeBtn = document.getElementById("closeMenu");
  const mobileMenu = document.getElementById("mobileMenu");
  if (!menuBtn || !mobileMenu) return;
  menuBtn.addEventListener("click", () => mobileMenu.classList.add("open"));
  if (closeBtn) closeBtn.addEventListener("click", () => mobileMenu.classList.remove("open"));
  mobileMenu.querySelectorAll("a").forEach((a) => {
    a.addEventListener("click", () => mobileMenu.classList.remove("open"));
  });
}

function setupReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add("visible");
    });
  }, { threshold: 0.1 });
  document.querySelectorAll(".manifesto-text, .section-title, .stat, .kpi, .card, .field-card, .country-card, .dash-title")
    .forEach((el) => {
      el.classList.add("reveal");
      observer.observe(el);
    });
}

// ============================================================================
// BRIEF ACTIONS · PDF preview, send by email, copy link
// Initialized only on briefing pages (where #brief-actions exists)
// ============================================================================
function setupBriefActions() {
  const actionsBar = document.getElementById("brief-actions");
  if (!actionsBar) return; // not a briefing page

  const modal = document.getElementById("brief-modal");
  const pdfContainer = document.getElementById("brief-pdf");
  if (!modal || !pdfContainer) return;

  // ---------- Helpers ----------
  function getText(key) {
    return window.t ? window.t(key) : key;
  }
  function getEl(selector) {
    return document.querySelector(selector);
  }
  function safeText(selector) {
    const el = getEl(selector);
    return el ? el.textContent.trim() : "";
  }
  function safeHtml(selector) {
    const el = getEl(selector);
    return el ? el.innerHTML : "";
  }

  // Detect prefix from page (b1, b2, b3) by scanning data-i18n keys
  function detectPrefix() {
    const t = document.querySelector("[data-i18n^='b1.']") ? "b1" :
              document.querySelector("[data-i18n^='b2.']") ? "b2" :
              document.querySelector("[data-i18n^='b3.']") ? "b3" : null;
    return t;
  }

  const prefix = detectPrefix();

  // ---------- Build concise PDF body ----------
  function buildPdfHtml() {
    const today = new Date();
    const dateStr = today.toLocaleDateString(
      window.CURRENT_LANG === "en" ? "en-US" : "fr-FR",
      { year: "numeric", month: "long", day: "numeric" }
    );

    const heroTitle = safeText(".brief-hero-title");
    const heroSub = safeText(".brief-hero-sub");
    const meta = Array.from(document.querySelectorAll(".brief-hero-meta span"))
      .map(s => s.textContent.trim()).filter(Boolean).join(" · ");

    // ROLES: collect role names (h3 inside .brief-role)
    const roles = Array.from(document.querySelectorAll(".brief-role h3, .brief-role-title"))
      .slice(0, 6)
      .map(h => h.textContent.trim())
      .filter(Boolean);

    // ARCHETYPES: collect arch-name + arch-tag
    const archetypes = Array.from(document.querySelectorAll(".brief-arch-card"))
      .map(card => {
        const name = card.querySelector(".brief-arch-name");
        const tag = card.querySelector(".brief-arch-tag");
        return name ? { name: name.textContent.trim(), tag: tag ? tag.textContent.trim() : "" } : null;
      })
      .filter(Boolean);

    // DEBATE: collect 3 positions
    const debatePositions = Array.from(document.querySelectorAll(".brief-debate-pos"))
      .map(pos => {
        const tag = pos.querySelector(".brief-debate-pos-tag");
        const claim = pos.querySelector(".brief-debate-pos-claim");
        return claim ? {
          tag: tag ? tag.textContent.trim() : "",
          claim: claim.textContent.trim()
        } : null;
      })
      .filter(Boolean);
    const debateSector = safeText(".brief-debate-sector-title");

    // TCO + Sovereignty takeaways (keep them short)
    const tcoTakeaway = safeText(".brief-tco-takeaway");
    const sovTakeaway = safeText(".brief-sov-takeaway");

    // Final action takeaway
    const archTakeaway = safeText(".brief-archetypes-takeaway");

    // Build URL canonical
    const url = window.location.origin + window.location.pathname;

    let html = `
      <header class="pdf-head">
        <div class="pdf-eyebrow">observatoire<span class="b">[s]</span>·ia <span class="dot">·</span> ${getText("brief.pdf.heading")}</div>
        <h1 class="pdf-title">${heroTitle}</h1>
        <div class="pdf-meta">${meta}</div>
        <div class="pdf-byline">${getText("brief.pdf.author")} <span class="dot">·</span> ${getText("brief.pdf.published")} ${dateStr}</div>
      </header>

      <section class="pdf-section">
        <h2>${getText("brief.pdf.summary")}</h2>
        <p>${heroSub}</p>
      </section>
    `;

    if (roles.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.roles")}</h2>
        <ul class="pdf-list">
          ${roles.map(r => `<li>${r}</li>`).join("")}
        </ul>
      </section>
      `;
    }

    if (archetypes.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.archetypes")}</h2>
        <ul class="pdf-list">
          ${archetypes.map(a => `<li><strong>${a.name}</strong>${a.tag ? ` <span class="pdf-tag">${a.tag}</span>` : ""}</li>`).join("")}
        </ul>
      </section>
      `;
    }

    if (debatePositions.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.debate")}</h2>
        <ul class="pdf-list">
          ${debatePositions.map(p => `<li><strong>${p.tag}</strong> · ${p.claim}</li>`).join("")}
        </ul>
        ${debateSector ? `<p class="pdf-callout">${debateSector}</p>` : ""}
      </section>
      `;
    }

    if (tcoTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.tco")}</h2>
        <p>${tcoTakeaway}</p>
      </section>
      `;
    }

    if (sovTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.sov")}</h2>
        <p>${sovTakeaway}</p>
      </section>
      `;
    }

    if (archTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.action")}</h2>
        <p>${archTakeaway}</p>
      </section>
      `;
    }

    html += `
      <footer class="pdf-foot">
        <div class="pdf-foot-url">${getText("brief.pdf.url")}: <a href="${url}">${url}</a></div>
        <div class="pdf-foot-license">${getText("brief.pdf.foot")}</div>
      </footer>
    `;

    return html;
  }

  // ---------- Modal control ----------
  function openModal() {
    pdfContainer.innerHTML = buildPdfHtml();
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  // ---------- Print ----------
  function doPrint() {
    // Use browser native print with a print-only stylesheet that hides everything except #brief-pdf
    document.body.classList.add("printing-pdf");
    window.print();
    setTimeout(() => document.body.classList.remove("printing-pdf"), 500);
  }

  // ---------- Mail ----------
  function sendByMail() {
    const heroTitle = safeText(".brief-hero-title");
    const heroSub = safeText(".brief-hero-sub");
    const url = window.location.origin + window.location.pathname;
    const isFr = (window.CURRENT_LANG !== "en");

    const subject = isFr
      ? `observatoire[s]·ia · ${heroTitle}`
      : `observatoire[s]·ia · ${heroTitle}`;

    const bodyLines = isFr ? [
      `Bonjour,`,
      ``,
      `Je vous transmets ce briefing sectoriel publié par observatoire[s]·ia :`,
      ``,
      heroTitle,
      ``,
      heroSub,
      ``,
      `Lecture intégrale : ${url}`,
      ``,
      `Données ouvertes (CC BY 4.0) et méthodologie sur observatoire.naullynicolas.ch`,
      ``,
      `Bien cordialement,`
    ] : [
      `Hello,`,
      ``,
      `Sharing this sectoral briefing published by observatoire[s]·ia:`,
      ``,
      heroTitle,
      ``,
      heroSub,
      ``,
      `Full reading: ${url}`,
      ``,
      `Open data (CC BY 4.0) and methodology on observatoire.naullynicolas.ch`,
      ``,
      `Best regards,`
    ];

    const mailto = "mailto:?subject=" + encodeURIComponent(subject)
                 + "&body=" + encodeURIComponent(bodyLines.join("\n"));
    window.location.href = mailto;
  }

  // ---------- Copy link ----------
  function copyLink() {
    const url = window.location.origin + window.location.pathname;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        showToast(getText("brief.copy.ok"));
      }).catch(() => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast(getText("brief.copy.ok")); } catch(e) {}
    document.body.removeChild(ta);
  }
  function showToast(message) {
    let toast = document.getElementById("brief-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "brief-toast";
      toast.className = "brief-toast";
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add("is-visible");
    setTimeout(() => toast.classList.remove("is-visible"), 2000);
  }

  // ---------- Wire up ----------
  const btnPdf = document.getElementById("btn-preview-pdf");
  const btnMail = document.getElementById("btn-send-mail");
  const btnCopy = document.getElementById("btn-copy-link");
  const btnPrint = document.getElementById("btn-do-print");

  if (btnPdf) btnPdf.addEventListener("click", openModal);
  if (btnMail) btnMail.addEventListener("click", sendByMail);
  if (btnCopy) btnCopy.addEventListener("click", copyLink);
  if (btnPrint) btnPrint.addEventListener("click", doPrint);

  // Close modal handlers
  modal.querySelectorAll("[data-modal-close]").forEach(el => {
    el.addEventListener("click", closeModal);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.getAttribute("aria-hidden") === "false") {
      closeModal();
    }
  });
}

window.setupBriefActions = setupBriefActions;

</script>

    "home.frame.d3.tag": "03 · Type d'IA",
    "home.frame.d3.title": "Toutes les IA n'affectent pas les mêmes métiers.",
    "home.frame.d3.body": "Trois familles d'IA aux impacts très différents. <strong>L'IA générative</strong> (LLMs) affecte les métiers de production de contenu, de synthèse, de rédaction et de code standard. <strong>L'IA spécialisée</strong> (machine learning sur données structurées) affecte les métiers de détection, scoring et classification. <strong>La robotique IA</strong> affecte les métiers physiques répétitifs. Confondre ces familles fausse toute décision RH ou stratégique.",
    "home.frame.d3.example": "Exemple : un radiologue n'est pas affecté par ChatGPT, il est affecté par des modèles de vision par ordinateur entraînés sur des millions d'images médicales. Un journaliste n'est pas concerné par l'IA de diagnostic médical. Le tableau détaillé est sur la page <a href=\"methodologie.html\">Méthodologie</a>.",

    "home.warn.tag": "Mise en garde · 4e angle mort",
    "home.warn.num": "Court terme vs long terme · gouvernance des coûts et de la donnée",
    "home.warn.title": "Le récit « IA = baisse mécanique des coûts » <em>ne tient déjà plus</em>.",
    "home.warn.lede": "Réduire des postes en s'appuyant sur des prix par token bas peut donner l'illusion d'une économie immédiate. Mais deux dynamiques que les organisations sous-estiment encore renversent l'équation à 24-36 mois : l'envolée du coût total de possession (TCO) et la question de la souveraineté juridictionnelle des données. Ce sont les deux angles morts qui transforment un projet IA rentable sur le papier en passif technologique.",

    "home.warn.c1.title": "Coûts cachés : Gartner prédit une sous-estimation de 500% à 1000%",
    "home.warn.c1.body": "Le prix par token n'est qu'une couche du coût réel. Le <strong>coût total de possession (TCO)</strong> inclut l'orchestration, l'intégration, la gouvernance, la supervision humaine, l'évaluation, la vérification, la gestion des escalades et la refonte organisationnelle (Tomer 2026). Gartner prédit que d'ici 2030, le coût par résolution GenAI dans le service client dépassera 3$, plus cher que les agents humains offshore B2C. Trois facteurs structurels : explosion des coûts data centers, fin des prix subventionnés vers la rentabilité chez les éditeurs, complexité croissante des cas d'usage. <strong>72% des CIO interrogés par Gartner indiquent un breakeven ou une perte sur leurs investissements IA.</strong> 50% des projets GenAI sont abandonnés après PoC. 90% des CIO disent que la gestion des coûts limite désormais la valeur tirée de l'IA.",
    "home.warn.c1.source": "Sources · Gartner Predicts 2026 · Singh Tomer 2026 · IBM",

    "home.warn.c2.title": "Souveraineté : où vivent vos données, qui les juge",
    "home.warn.c2.body": "Pour une organisation européenne, choisir un fournisseur LLM n'est plus seulement technique ou économique. C'est une décision de gouvernance. Les hyperscalers américains ne peuvent pas garantir une infrastructure sous juridiction européenne, ce qui crée un risque réglementaire (RGPD, NIS2, EU AI Act) et un risque de vendor lock-in. <strong>Mistral AI</strong> a levé en mars 2026 830 millions de dollars de dette auprès de 7 banques européennes pour 200 MW de capacité de calcul européenne en 2027. Côté Suisse, <strong>Apertus</strong> (EPFL, ETH Zurich, CSCS, septembre 2025) est le premier LLM public fully open conforme à l'EU AI Act et à la LPD suisse, hébergé par Swisscom. L'écosystème souverain européen 2026 (Mistral, Aleph Alpha, Apertus, Minerva, PhariaAI, LightOn) est devenu une option crédible, et pour les industries régulées, un prérequis.",
    "home.warn.c2.source": "Sources · European Business Magazine · EPFL · ETH Zurich · Index.dev",

    "home.warn.footer": "<strong>Conséquence concrète pour les COMEX et les directions RH.</strong> Les arbitrages d'aujourd'hui sur la substitution de postes par IA doivent intégrer dès le cadrage le TCO réel à 36 mois et le risque de souveraineté. Les Dispatches sectoriels d'observatoire[s]·ia traitent ces deux dimensions sur les périmètres concrets (banque, cadres, horlogerie premium). Les ressources sources sont en accès libre.",

    "home.debate.eyebrow": "Le débat structurant 2026",
    "home.debate.title": "Apocalypse ou réfutation : <em>deux récits, deux corpus de preuves</em>.",
    "home.debate.lede": "En 2026, le débat public sur l'IA et l'emploi se structure autour de deux thèses irréconciliables. Les CEO IA annoncent une élimination massive et imminente. Les économistes du travail et les données empiriques racontent une autre histoire. Les deux corpus existent, sont vérifiables, et arrivent à des conclusions contradictoires. Voici comment l'observatoire les met côte à côte.",

    "home.debate.t.tag": "Thèse · L'apocalypse de l'emploi",
    "home.debate.t.title": "« 50% des cols blancs juniors disparus en 1 à 5 ans »",
    "home.debate.t.quote": "Most white collar work, where you're sitting down at a computer, either being a lawyer or an accountant or a project manager or a marketing person, most of those tasks will be fully automated by an AI within the next 12 to 18 months.",
    "home.debate.t.p1": "<strong>Dario Amodei (Anthropic, mai 2025 puis Davos janvier 2026)</strong> annonce sur Fox News que l'IA éliminera jusqu'à 50% des cols blancs juniors en finance, conseil, droit et tech d'ici 1 à 5 ans, avec un taux de chômage qui pourrait atteindre 10 à 20%.",
    "home.debate.t.p2": "<strong>Mustafa Suleyman (Microsoft AI, FT 2026)</strong> va plus loin : « la plupart des tâches de col blanc seront automatisées dans les 12 à 18 prochains mois ». Argument du moat : les vagues d'automatisation précédentes offraient des secteurs adjacents pour absorber les déplacés. L'IA frappe simultanément tous les secteurs cognitifs.",
    "home.debate.t.p3": "<strong>Jamie Dimon (JPMorgan, février 2026)</strong> compare l'impact de l'IA à celui de l'électricité et avertit : 150 000 employés JPMorgan utilisent déjà des LLM hebdomadairement. <strong>Jack Dorsey (Block, février 2026)</strong> licencie 4 000 personnes (40% des effectifs) en attribuant explicitement à l'IA.",
    "home.debate.t.source": "Sources · Axios, Fox News, Financial Times, conférences CEO 2025-2026",

    "home.debate.a.tag": "Antithèse · La tâche n'est pas le métier",
    "home.debate.a.title": "Les données empiriques contredisent le récit Silicon Valley",
    "home.debate.a.quote": "Almost every company that does layoffs is blaming AI, whether or not it really is about AI.",
    "home.debate.a.p1": "<strong>Luis Garicano (LSE, avril 2026)</strong> formalise le bundles framework. Cas canonique : agents de voyage. Emploi -60% depuis 2000, mais salaires hebdomadaires moyens passés de 87% à 99% de la moyenne du secteur privé. Frey & Osborne 2013 prédisaient 94% d'automatisation des comptables : le BLS recense aujourd'hui 1,6 million de comptables actifs avec une croissance projetée de +5%.",
    "home.debate.a.p2": "<strong>Washington Post (1er mai 2026)</strong> et <strong>NYT Opinion (3 mai 2026)</strong> documentent que Amazon, Google et Meta ont aujourd'hui à peu près le même nombre d'employés qu'en 2022, malgré 700 milliards de dollars de CapEx IA. Marc Andreessen (board Meta) et Sam Altman (CEO OpenAI) reconnaissent publiquement l'AI-washing.",
    "home.debate.a.p3": "<strong>Trammell (Stanford Digital Economy Lab, mars 2026)</strong> théorise la part durable du travail humain via les biens « human-intrinsic ». <strong>Oxford Economics (janvier 2026)</strong> qualifie les preuves d'une perturbation IA de « patchwork au mieux ». Chômage US à 4,4%, bien en dessous des pics européens des années 1990.",
    "home.debate.a.source": "Sources · Garicano (Silicon Continent), Trammell (Stanford), WaPo, NYT, Oxford Economics, Wharton",

    "home.debate.takeaway": "<strong>Posture de l'observatoire face à ce débat.</strong> Les deux corpus sont importants. Mais ils ne s'équivalent pas méthodologiquement. Les annonces des CEO IA sont des prédictions stratégiques (et parfois des outils de communication produit). Les travaux de Garicano, Trammell, Yale Budget Lab et NBER w35110 sont des analyses empiriques contradictoires soumises à la revue par les pairs. Pour un comité de direction, calibrer un plan de transformation sur la première catégorie sans confronter à la seconde, c'est arbitrer dans le bruit. La vocation de cette cartographie est de fournir le terrain de comparaison.",

    "home.frame.d4.tag": "04 · Coût total de possession",
    "home.frame.d4.title": "Le prix par token n'est pas le coût réel.",
    "home.frame.d4.body": "Comparer le prix d'un token au salaire humain est l'erreur économique la plus répandue dans les COMEX en 2026. <strong>Gartner</strong> mesure que les organisations sous-estiment leurs coûts GenAI réels d'un facteur 5 à 10. Le coût total inclut l'orchestration, l'intégration, la gouvernance, le monitoring, la vérification, la gestion des escalades et le redesign organisationnel. Pire, le <em>LLM Cost Paradox</em> documenté en mars 2026 (Gartner, AISuperior) montre que la baisse du prix unitaire (jusqu'à -90% d'ici 2030) est <strong>plus que compensée</strong> par l'explosion de la consommation : les modèles agentiques consomment 5 à 30 fois plus de tokens par tâche, les reasoning models cachent leur consommation interne. Pour les organisations francophones, s'ajoute la « taxe linguistique » : le français consomme +60% de tokens vs anglais sur les mêmes tâches.",
    "home.frame.d4.example": "Exemple : Gartner prédit (janvier 2026) que le coût par résolution GenAI en service client dépassera 3$ d'ici 2030, au-dessus des agents humains offshore. 72% des CIO interrogés en 2024 rapportent un break-even ou des pertes sur leurs investissements IA. Cette dimension est désormais traitée dans toutes nos dépêches sectorielles.",

    "home.frame.footer": "<strong>Trois travaux récents valident ce cadre.</strong> <em>Garicano (Silicon Continent, avril 2026)</em> formalise le concept de <strong>bundle de tâches</strong> : un métier n'est pas la somme de ses tâches automatisables, c'est ce qui reste quand la commodity disparaît. Cas canonique : les agents de voyage ont vu leur emploi reculer de 60% depuis 2000, mais leurs salaires hebdomadaires sont passés de 87% à 99% de la moyenne du secteur privé. La machine a pris la partie faible du bundle, leur a laissé la partie forte. <em>Trammell (Stanford Digital Economy Lab, mars 2026)</em> apporte la formalisation théorique : une préférence même très faible pour les biens human-intrinsic (concert vivant, soin direct, performance) suffit à maintenir la part durable du travail élevée, parce qu'il y a au plus un humain par humain. <em>NYT et Washington Post (mai 2026)</em> rappellent les données macro : chômage US à 4,4%, capex IA à 700 milliards, mais effectif global tech qui ne se contracte pas. Le récit Silicon Valley d'apocalypse de l'emploi ne se vérifie pas dans les statistiques. La cartographie applique ces validations au quotidien : tout score d'exposition est lu en regard du bundle restant, du caractère human-intrinsic du métier, et des données macro disponibles.",

  en: {
    "home.eyebrow": "",
    "home.title": "What <em>AI systems</em> actually do to work<span class=\"accent-bracket\">.</span>",
    "home.pitch": "AI systems do not threaten all occupations the same way. It is not the same AI that affects a radiologist, a journalist, and a driver. And not all exposed occupations are under pressure: some benefit from it.",
    "home.lede": "On the impact of AI on jobs, we hear everything and its opposite. Looming collapse on one side, productive revolution on the other, and in between workers trying to decide on their training and trajectory. The problem is not a lack of data: figures exist, scattered across a dozen institutions, in several languages, under as many methodologies. This observatory gathers, translates, and cross-checks them to enable a factual reading rather than an emotional one. And because generative AI, discriminative AI, and machine learning do not produce the same effects on the same occupations, every figure here is tagged by AI type.",
    "home.cta.ch": "Switzerland dashboard",
    "home.cta.fr": "France dashboard",
    "home.stat1.label": "of UK+US workers have already used AI at work. But fewer than 1/5 daily.",
    "home.stat2.label": "of large Swiss firms have introduced AI. Against 9% for SMEs: the asymmetry is Swiss.",
    "home.stat3.label": "occupations mapped (200 ROME France + 324 NP 2010 Switzerland). Open data.",
    "home.stat3.source": "ROME 4.0 · NP 2010 FSO · CC BY 4.0",
    "home.manifesto.tag": "¶ Manifesto",
    "home.manifesto.text": "<p>Speaking of « AI » in the singular is a linguistic shortcut that produces analytical errors. <strong>Generative AI</strong> writing an email does not have the same impact as <strong>a discriminative AI</strong> screening résumés, nor as <strong>a machine learning system</strong> optimizing a supply chain. Conflating these families is to condemn oneself to imprecise predictions and ill-calibrated public policies. This is why every figure published here is explicitly tagged by AI type, and why we speak of <em>AI systems</em>, in the plural.</p><p>The second postulate of this observatory is simpler: <strong>a single source is never enough</strong>. France's DARES quantifies the exposure of jobs to generative AI. France Travail measures recruitment tensions. The EPFL AI Center documents company adoption. Switzerland's Federal Statistical Office tracks vacancies. Coface models sectoral risks. The Yale Budget Lab monthly tracks US employment effects. The Financial Times publishes its Workforce AI Tracker. No single source, taken in isolation, gives the full picture. <em>Together, cross-checked and confronted, they allow a fairer reading</em>, both of what AI systems can do and what they do not do.</p><p>The observatory seeks neither to reassure nor to alarm. It seeks to <strong>reduce the emotional share of the debate</strong> by giving workers, HR leaders, public decision-makers and researchers a shared ground on which to reason. All figures are sourced, traceable to the primary publication, and published as open data under CC BY 4.0 license.</p>",

    "home.frame.eyebrow": "Analytical frame · 4 reading dimensions",
    "home.frame.title": "Reading an occupation against AI means <em>crossing four axes</em>.",
    "home.frame.lede": "An isolated exposure score is never enough to decide on an HR trajectory or a transformation strategy. The observatory articulates four complementary dimensions that read figures in their full depth, from demand dynamics to AI's real operational cost.",
    "home.frame.d1.tag": "01 · Demand trajectory",
    "home.frame.d1.title": "Exposure does not predict trajectory.",
    "home.frame.d1.body": "A highly exposed occupation can see its demand grow if AI enriches the households who spend more on these services. The exposure score alone is insufficient to anticipate real employment pressure. Three possible profiles: rising demand (care, hospitality, craft, training, personal services), stable demand (law, architecture, management, engineering), declining pressure (data entry, generic content, standardized administrative processing).",
    "home.frame.d1.example": "Example: a fine-dining chef at 6/10 exposure is in a better position than a credit analyst at 7/10. The difference does not come from AI's technical capability, it comes from the income effect (Imas & Comin, 2026).",

    "home.frame.d2.tag": "02 · Relational sector",
    "home.frame.d2.title": "AI also creates winners.",
    "home.frame.d2.body": "Occupations with strong human relational necessity (care, premium hospitality, craft, therapy, training, live performance) structurally benefit from the AI transition. When AI lowers the cost of standardized goods, households reallocate their budget toward presence and human attention. This is not « protected from AI », it is <em>indirect beneficiary</em> of AI through the income effect.",
    "home.frame.d2.example": "Example: a social educator (3/10 exposure) is not merely spared by automation. Their structural demand is set to grow as AI enriches households who invest more in human accompaniment.",

    "home.frame.d3.tag": "03 · AI type",
    "home.frame.d3.title": "Not all AI affects the same occupations.",
    "home.frame.d3.body": "Three families of AI with very different impacts. <strong>Generative AI</strong> (LLMs) affects content production, synthesis, writing, and standard code occupations. <strong>Specialized AI</strong> (machine learning on structured data) affects detection, scoring, and classification occupations. <strong>Robotic AI</strong> affects repetitive physical occupations. Conflating these families distorts any HR or strategic decision.",
    "home.frame.d3.example": "Example: a radiologist is not affected by ChatGPT, they are affected by computer vision models trained on millions of medical images. A journalist is not concerned by medical diagnostic AI. Detailed table on the <a href=\"methodologie.html\">Methodology</a> page.",

    "home.warn.tag": "Warning · 4th blind spot",
    "home.warn.num": "Short term vs long term · cost and data governance",
    "home.warn.title": "The « AI = mechanical cost reduction » narrative <em>no longer holds</em>.",
    "home.warn.lede": "Cutting positions based on cheap token prices may give the illusion of immediate savings. But two dynamics organizations still underestimate reverse the equation at 24-36 months: the surge in total cost of ownership (TCO) and the question of jurisdictional sovereignty over data. These are the two blind spots that turn a paper-profitable AI project into a technological liability.",

    "home.warn.c1.title": "Hidden costs: Gartner predicts 500% to 1000% underestimation",
    "home.warn.c1.body": "Token price is only one layer of real cost. <strong>Total cost of ownership (TCO)</strong> includes orchestration, integration, governance, human oversight, evaluation, verification, escalation handling, and organizational redesign (Tomer 2026). Gartner predicts that by 2030, GenAI cost per resolution in customer service will exceed $3, more expensive than B2C offshore human agents. Three structural drivers: exploding data center costs, end of subsidized pricing toward profitability, and rising use case complexity. <strong>72% of CIOs surveyed by Gartner report breakeven or losses on AI investments.</strong> 50% of GenAI projects are abandoned after PoC. 90% of CIOs say cost management now limits the value extracted from AI.",
    "home.warn.c1.source": "Sources · Gartner Predicts 2026 · Singh Tomer 2026 · IBM",

    "home.warn.c2.title": "Sovereignty: where your data lives, who judges it",
    "home.warn.c2.body": "For a European organization, choosing an LLM vendor is no longer just technical or economic. It is a governance decision. US hyperscalers cannot guarantee European-jurisdiction infrastructure, creating regulatory risk (GDPR, NIS2, EU AI Act) and vendor lock-in risk. <strong>Mistral AI</strong> raised $830 million in debt from 7 European banks in March 2026 for 200 MW of European compute capacity by 2027. On the Swiss side, <strong>Apertus</strong> (EPFL, ETH Zurich, CSCS, September 2025) is the first public fully open LLM compliant with the EU AI Act and Swiss data protection law, hosted by Swisscom. The European sovereign ecosystem 2026 (Mistral, Aleph Alpha, Apertus, Minerva, PhariaAI, LightOn) has become a credible option, and for regulated industries, a prerequisite.",
    "home.warn.c2.source": "Sources · European Business Magazine · EPFL · ETH Zurich · Index.dev",

    "home.warn.footer": "<strong>Concrete consequence for executive committees and HR leadership.</strong> Today's arbitrages on AI position substitution must integrate the real 36-month TCO and sovereignty risk from the framing stage. The sectoral Dispatches of observatoire[s]·ia address these two dimensions on concrete perimeters (banking, executives, premium watchmaking). Source resources are openly accessible.",

    "home.debate.eyebrow": "The structuring debate of 2026",
    "home.debate.title": "Apocalypse or refutation: <em>two narratives, two evidence corpora</em>.",
    "home.debate.lede": "In 2026, the public debate on AI and employment crystallizes around two irreconcilable theses. AI CEOs announce massive and imminent elimination. Labor economists and empirical data tell another story. Both corpora exist, are verifiable, and reach contradictory conclusions. Here is how the observatory places them side by side.",

    "home.debate.t.tag": "Thesis · The jobs apocalypse",
    "home.debate.t.title": "« 50% of junior white-collar jobs gone in 1 to 5 years »",
    "home.debate.t.quote": "Most white collar work, where you're sitting down at a computer, either being a lawyer or an accountant or a project manager or a marketing person, most of those tasks will be fully automated by an AI within the next 12 to 18 months.",
    "home.debate.t.p1": "<strong>Dario Amodei (Anthropic, May 2025 then Davos January 2026)</strong> announced on Fox News that AI will eliminate up to 50% of junior white-collar jobs in finance, consulting, law and tech within 1 to 5 years, with unemployment potentially reaching 10 to 20%.",
    "home.debate.t.p2": "<strong>Mustafa Suleyman (Microsoft AI, FT 2026)</strong> goes further: « most white collar tasks will be fully automated within the next 12 to 18 months ». The moat argument: previous automation waves offered adjacent sectors to absorb displaced workers. AI hits all cognitive sectors simultaneously.",
    "home.debate.t.p3": "<strong>Jamie Dimon (JPMorgan, February 2026)</strong> compares AI's impact to electricity and warns: 150,000 JPMorgan employees already use LLMs weekly. <strong>Jack Dorsey (Block, February 2026)</strong> lays off 4,000 people (40% of headcount), explicitly attributing to AI.",
    "home.debate.t.source": "Sources · Axios, Fox News, Financial Times, CEO conferences 2025-2026",

    "home.debate.a.tag": "Antithesis · The task is not the job",
    "home.debate.a.title": "Empirical data contradicts the Silicon Valley narrative",
    "home.debate.a.quote": "Almost every company that does layoffs is blaming AI, whether or not it really is about AI.",
    "home.debate.a.p1": "<strong>Luis Garicano (LSE, April 2026)</strong> formalizes the bundles framework. Canonical case: travel agents. Employment -60% since 2000, yet average weekly earnings rose from 87% to 99% of private-sector average. Frey & Osborne 2013 predicted 94% accountant automation: BLS now counts 1.6 million working accountants with projected +5% growth.",
    "home.debate.a.p2": "<strong>Washington Post (May 1, 2026)</strong> and <strong>NYT Opinion (May 3, 2026)</strong> document that Amazon, Google, and Meta today have roughly the same headcount as in 2022, despite $700 billion in AI CapEx. Marc Andreessen (Meta board) and Sam Altman (OpenAI CEO) publicly acknowledge AI-washing.",
    "home.debate.a.p3": "<strong>Trammell (Stanford Digital Economy Lab, March 2026)</strong> theorizes the durable human labor share via « human-intrinsic » goods. <strong>Oxford Economics (January 2026)</strong> calls evidence of AI-driven disruption « patchy at best ». US unemployment at 4.4%, far below European peaks of the 1990s.",
    "home.debate.a.source": "Sources · Garicano (Silicon Continent), Trammell (Stanford), WaPo, NYT, Oxford Economics, Wharton",

    "home.debate.takeaway": "<strong>The observatory's posture on this debate.</strong> Both corpora matter. But they are not methodologically equivalent. The announcements of AI CEOs are strategic predictions (and sometimes product communication tools). The work of Garicano, Trammell, Yale Budget Lab, and NBER w35110 are contradictory empirical analyses subject to peer review. For an executive committee, calibrating a transformation plan on the first category without confronting the second is arbitrage in the noise. The vocation of this cartography is to provide the comparison ground.",

    "home.frame.d4.tag": "04 · Total cost of ownership",
    "home.frame.d4.title": "The token price is not the real cost.",
    "home.frame.d4.body": "Comparing token price to human salary is the most widespread economic error in executive committees in 2026. <strong>Gartner</strong> measures that organizations underestimate their real GenAI costs by a factor of 5 to 10. Total cost includes orchestration, integration, governance, monitoring, verification, escalation handling, and organizational redesign. Worse, the <em>LLM Cost Paradox</em> documented in March 2026 (Gartner, AISuperior) shows that the unit price decline (up to -90% by 2030) is <strong>more than offset</strong> by exploding consumption: agentic models consume 5 to 30 times more tokens per task, reasoning models hide their internal consumption. For French-speaking organizations, the « linguistic tax » adds up: French consumes +60% tokens vs English on the same tasks.",
    "home.frame.d4.example": "Example: Gartner predicts (January 2026) that GenAI cost per resolution in customer service will exceed $3 by 2030, above offshore human agents. 72% of CIOs surveyed in 2024 report break-even or losses on AI investments. This dimension is now addressed in all our sectoral dispatches.",

    "home.frame.footer": "<strong>Three recent works validate this frame.</strong> <em>Garicano (Silicon Continent, April 2026)</em> formalizes the concept of <strong>task bundle</strong>: a job is not the sum of its automatable tasks, it is what remains when commodity tasks disappear. Canonical case: travel agents saw employment drop 60% since 2000, but their weekly wages rose from 87% to 99% of the private sector average. The machine took the weak part of the bundle and left them the strong one. <em>Trammell (Stanford Digital Economy Lab, March 2026)</em> provides the theoretical formalization: even a very mild preference for human-intrinsic goods (live concert, direct care, performance) is enough to keep labor's durable share high, because there is at most one human per human. <em>NYT and Washington Post (May 2026)</em> remind us of macro data: US unemployment at 4.4%, AI capex at 700 billion, but tech overall headcount not contracting. The Silicon Valley narrative of job apocalypse does not show up in the statistics. The cartography applies these validations daily: every exposure score is read against the remaining bundle, the human-intrinsic character of the job, and available macro data.",

let veilleData = [];

async function loadVeille() {
  veilleData = window.VEILLE_DATA || [];
  renderVeille();
}

function renderVeille() {
  const grid = document.getElementById("fieldGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const lang = window.CURRENT_LANG;
  veilleData.slice(0, 3).forEach((v) => {
    const card = document.createElement("a");
    card.className = "field-card";
    card.href = v.url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
    card.style.textDecoration = "none";
    card.style.color = "inherit";
    card.style.display = "block";

    const meta = document.createElement("div");
    meta.className = "field-card-meta";
    const dateSpan = document.createElement("span");
    const flag = v.country === "CH" ? "🇨🇭" : v.country === "FR" ? "🇫🇷" : "🌍";
    dateSpan.textContent = flag + " · " + v.date;
    meta.appendChild(dateSpan);
    const sourceSpan = document.createElement("span");
    sourceSpan.textContent = v.source;
    meta.appendChild(sourceSpan);
    card.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "field-card-title";
    title.textContent = v.title[lang];
    card.appendChild(title);

    const excerpt = document.createElement("p");
    excerpt.className = "field-card-excerpt";
    excerpt.textContent = v.excerpt[lang];
    card.appendChild(excerpt);

    const link = document.createElement("span");
    link.className = "field-card-link mono";
    link.textContent = lang === "fr" ? "Lire le rapport →" : "Read the report →";
    card.appendChild(link);

    grid.appendChild(card);
  });
}

window.onLangChange = renderVeille;

initSite("home");
loadVeille();
</script>
