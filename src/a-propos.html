    "ab.why.text": "<p><em>Cet observatoire est un constat personnel et factuel.</em> Comme consultant en intelligence artificielle, j'opère depuis plusieurs années entre la Suisse et la France auprès de dirigeants, d'équipes RH, de collectivités et de chercheurs. Tous me posent des questions presque identiques : que va devenir tel métier, telle équipe, telle administration ? Faut-il former, recruter, restructurer, et selon quel calendrier ? Les réponses existent. Elles sont produites par l'OFS, la DARES, France Stratégie, l'EPFL, le SEFRI, France Travail, l'APEC, la CNIL, l'Inria. Elles sont précises, sourcées, méthodologiquement rigoureuses. Elles sont surtout dispersées entre une douzaine d'institutions et largement invisibles pour les acteurs qu'elles concernent.</p><p>Aucune cartographie francophone ne rassemblait ces sources de manière cohérente, ne les comparait entre les deux pays, ni ne signalait explicitement leurs biais. Le débat public sur l'IA et le travail naviguait dans un brouillard d'estimations américaines relayées sans contexte, ou de fragments institutionnels lus en isolation. Les actifs concernés, qui sont pourtant les premiers exposés, n'avaient aucun moyen simple d'accéder à cette information.</p><p>Ce projet est ma tentative de combler ce trou. Il ne produit aucun chiffre nouveau. Il agrège, il traduit, il compare, il critique ceux qui existent. Il est gratuit, sans publicité, sans tracker, sous licence ouverte. C'est un bien commun, modestement contribué.</p>",

    "ab.why.text": "<p><em>This observatory is a personal and factual observation.</em> As an AI consultant, I have been operating between Switzerland and France for several years, working with executives, HR teams, public bodies and researchers. They all ask me almost identical questions: what will become of this occupation, this team, this administration? Should we train, hire, restructure, and on what timeline? The answers exist. They are produced by FSO, DARES, France Stratégie, EPFL, SERI, France Travail, APEC, CNIL, Inria. They are precise, sourced, methodologically rigorous. They are also scattered across a dozen institutions and largely invisible to the actors they concern.</p><p>No French-speaking cartography brought these sources together coherently, compared them across the two countries, or explicitly flagged their biases. Public debate on AI and work was navigating a fog of American estimates relayed without context, or institutional fragments read in isolation. The workers concerned, who are the most exposed, had no simple way to access this information.</p><p>This project is my attempt to fill that gap. It produces no new figures. It aggregates, translates, compares and critiques those that already exist. It is free, ad-free, tracker-free, and openly licensed. It is a modestly contributed common good.</p>",

const PRINCIPLES = [
  {
    title: { fr: "Sources primaires uniquement", en: "Primary sources only" },
    desc: {
      fr: "Chaque observatoire référencé renvoie directement à sa publication officielle. Pas de reformulation, pas d'intermédiaire, pas de SEO.",
      en: "Every referenced observatory links directly to its official publication. No reformulation, no intermediary, no SEO."

  },
  {
    title: { fr: "Bilingue dès le premier jour", en: "Bilingual from day one" },
    desc: {
      fr: "FR et EN comme citoyens de première classe. Le bilingue n'est pas une option ajoutée à la fin, c'est l'architecture.",
      en: "FR and EN as first-class citizens. Bilingualism is not an afterthought, it is the architecture."
    }
  },
  {
    title: { fr: "Données ouvertes", en: "Open data" },
    desc: {
      fr: "L'agrégation est publiée en JSON sous licence CC BY. Vous pouvez la copier, la forker, la corriger. Le dépôt GitHub est ouvert.",
      en: "The aggregation is published as JSON under CC BY. You can copy it, fork it, correct it. The GitHub repo is open."
    }
  }
];

function renderPrinc() {
  const grid = document.getElementById("princGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const lang = window.CURRENT_LANG;
  PRINCIPLES.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.cursor = "default";

    const meta = document.createElement("div");
    meta.className = "card-meta mono";
    const num = document.createElement("span");
    num.textContent = String(i + 1).padStart(2, "0");
    num.style.color = "var(--signal)";
    num.style.fontFamily = "Fraunces, serif";
    num.style.fontSize = "20px";
    meta.appendChild(num);
    card.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = p.title[lang];
    card.appendChild(title);

    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = p.desc[lang];
    card.appendChild(desc);

    grid.appendChild(card);
  });
}

window.onLangChange = renderPrinc;
initSite("about");
renderPrinc();
</script>
