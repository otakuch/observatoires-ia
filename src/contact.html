        <option value="contrib" data-i18n="ct.t.contrib"></option>
        <option value="other" data-i18n="ct.t.other"></option>
      </select>
    </div>

    <div class="form-row">
      <label class="form-label" for="ct-message">
        <span data-i18n="ct.f.message"></span><span class="required">*</span>
      </label>
      <textarea id="ct-message" name="message" class="form-textarea" rows="7" required></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="form-submit">
        <span data-i18n="ct.f.send"></span>
        <span>→</span>
      </button>
      <p class="form-note" data-i18n="ct.f.note"></p>
    </div>
  </form>

function applyURLParams() {
  const params = new URLSearchParams(window.location.search);
  const typeMap = {
    "exec": "dispatch-exec",
    "sub": "dispatch-sub",
    "notify": "dispatch-notify",
    "conf": "conf",
    "workshop": "workshop",
    "strategy": "strategy",
    "contrib": "contrib"
  };
  const typeParam = params.get("type");
  if (typeParam && typeMap[typeParam]) {
    const sel = document.getElementById("ct-type");
    if (sel) sel.value = typeMap[typeParam];
  }
  const dispatchParam = params.get("dispatch");
  if (dispatchParam) {
    const tx = document.getElementById("ct-message");
    const lang = window.CURRENT_LANG || "fr";
    const prefix = lang === "fr"
      ? "Concernant Le Dispatch·iA #" + dispatchParam + " :\n\n"
      : "Regarding The Dispatch·iA #" + dispatchParam + ":\n\n";
    if (tx && !tx.value) tx.value = prefix;
  }
}

function handleSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const name = (form.elements.name.value || "").trim();
  const email = (form.elements.email.value || "").trim();
  const org = (form.elements.org.value || "").trim();
  const type = form.elements.type.value || "other";
  const message = (form.elements.message.value || "").trim();

  const feedback = document.getElementById("formFeedback");

  if (!name || !email || !message) {
    feedback.textContent = window.t("ct.feedback.invalid");
    feedback.classList.add("visible");
    feedback.style.borderColor = "var(--signal)";
    return;
  }

  const subject = window.t("ct.subject." + type.replace("dispatch-", ""));

  const lang = window.CURRENT_LANG || "fr";
  let body = message + "\n\n";
  body += "--\n";
  body += name + "\n";
  if (org) body += org + "\n";
  body += email;

  const mailto = "mailto:sayhi@naullynicolas.ch"
    + "?subject=" + encodeURIComponent(subject)
    + "&body=" + encodeURIComponent(body);

  feedback.textContent = window.t("ct.feedback.opening");
  feedback.classList.add("visible");
  feedback.style.borderColor = "var(--ink)";

  window.location.href = mailto;
}

initSite("contact");

document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("contactForm");
  if (form) form.addEventListener("submit", handleSubmit);
  applyURLParams();
});
