    "pt.q.q3.body": "Generative AI is arriving today on content production and synthesis functions. Specialized AI has affected scoring, classification, and detection functions on structured data for longer. Robotic AI is deploying on repetitive physical functions on yet another rhythm. Conflating these families produces poorly calibrated training and redeployment plans. Each function in your organization must be analyzed with its relevant AI family and its own time horizon.",
    "pt.q.footer": "These three questions are the matrix of every sectoral report produced under a partnership. If they are yours, let's talk. If you have others, say so, we calibrate deliverables based on what you want to objectively measure.",

    "pt.del.t1.tag": "Format",
    "pt.del.t1.title": "Three <em>delivery formats</em>.",
    "pt.del.t1.p1": "<strong>One-off sectoral report.</strong> 12 to 24 pages, magazine format inspired by The Dispatch·iA dispatches. Executive summary, key indicators, scenarios, recommendations. Delivery within 4 to 6 weeks depending on subject complexity.",
    "pt.del.t1.p2": "<strong>Quarterly memo series.</strong> Annual commitment to produce 4 sectoral memos per year, calibrated on your steering committee's agenda. Ideal for federations that need a regular flow of analytical material.",

    "pt.del.t2.tag": "Method",
    "pt.del.t2.title": "<em>Primary sources</em>, open methodology.",
    "pt.del.t2.p1": "All partnership reports rely on the same methodological rigor as public dispatches: primary sources only (DARES, FSO, INSEE, Stanford HAI, Coface, etc.), triangulation by reliability tier, biases explicited, AI types disambiguated (generative, agentic, broad automation).",
    "pt.del.t2.p2": "The complete methodology is publicly documented on the <a href=\"methodologie.html\">Methodology page</a>. You can communicate it to your stakeholders and auditors.",

    "pt.del.t3.tag": "License",

    "pt.del.t3.p1": "Reports produced under a partnership are published under Creative Commons CC BY 4.0 license, like the observatory's datasets. You can freely distribute them to your members, cite them in your communications, republish them on your website.",
    "pt.del.t3.p2": "An embargo option of 30 to 90 days is possible if you wish to control the diffusion calendar. Beyond this period, the report joins the editorial commons of the site and becomes citable by all.",

function buildMailto() {
  const data = new FormData(document.getElementById("partnerForm"));
  const lang = window.CURRENT_LANG || "fr";
  const i18n = window.PAGE_I18N[lang];

  const typeLabels = {
    "association": i18n["pt.f.type.association"],
    "federation": i18n["pt.f.type.federation"],
    "public": i18n["pt.f.type.public"],
    "education": i18n["pt.f.type.education"],
    "ong": i18n["pt.f.type.ong"],
    "autre": i18n["pt.f.type.autre"]
  };
  const formatLabels = {
    "rapport": i18n["pt.f.format.rapport"],
    "serie": i18n["pt.f.format.serie"],
    "conference": i18n["pt.f.format.conference"],
    "atelier": i18n["pt.f.format.atelier"],
    "cartographie": i18n["pt.f.format.carto"],
    "discussion": i18n["pt.f.format.discussion"]
  };

  const subject = lang === "fr"
    ? "[Partenariat] Demande de " + (formatLabels[data.get("format")] || "")
    : "[Partnership] Request for " + (formatLabels[data.get("format")] || "");

  const lines = [
    lang === "fr" ? "Bonjour Naully," : "Hello Naully,",
    "",
    lang === "fr" ? "Je vous contacte au nom de mon organisation au sujet d'un partenariat." : "I'm writing on behalf of my organization regarding a partnership.",
    "",
    "===",
    (lang === "fr" ? "Nom : " : "Name: ") + data.get("name"),
    (lang === "fr" ? "Email : " : "Email: ") + data.get("email"),
    (lang === "fr" ? "Organisation : " : "Organization: ") + data.get("org"),
    (lang === "fr" ? "Fonction : " : "Role: ") + (data.get("role") || "==="),
    (lang === "fr" ? "Type : " : "Type: ") + (typeLabels[data.get("type")] || ""),
    (lang === "fr" ? "Format souhaité : " : "Desired format: ") + (formatLabels[data.get("format")] || ""),
    "===",
    "",
    data.get("message"),
    "",
    "===",
    (lang === "fr" ? "Envoyé depuis observatoire.naullynicolas.ch/partenariats" : "Sent from observatoire.naullynicolas.ch/partenariats")
  ];
  const body = lines.join("\n");
  return "mailto:sayhi@naullynicolas.ch?subject=" + encodeURIComponent(subject) +
         "&body=" + encodeURIComponent(body);
}

function handleSubmit(e) {
  e.preventDefault();
  const form = document.getElementById("partnerForm");
  const feedback = document.getElementById("formFeedback");
  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }
  const lang = window.CURRENT_LANG || "fr";
  feedback.textContent = lang === "fr"
    ? "Ouverture de votre client mail…"
    : "Opening your mail client…";
  feedback.classList.add("visible");
  feedback.style.borderColor = "var(--ink)";
  window.location.href = buildMailto();
}

initSite("partenariats");

document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("partnerForm");
  if (form) form.addEventListener("submit", handleSubmit);
});
