<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veille · observatoire[s]·ia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="nav" id="siteNav"><div class="nav-inner"><a href="index.html" class="logo" title="Retour à l'accueil">observatoire<span class="bracket">[s]</span><span class="dot">·</span>ia</a></div></nav>
<div class="mobile-menu" id="mobileMenu"></div>

<section class="dash-header">
  <h1 class="dash-title" data-i18n="vl.title" data-i18n-html="true"></h1>
  <p class="dash-lede" data-i18n="vl.lede"></p>
</section>

<div class="filters" style="border-top: 1px solid var(--rule); padding-top: 32px;">
  <div class="filter-group">
    <span class="filter-label mono" data-i18n="filter.country"></span>
    <button class="chip active" data-filter="country" data-value="all" data-i18n="filter.all"></button>
    <button class="chip" data-filter="country" data-value="CH">🇨🇭</button>
    <button class="chip" data-filter="country" data-value="FR">🇫🇷</button>
    <button class="chip" data-filter="country" data-value="INT" data-i18n="vl.int"></button>
  </div>
  <div class="filter-group">
    <span class="filter-label mono" data-i18n="vl.search.label"></span>
    <label class="search-wrap" id="searchWrap">
      <input type="search" id="searchInput" class="search-input" autocomplete="off" spellcheck="false" />
      <button type="button" class="search-clear" id="searchClear" aria-label="">×</button>
    </label>
  </div>
  <div class="filter-group">
    <span class="results-counter mono" id="resultsCounter"></span>
  </div>
</div>

<section class="field-report" style="padding-top: 0;">
  <div class="field-grid" id="fieldGrid"></div>
</section>

<footer id="siteFooter"></footer>

<script src="assets/components.js"></script>
<script>
window.PAGE_I18N = {
  fr: {
    "vl.tag": "",
    "vl.title": "Les rapports à lire <em>ce mois-ci</em>.",
    "vl.lede": "Sélection des publications les plus structurantes des 30 derniers jours sur l'IA et l'emploi. Sources primaires uniquement, vérifiées et liées vers leur publication d'origine.",
    "vl.int": "International",
    "vl.read": "Lire le rapport →",
    "vl.search.label": "Recherche",
    "vl.search.placeholder": "Rechercher par titre, source, mot-clé…",
    "vl.search.clear": "Effacer la recherche",
    "vl.search.results": "{n} sur {total}",
    "vl.search.empty": "Aucun rapport ne correspond à votre recherche."
  },
  en: {
    "vl.tag": "",
    "vl.title": "Reports to read <em>this month</em>.",
    "vl.lede": "Selection of the most structuring publications from the last 30 days on AI and employment. Primary sources only, verified and linked to their original publication.",
    "vl.int": "International",
    "vl.read": "Read the report →",
    "vl.search.label": "Search",
    "vl.search.placeholder": "Search by title, source, keyword…",
    "vl.search.clear": "Clear search",
    "vl.search.results": "{n} of {total}",
    "vl.search.empty": "No report matches your search."
  }
};

let veilleData = [];
let activeCountry = "all";
let searchQuery = "";
let searchDebounceTimer = null;

function normalizeForSearch(s) {
  return (s == null ? "" : String(s)).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function matchesSearch(v, q, lang) {
  if (!q) return true;
  const qn = normalizeForSearch(q).trim();
  if (qn === "") return true;
  const haystack = normalizeForSearch([
    v.source,
    v.date,
    v.title && v.title[lang],
    v.summary && v.summary[lang],
    v.excerpt && v.excerpt[lang]
  ].filter(Boolean).join(" "));
  return haystack.indexOf(qn) !== -1;
}

async function loadData() {
  veilleData = window.VEILLE_DATA;
  renderVeille();
}

function renderVeille() {
  const grid = document.getElementById("fieldGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const lang = window.CURRENT_LANG;
  const filtered = veilleData
    .filter((v) => activeCountry === "all" || v.country === activeCountry)
    .filter((v) => matchesSearch(v, searchQuery, lang));

  // Results counter — only shown when search or non-default country filter is active
  const counterEl = document.getElementById("resultsCounter");
  if (counterEl) {
    const isFiltering = (searchQuery && searchQuery.trim() !== "") || activeCountry !== "all";
    if (isFiltering) {
      const tpl = window.t("vl.search.results");
      counterEl.textContent = tpl.replace("{n}", filtered.length).replace("{total}", veilleData.length);
    } else {
      counterEl.textContent = "";
    }
  }

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "card-empty-state";
    empty.style.gridColumn = "1 / -1";
    const emptyKey = (searchQuery && searchQuery.trim() !== "") ? "vl.search.empty" : "empty";
    empty.textContent = window.t(emptyKey);
    grid.appendChild(empty);
    return;
  }

  filtered.forEach((v) => {
    const card = document.createElement("a");
    card.className = "field-card";
    card.href = v.url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
    card.style.textDecoration = "none";
    card.style.color = "inherit";
    card.style.display = "block";

    const meta = document.createElement("div");
    meta.className = "field-card-meta";
    const dateSpan = document.createElement("span");
    const flag = v.country === "CH" ? "🇨🇭" : v.country === "FR" ? "🇫🇷" : "🌍";
    dateSpan.textContent = flag + " · " + v.date;
    meta.appendChild(dateSpan);
    const sourceSpan = document.createElement("span");
    sourceSpan.textContent = v.source;
    meta.appendChild(sourceSpan);
    card.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "field-card-title";
    title.textContent = v.title[lang];
    card.appendChild(title);

    const excerpt = document.createElement("p");
    excerpt.className = "field-card-excerpt";
    excerpt.textContent = (v.summary && v.summary[lang]) ? v.summary[lang] : v.excerpt[lang];
    card.appendChild(excerpt);

    // AI type badge if present
    if (v.ai_type && v.ai_type !== "unspecified") {
      const aiBadge = document.createElement("div");
      aiBadge.className = "mono";
      aiBadge.style.fontSize = "10px";
      aiBadge.style.color = "var(--signal)";
      aiBadge.style.textTransform = "uppercase";
      aiBadge.style.letterSpacing = "0.1em";
      aiBadge.style.marginTop = "12px";
      const labels = {
        "generative": { fr: "IA générative", en: "Generative AI" },
        "agentic": { fr: "IA agentique", en: "Agentic AI" },
        "automation_broad": { fr: "Automatisation (large)", en: "Automation (broad)" }
      };
      const lbl = labels[v.ai_type];
      aiBadge.textContent = lbl ? lbl[lang] : v.ai_type;
      card.appendChild(aiBadge);
    }

    const link = document.createElement("span");
    link.className = "field-card-link mono";
    link.textContent = window.t("vl.read");
    card.appendChild(link);

    grid.appendChild(card);
  });
}

document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    activeCountry = chip.getAttribute("data-value");
    document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
    chip.classList.add("active");
    renderVeille();
  });
});

function applyI18nToSearch() {
  const input = document.getElementById("searchInput");
  const clearBtn = document.getElementById("searchClear");
  if (input) {
    const ph = window.t("vl.search.placeholder");
    input.placeholder = ph;
    input.setAttribute("aria-label", ph);
  }
  if (clearBtn) {
    const lbl = window.t("vl.search.clear");
    clearBtn.setAttribute("aria-label", lbl);
    clearBtn.title = lbl;
  }
}

function setupSearch() {
  const input = document.getElementById("searchInput");
  const clearBtn = document.getElementById("searchClear");
  const wrap = document.getElementById("searchWrap");
  if (!input || !clearBtn || !wrap) return;

  input.addEventListener("input", () => {
    const v = input.value;
    wrap.classList.toggle("has-value", v.length > 0);
    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
      searchQuery = v;
      renderVeille();
    }, 200);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && input.value !== "") {
      e.preventDefault();
      input.value = "";
      searchQuery = "";
      wrap.classList.remove("has-value");
      renderVeille();
    }
  });

  clearBtn.addEventListener("click", () => {
    input.value = "";
    searchQuery = "";
    wrap.classList.remove("has-value");
    input.focus();
    renderVeille();
  });
}

window.onLangChange = function () {
  applyI18nToSearch();
  renderVeille();
};

initSite("veille");
setupSearch();
applyI18nToSearch();
loadData();
</script>
</body>
</html>
