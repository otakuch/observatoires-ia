let activeFilters = { country: "all", sector: "all" };

function renderBriefings() {
  const list = document.getElementById("briefingsList");
  if (!list) return;
  list.innerHTML = "";
  const lang = window.CURRENT_LANG;

  const filtered = BRIEFINGS.filter((b) => {
    const c = activeFilters.country === "all" || b.country === activeFilters.country;
    const s = activeFilters.sector === "all" || b.sector === activeFilters.sector;
    return c && s;
  });

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "card-empty-state";
    empty.style.padding = "60px 0";
    empty.textContent = window.t("empty");
    list.appendChild(empty);
    return;
  }

  filtered.forEach((b) => {
    const row = document.createElement("div");
    row.className = "briefing-row" + (b.upcoming ? " upcoming" : "");

    // Number
    const num = document.createElement("div");
    num.className = "briefing-num";
    num.textContent = "#" + b.num;
    row.appendChild(num);

    // Body
    const body = document.createElement("div");

    // Meta
    const meta = document.createElement("div");
    meta.className = "briefing-meta";
    const date = document.createElement("span");
    date.textContent = b.date;
    meta.appendChild(date);
    const flag = document.createElement("span");
    flag.textContent = b.country === "CH" ? "🇨🇭 Suisse" : "🇫🇷 France";
    meta.appendChild(flag);
    const sect = document.createElement("span");
    sect.className = "pill-sector";
    sect.textContent = window.t("bf.sector." + b.sector);
    meta.appendChild(sect);
    if (b.upcoming) {
      const u = document.createElement("span");
      u.textContent = window.t("bf.upcoming");
      u.style.color = "var(--signal)";
      meta.appendChild(u);
    } else if (b.inProgress) {
      const ip = document.createElement("span");
      ip.textContent = window.t("bf.inprogress");
      ip.className = "pill-inprogress";
      meta.appendChild(ip);
    } else {
      const open = document.createElement("span");
      open.textContent = window.t("bf.open");
      open.className = "pill-open";
      meta.appendChild(open);
    }
    if (b.sponsored) {
      const sp = document.createElement("span");
      sp.className = "pill-sponsored";
      sp.textContent = window.t("bf.sponsored") + " · " + b.sponsor;
      meta.appendChild(sp);
    }
    body.appendChild(meta);

    // Title
    const title = document.createElement("h3");
    title.className = "briefing-title";
    if (b.upcoming || b.inProgress) {
      title.textContent = b.title[lang];
    } else {
      const a = document.createElement("a");
      a.href = "briefings/" + b.slug + ".html";
      a.textContent = b.title[lang];
      title.appendChild(a);
    }
    body.appendChild(title);

    // Summary
    const sum = document.createElement("p");
    sum.className = "briefing-summary";
    sum.textContent = b.summary[lang];
    body.appendChild(sum);

    row.appendChild(body);

    // Actions
    const actions = document.createElement("div");
    actions.className = "briefing-actions";

    if (b.upcoming) {
      const upline = document.createElement("a");
      upline.href = "contact.html?type=notify&dispatch=" + b.num;
      upline.className = "briefing-action-line";
      upline.style.color = "var(--signal)";
      upline.style.borderBottom = "1px solid var(--signal)";
      upline.style.paddingBottom = "2px";
      upline.textContent = window.t("bf.upcoming.cta") + " →";
      actions.appendChild(upline);
    } else if (b.inProgress) {
      const ipline = document.createElement("span");
      ipline.className = "briefing-action-line";
      ipline.style.color = "var(--muted)";
      ipline.style.fontStyle = "italic";
      ipline.textContent = window.t("bf.inprogress.note");
      actions.appendChild(ipline);
    } else {
      const readLink = document.createElement("a");
      readLink.href = "briefings/" + b.slug + ".html";
      readLink.className = "briefing-action-primary";
      readLink.textContent = window.t("bf.read") + " →";
      actions.appendChild(readLink);
    }

    row.appendChild(actions);
    list.appendChild(row);
  });
}

document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const filter = chip.getAttribute("data-filter");
    const value = chip.getAttribute("data-value");
    activeFilters[filter] = value;
    document.querySelectorAll(".chip[data-filter=\"" + filter + "\"]").forEach((c) => c.classList.remove("active"));
    chip.classList.add("active");
    renderBriefings();
  });
});

window.onLangChange = renderBriefings;
initSite("briefings");
renderBriefings();
