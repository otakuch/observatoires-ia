// ───────── AI DIFFUSION CHART (Microsoft) ─────────
function renderDiffusionChart() {
  const el = document.getElementById("diffChart");
  if (!el) return;
  var inlineEl = document.getElementById("diffusionData");
  var initialData = null;
  if (inlineEl) {
    try { initialData = JSON.parse(inlineEl.textContent); } catch(e) { initialData = null; }
  }
  function drawDiffusion(data) {
      const lang = document.documentElement.lang || "fr";
      const periods = data.periods.map(p => p.short);
      const countries = data.countries;

      // SVG dimensions
      const w = 880, h = 360;
      const m = { top: 24, right: 100, bottom: 56, left: 60 };
      const innerW = w - m.left - m.right;
      const innerH = h - m.top - m.bottom;

      // Y scale: 0% to 60%
      const yMax = 60;
      const yScale = v => m.top + innerH * (1 - v / yMax);
      // X scale: evenly distributed
      const xStep = innerW / (periods.length - 1);
      const xScale = i => m.left + i * xStep;

      let svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI diffusion chart">';

      // Y gridlines + labels
      for (let v = 0; v <= yMax; v += 10) {
        const y = yScale(v);
        svg += '<line x1="' + m.left + '" y1="' + y + '" x2="' + (m.left + innerW) + '" y2="' + y + '" stroke="#11110F" stroke-opacity="0.08" stroke-width="1"/>';
        svg += '<text x="' + (m.left - 10) + '" y="' + (y + 4) + '" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#11110F" fill-opacity="0.6">' + v + '%</text>';
      }

      // X labels (periods)
      periods.forEach((p, i) => {
        const x = xScale(i);
        svg += '<text x="' + x + '" y="' + (h - m.bottom + 22) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#11110F">' + p + '</text>';
      });

      // Draw lines + points for each country
      countries.forEach(country => {
        const isDashed = country.style === "dashed";
        // Path
        let pathD = "";
        country.values.forEach((v, i) => {
          const x = xScale(i);
          const y = yScale(v);
          pathD += (i === 0 ? "M" : "L") + x + "," + y;
        });
        svg += '<path d="' + pathD + '" fill="none" stroke="' + country.color + '" stroke-width="2.5"' + (isDashed ? ' stroke-dasharray="6,4"' : '') + ' opacity="' + (isDashed ? "0.55" : "1") + '"/>';

        // Points and value labels
        country.values.forEach((v, i) => {
          const x = xScale(i);
          const y = yScale(v);
          svg += '<circle cx="' + x + '" cy="' + y + '" r="' + (isDashed ? 3.5 : 5) + '" fill="' + country.color + '" opacity="' + (isDashed ? "0.55" : "1") + '"/>';
          // Value label
          const labelY = y - 12;
          svg += '<text x="' + x + '" y="' + labelY + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="' + country.color + '" opacity="' + (isDashed ? "0.65" : "1") + '">' + v.toFixed(1) + '%</text>';
        });

        // Country label at end
        const lastX = xScale(periods.length - 1);
        const lastY = yScale(country.values[country.values.length - 1]);
        const labelName = country.name.fr || country.name;
        svg += '<text x="' + (lastX + 12) + '" y="' + (lastY + 4) + '" font-family="Instrument Sans, sans-serif" font-size="13" font-weight="600" fill="' + country.color + '" opacity="' + (isDashed ? "0.7" : "1") + '">' + labelName + '</text>';
      });

      svg += '</svg>';
      el.innerHTML = svg;
  }
  
  // First draw with inline data if available
  if (initialData) {
    drawDiffusion(initialData);
  }
  // Then try fetch to override with potentially newer data (silent fail)
  fetch("../assets/data/ai-diffusion-microsoft.json")
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      var ct = r.headers.get("content-type") || "";
      if (ct.indexOf("application/json") === -1 && ct.indexOf("text/json") === -1) throw new Error("Not JSON content-type");
      return r.json();
    })
    .then(data => drawDiffusion(data))
    .catch(err => { /* silent: inline fallback already used */ });
}

document.addEventListener("DOMContentLoaded", renderDiffusionChart);


// ───────── AI EXPOSURE GAP CHART (Anthropic Economic Index Fig 2) ─────────
function renderCompareExposureChart(containerId, options) {
  options = options || {};
  const el = document.getElementById(containerId);
  if (!el) return;
  const colorCH = options.colorCH || "#D03C2F";
  const colorFR = options.colorFR || "#1F3A3D";
  const colorPositive = options.colorPositive || "#3A6B5F";
  const dataUrl = options.dataUrl || "../assets/data/ai-exposure-compare.json";

  var inlineEl = document.getElementById("compareExpData");
  var initialData = null;
  if (inlineEl) {
    try { initialData = JSON.parse(inlineEl.textContent); } catch(e) { initialData = null; }
  }
  function drawCompare(data) {
      // Sort families by max exposure to keep highest impact at top
      const families = data.families.slice().sort(function(a, b) {
        // Sort by FR exposure (Coface, common methodology) descending
        return b.fr_exposure - a.fr_exposure;
      });

      const w = 980;
      const rowH = 50; // each row contains two side-by-side bars
      const m = { top: 32, right: 60, bottom: 76, left: 270 };
      const innerH = families.length * rowH;
      const h = m.top + innerH + m.bottom;

      // Single shared bar panel for postings (-35 to +10)
      const barX = m.left + 20;
      const barW = 520;
      const postMin = -35, postMax = 10;
      const postRange = postMax - postMin;
      const postZero = barX + ((-postMin) / postRange) * barW;
      const postScale = function(v) { return barX + ((v - postMin) / postRange) * barW; };

      let svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="France-Switzerland comparison chart">';

      // Panel header
      svg += '<text x="' + (barX + barW / 2) + '" y="' + (m.top - 10) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#11110F" letter-spacing="0.06em">VARIATION DES OFFRES D\'EMPLOI · CH vs FR</text>';
      // Exposure column header
      svg += '<text x="' + (barX + barW + 80) + '" y="' + (m.top - 10) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#11110F" letter-spacing="0.06em">EXPOSITION IA</text>';

      // Posting gridlines at -30, -20, -10, 0, +10
      [-30, -20, -10, 0, 10].forEach(function(v) {
        const x = postScale(v);
        const isZero = (v === 0);
        svg += '<line x1="' + x + '" y1="' + m.top + '" x2="' + x + '" y2="' + (m.top + innerH) + '" stroke="#11110F" stroke-opacity="' + (isZero ? "0.4" : "0.06") + '" stroke-width="' + (isZero ? "1.2" : "1") + '"/>';
        const label = (v > 0 ? "+" : "") + v + "%";
        svg += '<text x="' + x + '" y="' + (m.top + innerH + 22) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#11110F" fill-opacity="0.55">' + label + '</text>';
      });

      // Draw rows
      families.forEach(function(f, i) {
        const yBase = m.top + i * rowH + 4;
        const labelText = f.label;
        const barH = 13;
        const gap = 4;

        // Family label
        svg += '<text x="' + (m.left - 14) + '" y="' + (yBase + 16) + '" text-anchor="end" font-family="Instrument Sans, sans-serif" font-size="13" font-weight="600" fill="#11110F">' + labelText + '</text>';

        // CH bar (top)
        const yCH = yBase + 4;
        const vCH = f.ch_postings;
        const colorCHBar = vCH >= 0 ? colorPositive : colorCH;
        let xCH, wCH;
        if (vCH >= 0) { xCH = postZero; wCH = postScale(vCH) - postZero; }
        else { xCH = postScale(vCH); wCH = postZero - postScale(vCH); }
        svg += '<rect x="' + xCH + '" y="' + yCH + '" width="' + Math.max(wCH, 1) + '" height="' + barH + '" fill="' + colorCHBar + '" opacity="0.9"/>';
        // CH label (left of bar): "🇨🇭 CH"
        svg += '<text x="' + (barX - 8) + '" y="' + (yCH + barH - 3) + '" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#11110F">CH</text>';
        // CH value label
        const signCH = vCH > 0 ? "+" : "";
        const labelXCH = vCH >= 0 ? (postScale(vCH) + 6) : (postScale(vCH) - 6);
        const anchorCH = vCH >= 0 ? "start" : "end";
        svg += '<text x="' + labelXCH + '" y="' + (yCH + barH - 3) + '" text-anchor="' + anchorCH + '" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="' + colorCHBar + '">' + signCH + vCH + '%</text>';

        // FR bar (bottom)
        const yFR = yCH + barH + gap;
        const vFR = f.fr_postings;
        const colorFRBar = vFR >= 0 ? colorPositive : colorFR;
        let xFR, wFR;
        if (vFR >= 0) { xFR = postZero; wFR = postScale(vFR) - postZero; }
        else { xFR = postScale(vFR); wFR = postZero - postScale(vFR); }
        svg += '<rect x="' + xFR + '" y="' + yFR + '" width="' + Math.max(wFR, 1) + '" height="' + barH + '" fill="' + colorFRBar + '" opacity="0.9"/>';
        svg += '<text x="' + (barX - 8) + '" y="' + (yFR + barH - 3) + '" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#11110F">FR</text>';
        const signFR = vFR > 0 ? "+" : "";
        const labelXFR = vFR >= 0 ? (postScale(vFR) + 6) : (postScale(vFR) - 6);
        const anchorFR = vFR >= 0 ? "start" : "end";
        svg += '<text x="' + labelXFR + '" y="' + (yFR + barH - 3) + '" text-anchor="' + anchorFR + '" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="' + colorFRBar + '">' + signFR + vFR + '%</text>';

        // Exposure column on far right
        const expX = barX + barW + 30;
        svg += '<text x="' + expX + '" y="' + (yCH + barH - 3) + '" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#11110F">CH ' + f.ch_exposure.toFixed(0) + '%</text>';
        svg += '<text x="' + expX + '" y="' + (yFR + barH - 3) + '" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#11110F">FR ' + f.fr_exposure.toFixed(1) + '%</text>';
      });

      svg += '</svg>';
      el.innerHTML = svg;
  }

  if (initialData) {
    drawCompare(initialData);
  }
  fetch(dataUrl)
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      var ct = r.headers.get("content-type") || "";
      if (ct.indexOf("application/json") === -1 && ct.indexOf("text/json") === -1) throw new Error("Not JSON content-type");
      return r.json();
    })
    .then(function(data) { drawCompare(data); })
    .catch(function() { /* silent */ });
}


document.addEventListener("DOMContentLoaded", function() { renderCompareExposureChart("expgapChart", { colorCH: "#D03C2F", colorFR: "#1F3A3D", colorPositive: "#3A6B5F", dataUrl: "../assets/data/ai-exposure-compare.json" }); });
