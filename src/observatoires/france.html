    <span class="filter-label mono" data-i18n="filter.type"></span>
    <button class="chip active" data-filter="type" data-value="all" data-i18n="filter.all"></button>
    <button class="chip" data-filter="type" data-value="public" data-i18n="type.public"></button>
    <button class="chip" data-filter="type" data-value="academique" data-i18n="type.academique"></button>

<script src="../assets/components.js"></script>
<script>
window.PAGE_I18N = {
  fr: {
    "fr.flag": "",
    "fr.title": "L'écosystème français, <em>cartographié</em>.",
    "fr.lede": "Huit observatoires entre Matignon, le ministère du Travail, l'Inria et les fédérations professionnelles. Une donnée plus dense, plus institutionnalisée, et parfois plus lente.",
    "fr.cta.full": "Dashboard détaillé",
    "fr.cta.compare": "Comparer avec la Suisse",
    "fr.kpi1.tag": "01 · Offres cadres · IA",
    "fr.kpi1.label": "des offres d'emploi cadres mentionnent une compétence IA explicite.",
    "fr.kpi1.source": "APEC · Q1 2026",
    "fr.kpi2.tag": "02 · Exposition IA générative",
    "fr.kpi2.label": "des emplois français présentent une exposition forte à l'IA générative.",
    "fr.kpi2.source": "DARES · Mars 2026",
    "fr.kpi3.tag": "03 · Recrutement junior",
    "fr.kpi3.label": "de baisse des entrées en poste des diplômés grandes écoles 2024 vs. 2022.",
    "fr.kpi3.source": "CGE · Enquête insertion 2025",
    "fr.chart.eyebrow": "Tensions ROME · top 6",
    "fr.chart.title": "Les métiers les plus tendus.",
    "fr.chart.sub": "Indice de tension France Travail 2025. Plus la valeur est élevée, plus le recrutement est difficile.",
    "fr.obs.eyebrow": "Observatoires FR · 8 sources",
    "fr.obs.title": "Qui observe quoi, en France.",
    "fr.obs.sub": "Filtrez par type d'institution et domaine d'observation. Chaque fiche renvoie à la source primaire.",
    "fr.cross.text": "Et chez le voisin <em>helvétique</em> ? Trois niveaux de gouvernement, vingt-six cantons, quatre langues nationales. Une donnée plus fragmentée, mais plus proche du terrain.",
    "fr.cross.cta": "Dashboard Suisse",
    "fr.cross.full": "Aller plus loin sur la France",
    "fr.context.tag": "Le contexte",
    "fr.context.title": "Un <em>État</em>, ses couches, ses observatoires.",
    "fr.kf1": "Niveaux administratifs (État, région, département, intercom., commune)",
    "fr.kf2": "Nomenclature unifiée des métiers",
    "fr.kf3": "Acteurs du dialogue social tripartite",
    "fr.context.text": "<p>La France gouverne par le centre. Une administration unifiée, hiérarchisée du sommet de l'État aux préfectures de département, structure la production statistique sur l'emploi. France Stratégie analyse pour Matignon, la DARES produit la statistique pour le ministère du Travail, France Travail opère sur le terrain. Cette verticalité produit des données <strong>denses, fréquentes, et relativement homogènes</strong> d'une région à l'autre, articulées autour de la nomenclature ROME pour les métiers et de la PCS-ESE pour les catégories socioprofessionnelles.</p><p>Sous l'État central, la décentralisation a empilé des couches successives : régions, départements, métropoles, intercommunalités, communes. Chaque échelon dispose de ses propres directions, de ses propres dispositifs de formation et de retour à l'emploi. Les régions pilotent désormais une part substantielle de la formation professionnelle continue, ce que ni la DARES ni France Travail ne couvrent uniformément. Le dialogue social tripartite (État, organisations syndicales, organisations patronales) ajoute une troisième dimension, qui irrigue les études APEC, OPCO et les observatoires de branche.</p><p>Sur le plan réglementaire, la France a transposé l'AI Act européen et appuie ses contrôles sur la <em>CNIL</em>, autorité de référence sur les usages de l'IA dans le management, la sélection à l'embauche et le suivi des salariés. Cette régulation horizontale, plus contraignante qu'en Suisse, alimente une production analytique abondante et parfois redondante, mais aussi singulièrement avancée sur les enjeux de gouvernance algorithmique au travail.</p>",
  },
  en: {
    "fr.flag": "",
    "fr.title": "The French ecosystem, <em>mapped</em>.",
    "fr.lede": "Eight observatories between the Prime Minister's Office, the Ministry of Labour, Inria and professional federations. Denser, more institutionalised data, and sometimes slower.",
    "fr.cta.full": "Detailed dashboard",
    "fr.cta.compare": "Compare with Switzerland",
    "fr.kpi1.tag": "01 · Executive offers · AI",
    "fr.kpi1.label": "of executive job postings now mention an explicit AI skill.",
    "fr.kpi1.source": "APEC · Q1 2026",
    "fr.kpi2.tag": "02 · Generative AI exposure",
    "fr.kpi2.label": "of French jobs show high exposure to generative AI.",
    "fr.kpi2.source": "DARES · March 2026",
    "fr.kpi3.tag": "03 · Junior hiring",
    "fr.kpi3.label": "drop in job entries for 2024 grandes écoles graduates vs. 2022.",
    "fr.kpi3.source": "CGE · 2025 insertion survey",
    "fr.chart.eyebrow": "ROME tensions · top 6",
    "fr.chart.title": "The most strained occupations.",
    "fr.chart.sub": "France Travail tension index 2025. The higher the value, the harder it is to recruit.",
    "fr.obs.eyebrow": "FR observatories · 8 sources",
    "fr.obs.title": "Who observes what, in France.",
    "fr.obs.sub": "Filter by institution type and observation domain. Each card links to the primary source.",
    "fr.cross.text": "And on the <em>Swiss</em> side? Three levels of government, twenty-six cantons, four national languages. Data that is more fragmented, but closer to the ground.",
    "fr.cross.cta": "Switzerland dashboard",
    "fr.cross.full": "Dive deeper into France",
    "fr.context.tag": "The context",
    "fr.context.title": "One <em>State</em>, its layers, its observatories.",
    "fr.kf1": "Administrative levels (State, region, department, intercom., municipality)",
    "fr.kf2": "Unified national job classification",
    "fr.kf3": "Tripartite social dialogue actors",
    "fr.context.text": "<p>France governs from the centre. A unified, hierarchical administration, stretching from the apex of the state down to departmental prefectures, structures the production of employment statistics. France Stratégie analyses for the Prime Minister's office, DARES produces statistics for the Ministry of Labour, France Travail operates on the ground. This verticality yields <strong>dense, frequent, and relatively homogeneous</strong> data from one region to another, articulated around the ROME job classification and the PCS-ESE socio-professional categories.</p><p>Beneath the central state, decentralisation has stacked successive layers: regions, departments, metropolises, intermunicipal bodies, municipalities. Each level has its own directorates, its own training and return-to-work schemes. The regions now pilot a substantial share of continuing vocational training, an area that neither DARES nor France Travail covers uniformly. Tripartite social dialogue (state, trade unions, employer organisations) adds a third dimension that irrigates APEC studies, OPCO publications and sectoral observatories.</p><p>On the regulatory side, France has transposed the European AI Act and relies on the <em>CNIL</em>, the reference authority on AI use in management, hiring selection and employee monitoring. This horizontal regulation, stricter than in Switzerland, fuels abundant and sometimes redundant analytical output, but also a uniquely advanced posture on workplace algorithmic governance.</p>"
  }
};

const TENSIONS = [
  { fr: "Ingénieurs IA / ML", en: "AI / ML engineers", value: 92 },
  { fr: "Cybersécurité", en: "Cybersecurity", value: 87 },
  { fr: "Soins infirmiers", en: "Nursing", value: 81 },
  { fr: "Conducteurs PL", en: "Truck drivers", value: 76 },
  { fr: "Aide à domicile", en: "Home care workers", value: 73 },
  { fr: "Maçons", en: "Masons", value: 64 }
];

let observatoires = [];
let activeFilters = { type: "all", domain: "all" };

async function loadData() {
  observatoires = window.OBSERVATOIRES_DATA.filter((o) => o.country === "FR");
  renderCards();
  renderChart();
}

function renderCards() {
  const grid = document.getElementById("cardsGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const lang = window.CURRENT_LANG;

  const filtered = observatoires.filter((o) => {
    const ty = activeFilters.type === "all" || o.type === activeFilters.type;
    const d = activeFilters.domain === "all" || o.domains.includes(activeFilters.domain);
    return ty && d;
  });

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "card-empty-state";
    empty.textContent = window.t("empty");
    grid.appendChild(empty);
    return;
  }

  filtered.forEach((o) => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = o.url;
    card.target = "_blank";
    card.rel = "noopener";

    const meta = document.createElement("div");
    meta.className = "card-meta mono";
    const flag = document.createElement("span");
    flag.className = "flag flag-fr";
    const dot = document.createElement("span");
    dot.className = "flag-dot";
    flag.appendChild(dot);
    flag.appendChild(document.createTextNode("France"));
    meta.appendChild(flag);
    const typeSpan = document.createElement("span");
    typeSpan.textContent = window.t("type." + o.type);
    meta.appendChild(typeSpan);
    card.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = o.nom;
    card.appendChild(title);

    const org = document.createElement("div");
    org.className = "card-org";
    org.textContent = o.org[lang];
    card.appendChild(org);

    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = o.desc[lang];
    card.appendChild(desc);

    const tags = document.createElement("div");
    tags.className = "card-tags";
    o.domains.forEach((d) => {
      const tag = document.createElement("span");
      tag.className = "card-tag";
      tag.textContent = window.t("domain." + d);
      tags.appendChild(tag);
    });
    card.appendChild(tags);

    const footer = document.createElement("div");
    footer.className = "card-footer";
    const lastSpan = document.createElement("span");
    lastSpan.textContent = window.t("card.last") + " · " + o.last;
    footer.appendChild(lastSpan);
    const linkSpan = document.createElement("span");
    linkSpan.className = "visit";
    linkSpan.textContent = window.t("card.visit");
    footer.appendChild(linkSpan);
    card.appendChild(footer);

    grid.appendChild(card);
  });
}

function renderChart() {
  const chart = document.getElementById("frBarChart");
  if (!chart) return;
  chart.innerHTML = "";
  const lang = window.CURRENT_LANG;

  TENSIONS.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "bar-row";

    const label = document.createElement("div");
    label.textContent = s[lang];
    row.appendChild(label);

    const track = document.createElement("div");
    track.className = "bar-track";
    const fill = document.createElement("div");
    fill.className = "bar-fill teal";
    fill.style.width = "0%";
    track.appendChild(fill);
    row.appendChild(track);

    const value = document.createElement("div");
    value.className = "bar-value";
    value.textContent = s.value;
    row.appendChild(value);

    chart.appendChild(row);

    setTimeout(() => {
      fill.style.width = s.value + "%";
    }, 100 + i * 80);
  });
}

document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const filter = chip.getAttribute("data-filter");
    const value = chip.getAttribute("data-value");
    activeFilters[filter] = value;
    document.querySelectorAll(".chip[data-filter=\"" + filter + "\"]").forEach((c) => c.classList.remove("active"));
    chip.classList.add("active");
    renderCards();
  });
});

window.onLangChange = function() {
  renderCards();
  renderChart();
};

initSite("france");
loadData();
</script>
</body>
</html>
