    "ch.context.text": "<p>La Suisse n'a pas d'État central au sens français du terme. Trois niveaux de gouvernement coexistent : la Confédération, vingt-six cantons souverains et près de deux mille communes. Chacun produit ses propres données, ses propres normes, ses propres temporalités. Comprendre l'impact de l'IA sur le travail suisse implique donc de naviguer entre l'Office fédéral de la statistique, qui agrège au sommet, et les services cantonaux de l'emploi, qui observent au plus près du terrain.</p><p>À cette architecture politique s'ajoute une réalité linguistique. <strong>Quatre langues nationales</strong> structurent la production statistique : l'allemand domine quantitativement, le français anime le débat romand, l'italien couvre le Tessin, le romanche persiste dans quelques vallées grisonnes. Les sources alémaniques (KOF Konjunkturforschungsstelle, BAK Economics) circulent peu en Suisse romande et inversement. Cette cartographie reconnaît ce biais et travaille à le corriger version après version.</p><p>Le système de formation suisse repose enfin sur la coexistence d'une voie académique et d'une voie professionnelle duale. Le SEFRI pilote au niveau fédéral les certifications professionnelles, dont les filières IA émergentes. Cette particularité façonne la manière dont la reconversion s'organise : <em>moins par diplômes universitaires que par brevets fédéraux et certifications continues</em>. Sur le plan réglementaire, la Suisse n'a pas adopté de loi spécifique à l'IA en 2026 et privilégie l'adaptation sectorielle des cadres existants.</p>",

    "ch.expgap.eyebrow": "KOF/ETH · Klaeui & Siegenthaler · adoption Microsoft Diffusion · Adecco/PwC",
    "ch.expgap.title": "Effet documenté de l'IA sur le marché du travail suisse · <em>l'exposition coïncide avec la contraction des offres</em>.",
    "ch.expgap.sub": "Le KOF de l'ETH Zurich (Klaeui & Siegenthaler, décembre 2025) documente pour la première fois que depuis fin 2022, le chômage progresse jusqu'à 30% plus vite dans les professions hautement exposées à l'IA que dans les métiers peu concernés. Au maximum, un cinquième de la hausse du chômage est attribuable à l'IA. Le graphique croise l'exposition IA estimée par grande famille NP 2010 avec la variation des offres d'emploi en Suisse entre 2023 et 2025 (Adecco/KOF Swiss Job Market Index Q3 2025, étude Adecco bureau et administration octobre 2025).",
    "ch.expgap.legend.theoretical": "Exposition IA (NP 2010)",
    "ch.expgap.legend.observed": "Variation des offres 2023-2025",
    "ch.expgap.readline": "<strong>Lecture pour la Suisse</strong> · adoption IA en Suisse à <strong>37,8% Q1 2026</strong> (Microsoft, rang 14 mondial) et <strong>47%</strong> des 16-74 ans (OFS, 3e rang européen). Bureau et administration <strong>-17,4%</strong>/an d'offres, informatique <strong>-30%</strong> en un an, marketing et journalisme sévèrement touchés (KOF). À l'inverse, les <strong>agents de services commerciaux</strong> (courtage, immobilier) progressent malgré une exposition modérée. Santé, soins, construction et services à la personne résistent. <strong>AI Frontiers · Anton Shenk (RAND), 11 mai 2026</strong>, place ces chiffres suisses dans le débat macroéconomique mondial : l'écart entre Acemoglu (+0,71% productivité US sur 10 ans) et Epoch AI (jusqu'à +30% si singularité économique) atteint 1 quadrillion $ cumulés d'ici 2035. Les données suisses KOF/Adecco documentées ici (informatique -30% offres, mais administration plus large à -17%) sont cohérentes avec le bear case institutionnel OECD : friction sectorielle élevée, adoption lente, Baumol's cost disease. Mai 2026 reste un point bas du compteur skeptic/optimiste. <strong>OCDE · AI adoption by SMEs · discussion paper G7 (9 décembre 2025)</strong> ajoute le cadre de référence 2026 sur l'adoption PME : entre 0,2 et 1,3 points de croissance annuelle de la productivité du travail dans les économies G7 sur 10 ans selon le scénario d'adoption (comparable boom ICT US 1990s à 0,5-1,5 pp), adoption agrégée OCDE passée de 5,6% (2020) à 14% (2024), gap persistant petites entreprises 17% / moyennes 30% vs grandes entreprises. La Suisse n'est pas membre du G7 mais l'analyse OCDE applique au tissu suisse via le même mécanisme : 4 barrières dominantes (compétences pour 50% des PME interrogées, financement, infrastructure, pertinence perçue), 39% des PME utilisatrices d'IA générative déclarent qu'elle compense leur skill gap, et 76% des PME restent à un stade de novices (outils basiques sur fonctions isolées) selon l'enquête D4SME 2026 (2 018 PME, 12 pays). À ce constat institutionnel s'ajoute un contrepoint empirique UK : <strong>Pedro Serôdio (British Progress, thread X du 22 avril 2026)</strong> documente qu'au Royaume-Uni, les occupations à forte exposition IA ont en moyenne grandi PLUS vite que les peu exposées trois ans après ChatGPT (résultat robuste sur 4 mesures d'exposition et 2 sources de données). Hétérogénéité occupationnelle frappante depuis 2021 : analystes business IT +38% et programmeurs +18%, mais call-centre -19% et télévendeurs -23%. Ce que l'IA augmente ou substitue compte plus que le score d'exposition lui-même. Lecture complémentaire au pattern KOF/ETH suisse (+27% chômage métiers très exposés <50 ans) qui isole la substitution sans mesurer l'augmentation et la réallocation. Sur le plan théorique, <strong>NBER WP 33509 (Hampole/Papanikolaou/Schmidt/Seegmiller, révisé septembre 2025)</strong> formalise pourquoi : la moyenne d'exposition tâche-level déprime la demande (substitution directe), mais la concentration de l'exposition sur quelques tâches permet la réallocation d'effort vers les tâches non automatisées · les effets emploi globaux sont modestes malgré une substitution forte tâche-level, compensés par la hausse de productivité dans les firmes adoptrices. Sur le plan empirique entry-level, <strong>Brynjolfsson/Chandar/Chen (Stanford Digital Economy Lab, 13 novembre 2025)</strong> exploitent des données ADP haute fréquence pour documenter que les 22-25 ans en métiers AI-exposed accusent -16% d'emploi relatif vs stabilité pour les expérimentés, MAIS uniquement où l'IA automatise le travail, pas où elle l'augmente. Distinction empirique opérationnelle pour les DRH : prioriser les outils IA à logique augmentative dans les fonctions d'entrée pour préserver les pipelines de talent.",
    "ch.expgap.source": "Sources · KOF/ETH Klaeui & Siegenthaler décembre 2025 · Adecco/KOF Swiss Job Market Index Q3 2025 · PwC AI Jobs Barometer 2025 · OFS Enquête utilisation Internet 2025 · Microsoft AI Diffusion Q1 2026 · AI Frontiers · Anton Shenk (RAND) · The Quadrillion-Dollar Disagreement on AI and the Economy · mai 2026 · OECD · AI adoption by small and medium-sized enterprises · discussion paper G7 · décembre 2025 · OECD Filippucci et al. · Miracle or Myth · novembre 2024 · Brookings · Baily/Brynjolfsson/Korinek · Machines of Mind · 2023 · Pedro Serôdio (British Progress) · Is AI killing jobs? · thread X · 22 avril 2026 · NBER WP 33509 · Hampole/Papanikolaou/Schmidt/Seegmiller · Artificial Intelligence and the Labor Market · révisé septembre 2025 · Stanford Digital Economy Lab · Brynjolfsson/Chandar/Chen · Canaries in the Coal Mine · 13 novembre 2025 · Goldman Sachs Research · Briggs/Dong · How Will AI Affect the Global Workforce? · août 2025 · NBER WP 33509 · Hampole/Papanikolaou/Schmidt/Seegmiller · Artificial Intelligence and the Labor Market · révisé septembre 2025 · Stanford Digital Economy Lab · Brynjolfsson/Chandar/Chen · Canaries in the Coal Mine · 13 novembre 2025 · Goldman Sachs Research · Briggs/Dong · How Will AI Affect the Global Workforce? · août 2025",

    "ch.intl.title": "What Switzerland <em>shares</em> and what <em>sets it apart</em>.",
    "ch.intl.text": "<p>The three DemoSCOPE indicators above gain meaning when placed in the international picture. The monthly <strong>Focaldata × Financial Times</strong> tracker published in April 2026 (n=4,119, UK+US) confirms that the asymmetry observed in Switzerland is neither an exception nor a delay: it is the dominant pattern of AI deployment in 2026 across advanced economies.</p><p>Three convergent findings should anchor the Swiss reading. <strong>AI usage follows an L-shaped distribution</strong>, not a bell curve: 35% of UK+US workers never use AI, 11-18% use it daily, the rest only occasionally. <strong>The most powerful identified lever remains training</strong>: a company that trains its teams sees +37 points of daily usage, but only 14% of workers have received formal training. <strong>Aggregate productivity gains remain modest</strong> (+3.5% total) but heavily concentrated in tech (+7.8%) and finance (+5.1%).</p><p>For Switzerland, whose productive structure is more oriented toward high-end tertiary than the UK and US economies, these signals suggest that the concentration of gains will be <em>mechanically more pronounced</em>. The DemoSCOPE finding : continuing education rated the most effective measure by workers themselves (M=3.27/4) : converges with the international finding: training is <em>the</em> priority public policy lever to prevent Bifurcation from becoming the default scenario.</p>",

    "ch.kf3": "Academic + vocational tracks",
    "ch.context.text": "<p>Switzerland has no central state in the French sense of the term. Three levels of government coexist: the Confederation, twenty-six sovereign cantons, and nearly two thousand municipalities. Each produces its own data, its own rules, its own timelines. Understanding AI's impact on Swiss work therefore means navigating between the Federal Statistical Office, which aggregates at the top, and the cantonal employment services, which observe closest to the ground.</p><p>On top of this political architecture sits a linguistic reality. <strong>Four national languages</strong> structure statistical production: German dominates quantitatively, French animates the western Swiss debate, Italian covers Ticino, Romansh persists in a few Grison valleys. German-speaking sources (KOF Konjunkturforschungsstelle, BAK Economics) circulate little in French-speaking Switzerland and vice versa. This cartography acknowledges that bias and works to correct it, version after version.</p><p>The Swiss training system finally rests on the coexistence of an academic track and a dual vocational one. SERI steers federal-level professional certifications, including emerging AI tracks. This particularity shapes how reskilling organises itself: <em>less through university degrees than through federal certificates and continuing education credentials</em>. On the regulatory side, Switzerland has not adopted AI-specific legislation in 2026 and favours sectoral adaptation of existing frameworks.</p>",

l finding adds a UK empirical counterpoint: <strong>Pedro Serôdio (British Progress, X thread April 22, 2026)</strong> documents that in the UK, highly AI-exposed occupations on average grew FASTER than less-exposed ones three years after ChatGPT (result robust across 4 exposure measures and 2 data sources). Striking occupational heterogeneity since 2021: IT business analysts +38% and programmers +18%, but call-centre roles -19% and telephone salespersons -23%. What AI augments or substitutes matters more than the exposure score itself. Complementary reading to the Swiss KOF/ETH pattern (+27% unemployment in highly exposed occupations <50 years) which isolates substitution without measuring augmentation and reallocation. On the theoretical side, <strong>NBER WP 33509 (Hampole/Papanikolaou/Schmidt/Seegmiller, revised September 2025)</strong> formalizes why: mean task-level exposure depresses demand (direct substitution), but concentration of exposure on a few tasks allows effort reallocation toward non-automated tasks · aggregate employment effects are modest despite strong task-level substitution, offset by productivity-driven labor demand growth at AI-adopting firms. On the empirical entry-level side, <strong>Brynjolfsson/Chandar/Chen (Stanford Digital Economy Lab, November 13, 2025)</strong> leverage high-frequency ADP data to document that ages 22-25 in AI-exposed occupations face -16% relative employment vs stable for experienced workers, BUT only where AI automates work, not where it augments. Operational empirical distinction for HR: prioritize augmentative-logic AI tools in entry-level functions to preserve talent pipelines.",

const SECTOR_ADOPTION = [
  { fr: "Finance & Banque", en: "Finance & Banking", value: 68 },
  { fr: "Conseil & Services", en: "Consulting & Services", value: 54 },
  { fr: "Industrie pharma", en: "Pharma industry", value: 49 },
  { fr: "Horlogerie & Luxe", en: "Watchmaking & Luxury", value: 31 },
  { fr: "Construction", en: "Construction", value: 18 },
  { fr: "Hôtellerie", en: "Hospitality", value: 12 }
];

let observatoires = [];
let activeFilters = { type: "all", domain: "all" };

async function loadData() {
  observatoires = window.OBSERVATOIRES_DATA.filter((o) => o.country === "CH");
  renderCards();
  renderChart();
}

function renderCards() {
  const grid = document.getElementById("cardsGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const lang = window.CURRENT_LANG;

  const filtered = observatoires.filter((o) => {
    const ty = activeFilters.type === "all" || o.type === activeFilters.type;
    const d = activeFilters.domain === "all" || o.domains.includes(activeFilters.domain);
    return ty && d;
  });

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "card-empty-state";
    empty.textContent = window.t("empty");
    grid.appendChild(empty);
    return;
  }

  filtered.forEach((o) => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = o.url;
    card.target = "_blank";
    card.rel = "noopener";

    const meta = document.createElement("div");
    meta.className = "card-meta mono";
    const flag = document.createElement("span");
    flag.className = "flag flag-ch";
    const dot = document.createElement("span");
    dot.className = "flag-dot";
    flag.appendChild(dot);
    flag.appendChild(document.createTextNode("Suisse"));
    meta.appendChild(flag);
    const typeSpan = document.createElement("span");
    typeSpan.textContent = window.t("type." + o.type);
    meta.appendChild(typeSpan);
    card.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = o.nom;
    card.appendChild(title);

    const org = document.createElement("div");
    org.className = "card-org";
    org.textContent = o.org[lang];
    card.appendChild(org);

    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = o.desc[lang];
    card.appendChild(desc);

    const tags = document.createElement("div");
    tags.className = "card-tags";
    o.domains.forEach((d) => {
      const tag = document.createElement("span");
      tag.className = "card-tag";
      tag.textContent = window.t("domain." + d);
      tags.appendChild(tag);
    });
    card.appendChild(tags);

    const footer = document.createElement("div");
    footer.className = "card-footer";
    const lastSpan = document.createElement("span");
    lastSpan.textContent = window.t("card.last") + " · " + o.last;
    footer.appendChild(lastSpan);
    const linkSpan = document.createElement("span");
    linkSpan.className = "visit";
    linkSpan.textContent = window.t("card.visit");
    footer.appendChild(linkSpan);
    card.appendChild(footer);

    grid.appendChild(card);
  });
}

function renderChart() {
  const chart = document.getElementById("chBarChart");
  if (!chart) return;
  chart.innerHTML = "";
  const lang = window.CURRENT_LANG;
  const max = 100;

  SECTOR_ADOPTION.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "bar-row";

    const label = document.createElement("div");
    label.textContent = s[lang];
    row.appendChild(label);

    const track = document.createElement("div");
    track.className = "bar-track";
    const fill = document.createElement("div");
    fill.className = "bar-fill" + (i < 2 ? " signal" : "");
    fill.style.width = "0%";
    track.appendChild(fill);
    row.appendChild(track);

    const value = document.createElement("div");
    value.className = "bar-value";
    value.textContent = s.value + "%";
    row.appendChild(value);

    chart.appendChild(row);

    // Animate after a tick
    setTimeout(() => {
      fill.style.width = (s.value / max * 100) + "%";
    }, 100 + i * 80);
  });
}

document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const filter = chip.getAttribute("data-filter");
    const value = chip.getAttribute("data-value");
    activeFilters[filter] = value;
    document.querySelectorAll(".chip[data-filter=\"" + filter + "\"]").forEach((c) => c.classList.remove("active"));
    chip.classList.add("active");
    renderCards();
  });
});

window.onLangChange = function() {
  renderCards();
  renderChart();
};

// Accordion toggle for reinvent section
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll("#chReinventList .reinvent-trigger").forEach(function(trigger) {
    trigger.addEventListener("click", function() {
      var item = trigger.closest(".reinvent-item");
      item.classList.toggle("open");
    });
  });
});


// ───────── AI EXPOSURE GAP CHART (Anthropic Economic Index Fig 2) ─────────
function renderSwissExposureChart(containerId, options) {
  options = options || {};
  const el = document.getElementById(containerId);
  if (!el) return;
  const colorExposure = options.colorExposure || "#B7C5C7";
  const colorPositive = options.colorPositive || "#1F3A3D";
  const colorNegative = options.colorNegative || "#D03C2F";
  const dataUrl = options.dataUrl || "../assets/data/ai-exposure-switzerland.json";

  var inlineEl = document.getElementById("swissExpData");
  var initialData = null;
  if (inlineEl) {
    try { initialData = JSON.parse(inlineEl.textContent); } catch(e) { initialData = null; }
  }
  function drawSwiss(data) {
      // Sort families by AI exposure descending for clearer reading
      const families = data.families.slice().sort(function(a, b) { return b.ai_exposure - a.ai_exposure; });

      // SVG dimensions
      const w = 920;
      const rowH = 34;
      const m = { top: 24, right: 60, bottom: 64, left: 250 };
      const innerH = families.length * rowH;
      const h = m.top + innerH + m.bottom;

      // Split into 2 panels: exposure (0-100%) on left, posting change (-30 to +10) on right
      // Layout:
      // | label | exposure bar (light, 0-100%) | postings bar (positive teal / negative red, centered on zero) |
      const expW = 360;
      const expScale = function(v) { return m.left + (v / 100) * expW; };

      const postX = m.left + expW + 40;
      const postW = 230;
      const postMin = -30, postMax = 10;
      const postRange = postMax - postMin;
      const postZero = postX + ((-postMin) / postRange) * postW;
      const postScale = function(v) { return postX + ((v - postMin) / postRange) * postW; };

      let svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Swiss AI exposure chart">';

      // Panel headers
      svg += '<text x="' + (m.left + expW / 2) + '" y="' + (m.top - 6) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#11110F" letter-spacing="0.06em">EXPOSITION IA</text>';
      svg += '<text x="' + (postX + postW / 2) + '" y="' + (m.top - 6) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#11110F" letter-spacing="0.06em">OFFRES EMPLOI 2023-2025</text>';

      // Exposure axis gridlines + labels at 0, 25, 50, 75, 100
      [0, 25, 50, 75, 100].forEach(function(v) {
        const x = expScale(v);
        svg += '<line x1="' + x + '" y1="' + m.top + '" x2="' + x + '" y2="' + (m.top + innerH) + '" stroke="#11110F" stroke-opacity="0.06" stroke-width="1"/>';
        svg += '<text x="' + x + '" y="' + (m.top + innerH + 22) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#11110F" fill-opacity="0.55">' + v + '%</text>';
      });

      // Posting change axis gridlines at -30, -20, -10, 0, +10
      [-30, -20, -10, 0, 10].forEach(function(v) {
        const x = postScale(v);
        const isZero = (v === 0);
        svg += '<line x1="' + x + '" y1="' + m.top + '" x2="' + x + '" y2="' + (m.top + innerH) + '" stroke="#11110F" stroke-opacity="' + (isZero ? "0.35" : "0.06") + '" stroke-width="' + (isZero ? "1.2" : "1") + '"' + (isZero ? "" : "") + '/>';
        const label = (v > 0 ? "+" : "") + v + "%";
        svg += '<text x="' + x + '" y="' + (m.top + innerH + 22) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#11110F" fill-opacity="0.55">' + label + '</text>';
      });

      // Draw each row
      families.forEach(function(f, i) {
        const y = m.top + i * rowH + 6;
        const barH = 14;
        const label = f.label;

        // Row label (left)
        svg += '<text x="' + (m.left - 14) + '" y="' + (y + barH - 2) + '" text-anchor="end" font-family="Instrument Sans, sans-serif" font-size="12" font-weight="500" fill="#11110F">' + label + '</text>';

        // Exposure bar (light)
        const expWidth = expScale(f.ai_exposure) - m.left;
        svg += '<rect x="' + m.left + '" y="' + y + '" width="' + expWidth + '" height="' + barH + '" fill="' + colorExposure + '"/>';
        svg += '<text x="' + (expScale(f.ai_exposure) + 6) + '" y="' + (y + barH - 3) + '" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#11110F">' + f.ai_exposure + '%</text>';

        // Posting change bar (positive teal, negative red)
        const v = f.job_posting_change_pct;
        const fillColor = v >= 0 ? colorPositive : colorNegative;
        let rectX, rectW;
        if (v >= 0) {
          rectX = postZero;
          rectW = postScale(v) - postZero;
        } else {
          rectX = postScale(v);
          rectW = postZero - postScale(v);
        }
        svg += '<rect x="' + rectX + '" y="' + y + '" width="' + Math.max(rectW, 1) + '" height="' + barH + '" fill="' + fillColor + '"/>';
        // Value label
        const sign = v > 0 ? "+" : "";
        const labelX = v >= 0 ? (postScale(v) + 6) : (postScale(v) - 6);
        const labelAnchor = v >= 0 ? "start" : "end";
        svg += '<text x="' + labelX + '" y="' + (y + barH - 3) + '" text-anchor="' + labelAnchor + '" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="' + fillColor + '">' + sign + v + '%</text>';
      });

      svg += '</svg>';
      el.innerHTML = svg;
  }

  // First draw with inline data if available
  if (initialData) {
    drawSwiss(initialData);
  }
  // Then try fetch to override (silent fail)
  fetch(dataUrl)
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      var ct = r.headers.get("content-type") || "";
      if (ct.indexOf("application/json") === -1 && ct.indexOf("text/json") === -1) throw new Error("Not JSON content-type");
      return r.json();
    })
    .then(function(data) { drawSwiss(data); })
    .catch(function() { /* silent: inline fallback already used */ });
}
