    "b1.roles.r4.name": "Responsable conformité bancaire",
    "b1.roles.r4.exp": "5/10",
    "b1.roles.r4.expLabel": "exposition",
    "b1.roles.r4.head": "6 000",
    "b1.roles.r4.headLabel": "actifs CH",
    "b1.roles.r4.shift": "Exposition modérée, mais transformation profonde. La veille réglementaire, le screening AML de premier niveau, le contrôle KYC standard sont massivement outillés. La fonction monte en gamme sur les sanctions cross-border complexes, la gouvernance des données client face à la nLPD et au RGPD, le pilotage des solutions RegTech. C'est ici que se joue l'arbitrage entre les automatismes IA et la supervision humaine attendue par la FINMA.",
    "b1.roles.r4.pivot": "Expert AML et sanctions internationales (OFAC, GAFI, transactions cross-border). Responsable données et vie privée bancaire (nLPD, RGPD). Consultant RegTech et automatisation compliance.",

    "b1.roles.r5.domain": "Banque, assurance, immobilier",
    "b1.roles.r5.name": "Directeur d'agence bancaire",
    "b1.roles.r5.exp": "5/10",
    "b1.roles.r5.expLabel": "exposition",
    "b1.roles.r5.head": "5 000",
    "b1.roles.r5.headLabel": "actifs CH",
    "b1.roles.r5.shift": "La fonction de pilotage local résiste, mais sa raison d'être se déplace. Les indicateurs commerciaux et le reporting d'agence se standardisent dans les dashboards. Ce que la direction d'agence apporte de spécifique se concentre sur la connaissance fine du tissu économique local, le pilotage de la relation aux PME du bassin, et l'animation d'une équipe de plus en plus hybride entre conseillers humains et outils IA.",
    "b1.roles.r5.pivot": "Directeur commercial régional avec mandat d'animation réseau. Expert PME et financement local. Responsable private banking sur clientèle premium régionale.",

    "b1.tools.eyebrow": "L'IA comme levier",
    "b1.tools.title": "Six <em>outils</em> qu'utilisent les équipes qui avancent.",
    "b1.tools.intro": "Sélection observée dans les déploiements réels des six grandes banques privées suisses interrogées. La maîtrise n'est pas dans le choix de l'outil, mais dans la définition du cas d'usage et la gouvernance des données qu'il manipule.",

    "b1.tools.t1.cat": "Conformité & AML",
    "b1.tools.t1.name": "Modèles propriétaires + Claude Enterprise",
    "b1.tools.t1.desc": "Détection de schémas de transactions atypiques, génération de premiers rapports SDD, classification de documents KYC. Piste d'audit native, retention contrôlée.",

    "b1.tools.t2.cat": "Conseil client",
    "b1.tools.t2.name": "Synthèse de portefeuille",
    "b1.tools.t2.desc": "Préparation d'entretiens, génération de notes de conviction, rapprochement entre contraintes du client et univers d'investissement disponible.",

    "b1.tools.t3.cat": "Knowledge management",
    "b1.tools.t3.name": "RAG sur archives internes",
    "b1.tools.t3.desc": "Recherche sémantique sur la documentation juridique, fiscale, produit. Réduit le temps de réponse interne entre les fronts office et les desks de spécialistes.",

    "b1.tools.t4.cat": "Trading & marchés",
    "b1.tools.t4.name": "Modèles classiques + LLM en surcouche",
    "b1.tools.t4.desc": "Pas de LLM en boucle de décision. Usage cantonné à la lecture de news, l'analyse sentiment et la rédaction de notes pour les gérants. FINMA prudente.",

    "b1.tools.t5.cat": "Cybersécurité",
    "b1.tools.t5.name": "EDR augmenté + détection d'intrusion",
    "b1.tools.t5.desc": "Triage automatisé des alertes SOC, classification d'incidents par criticité. Délestage massif du niveau 1, tension recrutement sur le niveau 2 et 3.",

    "b1.tools.t6.cat": "Productivité",
    "b1.tools.t6.name": "Copilot d'entreprise gouverné",
    "b1.tools.t6.desc": "Rédaction interne, traduction quadrilingue, assistance bureautique. Le vrai chantier est sur la politique d'usage et la formation, pas sur l'outil.",

    "b1.act.eyebrow": "Aller plus loin",

    "b1.act.c1.tag": "Dispatch sur mesure",
    "b1.act.c1.title": "Une dépêche dédiée à votre établissement",
    "b1.act.c1.desc": "Format Le Dispatch·iA appliqué à votre périmètre exact : revue des cas d'usage déployés chez vos pairs, cartographie compliance adaptée à votre statut, matrice de priorisation chiffrée, trois scénarios d'architecture pour votre situation. Livré sous quinze jours. Devis sur demande.",

    "b1.act.c2.title": "Du cadrage à l'architecture des workflows",
    "b1.act.c2.desc": "Accompagnement à la transformation : organisation documentaire, gouvernance des données, design des agents IA, choix d'architecture (cloud souverain, hybride, on-premise), formation des équipes. Intervention en demi-journées ou en mission cadrée. Premier échange gratuit.",

    "b1.src.eyebrow": "Annexe · Sources & traçabilité",
    "b1.src.title": "Les chiffres cités, ouverts à la <em>vérification</em>.",
    "b1.src.intro": "Une dépêche n'a de valeur que si ses chiffres sont vérifiables. Chaque indicateur de cette dépêche renvoie ci-dessous à sa publication d'origine. Sources primaires intégralement citées, sans paywall ni rétention.",
    "b1.src.s1.label": "Digital Switzerland · Baromètre IA générative · Q1 2026",
    "b1.src.s1.cited": "Citée pour le chiffre <strong>68% des banques suisses ont au moins un cas d'usage IA générative en production</strong>. Échantillon de 142 institutions financières répondantes, dont 38 banques privées.",
    "b1.src.s2.label": "OFS · Statistique de l'emploi (STATEM) · Q1 2026",
    "b1.src.s2.cited": "Citée pour le chiffre <strong>−9% de postes vacants tech dans le secteur bancaire suisse</strong>, comparaison Q1 2026 vs. Q1 2025. Périmètre NOGA 64 (services financiers).",
    "b1.src.s3.label": "Swiss Bankers Association · Étude compliance & IA · 2025",
    "b1.src.s3.cited": "Citée pour le chiffre <strong>12% de réduction du temps moyen sur les tâches de compliance de premier niveau</strong>. Mesuré dans 8 banques pilotes.",
    "b1.src.primary": "Source primaire ↗",
    "b1.src.note": "Note. Les chiffres présentés ici sont arrondis. Les marges d'incertitude et les méthodologies détaillées de chaque source sont accessibles sur la page Méthodologie. Les sources non répertoriées dans la cartographie (Swiss Bankers Association notamment) sont en cours d'évaluation pour une intégration future.",


    "b1.arch.eyebrow": "Le travailleur recomposé · 4 archétypes face à l'IA",
    "b1.arch.title": "Quatre archétypes pour <em>recomposer les postes bancaires</em>, pas pour les couper.",
    "b1.arch.lede": "Le sociologue Yann Ferguson, présenté aux Rencontres Numériques de Strasbourg en avril 2026 avec Yves Caseau, propose un cadre d'analyse directement actionnable pour les directions RH bancaires. Plutôt que de décider entre garder ou couper un poste cadre, la question pratique est de choisir quel archétype de travailleur l'organisation veut produire. Chaque archétype implique un mode de pilotage RH spécifique, et un risque éthique particulier.",
    "b1.arch.a1.tag": "Risque · à éviter",
    "b1.arch.a1.name": "Le travailleur remplacé",
    "b1.arch.a1.body": "L'automatisation réduit les emplois par attrition silencieuse plutôt que par licenciements. Pour la banque retail suisse, ce scénario concerne typiquement la compression progressive des back-office et des fonctions de KYC de premier niveau, sans plan de reskilling explicite. Politiquement plus facile à court terme, mais la pyramide des compétences se vide à moyen terme et l'organisation perd sa capacité à former les seniors de demain. <strong>Recommandation : à éviter sauf en cas de surcapacité structurelle réellement documentée.</strong>",
    "b1.arch.a2.tag": "Risque · éthique",
    "b1.arch.a2.name": "Le travailleur dominé",
    "b1.arch.a2.body": "L'autonomie et les compétences sont contraintes par le contrôle algorithmique. Pour la banque, ce risque apparaît quand les conseillers sont pilotés par des scripts IA-générés en temps réel, notés sur leur conformité algorithmique aux recommandations de l'IA, ou évalués sur des indicateurs de productivité issus de l'IA. La FINMA et le RGPD encadrent ces pratiques, mais l'opacité des systèmes IA crée des zones grises. <strong>Recommandation : auditer les outils RH augmentés par IA pour détecter les pratiques de domination algorithmique.</strong>",
    "b1.arch.a3.tag": "Cible principale",
    "b1.arch.a3.name": "Le travailleur augmenté",
    "b1.arch.a3.body": "L'IA améliore la performance individuelle sans remplacer la décision humaine. C'est la cible naturelle pour les conseillers patrimoniaux, hypothécaires et PME : libérer le temps administratif (synthèse de dossier, recherche réglementaire, premier projet de plan financier) pour le rendre disponible au moment de vie du client. Brynjolfsson 2025 documente +15% de gain concentré sur les juniors. <strong>Mais attention au coût cognitif</strong> : Lee et al. 2025 (Microsoft + Carnegie Mellon) montrent que l'usage répété sans discipline affaiblit la pensée critique. La règle Michelin de Florent Menegaux s'applique : « go fast, but mostly go far » : utiliser l'IA pour accélérer, jamais au détriment de l'apprentissage continu.",
    "b1.arch.a4.tag": "Cible stratégique",
    "b1.arch.a4.name": "Le travailleur réhumanisé",
    "b1.arch.a4.body": "L'IA libère du temps pour des activités plus distinctement humaines : créativité, empathie, présence, accompagnement des moments de vie. C'est la cible stratégique pour les Maisons bancaires qui veulent capturer la prime du human-intrinsic identifiée par Trammell. Pour le conseiller patrimonial qui suit une succession, le conseiller hypothécaire qui négocie l'achat d'une vie, le conseiller PME qui devient le partenaire stratégique d'une succession familiale. <strong>Cible la plus exigeante</strong> : elle nécessite de redéfinir les indicateurs de performance pour récompenser la qualité relationnelle, pas la productivité transactionnelle.",
    "b1.arch.closing": "<strong>Pour les directions RH bancaires en 2026</strong>, le cadre Ferguson permet de sortir du débat binaire couper-ou-garder. Chaque poste est analysé en termes d'archétype actuel et d'archétype cible. La décision RH n'est plus de juger des effectifs, c'est de piloter une trajectoire de transformation par fonction. Combiné au cadre Iansiti (streamlining + contexte partagé + objectifs simples), c'est ce qui permet de transformer une organisation bancaire en cinq ans sans perdre son capital humain.",
    "b1.arch.eyebrow": "Cartographie sociologique · 4 manières de vivre l'IA au travail",
    "b1.arch.title": "Le travailleur remplacé, dominé, augmenté ou réhumanisé · <em>quel banquier suisse construit-on ?</em>",
    "b1.arch.lede": "La typologie de Yann Ferguson (LaborIA Explorer, ICAM Toulouse) propose quatre figures de travailleur face à l'IA. Pour les directions RH des banques retail suisses, ce cadre est plus actionnable qu'un pourcentage agrégé d'exposition : il oblige à arbitrer activement, métier par métier, l'archétype que l'on construit.",
    "b1.arch.a1.tag": "Attrition silencieuse",
    "b1.arch.a1.name": "Le travailleur remplacé",
    "b1.arch.a1.body": "L'automatisation discrète qui réduit l'emploi par non-renouvellement de départs naturels, plutôt que par licenciement collectif visible. Sans plan social, sans communication, sans contrepartie. Le poste disparaît à mesure que les départs en retraite et les démissions ne sont plus remplacés.",
    "b1.arch.a1.signal": "<strong>Périmètre exposé :</strong> back-office documentaire, premier niveau KYC standard, saisie compliance, scoring crédit basique. <strong>Signal d'alerte RH :</strong> pyramide des âges qui se déforme par le bas sans plan d'accompagnement.",
    "b1.arch.a2.tag": "Contrôle algorithmique",
    "b1.arch.a2.name": "Le travailleur dominé",
    "b1.arch.a2.body": "L'IA devient l'arbitre invisible du travail. Le conseiller suit des recommandations qu'il ne comprend pas, valide des scores qu'il n'a pas calculés, exécute un script qui définit son rythme et ses priorités. L'autonomie professionnelle se rétrécit, l'expertise propre se dévalue.",
    "b1.arch.a2.signal": "<strong>Périmètre exposé :</strong> conseillers en réseau d'agences sous outils de prescription IA, agents de support client sous scoring de conformité automatique. <strong>Signal d'alerte RH :</strong> dégradation des indicateurs de satisfaction au travail et perte de fidélité des conseillers expérimentés.",
    "b1.arch.a3.tag": "Performance augmentée",
    "b1.arch.a3.name": "Le travailleur augmenté",
    "b1.arch.a3.body": "L'IA libère le banquier des tâches à faible valeur (compilation de documents, recherche réglementaire de premier niveau, génération de comptes rendus) pour qu'il se concentre sur le jugement, la négociation, le conseil. Mais nouvelles compétences à acquérir, et risques cognitifs réels (sédation, dépendance) si la discipline d'usage est absente.",
    "b1.arch.a3.signal": "<strong>Périmètre exposé :</strong> conseillers patrimoniaux, gestionnaires de relations PME, conformité réglementaire de niveau 2. <strong>Signal d'alerte RH :</strong> écart de productivité qui se creuse entre conseillers disciplinés et conseillers en sédation cognitive.",
    "b1.arch.a4.tag": "Recentrage humain",
    "b1.arch.a4.name": "Le travailleur réhumanisé",
    "b1.arch.a4.body": "L'IA absorbe les tâches transactionnelles et libère du temps pour l'écoute, la pédagogie financière, l'accompagnement des moments de vie. Le banquier devient ce qu'il prétend être depuis vingt ans dans son discours marketing : un partenaire patrimonial. Mais cette issue n'est jamais automatique, elle exige un choix RH explicite.",
    "b1.arch.a4.signal": "<strong>Périmètre concerné :</strong> conseillers hypothécaires, conseillers patrimoniaux haute valeur, accompagnement de successions et transmissions familiales. <strong>Signal positif RH :</strong> temps relationnel face client en hausse, NPS clients haut de gamme en hausse.",
    "b1.arch.takeaway": "<strong>Pour les comités exécutifs des banques retail suisses</strong>, ces quatre archétypes ne sont pas équiprobables. Ils résultent de choix RH explicites : conception des fiches de poste, politique de formation, indicateurs de performance retenus, marges de manœuvre laissées aux conseillers face à l'outil IA. Une banque retail qui laisse le marché et les éditeurs IA décider à sa place finit avec un mélange remplacé + dominé. Une banque qui pilote activement vise un mélange augmenté + réhumanisé. <em>Le pivot 2026 n'est pas technologique, il est sociologique.</em>",
    "b1.debate.eyebrow": "Le débat IA et travail · trois positions structurantes",
    "b1.debate.title": "Trois lectures, <em>une décision RH spécifique au retail bancaire suisse</em>.",
    "b1.debate.lede": "Le débat sur l'IA et l'emploi est traversé par trois positions intellectuelles solides qui ne convergent pas. Pour les directions des banques retail suisses, qui combinent à la fois des fonctions hautement automatisables (compliance documentaire, KYC de premier niveau, scoring crédit standard) et des fonctions hautement humaines-intrinsèques (conseil patrimonial, accompagnement de moments de vie, négociation hypothécaire complexe), la lecture nuancée des trois positions est indispensable.",

    "b1.debate.p1.tag": "Position pessimiste",
    "b1.debate.p1.author": "Dario Amodei (Anthropic) · Mustafa Suleyman (Microsoft AI)",
    "b1.debate.p1.claim": "L'IA va éliminer 50% des cadres entrants en 1 à 5 ans, finance comprise.",
    "b1.debate.p1.body": "Pour Amodei, l'IA progresse simultanément dans tous les secteurs cognitifs, ce qui supprime les bassins d'emploi adjacents qui absorbaient historiquement les travailleurs déplacés. La banque retail est explicitement dans le périmètre cible (finance, conseil, droit, tech). Suleyman estime que la plupart des tâches cadres seront automatisées en 12 à 18 mois. <strong>Pour la banque suisse, cette position implique</strong> un gel rapide des recrutements compliance et back-office, une rationalisation des fonctions de scoring crédit et de KYC, et une bascule vers des architectures IA-first sur les workflows documentaires standardisés. Les organisations qui retiennent cette lecture sont en train de renégocier leurs partenariats RH avec les écoles HES et UNI.",

    "b1.debate.p2.tag": "Position empirique",
    "b1.debate.p2.author": "Pieter Garicano (Silicon Continent) · Brynjolfsson (Stanford) · NY Fed",
    "b1.debate.p2.claim": "La tâche n'est pas le job. Le bundle survit, recomposé.",
    "b1.debate.p2.body": "Garicano développe l'argument structurel : un job est un bundle de tâches, pas une somme de tâches automatisables. Quand l'IA prend la tâche faible du bundle (documentation compliance, premier filtrage KYC, scoring standard), elle laisse au cadre bancaire la tâche forte (jugement patrimonial, négociation, accountability réglementaire face à la FINMA, gestion des cas non standards à fort enjeu). Les données NY Fed avril 2026 confirment que la majorité des firmes adoptant l'IA forment leur personnel existant plutôt que de couper. Brynjolfsson 2025 documente +15% de gain concentré sur les juniors, signal d'augmentation. <strong>Hollow out the entry level, you hollow out the pipeline</strong> : l'expertise patrimoniale senior se construit en faisant les tâches compliance que l'IA va prendre. Couper les juniors, c'est tuer la formation des seniors de demain.",

    "b1.debate.p3.tag": "Position macroéconomique",
    "b1.debate.p3.author": "Philip Trammell (Stanford) · Korinek (NBER) · Papanikolaou (Northwestern)",
    "b1.debate.p3.claim": "Les biens human-intrinsic protègent structurellement la part travail.",
    "b1.debate.p3.body": "Trammell formalise pourquoi la part travail peut rester élevée même en pleine automatisation. La thèse repose sur les biens human-intrinsic : performance, soin, accompagnement, où la présence humaine fait partie de la définition même du bien. <strong>Pour la banque retail suisse, le cadre s'applique fortement à un sous-ensemble de fonctions</strong> : conseiller patrimonial qui accompagne un héritage, conseiller hypothécaire qui négocie l'achat d'une vie, conseiller PME qui devient le partenaire stratégique d'une succession familiale. Sont human-intrinsic. Sont protégées. La compliance documentaire, le scoring crédit standard, le premier niveau KYC : ne le sont pas. Papanikolaou (Northwestern) confirme empiriquement les effets compensatoires.",

    "b1.debate.sec.tag": "Implication sectorielle · banque retail suisse",
    "b1.debate.sec.title": "Le pivot 2026 n'est pas <em>combien couper</em>, c'est <em>quels conseillers augmenter</em>.",
    "b1.debate.sec.body": "Pour les directions des banques retail suisses, la convergence prudente des trois positions donne une lecture actionnable et différenciée. Les fonctions <strong>back-office et compliance documentaire</strong> sont effectivement vulnérables à l'automatisation IA dans les 18-24 mois (position Amodei probablement correcte sur ce périmètre, avec les caveats TCO). Les fonctions <strong>de conseil patrimonial, hypothécaire, et PME</strong> sont structurellement protégées par leur nature human-intrinsic (position Trammell). Pour ces fonctions, l'IA est un outil d'augmentation, pas de substitution (position Garicano + Brynjolfsson). <strong>La décision RH 2026 d'une banque retail suisse</strong> doit donc se décliner en deux plans distincts : compression contrôlée du back-office avec recyclage interne (formation continue, CFC à HES, masters spécialisés), et expansion du temps relationnel des conseillers face client par augmentation IA (libérer le temps administratif pour le rendre disponible au moment de vie). C'est l'inverse d'une coupe pyramidale uniforme.",


    "b1.tco.eyebrow": "Économie des coûts · le facteur ignoré",
    "b1.tco.title": "Le coût réel de l'IA en banque suisse, <em>au-delà du prix par token</em>.",
    "b1.tco.lede": "Les budgets POC d'IA des banques suisses reposent souvent sur le prix d'inférence affiché. Mais en production, les coûts d'orchestration, de gouvernance, de supervision et de compliance font basculer l'équation. Pour un secteur régulé par la FINMA et soumis à la LPD révisée, les coûts cachés ne sont pas optionnels.",
    "b1.tco.s1.label": "Erreur potentielle de calcul des coûts GenAI selon Gartner si le passage à l'échelle n'est pas anticipé",
    "b1.tco.s1.source": "Gartner · oct 2024",
    "b1.tco.s2.label": "Des CIO indiquent un breakeven ou une perte sur leurs investissements IA en 2024",
    "b1.tco.s2.source": "Gartner · oct 2024",
    "b1.tco.s3.label": "Coût par résolution GenAI prédit dans le service client en 2030, supérieur aux agents offshore",
    "b1.tco.s3.source": "Gartner · janv 2026",
    "b1.tco.takeaway": "<strong>Pour les dirigeants bancaires suisses</strong>, l'enjeu pratique : les modèles de compliance et de KYC, qui consomment de larges contextes et exigent une supervision humaine forte, ont un TCO très supérieur au prix par token affiché. Le coût total par décision de compliance peut atteindre 5 à 10 fois l'estimation POC. Le pivot stratégique recommandé par <em>Quinlan (Gartner, janvier 2026)</em> pour le service client s'applique aussi à la banque retail : utiliser l'IA pour augmenter la valeur relationnelle, pas pour couper des coûts opérationnels. Le cadre TCO de Tomer (avril 2026) et notre <a href=\"../methodologie.html#tco\">section méthodologique 07</a> détaillent les composantes à modéliser.",

    "b1.sov.eyebrow": "Souveraineté numérique · juridiction et résidence des données",
    "b1.sov.title": "Pour la banque suisse, <em>où vivent vos données est aussi important que ce qu'elles disent</em>.",
    "b1.sov.lede": "Une banque suisse soumise à la LPD révisée et à la FINMA ne peut pas envoyer ses données clients vers une infrastructure dont la juridiction n'est pas garantie. Le choix d'un fournisseur LLM est devenu une décision de gouvernance, pas seulement technique. L'écosystème souverain européen et suisse offre désormais des alternatives crédibles aux hyperscalers américains.",
    "b1.sov.s1.tag": "Suisse",
    "b1.sov.s1.name": "Apertus + Swisscom Sovereign AI",
    "b1.sov.s1.body": "Apertus (EPFL, ETH Zurich, CSCS, septembre 2025) est le premier LLM public suisse fully open : 8B et 70B paramètres, conforme à l'EU AI Act, à la LPD suisse et aux opt-outs créateurs. Hébergé sur la plateforme IA souveraine de Swisscom. Pour la banque retail suisse qui veut traiter des données KYC ou des dossiers crédit en respectant strictement la juridiction helvétique, c'est la première option qui combine souveraineté juridictionnelle et transparence totale.",
    "b1.sov.s2.tag": "Europe",
    "b1.sov.s2.name": "Mistral AI · La Plateforme",
    "b1.sov.s2.body": "Mistral AI (FR, Paris) traite toutes les requêtes API dans des data centers européens. SOC 2 Type II, alignement EU AI Act, garantie contractuelle de non-utilisation des données client pour l'entraînement. Pour les banques suisses opérant aussi en zone euro (Genève, Bâle, branches européennes), c'est l'option la plus mature pour la conformité RGPD. Levée de 830 M$ de dette en mars 2026 pour 200 MW de capacité européenne en 2027.",
    "b1.sov.s3.tag": "Risque",
    "b1.sov.s3.name": "Vendor lock-in et juridiction extra-territoriale",
    "b1.sov.s3.body": "Le choix d'un fournisseur US n'est pas neutre. Le CLOUD Act américain peut s'appliquer aux données stockées chez un opérateur US même hébergées en Europe. Pour une banque suisse, cela peut entrer en conflit avec le secret bancaire et la LPD. Le coût d'une violation de conformité ou d'un changement forcé de fournisseur (vendor lock-in) doit désormais figurer dans le TCO réel, à côté du prix par token.",
    "b1.sov.takeaway": "<strong>Pour les comités exécutifs des banques suisses</strong>, la grille de décision recommandée intègre désormais quatre dimensions : capacité technique, TCO réel à 36 mois, juridiction de la donnée, et risque de lock-in fournisseur. Apertus n'est pas encore au niveau de capacité de GPT-5 ou Claude 4, mais pour les workflows internes de classification, synthèse documentaire et compliance de premier niveau, il offre un compromis souveraineté/coût qui mérite d'être évalué. Le coût d'opportunité d'un audit FINMA défavorable dépasse rapidement le différentiel de capacité.",

    "b1.disc.tag": "Disclosure",
    "b1.disc.body": "Ce dossier a été produit avec l'assistance d'une intelligence artificielle (Claude Opus 4.7, en modes Research et Web Search), puis soumis à une vérification factuelle contre les sources primaires. L'IA a servi d'outil de documentation, de synthèse et de mise en forme visuelle, pas de source autonome ni d'autorité scientifique. Détail méthodologique en <a href=\"../methodologie.html\">section 09 de la page Méthodologie</a>.",

    "b1.title": "Swiss banks facing AI: the year of <em>architectural choices</em>.",
    "b1.sub": "In 2026, the Swiss banking industry shifts from isolated experiments to architectural decisions binding for five to ten years. Three structural divides are emerging. Here is what an executive committee needs to know before the next investment review.",
    "b1.by.author": "Naully Nicolas",
    "b1.by.read": "7 minute read",
    "b1.by.sources": "12 primary sources",

    "b1.land.eyebrow": "The landscape",
    "b1.land.title": "What the sector actually looks like in 2026.",
    "b1.land.p1": "The Swiss financial centre, the world's second-largest hub for wealth management, is leaving the exploratory phase. Isolated experiments (one use case per business line, sponsored by discretionary innovation budgets) are giving way to binding architectural decisions. Trade-offs now concern the models to internalise, authorised cloud providers, storage zones for confidential prompts, and the training to scale up.",
    "b1.land.p2": "Three structural divides are emerging between players: the speed of deployment (private banks fast, cantonal banks cautious), the architectural strategy (public cloud versus sovereign on-premise AI), and the actual depth of business process transformation.",

    "b1.land.up.title": "What is settling in",
    "b1.land.up.li1": "<strong>Automated compliance.</strong> KYC, AML, fraud detection. Demonstrated ROI, FINMA tolerant with audit trail.",
    "b1.land.up.li2": "<strong>Augmented personalised advice.</strong> Client meeting preparation, portfolio synthesis, conviction note generation.",
    "b1.land.up.li3": "<strong>Knowledge management.</strong> Semantic search across legal, tax and product archives. First large-scale deployments.",
    "b1.land.up.li4": "<strong>Support functions.</strong> Internal writing, multilingual translation (DE / FR / IT / EN), ITSM assistance.",

    "b1.land.down.title": "What is slowing down",
    "b1.land.down.li1": "<strong>Junior tech recruitment.</strong> Vacancies declining, while AI requirements in new postings are rising.",
    "b1.land.down.li2": "<strong>Algorithmic AI trading.</strong> FINMA restrictive on non-explainable models.",
    "b1.land.down.li3": "<strong>Project outsourcing.</strong> Reinternalisation of sensitive skills (AI + data + security).",
    "b1.land.down.li4": "<strong>Non-European cloud outsourcing.</strong> Data sovereignty for ultra-high-net-worth clients under pressure.",


    "b1.crit.eyebrow": "Critical reading · three objections to the alarmist narrative",
    "b1.crit.title": "Why the « massive job disappearance » narrative <em>does not hold up</em>.",
    "b1.crit.lede": "Statements from Dario Amodei (Anthropic, 50% of junior white-collar jobs gone in 1-5 years) and Mustafa Suleyman (Microsoft AI, 12-18 months to automate office work) circulate widely in public debate. Three convergent sources in 2026 document why this narrative is empirically fragile and theoretically contestable. This section articulates them for the Swiss banking sector.",
    "b1.crit.t1.title": "Big Tech headcount 2026 ≈ 2022 · despite $700 billion in AI CapEx",
    "b1.crit.t1.body": "Amazon, Google and Meta today employ approximately the same number of workers as in 2022, after the layoff waves. The four largest tech firms have committed over $700 billion in AI CapEx this fiscal year, yet R&D expenditures normalized against revenue have <strong>increased</strong> at Meta, Google and Amazon since 2022. Marc Andreessen and Sam Altman themselves acknowledge layoffs primarily reflect pandemic-era over-hiring, not AI substitution. <strong>Consequence for Swiss banks</strong>: tech announcements are not an actionable signal to calibrate a restructuring plan. Real banking transformations go through function recomposition, not elimination.",
    "b1.crit.t1.source": "Source · Washington Post May 1, 2026 · NYT Opinion May 3, 2026",
    "b1.crit.t2.title": "A job is a bundle of tasks tied to authority, not a sum of isolated tasks",
    "b1.crit.t2.body": "The task-exposure argument assumes a job reduces to the sum of its measurable tasks. But organizations buy bundles: a banking advisor combines case analysis, personalized advice, risk arbitration, client accompaniment, and the exercise of authority (loan validation, compliance escalation). AI can help on each isolated task without replacing the <em>accountability</em> of the whole. This is Garicano's central argument (April 2026) in response to Amodei and Suleyman. <strong>For Swiss banking, the consequence is clear</strong>: restructuring will not happen through position elimination proportional to technical exposure rates, but through the recomposition of job bundles around higher-authority-value decisions.",
    "b1.crit.t2.source": "Source · Luis Garicano · Silicon Continent · April 22, 2026",
    "b1.crit.t3.title": "Theoretically, AI enrichment raises the share of human labor in the long run",
    "b1.crit.t3.body": "Trammell (Stanford Digital Economy Lab, March 2026) formalizes the thesis that under hierarchical consumption preferences, human labor becomes a high income-elasticity good, in other words a luxury. When capital becomes abundant, its share in consumption falls and the share of human-rendered labor rises. If capital and labor are gross complements, infinite capital accumulation does not suffice for growth. <strong>For Swiss premium banking</strong> (private banking, wealth management, advisory), this is the most plausible long-run scenario: AI raises standardized productivity and frees client budget for the premium human relationship, which becomes the highest-growth segment.",
    "b1.crit.t3.source": "Source · Philip Trammell · Stanford Digital Economy Lab · March 27, 2026",
    "b1.num.eyebrow": "By the numbers",
    "b1.num.title": "Three indicators that sum up the year.",

    "b1.q.eyebrow": "The expert verdict",
    "b1.q.text": "The question is no longer whether AI will transform banking. It is which banks will have made the right architectural decisions before regulators fix the framework. Those who wait take a short option on their information systems.",
    "b1.q.author": "Head of Innovation",
    "b1.q.role": "Geneva private bank · anonymised interview · March 2026",

    "b1.dec.eyebrow": "Decision · 4 questions to settle",
    "b1.dec.title": "What an <em>executive committee</em> must decide by September 2026.",
    "b1.dec.intro": "Four operational trade-offs, in order of criticality. None can be fully delegated to the IT department or an external consultancy. All commit the company beyond the annual budget horizon.",

    "b1.dec.li1": "<strong>Cloud versus sovereign architecture.</strong> Which models authorised on which environments, for which use cases, with which data confidentiality levels. A prerequisite to any industrialisation.",
    "b1.dec.li2": "<strong>Training policy.</strong> Mass approach (all employees, common base) or targeted (deep AI skills for 15 to 20% of staff). Both logics are defensible, but incompatible under budget constraints.",
    "b1.dec.li3": "<strong>Risk mapping.</strong> Internal use risk (employees entering client data into a public AI tool), output risk (hallucination in a client note), supply chain risk (failure or acquisition of a strategic vendor). Three distinct layers.",
    "b1.dec.li4": "<strong>Governance and arbitration.</strong> Who decides which use case goes to production. Who arbitrates business-compliance conflicts. Who reports to the board and to FINMA. Three roles, three mandates to clarify now.",

    "b1.roles.eyebrow": "At the role level",
    "b1.roles.title": "What these choices mean for <em>five roles</em> in Swiss banking.",
    "b1.roles.intro": "An architectural decision does not stay abstract for long. It plays out in daily work, in the skills that get hired, in the pivots that get anticipated. Five occupations concentrate the bulk of affected headcount in Switzerland. For each, what AI shifts, and the most defensible pivot path according to the observatory's sources.",
    "b1.roles.pivotLabel": "Recommended pivot",
    "b1.roles.footer": "<strong>Switzerland total: 66,000 active workers across the five roles above</strong>, the bulk of front-office and support banking population. Headcount figures come from the FSO (STATEM Q1 2026); exposure scores combine NBER w31161, ECB and McKinsey research. The 324 occupations of the NP 2010 nomenclature are accessible in the <a href=\"../observatoires/suisse.html\" style=\"color: var(--signal); text-decoration: underline;\">Swiss dashboard</a>.",

    "b1.roles.r1.domain": "Banking, insurance, real estate",
    "b1.roles.r1.name": "Bank advisor",
    "b1.roles.r1.exp": "7/10",
    "b1.roles.r1.expLabel": "exposure",
    "b1.roles.r1.head": "42,000",
    "b1.roles.r1.headLabel": "active CH",
    "b1.roles.r1.shift": "The most volume-heavy occupation in the sector. Standard products (account opening, basic mortgage, structured transfer) shift to self-service and robo-advisors. What remains: complex life moments, digital inclusion for less tech-fluent clients, judgement on atypical cases. The daily work moves from transaction to conversation, from form-filling to listening.",
    "b1.roles.r1.pivot": "Wealth advisor with strong human relationship. Empathy, life-moment support (marriage, retirement, bereavement), trust as primary asset (ITDF 2026, <em>care</em> dimension).",

    "b1.roles.r2.exp": "7/10",
    "b1.roles.r2.expLabel": "exposure",
    "b1.roles.r2.head": "8,000",

    "b1.roles.r2.pivot": "Multi-generational Family Office Manager. International tax optimisation for expatriates. Philanthropy and impact lead (foundations, patronage).",

    "b1.roles.r3.domain": "Banking, insurance, real estate",

    "b1.roles.r3.head": "5,000",

    "b1.roles.r3.pivot": "Structured credit and leveraged finance expert. ESG risk and sustainable finance analyst (green bonds, SFDR). Credit manager in active NPL portfolio management.",

    "b1.roles.r4.domain": "Banking, insurance, real estate",
    "b1.roles.r4.name": "Banking compliance officer",
    "b1.roles.r4.exp": "5/10",
    "b1.roles.r4.expLabel": "exposure",
    "b1.roles.r4.head": "6,000",
    "b1.roles.r4.headLabel": "active CH",
    "b1.roles.r4.shift": "Moderate exposure, but deep transformation. Regulatory monitoring, first-tier AML screening and standard KYC controls become massively tooled. The function moves up to complex cross-border sanctions, client data governance under nLPD and GDPR, and steering RegTech solutions. This is where the arbitration between AI automation and the human supervision expected by FINMA actually plays out.",
    "b1.roles.r4.pivot": "AML and international sanctions expert (OFAC, FATF, cross-border transactions). Banking data and privacy lead (nLPD, GDPR). RegTech and compliance automation consultant.",

    "b1.roles.r5.domain": "Banking, insurance, real estate",

    "b1.roles.r5.shift": "Local steering resists, but its purpose shifts. Commercial indicators and branch reporting standardise into dashboards. What branch leadership specifically brings is concentrated on fine-grained knowledge of the local economic fabric, steering relationships with regional SMEs, and managing teams that are increasingly hybrid between human advisors and AI tools.",
    "b1.roles.r5.pivot": "Regional sales director with network animation mandate. SME and local financing expert. Private banking lead on regional premium clientele.",

    "b1.arch.eyebrow": "The recomposed worker · 4 archetypes facing AI",
    "b1.arch.title": "Four archetypes to <em>recompose banking roles</em>, not to cut them.",
    "b1.arch.lede": "Sociologist Yann Ferguson, presented at the Strasbourg Digital Encounters in April 2026 with Yves Caseau, offers a directly actionable framework for banking HR leadership. Rather than deciding to keep or cut a role, the practical question is to choose which worker archetype the organization wants to produce. Each archetype implies a specific HR steering mode, and a specific ethical risk.",
    "b1.arch.a1.tag": "Risk · to avoid",
    "b1.arch.a1.name": "The replaced worker",
    "b1.arch.a1.body": "Automation reduces jobs through silent attrition rather than layoffs. For Swiss retail banking, this scenario typically concerns the progressive compression of back-office and first-level KYC functions, without an explicit reskilling plan. Politically easier short-term, but the skills pyramid empties medium-term and the organization loses its capacity to train tomorrow's seniors. <strong>Recommendation: avoid except in case of structural overcapacity actually documented.</strong>",
    "b1.arch.a2.tag": "Risk · ethical",
    "b1.arch.a2.name": "The dominated worker",
    "b1.arch.a2.body": "Autonomy and skills are constrained by algorithmic control. For banking, this risk appears when advisors are steered by real-time AI-generated scripts, scored on their algorithmic compliance with AI recommendations, or evaluated on AI-derived productivity indicators. FINMA and GDPR frame these practices, but AI system opacity creates gray zones. <strong>Recommendation: audit AI-augmented HR tools to detect algorithmic domination practices.</strong>",
    "b1.arch.a3.tag": "Primary target",
    "b1.arch.a3.name": "The augmented worker",
    "b1.arch.a3.body": "AI improves individual performance without replacing human decision. This is the natural target for wealth, mortgage and SME advisors: freeing administrative time (file synthesis, regulatory research, first draft of a financial plan) to make it available at the client's life moment. Brynjolfsson 2025 documents +15% gain concentrated on juniors. <strong>But beware of the cognitive cost</strong>: Lee et al. 2025 (Microsoft + Carnegie Mellon) show that repeated use without discipline weakens critical thinking. Michelin CEO Florent Menegaux's rule applies: « go fast, but mostly go far »: use AI to accelerate, never at the expense of continuous learning.",
    "b1.arch.a4.tag": "Strategic target",
    "b1.arch.a4.name": "The rehumanized worker",
    "b1.arch.a4.body": "AI frees time for more distinctly human activities: creativity, empathy, presence, life-moment accompaniment. This is the strategic target for banking houses that want to capture the human-intrinsic premium identified by Trammell. For the wealth advisor following a succession, the mortgage advisor negotiating a life purchase, the SME advisor becoming the strategic partner of a family succession. <strong>The most demanding target</strong>: it requires redefining performance indicators to reward relational quality, not transactional productivity.",
    "b1.arch.closing": "<strong>For banking HR leadership in 2026</strong>, the Ferguson framework allows exiting the binary cut-or-keep debate. Each role is analyzed in terms of current archetype and target archetype. The HR decision is no longer to judge headcount, it is to steer a transformation trajectory by function. Combined with the Iansiti framework (streamlining + shared context + simple goals), this is what allows transforming a banking organization in five years without losing its human capital.",
    "b1.arch.eyebrow": "Sociological mapping · 4 ways of living AI at work",
    "b1.arch.title": "The replaced, dominated, augmented or rehumanized worker · <em>which Swiss banker are we building?</em>",
    "b1.arch.lede": "Yann Ferguson's typology (LaborIA Explorer, ICAM Toulouse) proposes four worker figures facing AI. For Swiss retail banking HR leaders, this framework is more actionable than an aggregate exposure percentage: it forces active arbitrage, role by role, of the archetype being built.",
    "b1.arch.a1.tag": "Silent attrition",
    "b1.arch.a1.name": "The replaced worker",
    "b1.arch.a1.body": "Quiet automation reducing employment through non-replacement of natural departures, rather than visible mass layoffs. No restructuring plan, no communication, no compensation. The role disappears as retirements and resignations are no longer replaced.",
    "b1.arch.a1.signal": "<strong>Exposed perimeter:</strong> back-office documentation, first-level standard KYC, compliance data entry, basic credit scoring. <strong>HR warning signal:</strong> age pyramid distorting at the base without an accompaniment plan.",
    "b1.arch.a2.tag": "Algorithmic control",
    "b1.arch.a2.name": "The dominated worker",
    "b1.arch.a2.body": "AI becomes the invisible arbiter of work. The advisor follows recommendations they do not understand, validates scores they did not compute, executes a script that defines their rhythm and priorities. Professional autonomy shrinks, individual expertise is devalued.",
    "b1.arch.a2.signal": "<strong>Exposed perimeter:</strong> branch network advisors under AI prescription tools, customer support agents under automatic compliance scoring. <strong>HR warning signal:</strong> deterioration of work satisfaction indicators and loss of experienced advisor loyalty.",
    "b1.arch.a3.tag": "Augmented performance",
    "b1.arch.a3.name": "The augmented worker",
    "b1.arch.a3.body": "AI frees the banker from low-value tasks (document compilation, first-level regulatory research, report generation) so they can focus on judgment, negotiation, advice. But new skills are required, and real cognitive risks (sedation, dependence) emerge if usage discipline is absent.",
    "b1.arch.a3.signal": "<strong>Exposed perimeter:</strong> wealth advisors, SME relationship managers, level-2 regulatory compliance. <strong>HR warning signal:</strong> productivity gap widening between disciplined advisors and cognitively sedated advisors.",
    "b1.arch.a4.tag": "Human refocusing",
    "b1.arch.a4.name": "The rehumanized worker",
    "b1.arch.a4.body": "AI absorbs transactional tasks and frees time for listening, financial pedagogy, accompaniment of life moments. The banker becomes what they have claimed to be for twenty years in marketing speech: a wealth partner. But this outcome is never automatic, it requires an explicit HR choice.",
    "b1.arch.a4.signal": "<strong>Affected perimeter:</strong> mortgage advisors, high-value wealth advisors, accompaniment of inheritance and family transmission. <strong>Positive HR signal:</strong> client-facing relational time rising, high-end client NPS rising.",
    "b1.arch.takeaway": "<strong>For Swiss retail banking executive committees</strong>, these four archetypes are not equally likely. They result from explicit HR choices: job description design, training policy, performance indicators retained, room for maneuver left to advisors facing AI tools. A retail bank that lets the market and AI vendors decide for it ends up with a replaced + dominated mix. A bank that actively pilots aims for an augmented + rehumanized mix. <em>The 2026 pivot is not technological, it is sociological.</em>",
    "b1.debate.eyebrow": "The AI-and-work debate · three structuring positions",
    "b1.debate.title": "Three readings, <em>one HR decision specific to Swiss retail banking</em>.",
    "b1.debate.lede": "The debate on AI and employment is shaped by three solid intellectual positions that do not converge. For Swiss retail banks, which combine highly automatable functions (compliance documentation, first-level KYC, standard credit scoring) and highly human-intrinsic functions (wealth advisory, life-moment accompaniment, complex mortgage negotiation), a nuanced reading of the three positions is essential.",

    "b1.debate.p1.tag": "Pessimistic position",
    "b1.debate.p1.author": "Dario Amodei (Anthropic) · Mustafa Suleyman (Microsoft AI)",
    "b1.debate.p1.claim": "AI will eliminate 50% of entry-level executives in 1 to 5 years, finance included.",
    "b1.debate.p1.body": "For Amodei, AI advances simultaneously across all cognitive sectors, eliminating the adjacent employment basins that historically absorbed displaced workers. Retail banking is explicitly in the target perimeter (finance, consulting, law, tech). Suleyman estimates that most white-collar tasks will be automated within 12 to 18 months. <strong>For Swiss banking, this position implies</strong> a rapid freeze on compliance and back-office hiring, rationalization of credit scoring and KYC functions, and a pivot to AI-first architectures on standardized document workflows. Organizations retaining this reading are renegotiating their HR partnerships with HES and university schools.",

    "b1.debate.p2.tag": "Empirical position",
    "b1.debate.p2.author": "Pieter Garicano (Silicon Continent) · Brynjolfsson (Stanford) · NY Fed",
    "b1.debate.p2.claim": "The task is not the job. The bundle survives, recomposed.",
    "b1.debate.p2.body": "Garicano develops the structural argument: a job is a bundle of tasks, not a sum of automatable tasks. When AI takes the weak task of the bundle (compliance documentation, first KYC filtering, standard scoring), it leaves the bank executive with the strong task (wealth judgment, negotiation, regulatory accountability before FINMA, handling high-stakes non-standard cases). NY Fed April 2026 data confirms that the majority of AI-adopting firms retrain existing staff rather than cutting. Brynjolfsson 2025 documents +15% gain concentrated on juniors, a signal of augmentation. <strong>Hollow out the entry level, you hollow out the pipeline</strong>: senior wealth expertise builds by doing the compliance tasks AI is going to take. Cutting juniors kills the formation of tomorrow's seniors.",

    "b1.debate.p3.tag": "Macroeconomic position",
    "b1.debate.p3.author": "Philip Trammell (Stanford) · Korinek (NBER) · Papanikolaou (Northwestern)",
    "b1.debate.p3.claim": "Human-intrinsic goods structurally protect the labor share.",
    "b1.debate.p3.body": "Trammell formalizes why the labor share can stay high even in full automation. The thesis rests on human-intrinsic goods: performance, care, accompaniment, where human presence is part of the very definition of the good. <strong>For Swiss retail banking, the framework strongly applies to a subset of functions</strong>: the wealth advisor accompanying an inheritance, the mortgage advisor negotiating the purchase of a lifetime, the SME advisor becoming the strategic partner of a family succession. Are human-intrinsic. Are protected. Compliance documentation, standard credit scoring, first-level KYC: are not. Papanikolaou (Northwestern) empirically confirms the offsetting effects.",

    "b1.debate.sec.tag": "Sectoral implication · Swiss retail banking",
    "b1.debate.sec.title": "The 2026 pivot is not <em>how much to cut</em>, it is <em>which advisors to scale up</em>.",
    "b1.debate.sec.body": "For Swiss retail banking leadership, the cautious convergence of the three positions yields an actionable and differentiated reading. <strong>Back-office and document compliance functions</strong> are effectively vulnerable to AI automation in 18-24 months (Amodei position probably correct on this perimeter, with TCO caveats). <strong>Wealth, mortgage, and SME advisory functions</strong> are structurally protected by their human-intrinsic nature (Trammell position). For these functions, AI is an augmentation tool, not a substitution one (Garicano + Brynjolfsson position). <strong>The 2026 HR decision for a Swiss retail bank</strong> must therefore be split into two distinct plans: controlled compression of back-office with internal reskilling (continuing education, CFC to HES, specialized masters), and expansion of advisor relational time with clients through AI augmentation (free up administrative time to make it available at the life moment). It is the opposite of a uniform pyramidal cut.",

    /* TCO section · cost economics */
    "b1.tco.eyebrow": "Cost economics · the ignored factor",
    "b1.tco.title": "The real cost of AI in Swiss banking, <em>beyond token price</em>.",
    "b1.tco.lede": "Swiss banks' AI POC budgets often rest on the advertised inference price. But in production, orchestration, governance, supervision, and compliance costs tip the equation. For a sector regulated by FINMA and subject to the revised Data Protection Act, hidden costs are not optional.",
    "b1.tco.s1.label": "Potential GenAI cost calculation error per Gartner if scaling is not anticipated",
    "b1.tco.s1.source": "Gartner · Oct 2024",
    "b1.tco.s2.label": "Of CIOs report break-even or losses on AI investments in 2024",
    "b1.tco.s2.source": "Gartner · Oct 2024",
    "b1.tco.s3.label": "Predicted GenAI cost per resolution in customer service by 2030, above offshore agents",
    "b1.tco.s3.source": "Gartner · Jan 2026",
    "b1.tco.takeaway": "<strong>For Swiss banking leaders</strong>, the practical issue: compliance and KYC models, which consume large context and require strong human supervision, have a TCO far exceeding the advertised token price. Total cost per compliance decision can be 5 to 10 times the POC estimate. The strategic pivot recommended by <em>Quinlan (Gartner, January 2026)</em> for customer service applies equally to retail banking: use AI to increase relationship value, not to cut operating costs. Tomer's TCO framework (April 2026) and our new <a href=\"../methodologie.html#tco\">methodology section 07</a> detail the components to model.",

    "b1.sov.eyebrow": "Digital sovereignty · jurisdiction and data residency",
    "b1.sov.title": "For Swiss banking, <em>where your data lives matters as much as what it says</em>.",
    "b1.sov.lede": "A Swiss bank subject to revised FADP and FINMA cannot send client data to infrastructure whose jurisdiction is not guaranteed. Choosing an LLM vendor has become a governance decision, not just a technical one. The European and Swiss sovereign ecosystem now offers credible alternatives to US hyperscalers.",
    "b1.sov.s1.tag": "Switzerland",
    "b1.sov.s1.name": "Apertus + Swisscom Sovereign AI",
    "b1.sov.s1.body": "Apertus (EPFL, ETH Zurich, CSCS, September 2025) is Switzerland's first public fully open LLM: 8B and 70B parameters, compliant with the EU AI Act, Swiss data protection law, and creator opt-outs. Hosted on Swisscom's sovereign AI platform. For Swiss retail banking processing KYC data or credit files under strict Swiss jurisdiction, this is the first option combining jurisdictional sovereignty and full transparency.",
    "b1.sov.s2.tag": "Europe",
    "b1.sov.s2.name": "Mistral AI · La Plateforme",
    "b1.sov.s2.body": "Mistral AI (FR, Paris) processes all API requests in European data centers. SOC 2 Type II, EU AI Act alignment, contractual guarantee of non-use of customer data for training. For Swiss banks also operating in the euro zone (Geneva, Basel, European branches), it is the most mature option for GDPR compliance. $830M debt raise in March 2026 for 200 MW of European compute by 2027.",
    "b1.sov.s3.tag": "Risk",
    "b1.sov.s3.name": "Vendor lock-in and extra-territorial jurisdiction",
    "b1.sov.s3.body": "Choosing a US vendor is not neutral. The US CLOUD Act can apply to data stored with a US operator even hosted in Europe. For a Swiss bank, this can conflict with banking secrecy and FADP. The cost of a compliance violation or a forced vendor change (lock-in) must now appear in real TCO, alongside the per-token price.",
    "b1.sov.takeaway": "<strong>For Swiss bank executive committees</strong>, the recommended decision grid now integrates four dimensions: technical capability, real 36-month TCO, data jurisdiction, and vendor lock-in risk. Apertus is not yet at the capability level of GPT-5 or Claude 4, but for internal classification, document synthesis, and first-level compliance workflows, it offers a sovereignty/cost compromise worth evaluating. The opportunity cost of an unfavorable FINMA audit quickly exceeds the capability differential.",
