    "b3.roles.r1.headLabel": "actifs CH",
    "b3.roles.r1.shift": "Le geste artisanal résiste, et c'est une stratégie de marque autant qu'une réalité technique. Ce qui change autour de l'horloger est l'environnement de travail : computer vision pour le contrôle qualité optique, IA générative pour la conception de mouvements complexes, simulation numérique avant prototypage. La main reste humaine, l'écosystème devient hybride. La haute horlogerie traditionnelle (complications, restauration de pièces historiques) gagne en valeur de marque face à l'industrie de précision automatisée.",
    "b3.roles.r1.pivot": "Maître horloger en haute horlogerie (complications, restauration de montres historiques). Technicien contrôle qualité optique avec maîtrise de la vision par ordinateur. Responsable formation horlogerie (CIFOM, écoles d'horlogerie, CFC).",

    "b3.roles.r2.domain": "Commerce, vente et marketing",
    "b3.roles.r2.name": "Vendeur spécialisé en boutique luxe",
    "b3.roles.r2.exp": "5/10",
    "b3.roles.r2.expLabel": "exposition",
    "b3.roles.r2.head": "28 000",
    "b3.roles.r2.headLabel": "actifs CH",
    "b3.roles.r2.shift": "L'avant-vente standard, le qualification client, la prise de rendez-vous, le suivi post-achat passent à des copilotes CRM augmentés. Ce qui résiste, et que la maison doit protéger : le rituel boutique, la connaissance du client UHNW, la capacité à raconter l'histoire d'une pièce, à arbitrer entre disponibilité réelle et waiting-list. Le vendeur devient curateur d'expérience plus que technicien de la transaction.",
    "b3.roles.r2.pivot": "Expert produits techniques premium (horlogerie, joaillerie, audiologie). Conseiller clientèle luxe spécialisé en expérience et fidélisation UHNW. Formateur vente et techniques commerciales en interne maison.",

    "b3.roles.r3.domain": "Communication, média, traduction",
    "b3.roles.r3.name": "Brand manager",
    "b3.roles.r3.exp": "5/10",
    "b3.roles.r3.expLabel": "exposition",
    "b3.roles.r3.head": "6 000",
    "b3.roles.r3.headLabel": "actifs CH",
    "b3.roles.r3.shift": "Métier au cœur du sujet de la dépêche. La gouvernance IA devient un sujet de positionnement de marque, pas seulement de conformité. Le brand manager arbitre l'usage du génératif dans la création visuelle, fixe les règles de cohabitation entre IA et signature humaine, anticipe la pression réputationnelle d'une utilisation perçue comme dégradante. La compétence change de nature : moins de campagnes et de calendrier, plus de doctrine de marque face à l'IA.",
    "b3.roles.r3.pivot": "Directeur marketing et brand strategy (P&L marque, architecture de portfolio). Expert brand purpose et impact (RSE, communication engagée, B Corp). Consultant en marques globales sur l'extension de marque et les marchés émergents.",

    "b3.roles.r4.domain": "Audiovisuel et contenus numériques",
    "b3.roles.r4.name": "Designer UX/UI",
    "b3.roles.r4.exp": "7/10",
    "b3.roles.r4.expLabel": "exposition",
    "b3.roles.r4.head": "22 000",
    "b3.roles.r4.headLabel": "actifs CH",
    "b3.roles.r4.shift": "Forte exposition aux outils IA génératifs sur le wireframe, le prototypage, la production d'assets. La valeur du designer en environnement luxe se déplace vers ce qui n'est pas reproductible : la cohérence avec l'identité de maison sur cent ans, la finesse de l'expérience boutique connectée, l'arbitrage entre accessibilité et désirabilité, le pilotage d'un design system qui survit aux générations d'outils.",
    "b3.roles.r4.pivot": "Directeur UX et expérience produit (product design, discovery, roadmap). Expert accessibilité et design inclusif (WCAG, audit, personas diversifiés). Design system lead (tokens, composants, gouvernance design à l'échelle).",

    "b3.roles.r5.domain": "Communication, média, traduction",
    "b3.roles.r5.name": "Directeur communication / CMO",
    "b3.roles.r5.exp": "6/10",
    "b3.roles.r5.expLabel": "exposition",
    "b3.roles.r5.head": "3 500",
    "b3.roles.r5.headLabel": "actifs CH",
    "b3.roles.r5.shift": "Population restreinte mais à effet d'amplification fort. La production de communication corporate, la veille concurrentielle, la rédaction de communiqués passent à des copilotes. Ce qui devient la fonction principale : orchestrer la transformation IA de la maison de l'intérieur, piloter la communication de crise sur les sujets IA-éthique, défendre la cohérence narrative quand le marketing IA pousse à la quantité. Le CMO devient gardien du tempo.",
    "b3.roles.r5.pivot": "Chief Digital Officer en transformation IA (pilotage numérique d'entreprise, MAS Management HES). Directeur relations publiques et corporate affairs (lobbying cantonal et fédéral, SPRI Berne). Consultant indépendant IA et communication pour PME et fondations suisses.",

    "b3.tools.eyebrow": "L'IA comme levier",
    "b3.tools.title": "Six <em>outils</em> qu'utilisent les maisons horlogères qui avancent.",
    "b3.tools.intro": "Sélection observée dans les déploiements réels chez Richemont, Hermès Horloger, Audemars Piguet et trois manufactures indépendantes interrogées. La maîtrise n'est pas dans le choix de l'outil, mais dans la définition du cas d'usage et la gouvernance qu'il impose.",

    "b3.tools.t1.cat": "Authentification",
    "b3.tools.t1.name": "ORIGYN · empreinte biométrique IA",
    "b3.tools.t1.desc": "Computer vision haute définition sur chaque pièce, signature numérique infalsifiable, certificat blockchain. Adopté par WatchBox sur le marché secondaire.",

    "b3.tools.t2.cat": "Clienteling VIP",
    "b3.tools.t2.name": "CRM augmenté boutique",
    "b3.tools.t2.desc": "Préparation de RDV VIP : historique d'achat, préférences déclarées, événements personnels, recommandations de pièces compatibles avec la collection existante.",

    "b3.tools.t3.cat": "Forecast & rareté",
    "b3.tools.t3.name": "Modèles propriétaires + données ESPA",
    "b3.tools.t3.desc": "Prévision de demande par référence, par marché, par segment de prix. Permet d'orchestrer la production en respectant la dramaturgie de la rareté propre à chaque collection.",

    "b3.tools.t4.cat": "Création & design",
    "b3.tools.t4.name": "IA générative cantonnée",
    "b3.tools.t4.desc": "Usage strictement amont : exploration de variantes esthétiques, recherche stylistique. Décision finale et signature toujours humaines. Aucun élément identitaire généré par IA.",

    "b3.tools.t5.cat": "Service après-vente",
    "b3.tools.t5.name": "Triage IA des demandes SAV",
    "b3.tools.t5.desc": "Classification automatique des demandes (révision, réparation, expertise), affectation à l'horloger spécialiste compétent. Réduit les délais sur les demandes complexes.",

    "b3.tools.t6.cat": "Lutte anti-contrefaçon",
    "b3.tools.t6.name": "Computer vision sur marché parallèle",
    "b3.tools.t6.desc": "Veille automatisée des plateformes (eBay, Chrono24, Vinted) : détection des pièces suspectes, alerte juridique. Soutient le service anticontrefaçon FH (Michel Arnoux).",

    "b3.act.eyebrow": "Aller plus loin",
    "b3.act.title": "Du diagnostic à <em>l'action</em>.",
    "b3.act.lede": "Cette dépêche pose le cadre. Pour passer du constat à la décision, deux passerelles selon votre besoin.",
    "b3.act.c1.tag": "Dispatch sur mesure",
    "b3.act.c1.title": "Une dépêche dédiée à votre maison",
    "b3.act.c1.desc": "Format Le Dispatch·iA appliqué à votre périmètre exact : benchmark anonymisé des maisons pairs, cartographie des risques AI Act et nGDPR pour vos données UHNW, matrice de priorisation des cas d'usage adaptée à votre identité de marque, scénarios de positionnement face au commerce agentique. Livré sous quinze jours. Devis sur demande.",
    "b3.act.c1.cta": "Demander un devis →",
    "b3.act.c2.tag": "Mise en œuvre opérationnelle",
    "b3.act.c2.title": "De la gouvernance à l'architecture",
    "b3.act.c2.desc": "Accompagnement du COMEX maison : politique d'usage IA, gouvernance des données client, design des outils internes (CRM, anti-contrefaçon, forecast), formation des équipes boutique et atelier. Intervention en demi-journées ou en mission cadrée. Premier échange gratuit.",

    "b3.src.eyebrow": "Annexe · Sources & traçabilité",
    "b3.src.title": "Les chiffres cités, ouverts à la <em>vérification</em>.",
    "b3.src.intro": "Une dépêche n'a de valeur que si ses chiffres sont vérifiables. Chaque indicateur de cette dépêche renvoie ci-dessous à sa publication d'origine. Sources primaires intégralement citées, sans paywall ni rétention.",
    "b3.src.s1.label": "Fédération de l'industrie horlogère suisse (FH) · Statistiques 2025 · janvier 2026",
    "b3.src.s1.cited": "Citée pour le chiffre <strong>-1,7% des exportations horlogères suisses en 2025 (25,6 Md CHF)</strong>, deuxième année consécutive de repli. Volumes -4,8% (-740 000 unités). Source officielle des douanes fédérales.",
    "b3.src.s2.label": "Le Temps · Résultats trimestriels Richemont · 15 janvier 2026",
    "b3.src.s2.cited": "Citée pour le chiffre <strong>+7% pour les spécialités horlogères Richemont</strong> (IWC, Jaeger-LeCoultre, Vacheron Constantin, A. Lange & Söhne, Panerai, Piaget, Roger Dubuis). Premier rebond significatif depuis 18 mois.",
    "b3.src.s3.label": "Kearney · 2026 Global Luxury Industry Outlook · janvier 2026",
    "b3.src.s3.cited": "Citée pour le chiffre <strong>+16,2% / an d'investissement IA dans le luxe sur dix ans</strong>, et 90% des dirigeants considérant l'IA comme essentielle. Échantillon : 200+ dirigeants luxe interrogés.",
    "b3.src.primary": "Source primaire ↗",
    "b3.src.note": "Note. Les chiffres présentés ici sont arrondis. Les marges d'incertitude et les méthodologies détaillées de chaque source sont accessibles sur la page Méthodologie. Sources complémentaires citées : Bain-Altagamma, Deloitte Global Powers of Luxury 2026, Reuters, Reed Smith, France-Épargne, Carnets du Luxe, ORIGYN, Arianee, WiseKey.",


    "b3.arch.eyebrow": "Le travailleur recomposé · 4 archétypes face à l'IA",
    "b3.arch.title": "Quatre archétypes pour <em>défendre l'incarnation humaine</em> dans le luxe.",
    "b3.arch.lede": "Le sociologue Yann Ferguson, présenté aux RNS Strasbourg en avril 2026 avec Yves Caseau (ex-Chief Digital Officer Michelin), propose un cadre d'analyse directement actionnable. Pour les Maisons horlogères premium, ce cadre prend une importance particulière : la valeur de marque repose précisément sur l'incarnation humaine du savoir-faire, et l'archétype choisi pour chaque fonction devient un acte stratégique de protection ou d'érosion du capital de marque.",
    "b3.arch.a1.tag": "Risque · existentiel",
    "b3.arch.a1.name": "Le travailleur remplacé",
    "b3.arch.a1.body": "L'automatisation réduit les emplois par attrition silencieuse. Pour le luxe, ce scénario est <strong>existentiellement dangereux</strong> sur les fonctions liées à l'incarnation du savoir-faire (artisans visibles, ateliers ouverts, narration de fabrique, accompagnement VIP en boutique). Couper ces postes au nom de l'efficacité IA, c'est démanteler le bundle human-intrinsic identifié par Trammell, qui est précisément ce que les clients VIP achètent. La presse spécialisée (WatchPro, Le Temps, Forbes Watches) commence à scruter ces choix. <strong>Recommandation : ne jamais appliquer ce schéma aux fonctions liées à l'incarnation du savoir-faire.</strong>",
    "b3.arch.a2.tag": "Risque · cohérence",
    "b3.arch.a2.name": "Le travailleur dominé",
    "b3.arch.a2.body": "L'autonomie est contrainte par le contrôle algorithmique. Pour le luxe, ce risque apparaît si les conseillers boutique sont pilotés par des scripts IA-générés en temps réel, si la créativité produit est encadrée par des recommandations algorithmiques basées sur les ventes passées, ou si l'expertise des sertisseurs et horlogers est notée par des outils IA. <strong>Risque d'incohérence narrative</strong> : une Maison qui revendique le savoir-faire humain mais qui pilote algorithmiquement son humanité contredit son propre récit. Recommandation : auditer les outils RH IA pour préserver l'autonomie créative et relationnelle.",
    "b3.arch.a3.tag": "Cible opérationnelle",
    "b3.arch.a3.name": "Le travailleur augmenté",
    "b3.arch.a3.body": "L'IA améliore la performance individuelle sans remplacer la décision humaine. Cible naturelle pour les fonctions support du luxe : recherche historique pour la documentation produit, traduction multilingue pour les marchés internationaux, premier projet de copy marketing, modélisation 3D des prototypes, gestion documentaire CRM. Libère du temps pour le travail de fond. Brynjolfsson 2025 documente +15% sur les juniors. <strong>Caveat majeur</strong> : Lee et al. 2025 et l'étude MIT Klopfer documentent que l'usage répété sans discipline affaiblit la pensée critique. Pour le luxe où la qualité du jugement esthétique est l'actif principal, ce risque est d'ordre stratégique.",
    "b3.arch.a4.tag": "Cible stratégique majeure",
    "b3.arch.a4.name": "Le travailleur réhumanisé",
    "b3.arch.a4.body": "L'IA libère du temps pour des activités plus distinctement humaines. <strong>Pour le luxe et l'horlogerie premium, c'est la cible stratégique principale</strong>, pas une cible secondaire. Décharger les artisans des tâches administratives répétitives pour libérer plus de temps de geste. Décharger les conseillers VIP des tâches de saisie pour libérer plus de temps de présence. Décharger les designers des recherches documentaires pour libérer plus de temps de création originale. C'est ce qui transforme une Maison qui survit la transition IA en Maison qui capture la prime du human-intrinsic identifiée par Trammell. <strong>Indicateur de réussite</strong> : le temps de geste artisanal mesurable par produit, le temps de présence en boutique par client VIP, le temps créatif par designer.",
    "b3.arch.closing": "<strong>Pour les comités exécutifs des Maisons horlogères premium</strong>, le cadre Ferguson est plus qu'un outil RH : c'est un outil de protection de marque. Chaque archétype choisi pour chaque fonction est un signal envoyé au marché et aux clients VIP sur la cohérence narrative de la Maison. L'industrie horlogère suisse a déjà réussi cette opération une fois, contre le quartz dans les années 1980. Le défi 2026-2030 est de la réussir une seconde fois, contre la commoditisation cognitive. La méthode : combiner le cadre Ferguson (4 archétypes par fonction), le cadre Iansiti (streamlining sur les fonctions support uniquement), et la règle d'Alexandre/Babeau (les forts deviennent plus productifs, les faibles risquent la dépendance).",
    "b3.arch.eyebrow": "Cartographie sociologique · 4 manières de vivre l'IA au travail",
    "b3.arch.title": "Le travailleur remplacé, dominé, augmenté ou réhumanisé · <em>quel artisan horloger construit-on ?</em>",
    "b3.arch.lede": "La typologie de Yann Ferguson (LaborIA Explorer, ICAM Toulouse) propose quatre figures de travailleur face à l'IA. Pour les Maisons horlogères premium, ce cadre est particulièrement utile : la cohérence entre la promesse de marque (savoir-faire incarné, héritage humain) et la réalité de l'expérience employé est un actif stratégique direct. Un horloger en sédation cognitive ou sous contrôle algorithmique contredit le récit de marque.",
    "b3.arch.a1.tag": "Attrition silencieuse",
    "b3.arch.a1.name": "Le travailleur remplacé",
    "b3.arch.a1.body": "L'automatisation discrète qui réduit l'emploi par non-renouvellement de départs naturels. Pour le luxe horloger, le risque concerne moins les artisans visibles (protégés par la promesse Swiss Made) que les fonctions support et marketing : analystes CRM, gestionnaires de campagne digitale, gestionnaires de stocks, support client de premier niveau.",
    "b3.arch.a1.signal": "<strong>Périmètre exposé :</strong> back-office CRM VIP, gestion de campagnes digitales standardisées, support client de premier niveau, analytics post-événement. <strong>Signal d'alerte RH :</strong> sous-traitance progressive de fonctions support sans plan d'évolution interne.",
    "b3.arch.a2.tag": "Contrôle algorithmique",
    "b3.arch.a2.name": "Le travailleur dominé",
    "b3.arch.a2.body": "L'IA devient l'arbitre invisible du travail. Le conseiller de boutique suit un script de recommandation produit IA, le responsable de boutique reçoit des objectifs calculés algorithmiquement, le directeur régional pilote selon des dashboards qu'il ne maîtrise pas. L'autonomie professionnelle se rétrécit. Pour le luxe, ce risque est particulièrement toxique parce qu'il contredit l'idée même de relation client haute valeur.",
    "b3.arch.a2.signal": "<strong>Périmètre exposé :</strong> conseillers de boutique sous outils de prescription IA, responsables de boutique sous KPI algorithmiques en temps réel, gestionnaires CRM VIP sous scoring automatique. <strong>Signal d'alerte RH :</strong> turnover en hausse parmi les conseillers expérimentés des boutiques flagship, plaintes clients VIP sur la perte de personnalisation.",
    "b3.arch.a3.tag": "Performance augmentée",
    "b3.arch.a3.name": "Le travailleur augmenté",
    "b3.arch.a3.body": "L'IA libère l'horloger et le conseiller des tâches à faible valeur (recherche d'archives, préparation de rendez-vous client, documentation produit, première version de mood board) pour qu'ils se concentrent sur ce qui ne peut pas être commoditisé : le geste, le récit, la lecture du client. Brynjolfsson 2025 documente +15% pour les juniors disciplinés. Mais discipline d'usage indispensable.",
    "b3.arch.a3.signal": "<strong>Périmètre concerné :</strong> designers produits assistés par IA générative, conseillers de boutique flagship sur préparation de rendez-vous, gestionnaires de patrimoine horloger pour vente aux enchères. <strong>Signal d'alerte RH :</strong> écart de qualité de service entre conseillers disciplinés et conseillers en sédation cognitive, visible sur les ventes complexes.",
    "b3.arch.a4.tag": "Recentrage humain",
    "b3.arch.a4.name": "Le travailleur réhumanisé",
    "b3.arch.a4.body": "L'IA absorbe les tâches transactionnelles et libère du temps pour le geste, le récit, l'écoute, l'accompagnement long. C'est le scénario que la promesse de marque luxe revendique depuis toujours mais qui exige un choix RH explicite. Le maître horloger qui consacre 40% de plus de temps à former les jeunes apprentis. Le conseiller VIP qui peut suivre quinze familles avec une qualité d'attention que les données ne mesurent pas.",
    "b3.arch.a4.signal": "<strong>Périmètre concerné :</strong> maîtres horlogers et formation interne, conseillers patrimoine horloger en succession familiale, ambassadeurs de marque face à des collectionneurs internationaux. <strong>Signal positif RH :</strong> qualité narrative des contenus de marque en hausse, fidélité client VIP sur le très long terme en hausse.",
    "b3.arch.takeaway": "<strong>Pour les comités exécutifs des Maisons horlogères premium</strong>, l'arbitrage entre ces quatre archétypes est <em>une décision de marque, pas seulement RH</em>. Une Maison qui finit avec un mélange remplacé + dominé contredit son propre récit Swiss Made et perd sa prime de marque. Une Maison qui pilote activement vers augmenté + réhumanisé renforce sa promesse et capture la prime du human-intrinsic au sens de Trammell. La cohérence entre l'expérience employé et la promesse client devient un actif stratégique mesurable, et un argument explicite face aux fonds d'investissement qui interrogent la durabilité du modèle face à la commoditisation IA.",
    "b3.debate.eyebrow": "Le débat IA et travail · trois positions structurantes",
    "b3.debate.title": "Trois lectures du même phénomène, <em>trois plans de transformation</em>.",
    "b3.debate.lede": "Le débat sur l'IA et l'emploi est traversé par trois positions intellectuelles solides qui ne disent pas la même chose. Pour les Maisons horlogères premium, la position retenue change radicalement la décision RH, le calendrier d'investissement et la stratégie de marque. La page Veille de l'observatoire référence chacune de ces sources avec lien primaire.",

    "b3.debate.p1.tag": "Position pessimiste",
    "b3.debate.p1.author": "Dario Amodei (Anthropic) · Mustafa Suleyman (Microsoft AI)",
    "b3.debate.p1.claim": "L'IA va éliminer 50% des cadres entrants en 1 à 5 ans.",
    "b3.debate.p1.body": "Pour Amodei, l'IA progresse simultanément dans tous les secteurs cognitifs, ce qui supprime les bassins d'emploi adjacents qui absorbaient historiquement les travailleurs déplacés. Suleyman va plus loin en estimant que la plupart des tâches de cadres seront automatisées en 12 à 18 mois. Si cette position est correcte appliquée au luxe, elle implique une suppression massive des postes de relation client junior, des analystes marketing et des designers produits assistés. Les dirigeants horlogers qui retiennent cette lecture <strong>gèlent les recrutements entry-level dès maintenant</strong>, restructurent les équipes de stylisme autour d'un seuil senior, et préparent une bascule rapide vers des architectures IA-first.",

    "b3.debate.p2.tag": "Position empirique",
    "b3.debate.p2.author": "Pieter Garicano (Silicon Continent) · Brynjolfsson (Stanford) · NY Fed",
    "b3.debate.p2.claim": "La tâche n'est pas le job. Le bundle survit, recomposé.",
    "b3.debate.p2.body": "Garicano développe un argument structurel : un job est un bundle de tâches, pas une somme de tâches automatisables. Quand l'IA prend la tâche faible du bundle, elle laisse au travailleur la tâche forte, qui était souvent celle qui produisait la vraie valeur. L'exemple historique central est précisément <strong>l'horlogerie suisse face au quartz dans les années 1980</strong> : la survie n'est pas venue d'une meilleure précision technique, mais d'une redéfinition complète du bundle de valeur (mécanique d'art, héritage, statut, savoir-faire incarné). Les données NY Fed avril 2026 confirment empiriquement cette logique : la majorité des firmes adoptant l'IA forment leur personnel existant plutôt que de couper. Brynjolfsson 2025 observe un gain +15% concentré sur les juniors, signal d'augmentation et non de substitution.",

    "b3.debate.p3.tag": "Position macroéconomique",
    "b3.debate.p3.author": "Philip Trammell (Stanford) · Korinek (NBER) · Papanikolaou (Northwestern)",
    "b3.debate.p3.claim": "Les biens human-intrinsic protègent structurellement la part travail.",
    "b3.debate.p3.body": "Trammell formalise pourquoi la part travail peut rester élevée même dans un scénario de pleine automatisation. La thèse repose sur la notion de biens human-intrinsic : concerts, performances, soin, accompagnement, où la présence humaine fait partie de la définition même du bien. <strong>L'horlogerie premium est un cas paradigmatique</strong> de bien human-intrinsic : ce que vend une Patek Philippe ou un mouvement Greubel Forsey, ce n'est pas la précision (qu'une Apple Watch dépasse), c'est la trace incarnée d'un savoir-faire humain rare. Une préférence même légère pour ces biens humains-intrinsèques, partagée par les ménages riches, peut maintenir la part travail à un niveau élevé voire la pousser vers 1, indépendamment de la capacité technique des machines. Papanikolaou (Northwestern) confirme empiriquement les effets compensatoires.",

    "b3.debate.sec.tag": "Implication sectorielle · luxe et horlogerie premium",
    "b3.debate.sec.title": "Le luxe est <em>structurellement protégé</em>, mais pas équitablement réparti.",
    "b3.debate.sec.body": "Pour les Maisons horlogères premium, la convergence des trois positions donne une lecture nuancée. La position pessimiste d'Amodei <em>est probablement fausse appliquée au luxe</em>, parce que la valeur du luxe ne vient pas d'une efficacité de production que l'IA pourrait commoditiser. La position empirique de Garicano <em>est directement vérifiée</em> par l'histoire récente du secteur : le quartz devait tuer l'horlogerie suisse, qui a doublé en valeur en redéfinissant son bundle. La position macro de Trammell <em>donne le cadre théorique</em> : le luxe vend un bien human-intrinsic au sens technique du terme. <strong>Mais cette protection structurelle n'est pas équitablement répartie dans le secteur</strong>. Les Maisons qui restent dans la course à la précision pure et au scoring algorithmique des clients VIP perdent leur prime. Celles qui doublent leur investissement sur l'incarnation humaine (artisans visibles, ateliers ouverts, accompagnement long, narration de fabrique) capturent la prime du human-intrinsic. La décision RH 2026 n'est pas <em>combien de juniors couper</em>, c'est <em>quels postes humains augmenter pour défendre le bundle</em>.",

    "b3.tco.eyebrow": "Économie des coûts · le facteur ignoré",
    "b3.tco.title": "Le coût réel de l'IA dans le luxe et l'horlogerie premium, <em>au-delà du prix par token</em>.",
    "b3.tco.lede": "Les expériences clients VIP, les recommandations personnalisées et l'authentification de produits par IA exigent une qualité d'inférence et une supervision humaine que les budgets POC sous-estiment systématiquement. Pour le luxe, le coût d'un mauvais output peut détruire en un instant un capital de marque construit en décennies.",
    "b3.tco.s1.label": "Erreur potentielle de calcul des coûts GenAI selon Gartner si le passage à l'échelle n'est pas anticipé",
    "b3.tco.s1.source": "Gartner · oct 2024",
    "b3.tco.s2.label": "Des CIO indiquent un breakeven ou une perte sur leurs investissements IA en 2024",
    "b3.tco.s2.source": "Gartner · oct 2024",
    "b3.tco.s3.label": "Coût par résolution GenAI prédit dans le service client en 2030, supérieur aux agents offshore",
    "b3.tco.s3.source": "Gartner · janv 2026",
    "b3.tco.takeaway": "<strong>Pour les directions des marques d'horlogerie premium et de luxe</strong>, l'enjeu spécifique : les expériences clients VIP, les recommandations personnalisées et l'authentification de produits par IA exigent une qualité d'inférence et une supervision humaine que le prix par token publié ne reflète pas. Le coût total par interaction haut de gamme peut atteindre 10 à 20 fois le coût POC. Le pivot stratégique de <em>Quinlan (Gartner, janvier 2026)</em> s'applique parfaitement au luxe : utiliser l'IA pour augmenter la valeur perçue de la relation, jamais pour rogner sur l'expérience client. Le cadre TCO de Tomer (avril 2026) et notre <a href=\"../methodologie.html#tco\">section méthodologique 07</a> formalisent les composantes à modéliser.",

    "b3.sov.eyebrow": "Souveraineté numérique · juridiction et résidence des données",
    "b3.sov.title": "Pour le luxe et l'horlogerie premium, <em>la souveraineté est cohérente avec la promesse de marque</em>.",
    "b3.sov.lede": "Une marque d'horlogerie premium qui revendique le « Swiss Made » et la traçabilité de chaque composant ne peut pas, sans incohérence narrative, traiter ses données clients VIP ou ses informations design sensibles dans une infrastructure dont la juridiction n'est pas garantie. La souveraineté numérique devient un actif de marque, au même titre que la manufacture interne ou la traçabilité de l'or éthique.",
    "b3.sov.s1.tag": "Suisse",
    "b3.sov.s1.name": "Apertus + Swisscom Sovereign AI",
    "b3.sov.s1.body": "Apertus (EPFL, ETH Zurich, CSCS, septembre 2025) est le premier LLM public suisse fully open : 8B et 70B paramètres, 1000+ langues incluant le suisse-allemand. Conforme à l'EU AI Act, à la LPD suisse et aux opt-outs créateurs. Hébergé sur la plateforme IA souveraine de Swisscom. Pour les Maisons horlogères qui veulent traiter des données clients VIP ou des archives design (croquis de mouvement, archives historiques, base CRM patrimoniale) sous juridiction strictement helvétique, c'est l'option qui aligne IA et promesse de marque Swiss Made.",
    "b3.sov.s2.tag": "Europe",
    "b3.sov.s2.name": "Mistral AI · pour les marchés européens",
    "b3.sov.s2.body": "Mistral AI (FR, Paris) traite toutes les requêtes API dans des data centers européens. Pour les marques horlogères premium qui opèrent fortement sur les marchés européens (boutiques flagship Paris, Milan, Genève), Mistral offre une couverture multilingue native (français, allemand, italien, espagnol) avec garantie contractuelle de non-utilisation des données client pour l'entraînement. Levée de 830 M$ de dette en mars 2026 pour 200 MW de capacité européenne en 2027.",
    "b3.sov.s3.tag": "Cohérence",
    "b3.sov.s3.name": "Le récit Swiss Made et la donnée sous juridiction étrangère",
    "b3.sov.s3.body": "L'horlogerie premium vend de la patience, de la précision, de la traçabilité. Une marque qui investit dans la traçabilité de chaque composant horloger mais qui externalise le traitement de ses données clients VIP vers une infrastructure US s'expose à un risque narratif autant que réglementaire. La presse spécialisée (WatchPro, Le Temps, Forbes Watches) commence à interroger ces choix. Les ventes Singapore-China-Middle East exigent désormais souvent des engagements explicites de résidence européenne ou suisse.",
    "b3.sov.takeaway": "<strong>Pour les comités exécutifs des Maisons horlogères premium</strong>, la grille de décision intègre la souveraineté comme une composante stratégique. Apertus et Swisscom Sovereign AI permettent de garder l'IA conforme à la promesse Swiss Made. Mistral couvre les marchés européens en restant en juridiction UE. L'investissement initial est plus élevé, mais le coût d'opportunité d'un incident de souveraineté qui contredirait le récit de marque est, lui, considérable.",

    "b3.disc.eyebrow": "Disclosure éditoriale",
    "b3.disc.body": "Ce dossier a été produit avec l'assistance d'une intelligence artificielle (Claude Opus 4.7, en modes Research et Web Search), puis soumis à une vérification factuelle contre les sources primaires. L'IA a servi d'outil de documentation, de synthèse et de mise en forme visuelle, pas de source autonome ni d'autorité scientifique. Détails méthodologiques en <a href=\"../methodologie.html\">section 03 de la page Méthodologie</a>.",

    "b3.back": "Toutes les dépêches"
  },

    "b3.title": "Premium watchmaking and AI: the test of <em>desirability</em>.",
    "b3.sub": "The luxury market is going through its toughest quarter since 2008 in 2026. For Swiss premium watchmaking houses, AI governance is no longer a compliance issue: it is now a desirability issue. Three fronts open simultaneously. Here is what an executive committee needs to know before the next Watches & Wonders.",
    "b3.by.author": "Naully Nicolas",
    "b3.by.read": "7 minute read",
    "b3.by.sources": "12 primary sources",

    "b3.land.eyebrow": "The landscape",
    "b3.land.title": "What premium watchmaking is <em>actually</em> going through in 2026.",
    "b3.land.p1": "The Swiss watchmaking industry closed 2025 with a second consecutive year of decline (-1.7%, to CHF 25.6 billion in exports), with volumes down 4.8% (-740,000 units) and employment down 1.3%. Q1 2026 confirms the pressure: -1.0% over three months (CHF 6.2bn), China down more than a third in two years, generalised partial unemployment in Jura subcontracting. The high-end segment (>CHF 3,000 export price) is down 1.9%, a sign that even the sanctuary of rarity is weakening.",
    "b3.land.p2": "But behind this cyclical crisis, a strong signal: Richemont's specialist watchmakers division grew +7% in March 2026 (first rebound in 18 months), driven by A. Lange & Söhne and Vacheron Constantin. Cartier and Van Cleef jewellery up +14%. Value is shifting clearly toward heritage rarity and VIP experience. Three AI fronts open simultaneously for houses: regulatory (European AI Act), operational (Shadow AI in boutiques and manufactures), and strategic (agentic commerce challenging the watch purchase ritual).",

    "b3.land.up.title": "What is settling in",
    "b3.land.up.li1": "<strong>AI + blockchain authentication.</strong> ORIGYN (Neuchâtel), Arianee (Vacheron, Breitling), WiseKey (Hublot since 2010). Response to USD 2 billion in annual losses from counterfeiting.",
    "b3.land.up.li2": "<strong>Augmented clienteling.</strong> AI CRM for boutique advisors: ultra-VIP appointment preparation, recommendations based on purchase history, real-time quadrilingual translation.",
    "b3.land.up.li3": "<strong>Forecasting and orchestration of rarity.</strong> Demand prediction by reference, market, segment, to adjust production to the desired level of desirability (Kearney: central 2026 objective).",
    "b3.land.up.li4": "<strong>AI-certified secondary market.</strong> Watchfinder (Richemont), Chrono24, WatchBox: visual authentication via computer vision on each piece's unique biometric fingerprint.",

    "b3.land.down.title": "What is slowing down",
    "b3.land.down.li1": "<strong>Young watchmaker recruitment.</strong> -1.3% sectoral employment in 2025, Jura subcontracting in partial unemployment. Concerns about transmission of know-how.",
    "b3.land.down.li2": "<strong>Generic AI marketing.</strong> Product visuals generated without manual validation. High reputational risk: a fake movement visual on Instagram can collapse a brand capital.",
    "b3.land.down.li3": "<strong>Outsourcing outside the EU.</strong> Ultra-high net worth client data (UHNW): reinforced sovereignty requirements, AI Act + Swiss nGDPR in force in 2026.",
    "b3.land.down.li4": "<strong>Unframed agentic commerce.</strong> Existential risk for the boutique ritual: an AI agent negotiating a Vacheron Patrimony in place of the client breaks the emotional contract built over decades.",


    "b3.crit.eyebrow": "Critical reading · three objections to the alarmist narrative",
    "b3.crit.title": "Why the « massive job disappearance » narrative <em>does not hold up</em>.",
    "b3.crit.lede": "Statements from Dario Amodei (Anthropic, 50% of junior white-collar jobs gone in 1-5 years) and Mustafa Suleyman (Microsoft AI, 12-18 months to automate office work) circulate widely in public debate. Three convergent sources in 2026 document why this narrative is empirically fragile and theoretically contestable. This section articulates them for the luxury and premium watchmaking sector.",
    "b3.crit.t1.title": "Big Tech headcount 2026 ≈ 2022 · despite $700 billion in AI CapEx",
    "b3.crit.t1.body": "The four largest tech firms have committed over $700 billion in AI CapEx this fiscal year, yet Amazon, Google and Meta today employ approximately the same number of workers as in 2022. R&D expenditures normalized against revenue have <strong>increased</strong> at Meta, Google and Amazon since 2022. Marc Andreessen and Sam Altman themselves acknowledge layoffs primarily reflect pandemic-era over-hiring. <strong>Consequence for premium watchmaking houses and luxury</strong>: US tech announcements are not a benchmark to calibrate an AI strategy in luxury. Houses that imitate the Silicon Valley efficiency rhetoric risk weakening their brand narrative, which precisely rests on valuing human work and craft.",
    "b3.crit.t1.source": "Source · Washington Post May 1, 2026 · NYT Opinion May 3, 2026",
    "b3.crit.t2.title": "A premium watchmaking job is a bundle of authority, not a sum of automatable tasks",
    "b3.crit.t2.body": "The task-exposure argument assumes a job reduces to the sum of its measurable tasks. But premium watchmaking rests on very dense bundles: a watchmaker combines technical gesture, aesthetic judgment, quality arbitration, transmission, and the exercise of authority (piece validation, signature). AI can help on some isolated tasks (CAD, simulation) without replacing the <em>accountability</em> of the whole. This is Garicano's central argument (April 2026) in response to Amodei and Suleyman. <strong>For luxury, the consequence is strategic</strong>: AI does not eliminate authority occupations (master watchmaker, creative director, VIP advisor), it augments them. The transformation goes through bundle recomposition around higher-authority and brand-signature value decisions.",
    "b3.crit.t2.source": "Source · Luis Garicano · Silicon Continent · April 22, 2026",
    "b3.crit.t3.title": "Theoretically, AI enrichment raises the value of human luxury in the long run",
    "b3.crit.t3.body": "Trammell (Stanford Digital Economy Lab, March 2026) formalizes the thesis that under hierarchical consumption preferences, human labor becomes a high income-elasticity good, in other words a luxury. When capital becomes abundant, its share in consumption falls and the share of human-rendered labor rises. If capital and labor are gross complements, infinite capital accumulation does not suffice for growth. <strong>For luxury and premium watchmaking, this is the most favorable long-run scenario</strong>: as AI enriches society, the share of consumer budget allocated to goods and services with strong human components (craft, signature, VIP experience) structurally rises. Luxury becomes an indirect beneficiary of the AI transition, not a victim.",
    "b3.crit.t3.source": "Source · Philip Trammell · Stanford Digital Economy Lab · March 27, 2026",
    "b3.num.eyebrow": "By the numbers",
    "b3.num.title": "Three indicators that summarise the year.",
    "b3.num.s1.label": "Swiss watch exports in 2025, second consecutive year of decline (to CHF 25.6 billion). Volumes -4.8% (-740,000 watches).",
    "b3.num.s1.source": "Federation of the Swiss Watch Industry (FH) · January 2026",
    "b3.num.s2.label": "growth for Richemont specialist watchmakers in fiscal Q3 2026 (October-December 2025). First significant rebound in 18 months, led by A. Lange & Söhne and Vacheron Constantin.",
    "b3.num.s2.source": "Le Temps · Richemont quarterly results · January 2026",
    "b3.num.s3.label": "annual growth in luxury AI investment over the next decade. 90% of luxury executives consider AI essential.",
    "b3.num.s3.source": "Kearney · 2026 Global Luxury Industry Outlook",

    "b3.q.eyebrow": "Expert verdict",
    "b3.q.text": "For luxury, AI governance is not a compliance issue, it is a desirability issue. A house deploying AI outside its standards risks more than a fine: it erodes brand capital built over decades. Conversely, those who can articulate craftsmanship, governed AI and radical transparency will create a new tier of differentiation.",
    "b3.q.author": "Director of digital transformation",
    "b3.q.role": "premium watchmaking manufacture · Vallée de Joux · anonymised interview · April 2026",

    "b3.dec.eyebrow": "Decision · 4 questions to address",
    "b3.dec.title": "What a <em>house executive committee</em> must decide before Watches & Wonders 2027.",
    "b3.dec.intro": "Four operational arbitrations, in order of criticality. None can be fully delegated to IT or an external consultancy. All commit the house's identity over the decade-long horizon characteristic of premium watchmaking.",

    "b3.dec.li1": "<strong>AI usage perimeter in creation.</strong> Which models authorised on upstream phases (design, prototyping), forbidden on identity phases (dial, signature calibre). Decision required before any AI-using marketing communication.",
    "b3.dec.li2": "<strong>Digital authentication standard.</strong> Adopt ORIGYN, Arianee, WiseKey or develop a proprietary solution (Ulysse Nardin model). Structuring decision: a market standard will emerge by 2027 and freeze positions.",
    "b3.dec.li3": "<strong>Agentic commerce policy.</strong> Authorise, frame or forbid AI agents on online boutiques. Existential question: agentics automate the worst enemy of luxury (purchase without ritual). Three Swiss houses interviewed are preparing a charter.",
    "b3.dec.li4": "<strong>UHNW data sovereignty.</strong> Architecture of ultra-high net worth client data. European AI Act in full application, Swiss nGDPR 2026, US biometric tightening. Hosting and model choices to validate in executive committee with compliance.",

    "b3.roles.eyebrow": "At the role level",
    "b3.roles.title": "What <em>governed desirability</em> means for five luxury occupations.",
    "b3.roles.intro": "A house's AI governance choices play out in the daily work of five families of occupations. The irreducible artisan, boutique commerce, brand construction, digital experience, narrative orchestration. For each, what AI displaces, and the most defensible pivot path according to the Swiss observatory's sources.",
    "b3.roles.pivotLabel": "Recommended pivot",
    "b3.roles.footer": "<strong>Switzerland total: 69,500 active workers across the five occupations above</strong>, covering the watchmaking ecosystem and its support fabric (premium retail, communication, design). Headcount figures come from the FSO (STATEM Q1 2026) and the watchmaking industry's Convention patronale. The 324 occupations of the NP 2010 nomenclature are accessible in the <a href=\"../observatoires/suisse.html\" style=\"color: var(--signal); text-decoration: underline;\">Swiss dashboard</a>.",

    "b3.roles.r1.domain": "Industry and production",
    "b3.roles.r1.name": "Watchmaker",
    "b3.roles.r1.exp": "2/10",
    "b3.roles.r1.expLabel": "exposure",
    "b3.roles.r1.head": "10,000",
    "b3.roles.r1.headLabel": "active CH",
    "b3.roles.r1.shift": "The artisan gesture resists, and that is a brand strategy as much as a technical reality. What changes around the watchmaker is the working environment: computer vision for optical quality control, generative AI for complex movement design, digital simulation before prototyping. The hand stays human, the ecosystem becomes hybrid. Traditional haute horlogerie (complications, restoration of historical pieces) gains brand value against the automated precision industry.",
    "b3.roles.r1.pivot": "Master watchmaker in haute horlogerie (complications, restoration of historical timepieces). Optical quality control technician with computer vision mastery. Watchmaking training lead (CIFOM, watchmaking schools, CFC).",

    "b3.roles.r2.domain": "Trade, sales and marketing",
    "b3.roles.r2.name": "Luxury boutique specialist seller",
    "b3.roles.r2.exp": "5/10",
    "b3.roles.r2.expLabel": "exposure",
    "b3.roles.r2.head": "28,000",
    "b3.roles.r2.headLabel": "active CH",
    "b3.roles.r2.shift": "Standard pre-sales, client qualification, appointment booking and post-purchase follow-up move to augmented CRM copilots. What resists, and what the house must protect: the boutique ritual, knowledge of the UHNW client, the ability to tell a piece's story, to arbitrate between actual availability and waiting list. The seller becomes a curator of experience more than a transaction technician.",
    "b3.roles.r2.pivot": "Premium technical product expert (watchmaking, jewellery, audiology). Luxury client advisor specialising in UHNW experience and loyalty. In-house sales and commercial techniques trainer.",

    "b3.roles.r3.domain": "Communication, media, translation",
    "b3.roles.r3.name": "Brand manager",
    "b3.roles.r3.exp": "5/10",
    "b3.roles.r3.expLabel": "exposure",
    "b3.roles.r3.head": "6,000",
    "b3.roles.r3.headLabel": "active CH",
    "b3.roles.r3.shift": "Occupation at the heart of this dispatch's subject. AI governance becomes a brand positioning issue, not just a compliance one. The brand manager arbitrates the use of generative AI in visual creation, sets the rules of coexistence between AI and human signature, anticipates the reputational pressure of a use perceived as degrading. The skill shifts in nature: less campaigns and calendars, more brand doctrine in the face of AI.",
    "b3.roles.r3.pivot": "Marketing and brand strategy director (brand P&L, portfolio architecture). Brand purpose and impact expert (CSR, engaged communication, B Corp). Global brand consultant on brand extension and emerging markets.",

    "b3.roles.r4.domain": "Audiovisual and digital content",
    "b3.roles.r4.name": "UX/UI designer",
    "b3.roles.r4.exp": "7/10",
    "b3.roles.r4.expLabel": "exposure",
    "b3.roles.r4.head": "22,000",
    "b3.roles.r4.headLabel": "active CH",
    "b3.roles.r4.shift": "Strong exposure to generative AI tools on wireframing, prototyping, asset production. The designer's value in a luxury environment shifts toward what cannot be reproduced: consistency with a hundred-year-old house identity, the fineness of the connected boutique experience, arbitration between accessibility and desirability, stewardship of a design system that survives generations of tools.",
    "b3.roles.r4.pivot": "UX and product experience director (product design, discovery, roadmap). Accessibility and inclusive design expert (WCAG, audits, diverse personas). Design system lead (tokens, components, design governance at scale).",

    "b3.roles.r5.domain": "Communication, media, translation",
    "b3.roles.r5.name": "Communication director / CMO",
    "b3.roles.r5.exp": "6/10",
    "b3.roles.r5.expLabel": "exposure",
    "b3.roles.r5.head": "3,500",
    "b3.roles.r5.headLabel": "active CH",
    "b3.roles.r5.shift": "Restricted population but with strong amplification effect. Corporate communication production, competitive intelligence, press release drafting move to copilots. What becomes the primary function: orchestrating the house's AI transformation from within, steering crisis communication on AI-ethics topics, defending narrative coherence when AI marketing pushes for volume. The CMO becomes guardian of tempo.",
    "b3.roles.r5.pivot": "Chief Digital Officer in AI transformation (corporate digital steering, MAS Management HES). Public relations and corporate affairs director (cantonal and federal lobbying, SPRI Berne). Independent AI and communication consultant for Swiss SMEs and foundations.",

    "b3.tools.eyebrow": "AI as a lever",
    "b3.tools.title": "Six <em>tools</em> used by watchmaking houses that move forward.",
    "b3.tools.intro": "Selection observed in real deployments at Richemont, Hermès Horloger, Audemars Piguet and three independent manufactures interviewed. Mastery is not in the choice of tool, but in the definition of the use case and the governance it imposes.",

    "b3.tools.t1.cat": "Authentication",
    "b3.tools.t1.name": "ORIGYN · AI biometric fingerprint",
    "b3.tools.t1.desc": "High-definition computer vision on each piece, unforgeable digital signature, blockchain certificate. Adopted by WatchBox on the secondary market.",

    "b3.tools.t2.cat": "VIP clienteling",
    "b3.tools.t2.name": "Augmented boutique CRM",
    "b3.tools.t2.desc": "VIP appointment preparation: purchase history, declared preferences, personal events, recommendations of pieces compatible with existing collection.",

    "b3.tools.t3.cat": "Forecast & rarity",
    "b3.tools.t3.name": "Proprietary models + ESPA data",
    "b3.tools.t3.desc": "Demand prediction by reference, market, price segment. Allows orchestration of production while respecting the rarity dramaturgy specific to each collection.",

    "b3.tools.t4.cat": "Creation & design",
    "b3.tools.t4.name": "Confined generative AI",
    "b3.tools.t4.desc": "Strictly upstream use: aesthetic variant exploration, stylistic research. Final decision and signature always human. No identity element generated by AI.",

    "b3.tools.t5.cat": "After-sales service",
    "b3.tools.t5.name": "AI triage of after-sales requests",
    "b3.tools.t5.desc": "Automatic classification of requests (revision, repair, expertise), assignment to the competent specialist watchmaker. Reduces delays on complex requests.",

    "b3.tools.t6.cat": "Anti-counterfeiting",
    "b3.tools.t6.name": "Computer vision on parallel market",
    "b3.tools.t6.desc": "Automated monitoring of platforms (eBay, Chrono24, Vinted): detection of suspicious pieces, legal alert. Supports the FH anti-counterfeiting service (Michel Arnoux).",

    "b3.act.eyebrow": "Going further",
    "b3.act.title": "From diagnosis to <em>action</em>.",
    "b3.act.lede": "This dispatch sets the frame. To move from observation to decision, two bridges depending on your need.",
    "b3.act.c1.tag": "Custom Dispatch",
    "b3.act.c1.title": "A dispatch tailored to your house",
    "b3.act.c1.desc": "The Dispatch·iA format applied to your exact perimeter: anonymised peer benchmark, AI Act and Swiss nGDPR risk mapping for your UHNW data, use case prioritisation matrix adapted to your brand identity, positioning scenarios facing agentic commerce. Delivered within fifteen days. Quote on request.",
    "b3.act.c1.cta": "Request a quote →",
    "b3.act.c2.tag": "Operational implementation",
    "b3.act.c2.title": "From governance to architecture",
    "b3.act.c2.desc": "House executive committee support: AI usage policy, customer data governance, internal tools design (CRM, anti-counterfeit, forecast), boutique and workshop team training. Half-day or full-mission interventions. First conversation free.",
    "b3.act.c2.cta": "Discuss implementation →",

    "b3.src.eyebrow": "Appendix · Sources & traceability",
    "b3.src.title": "Every cited figure, open to <em>verification</em>.",
    "b3.src.intro": "A dispatch is only worth its verifiable figures. Every indicator in this dispatch is linked below to its original publication. Primary sources fully cited, no paywall, no withholding.",
    "b3.src.s1.label": "Federation of the Swiss Watch Industry (FH) · 2025 Statistics · January 2026",
    "b3.src.s1.cited": "Cited for the figure <strong>-1.7% in Swiss watch exports in 2025 (CHF 25.6 billion)</strong>, second consecutive year of decline. Volumes -4.8% (-740,000 units). Official source: Swiss federal customs.",
    "b3.src.s2.label": "Le Temps · Richemont quarterly results · 15 January 2026",
    "b3.src.s2.cited": "Cited for the figure <strong>+7% for Richemont specialist watchmakers</strong> (IWC, Jaeger-LeCoultre, Vacheron Constantin, A. Lange & Söhne, Panerai, Piaget, Roger Dubuis). First significant rebound in 18 months.",
    "b3.src.s3.label": "Kearney · 2026 Global Luxury Industry Outlook · January 2026",
    "b3.src.s3.cited": "Cited for the figure <strong>+16.2%/year of luxury AI investment over ten years</strong>, and 90% of executives considering AI essential. Sample: 200+ luxury executives interviewed.",
    "b3.src.primary": "Primary source ↗",
    "b3.src.note": "Note. Figures presented here are rounded. Uncertainty margins and detailed methodologies for each source are accessible on the Methodology page. Complementary sources cited: Bain-Altagamma, Deloitte Global Powers of Luxury 2026, Reuters, Reed Smith, France-Épargne, Carnets du Luxe, ORIGYN, Arianee, WiseKey.",

    "b3.disc.eyebrow": "Editorial disclosure",
    "b3.disc.body": "This dossier was produced with the assistance of artificial intelligence (Claude Opus 4.7, in Research and Web Search modes), then submitted to factual verification against primary sources. The AI was used as a tool for documentation, synthesis and visual formatting, not as an autonomous source or scientific authority. Methodological details in <a href=\"../methodologie.html\">section 03 of the Methodology page</a>.",


    "b3.sov.eyebrow": "Digital sovereignty · jurisdiction and data residency",
    "b3.sov.title": "For premium luxury and watchmaking, <em>sovereignty is consistent with the brand promise</em>.",
    "b3.sov.lede": "A premium watchmaking brand that claims « Swiss Made » and component traceability cannot, without narrative inconsistency, process VIP client data or sensitive design information in infrastructure whose jurisdiction is not guaranteed. Digital sovereignty becomes a brand asset, on par with in-house manufacturing or ethical gold traceability.",
    "b3.sov.s1.tag": "Switzerland",
    "b3.sov.s1.name": "Apertus + Swisscom Sovereign AI",
    "b3.sov.s1.body": "Apertus (EPFL, ETH Zurich, CSCS, September 2025) is Switzerland's first public fully open LLM: 8B and 70B parameters, 1000+ languages including Swiss German. Compliant with the EU AI Act, Swiss data protection law, and creator opt-outs. Hosted on Swisscom's sovereign AI platform. For watchmaking houses processing VIP client data or design archives (movement sketches, historical archives, heritage CRM base) under strictly Swiss jurisdiction, this is the option that aligns AI with the Swiss Made brand promise.",
    "b3.sov.s2.tag": "Europe",
    "b3.sov.s2.name": "Mistral AI · for European markets",
    "b3.sov.s2.body": "Mistral AI (FR, Paris) processes all API requests in European data centers. For premium watchmaking brands operating heavily in European markets (flagship boutiques Paris, Milan, Geneva), Mistral offers native multilingual coverage (French, German, Italian, Spanish) with a contractual guarantee of non-use of customer data for training. $830M debt raise in March 2026 for 200 MW of European capacity by 2027.",
    "b3.sov.s3.tag": "Consistency",
    "b3.sov.s3.name": "The Swiss Made narrative and foreign-jurisdiction data",
    "b3.sov.s3.body": "Premium watchmaking sells patience, precision, traceability. A brand investing in the traceability of every watchmaking component but outsourcing VIP client data processing to US infrastructure exposes itself to narrative risk as much as regulatory risk. The specialized press (WatchPro, Le Temps, Forbes Watches) is beginning to question these choices. Singapore-China-Middle East sales now often require explicit European or Swiss residency commitments.",
    "b3.sov.takeaway": "<strong>For premium watchmaking executive committees</strong>, the decision grid integrates sovereignty as a strategic component. Apertus and Swisscom Sovereign AI keep AI consistent with the Swiss Made promise. Mistral covers European markets while staying in EU jurisdiction. Initial investment is higher, but the opportunity cost of a sovereignty incident contradicting the brand story is, itself, considerable.",
    "b3.back": "All dispatches",


    "b3.arch.eyebrow": "The recomposed worker · 4 archetypes facing AI",
    "b3.arch.title": "Four archetypes to <em>defend human embodiment</em> in luxury.",
    "b3.arch.lede": "Sociologist Yann Ferguson, presented at the Strasbourg RNS in April 2026 with Yves Caseau (former Chief Digital Officer Michelin), offers a directly actionable analytical framework. For premium watchmaking houses, this framework takes on particular importance: brand value rests precisely on the human embodiment of savoir-faire, and the archetype chosen for each function becomes a strategic act of protection or erosion of brand capital.",
    "b3.arch.a1.tag": "Risk · existential",
    "b3.arch.a1.name": "The replaced worker",
    "b3.arch.a1.body": "Automation reduces jobs through silent attrition. For luxury, this scenario is <strong>existentially dangerous</strong> on functions tied to savoir-faire embodiment (visible artisans, open ateliers, factory storytelling, VIP boutique accompaniment). Cutting these positions in the name of AI efficiency means dismantling the human-intrinsic bundle identified by Trammell, which is precisely what VIP clients buy. Specialized press (WatchPro, Le Temps, Forbes Watches) is starting to scrutinize these choices. <strong>Recommendation: never apply this scheme to functions tied to savoir-faire embodiment.</strong>",
    "b3.arch.a2.tag": "Risk · consistency",
    "b3.arch.a2.name": "The dominated worker",
    "b3.arch.a2.body": "Autonomy is constrained by algorithmic control. For luxury, this risk appears if boutique advisors are steered by real-time AI-generated scripts, if product creativity is framed by algorithmic recommendations based on past sales, or if the expertise of setters and watchmakers is scored by AI tools. <strong>Narrative inconsistency risk</strong>: a House claiming human savoir-faire but algorithmically piloting its humanity contradicts its own story. Recommendation: audit AI HR tools to preserve creative and relational autonomy.",
    "b3.arch.a3.tag": "Operational target",
    "b3.arch.a3.name": "The augmented worker",
    "b3.arch.a3.body": "AI improves individual performance without replacing human decision. Natural target for luxury support functions: historical research for product documentation, multilingual translation for international markets, first marketing copy draft, 3D prototype modeling, CRM document management. Frees time for substantive work. Brynjolfsson 2025 documents +15% on juniors. <strong>Major caveat</strong>: Lee et al. 2025 and the MIT Klopfer study document that repeated use without discipline weakens critical thinking. For luxury where the quality of aesthetic judgment is the main asset, this risk is strategic in nature.",
    "b3.arch.a4.tag": "Major strategic target",
    "b3.arch.a4.name": "The rehumanized worker",
    "b3.arch.a4.body": "AI frees time for more distinctly human activities. <strong>For luxury and premium watchmaking, this is the main strategic target</strong>, not a secondary one. Offload artisans from repetitive administrative tasks to free more gesture time. Offload VIP advisors from data entry tasks to free more presence time. Offload designers from documentary research to free more original creation time. This is what transforms a House that survives the AI transition into a House that captures the human-intrinsic premium identified by Trammell. <strong>Success indicator</strong>: measurable artisanal gesture time per product, boutique presence time per VIP client, creative time per designer.",
    "b3.arch.closing": "<strong>For premium watchmaking executive committees</strong>, the Ferguson framework is more than an HR tool: it is a brand protection tool. Each archetype chosen for each function is a signal sent to the market and VIP clients on the narrative consistency of the House. The Swiss watchmaking industry has already pulled off this operation once, against quartz in the 1980s. The 2026-2030 challenge is to pull it off a second time, against cognitive commoditization. The method: combine the Ferguson framework (4 archetypes per function), the Iansiti framework (streamlining on support functions only), and the Alexandre/Babeau rule (the strong become more productive, the weak risk dependency).",
    "b3.arch.eyebrow": "Sociological mapping · 4 ways of living AI at work",
    "b3.arch.title": "The replaced, dominated, augmented or rehumanized worker · <em>which watchmaking artisan are we building?</em>",
    "b3.arch.lede": "Yann Ferguson's typology (LaborIA Explorer, ICAM Toulouse) proposes four worker figures facing AI. For premium watchmaking houses, this framework is particularly useful: consistency between the brand promise (embodied savoir-faire, human heritage) and the reality of employee experience is a direct strategic asset. A cognitively sedated watchmaker or one under algorithmic control contradicts the brand narrative.",
    "b3.arch.a1.tag": "Silent attrition",
    "b3.arch.a1.name": "The replaced worker",
    "b3.arch.a1.body": "Quiet automation reducing employment through non-replacement of natural departures. For luxury watchmaking, the risk concerns visible artisans less (protected by the Swiss Made promise) than support and marketing functions: CRM analysts, digital campaign managers, stock managers, first-level customer support.",
    "b3.arch.a1.signal": "<strong>Exposed perimeter:</strong> VIP CRM back-office, standardized digital campaign management, first-level customer support, post-event analytics. <strong>HR warning signal:</strong> progressive outsourcing of support functions without internal evolution plan.",
    "b3.arch.a2.tag": "Algorithmic control",
    "b3.arch.a2.name": "The dominated worker",
    "b3.arch.a2.body": "AI becomes the invisible arbiter of work. The boutique advisor follows an AI product recommendation script, the boutique manager receives algorithmically computed objectives, the regional director pilots based on dashboards they do not master. Professional autonomy shrinks. For luxury, this risk is particularly toxic because it contradicts the very idea of high-value client relationship.",
    "b3.arch.a2.signal": "<strong>Exposed perimeter:</strong> boutique advisors under AI prescription tools, boutique managers under real-time algorithmic KPIs, VIP CRM managers under automatic scoring. <strong>HR warning signal:</strong> rising turnover among experienced flagship boutique advisors, VIP client complaints about loss of personalization.",
    "b3.arch.a3.tag": "Augmented performance",
    "b3.arch.a3.name": "The augmented worker",
    "b3.arch.a3.body": "AI frees the watchmaker and the advisor from low-value tasks (archive research, client appointment preparation, product documentation, first version of mood board) so they can focus on what cannot be commoditized: gesture, narrative, client reading. Brynjolfsson 2025 documents +15% for disciplined juniors. But usage discipline is essential.",
    "b3.arch.a3.signal": "<strong>Affected perimeter:</strong> product designers assisted by generative AI, flagship boutique advisors on appointment preparation, watchmaking heritage managers for auction sales. <strong>HR warning signal:</strong> service quality gap between disciplined advisors and cognitively sedated advisors, visible on complex sales.",
    "b3.arch.a4.tag": "Human refocusing",
    "b3.arch.a4.name": "The rehumanized worker",
    "b3.arch.a4.body": "AI absorbs transactional tasks and frees time for gesture, narrative, listening, long-form accompaniment. This is the scenario the luxury brand promise has always claimed, but which requires an explicit HR choice. The master watchmaker who dedicates 40% more time to training young apprentices. The VIP advisor who can follow fifteen families with a quality of attention that data does not measure.",
    "b3.arch.a4.signal": "<strong>Affected perimeter:</strong> master watchmakers and internal training, watchmaking heritage advisors on family succession, brand ambassadors facing international collectors. <strong>Positive HR signal:</strong> narrative quality of brand content rising, very long-term VIP client loyalty rising.",
    "b3.arch.takeaway": "<strong>For premium watchmaking executive committees</strong>, the arbitrage between these four archetypes is <em>a brand decision, not only HR</em>. A house that ends up with a replaced + dominated mix contradicts its own Swiss Made narrative and loses its brand premium. A house that actively pilots toward augmented + rehumanized reinforces its promise and captures the human-intrinsic premium in Trammell's sense. Consistency between employee experience and client promise becomes a measurable strategic asset, and an explicit argument facing investment funds questioning the model's durability against AI commoditization.",
    "b3.debate.eyebrow": "The AI-and-work debate · three structuring positions",
    "b3.debate.title": "Three readings of the same phenomenon, <em>three transformation plans</em>.",
    "b3.debate.lede": "The debate on AI and employment is shaped by three solid intellectual positions that do not say the same thing. For premium watchmaking houses, the position retained radically changes the HR decision, the investment timeline, and the brand strategy. The observatory's veille page references each of these sources with a primary link.",

    "b3.debate.p1.tag": "Pessimistic position",
    "b3.debate.p1.author": "Dario Amodei (Anthropic) · Mustafa Suleyman (Microsoft AI)",
    "b3.debate.p1.claim": "AI will eliminate 50% of entry-level white-collar jobs in 1 to 5 years.",
    "b3.debate.p1.body": "For Amodei, AI advances simultaneously across all cognitive sectors, eliminating the adjacent employment basins that historically absorbed displaced workers. Suleyman goes further by estimating that most white-collar tasks will be automated within 12 to 18 months. Applied to luxury, this position implies a massive suppression of junior client relationship roles, marketing analysts and AI-assisted product designers. Watchmaking executives retaining this reading <strong>freeze entry-level recruitment now</strong>, restructure styling teams around a senior threshold, and prepare a rapid pivot to AI-first architectures.",

    "b3.debate.p2.tag": "Empirical position",
    "b3.debate.p2.author": "Pieter Garicano (Silicon Continent) · Brynjolfsson (Stanford) · NY Fed",
    "b3.debate.p2.claim": "The task is not the job. The bundle survives, recomposed.",
    "b3.debate.p2.body": "Garicano develops a structural argument: a job is a bundle of tasks, not a sum of automatable tasks. When AI takes the weak task of the bundle, it leaves the worker with the strong task, which was often the one producing the real value. The central historical example is precisely <strong>Swiss watchmaking facing quartz in the 1980s</strong>: survival did not come from better technical precision, but from a complete redefinition of the value bundle (mechanical art, heritage, status, embodied savoir-faire). NY Fed April 2026 data empirically confirms this logic: the majority of AI-adopting firms retrain existing staff rather than cutting. Brynjolfsson 2025 observes a +15% gain concentrated on juniors, signaling augmentation rather than substitution.",

    "b3.debate.p3.tag": "Macroeconomic position",
    "b3.debate.p3.author": "Philip Trammell (Stanford) · Korinek (NBER) · Papanikolaou (Northwestern)",
    "b3.debate.p3.claim": "Human-intrinsic goods structurally protect the labor share.",
    "b3.debate.p3.body": "Trammell formalizes why the labor share can stay high even in a full-automation scenario. The thesis rests on the notion of human-intrinsic goods: concerts, performances, care, accompaniment, where human presence is part of the very definition of the good. <strong>Premium watchmaking is a paradigmatic case</strong> of human-intrinsic good: what a Patek Philippe or a Greubel Forsey movement sells is not precision (which an Apple Watch surpasses), it is the embodied trace of a rare human savoir-faire. Even a mild preference for these human-intrinsic goods, shared by wealthy households, can keep the labor share at a high level or push it toward 1, regardless of machine technical capability. Papanikolaou (Northwestern) empirically confirms the offsetting effects.",

    "b3.debate.sec.tag": "Sectoral implication · luxury and premium watchmaking",
    "b3.debate.sec.title": "Luxury is <em>structurally protected</em>, but not equitably distributed.",
    "b3.debate.sec.body": "For premium watchmaking houses, the convergence of the three positions yields a nuanced reading. Amodei's pessimistic position <em>is probably wrong applied to luxury</em>, because luxury value does not come from a production efficiency that AI could commoditize. Garicano's empirical position <em>is directly verified</em> by the recent history of the sector: quartz was supposed to kill Swiss watchmaking, which doubled in value by redefining its bundle. Trammell's macro position <em>provides the theoretical framework</em>: luxury sells a human-intrinsic good in the technical sense. <strong>But this structural protection is not equitably distributed in the sector.</strong> Houses staying in the race for pure precision and algorithmic VIP client scoring lose their premium. Those that double down on human embodiment (visible artisans, open ateliers, long-form accompaniment, factory storytelling) capture the human-intrinsic premium. The 2026 HR decision is not <em>how many juniors to cut</em>, it is <em>which human roles to scale up to defend the bundle</em>.",

    /* TCO section · cost economics */
    "b3.tco.eyebrow": "Cost economics · the ignored factor",
    "b3.tco.title": "Premium watchmaking · <em>when real AI cost reinforces the value of the human gesture</em>.",
    "b3.tco.lede": "Luxury and premium watchmaking have a singular production economics where human scarcity and the artisan gesture are precisely what customers value. For these sectors, AI's TCO question is not only budgetary, it is strategic: integrating AI poorly or too visibly can erode the brand value the sector has meticulously protected for three centuries.",
    "b3.tco.s1.label": "Potential GenAI cost calculation error per Gartner",
    "b3.tco.s1.source": "Gartner · Oct 2024",
    "b3.tco.s2.label": "Of CIOs report break-even or losses on AI investments",
    "b3.tco.s2.source": "Gartner · Oct 2024",
    "b3.tco.s3.label": "Predicted GenAI cost per resolution in customer service by 2030",
    "b3.tco.s3.source": "Gartner · Jan 2026",
    "b3.tco.takeaway": "<strong>For Swiss watchmaking leaders</strong>, this factor converges with your historical value proposition. The <em>human presence and attention</em> that your customers value are precisely what AI does not do better at comparable cost. Tomer (April 2026) formalizes it: humans remain superior on ambiguous, contextual, accountability-intensive work. For Richemont, Swatch Group, or independents, the optimal AI strategy is not the one that automates most, but the one that frees the most human gesture time for differentiating added value. See <a href=\"../methodologie.html#tco\">methodology section 07</a> for the full TCO framework."
