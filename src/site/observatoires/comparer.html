function renderCompare() {
  const tbody = document.getElementById("compareBody");
  if (!tbody) return;
  tbody.innerHTML = "";
  const lang = window.CURRENT_LANG;
  COMPARE.forEach((row) => {
    const tr = document.createElement("tr");

    const tdDim = document.createElement("td");
    tdDim.className = "dim";
    tdDim.textContent = row.dim[lang];
    tr.appendChild(tdDim);

    const tdCh = document.createElement("td");
    tdCh.textContent = row.ch[lang];
    tr.appendChild(tdCh);

    const tdFr = document.createElement("td");
    tdFr.textContent = row.fr[lang];
    tr.appendChild(tdFr);

    const tdGap = document.createElement("td");
    tdGap.className = "gap";
    tdGap.textContent = row.gap[lang];
    tr.appendChild(tdGap);

    tbody.appendChild(tr);
  });
}

function renderBlind() {
  const grid = document.getElementById("blindGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const lang = window.CURRENT_LANG;
  BLIND_SPOTS.forEach((b, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.cursor = "default";

    const meta = document.createElement("div");
    meta.className = "card-meta mono";
    const num = document.createElement("span");
    num.textContent = String(i + 1).padStart(2, "0") + " · " + (lang === "fr" ? "Angle mort" : "Blind spot");
    num.style.color = "var(--signal)";
    meta.appendChild(num);
    card.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = b.title[lang];
    card.appendChild(title);

    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = b.desc[lang];
    card.appendChild(desc);

    grid.appendChild(card);
  });
}

window.onLangChange = function() {
  renderCompare();
  renderBlind();
};

initSite("comparer");
renderCompare();
renderBlind();
