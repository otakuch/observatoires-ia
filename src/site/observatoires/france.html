const TENSIONS = [
  { fr: "Ingénieurs IA / ML", en: "AI / ML engineers", value: 92 },
  { fr: "Cybersécurité", en: "Cybersecurity", value: 87 },
  { fr: "Soins infirmiers", en: "Nursing", value: 81 },

  { fr: "Maçons", en: "Masons", value: 64 }
];

let observatoires = [];
let activeFilters = { type: "all", domain: "all" };

async function loadData() {
  observatoires = window.OBSERVATOIRES_DATA.filter((o) => o.country === "FR");
  renderCards();
  renderChart();
}

function renderCards() {
  const grid = document.getElementById("cardsGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const lang = window.CURRENT_LANG;

  const filtered = observatoires.filter((o) => {
    const ty = activeFilters.type === "all" || o.type === activeFilters.type;
    const d = activeFilters.domain === "all" || o.domains.includes(activeFilters.domain);
    return ty && d;
  });

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "card-empty-state";
    empty.textContent = window.t("empty");
    grid.appendChild(empty);
    return;
  }

  filtered.forEach((o) => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = o.url;
    card.target = "_blank";
    card.rel = "noopener";

    const meta = document.createElement("div");
    meta.className = "card-meta mono";
    const flag = document.createElement("span");
    flag.className = "flag flag-fr";
    const dot = document.createElement("span");
    dot.className = "flag-dot";
    flag.appendChild(dot);
    flag.appendChild(document.createTextNode("France"));
    meta.appendChild(flag);
    const typeSpan = document.createElement("span");
    typeSpan.textContent = window.t("type." + o.type);
    meta.appendChild(typeSpan);
    card.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = o.nom;
    card.appendChild(title);

    const org = document.createElement("div");
    org.className = "card-org";
    org.textContent = o.org[lang];
    card.appendChild(org);

    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = o.desc[lang];
    card.appendChild(desc);

    const tags = document.createElement("div");
    tags.className = "card-tags";
    o.domains.forEach((d) => {
      const tag = document.createElement("span");
      tag.className = "card-tag";
      tag.textContent = window.t("domain." + d);
      tags.appendChild(tag);
    });
    card.appendChild(tags);

    const footer = document.createElement("div");
    footer.className = "card-footer";
    const lastSpan = document.createElement("span");
    lastSpan.textContent = window.t("card.last") + " · " + o.last;
    footer.appendChild(lastSpan);
    const linkSpan = document.createElement("span");
    linkSpan.className = "visit";
    linkSpan.textContent = window.t("card.visit");
    footer.appendChild(linkSpan);
    card.appendChild(footer);

    grid.appendChild(card);
  });
}

function renderChart() {
  const chart = document.getElementById("frBarChart");
  if (!chart) return;
  chart.innerHTML = "";
  const lang = window.CURRENT_LANG;

  TENSIONS.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "bar-row";

    const label = document.createElement("div");
    label.textContent = s[lang];
    row.appendChild(label);

    const track = document.createElement("div");
    track.className = "bar-track";
    const fill = document.createElement("div");
    fill.className = "bar-fill teal";
    fill.style.width = "0%";
    track.appendChild(fill);
    row.appendChild(track);

    const value = document.createElement("div");
    value.className = "bar-value";
    value.textContent = s.value;
    row.appendChild(value);

    chart.appendChild(row);

    setTimeout(() => {
      fill.style.width = s.value + "%";
    }, 100 + i * 80);
  });
}

document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const filter = chip.getAttribute("data-filter");
    const value = chip.getAttribute("data-value");
    activeFilters[filter] = value;
    document.querySelectorAll(".chip[data-filter=\"" + filter + "\"]").forEach((c) => c.classList.remove("active"));
    chip.classList.add("active");
    renderCards();
  });
});

window.onLangChange = function() {
  renderCards();
  renderChart();
};

// Accordion toggle for reinvent section
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll("#frReinventList .reinvent-trigger").forEach(function(trigger) {
    trigger.addEventListener("click", function() {
      var item = trigger.closest(".reinvent-item");
      item.classList.toggle("open");
    });
  });
});

initSite("france");
loadData();
