    "home.debate.title": "Apocalypse ou réfutation : <em>deux récits, deux corpus de preuves</em>.",
    "home.debate.lede": "En 2026, le débat public sur l'IA et l'emploi se structure autour de deux thèses irréconciliables. Les CEO IA annoncent une élimination massive et imminente. Les économistes du travail et les données empiriques racontent une autre histoire. Les deux corpus existent, sont vérifiables, et arrivent à des conclusions contradictoires. Voici comment l'observatoire les met côte à côte.",

    "home.debate.t.tag": "Thèse · L'apocalypse de l'emploi",
    "home.debate.t.title": "« 50% des cols blancs juniors disparus en 1 à 5 ans »",
    "home.debate.t.quote": "<em>« L'essentiel du travail de bureau, où vous êtes assis devant un ordinateur en tant qu'avocat, comptable, chef de projet ou marketeur, sera entièrement automatisé par une IA dans les 12 à 18 prochains mois. »</em>",
    "home.debate.t.p1": "<strong>Dario Amodei (Anthropic, mai 2025 puis Davos janvier 2026)</strong> annonce sur Fox News que l'IA éliminera jusqu'à 50% des cols blancs juniors en finance, conseil, droit et tech d'ici 1 à 5 ans, avec un taux de chômage qui pourrait atteindre 10 à 20%.",
    "home.debate.t.p2": "<strong>Mustafa Suleyman (Microsoft AI, FT 2026)</strong> va plus loin : « la plupart des tâches de col blanc seront automatisées dans les 12 à 18 prochains mois ». Argument du moat : les vagues d'automatisation précédentes offraient des secteurs adjacents pour absorber les déplacés. L'IA frappe simultanément tous les secteurs cognitifs.",
    "home.debate.t.p3": "<strong>Jamie Dimon (JPMorgan, février 2026)</strong> compare l'impact de l'IA à celui de l'électricité et avertit : 150 000 employés JPMorgan utilisent déjà des LLM hebdomadairement. <strong>Jack Dorsey (Block, février 2026)</strong> licencie 4 000 personnes (40% des effectifs) en attribuant explicitement à l'IA. <strong>Writer & Workplace Intelligence (avril 2026, 2 400 répondants dont la France)</strong> documente le revers empirique côté entreprises : <strong>69% annoncent des licenciements liés à l'IA</strong>, dont <strong>60% spécifiquement pour les non-adoptants</strong>, et <strong>48% considèrent leur adoption IA comme un échec majeur</strong> (vs 34% un an plus tôt).",
    "home.debate.t.source": "Sources · Axios, Fox News, Financial Times, conférences CEO 2025-2026",

    "home.debate.a.tag": "Antithèse · La tâche n'est pas le métier",
    "home.debate.a.title": "Les données empiriques contredisent le récit Silicon Valley",
    "home.debate.a.quote": "<em>« Presque toutes les entreprises qui licencient invoquent l'IA, que ce soit réellement à propos de l'IA ou non. »</em>",
    "home.debate.a.p1": "<strong>Luis Garicano (LSE, avril 2026)</strong> formalise le bundles framework. Cas canonique : agents de voyage. Emploi -60% depuis 2000, mais salaires hebdomadaires moyens passés de 87% à 99% de la moyenne du secteur privé. Frey & Osborne 2013 prédisaient 94% d'automatisation des comptables : le BLS recense aujourd'hui 1,6 million de comptables actifs avec une croissance projetée de +5%.",
    "home.debate.a.p2": "<strong>Washington Post (1er mai 2026)</strong> et <strong>NYT Opinion (3 mai 2026)</strong> documentent que Amazon, Google et Meta ont aujourd'hui à peu près le même nombre d'employés qu'en 2022, malgré 700 milliards de dollars de CapEx IA. Marc Andreessen (board Meta) et Sam Altman (CEO OpenAI) reconnaissent publiquement l'AI-washing.",
    "home.debate.a.p3": "<strong>Goldfarb (Toronto Rotman, NBER WP 34639, avril 2026)</strong> formalise les O-ring tasks : automatiser une tâche complémentaire AUGMENTE la valeur des tâches humaines restantes. <strong>Microsoft AI Diffusion Q1 2026</strong> documente que les développeurs US sont à 2,2 millions (+8,5% en 2025, record historique). <strong>Trammell (Stanford Digital Economy Lab, mars 2026)</strong> théorise la part durable du travail humain via les biens « human-intrinsic ». <strong>Oxford Economics (janvier 2026)</strong> qualifie les preuves d'une perturbation IA de « patchwork au mieux ». Chômage US à 4,4%, bien en dessous des pics européens des années 1990. <em>The Economist (leader, 14 mai 2026)</em> publie en contrepoint un appel alarmiste à se préparer à une apocalypse de l'emploi cols blancs, principalement adossé à la baisse documentée de 13% de l'emploi des 22-25 ans dans les métiers exposés (Stanford via Dallas Fed). La cartographie traite cette divergence non comme une contradiction à arbitrer, mais comme deux lectures complémentaires de la même réalité : stabilité agrégée du marché américain, recomposition pour les jeunes diplômés.",
    "home.debate.a.source": "Sources · Garicano (Silicon Continent), Trammell (Stanford), WaPo, NYT, Oxford Economics, Wharton · Goldfarb NBER 34639 · Imas/Shukla · Microsoft AI Diffusion · Gallup Workforce",

    "home.debate.takeaway": "<strong>Posture de l'observatoire face à ce débat.</strong> Les deux corpus sont importants. Mais ils ne s'équivalent pas méthodologiquement. Les annonces des CEO IA sont des prédictions stratégiques (et parfois des outils de communication produit). Les travaux de Garicano, Trammell, Yale Budget Lab et NBER w35110 sont des analyses empiriques contradictoires soumises à la revue par les pairs. Pour un comité de direction, calibrer un plan de transformation sur la première catégorie sans confronter à la seconde, c'est arbitrer dans le bruit. La vocation de cette cartographie est de fournir le terrain de comparaison. <strong>Writer & Workplace Intelligence (avril 2026)</strong> ajoute une nuance décisive : le désordre actuel n'est pas une apocalypse de l'emploi, c'est un <strong>désordre organisationnel généralisé</strong>. 79% des entreprises peinent à adopter l'IA, 75% des executives reconnaissent que leur stratégie IA est « plus pour la galerie » que pour guider, 67% rapportent une fuite de données via une IA non autorisée, et 29% des employés (44% des Gen Z) admettent saboter activement la stratégie IA. La cartographie traite ce constat comme un signal de gouvernance · pas comme une preuve de destruction de l'emploi.",

    "home.frame.d4.tag": "04 · Coût total de possession",
    "home.frame.d4.title": "Le prix par token n'est pas le coût réel.",
    "home.frame.d4.body": "Comparer le prix d'un token au salaire humain est l'erreur la plus répandue dans les COMEX en 2026. <strong>Gartner</strong> mesure que les organisations sous-estiment leurs coûts GenAI réels d'un facteur 5 à 10. Le coût total inclut l'orchestration, l'intégration, la gouvernance, le monitoring et le redesign organisationnel. Pour les organisations francophones, s'ajoute la « taxe linguistique » : le français consomme +60% de tokens vs anglais.",
    "home.frame.d4.example": "Exemple : Gartner prédit que le coût par résolution GenAI dépassera 3$ d'ici 2030, au-dessus des agents humains offshore. 72% des CIO rapportent un break-even ou des pertes sur leurs investissements IA.",

    "home.frame.footer": "<strong>Trois travaux récents valident ce cadre.</strong> <em>Garicano (Silicon Continent, avril 2026)</em> formalise le concept de <strong>bundle de tâches</strong> : un métier n'est pas la somme de ses tâches automatisables, c'est ce qui reste quand la commodity disparaît. Cas canonique : les agents de voyage ont vu leur emploi reculer de 60% depuis 2000, mais leurs salaires hebdomadaires sont passés de 87% à 99% de la moyenne du secteur privé. La machine a pris la partie faible du bundle, leur a laissé la partie forte. <em>Goldfarb (Toronto Rotman, NBER WP 34639, avril 2026)</em> approfondit avec le cadre <strong>O-ring tasks</strong> : les tâches au sein d'un job sont complémentaires plutôt que substituables, donc automatiser une tâche AUGMENTE la valeur des tâches humaines restantes. <em>Imas (Chicago Booth, mars 2026)</em> ajoute la <strong>dimensionnalité du job</strong> comme variable critique : les jobs basses dimensions (peu de tâches) sont massivement plus exposés que les jobs hautes dimensions. <em>Trammell (Stanford Digital Economy Lab, mars 2026)</em> apporte la formalisation théorique : une préférence même très faible pour les biens human-intrinsic (concert vivant, soin direct, performance) suffit à maintenir la part durable du travail élevée. <em>Microsoft AI Diffusion Q1 2026, NYT et Washington Post (mai 2026)</em> rappellent les données macro : chômage US à 4,4%, capex IA à 700 milliards, développeurs US 2,2 millions (+8,5%, record historique), mais effectif global tech qui ne se contracte pas. Le récit Silicon Valley d'apocalypse de l'emploi ne se vérifie pas dans les statistiques. La cartographie applique ces validations au quotidien : tout score d'exposition est lu en regard du bundle restant, du caractère O-ring du job, de sa dimensionnalité, du caractère human-intrinsic du métier, et des données macro disponibles. <strong>Trois publications de mai 2026 viennent renforcer cette grille.</strong> <em>Lombard Odier (Strobaek & Dumur, 22 avril 2026)</em> rappelle quatre siècles d'évidence : la technologie remodèle les tâches plus qu'elle ne détruit les emplois · <strong>60% des emplois américains actuels relèvent de professions qui n'existaient pas en 1940</strong> (Autor MIT), et la Corée déploie <strong>plus de 100 robots industriels pour 1 000 ouvriers</strong> avec un chômage inférieur à 3%. <em>McKinsey Global Institute (Agents, robots, and us · Europe, mai 2026)</em> documente que <strong>58% des heures de travail européennes</strong> sont théoriquement automatisables, mais que <strong>70% des compétences restent pertinentes</strong> en partenariat avec agents et robots. <em>OBVIA Québec (Parent-Rocheleau et al., avril 2026 · 4 595 syndiqués)</em> confirme l'écart entre usage individuel (60%) et déploiement organisationnel (41%), avec seulement <strong>15% de confiance totale</strong> en l'IA et 60% de littératie IA faible ou moyenne · l'enjeu n'est pas l'apocalypse, c'est la gouvernance. <em>Writer & Workplace Intelligence (avril 2026, 2 400 répondants dont la France)</em> élargit ce cadre côté entreprises : l'écart entre adoption (97% des executives ont déployé des agents IA) et transformation effective (29% seulement voient un ROI significatif) confirme que <strong>l'enjeu de la décennie est la gouvernance, pas le déploiement</strong>.",

  en: {
    "home.eyebrow": "",
    "home.title": "What <em>AI systems</em> actually do to work<span class=\"accent-bracket\">.</span>",
    "home.pitch": "AI systems do not threaten all occupations the same way. It is not the same AI that affects a radiologist, a journalist, and a driver. And not all exposed occupations are under pressure: some benefit from it.",
    "home.lede": "On the impact of AI on jobs, we hear everything and its opposite. Looming collapse on one side, productive revolution on the other, and in between workers trying to decide on their training and trajectory. The problem is not a lack of data: figures exist, scattered across a dozen institutions, in several languages, under as many methodologies. This observatory gathers, translates, and cross-checks them to enable a factual reading rather than an emotional one. And because generative AI, discriminative AI, and machine learning do not produce the same effects on the same occupations, every figure here is tagged by AI type.",
    "home.cta.ch": "Switzerland dashboard",
    "home.cta.fr": "France dashboard",
    "home.stat1.label": "of UK+US workers have already used AI at work. But fewer than 1/5 daily.",
    "home.stat2.label": "of large Swiss firms have introduced AI. Against 9% for SMEs: the asymmetry is Swiss.",
    "home.stat3.label": "occupations mapped (200 ROME France + 324 NP 2010 Switzerland). Open data.",
    "home.stat3.source": "ROME 4.0 · NP 2010 FSO · CC BY 4.0",
    "home.manifesto.tag": "¶ Manifesto",
    "home.manifesto.text": "<p>Speaking of « AI » in the singular is a linguistic shortcut that produces analytical errors. <strong>Generative AI</strong> writing an email does not have the same impact as <strong>a discriminative AI</strong> screening résumés, nor as <strong>a machine learning system</strong> optimizing a supply chain. Conflating these families is to condemn oneself to imprecise predictions and ill-calibrated public policies. This is why every figure published here is explicitly tagged by AI type, and why we speak of <em>AI systems</em>, in the plural.</p><p>The second postulate of this observatory is simpler: <strong>a single source is never enough</strong>. France's DARES quantifies the exposure of jobs to generative AI. France Travail measures recruitment tensions. The EPFL AI Center documents company adoption. Switzerland's Federal Statistical Office tracks vacancies. Coface models sectoral risks. The Yale Budget Lab monthly tracks US employment effects. The Financial Times publishes its Workforce AI Tracker. No single source, taken in isolation, gives the full picture. <em>Together, cross-checked and confronted, they allow a fairer reading</em>, both of what AI systems can do and what they do not do.</p><p>The observatory seeks neither to reassure nor to alarm. It seeks to <strong>reduce the emotional share of the debate</strong> by giving workers, HR leaders, public decision-makers and researchers a shared ground on which to reason. All figures are sourced, traceable to the primary publication, and published as open data under CC BY 4.0 license.</p>",

    "home.frame.eyebrow": "Analytical frame · 4 reading dimensions",
    "home.frame.title": "Reading an occupation against AI means <em>crossing four axes</em>.",
    "home.frame.lede": "An isolated exposure score is never enough to decide on an HR trajectory or a transformation strategy. The observatory articulates four complementary dimensions that read figures in their full depth, from demand dynamics to AI's real operational cost.",
    "home.frame.d1.tag": "01 · Demand trajectory",
    "home.frame.d1.title": "Exposure does not predict trajectory.",
    "home.frame.d1.body": "A highly exposed occupation can see its demand grow if AI enriches the households who spend more on these services. The exposure score alone is insufficient to anticipate real employment pressure. Three possible profiles: rising demand (care, hospitality, craft, training, personal services), stable demand (law, architecture, management, engineering), declining pressure (data entry, generic content, standardized administrative processing).",
    "home.frame.d1.example": "Example: a fine-dining chef at 6/10 exposure is in a better position than a credit analyst at 7/10. The difference comes from the income effect, not from AI's technical capability (Imas & Comin, 2026).",

    "home.frame.d2.tag": "02 · Relational sector",
    "home.frame.d2.title": "AI also creates winners.",
    "home.frame.d2.body": "Occupations with strong human relational necessity (care, premium hospitality, craft, therapy, training, live performance) structurally benefit from the AI transition. When AI lowers the cost of standardized goods, households reallocate their budget toward presence and human attention. This is not « protected from AI », it is <em>indirect beneficiary</em> of AI through the income effect.",
    "home.frame.d2.example": "Example: a social educator (3/10 exposure) is not merely spared by automation. Their structural demand grows as AI enriches households investing in human accompaniment.",

    "home.frame.d3.tag": "03 · AI type",
    "home.frame.d3.title": "Not all AI affects the same occupations.",
    "home.frame.d3.body": "Three AI families with very different impacts. <strong>Generative AI</strong> (LLMs) affects content production, synthesis, writing and standard code occupations. <strong>Specialized AI</strong> (machine learning on structured data) affects detection, scoring and classification occupations. <strong>AI robotics</strong> affects repetitive physical occupations. Conflating these families distorts any HR or strategic decision.",
    "home.frame.d3.example": "Example: a radiologist is not affected by ChatGPT, they are by vision models trained on millions of medical images. Detailed table on the <a href=\"methodologie.html\">Methodology</a> page.",

    "home.warn.tag": "Warning · 4th blind spot",
    "home.warn.num": "Short term vs long term · cost and data governance",
    "home.warn.title": "The « AI = mechanical cost reduction » narrative <em>no longer holds</em>.",
    "home.warn.lede": "Cutting positions based on cheap token prices may give the illusion of immediate savings. But two dynamics organizations still underestimate reverse the equation at 24-36 months: the surge in total cost of ownership (TCO) and the question of jurisdictional sovereignty over data. These are the two blind spots that turn a paper-profitable AI project into a technological liability.",

    "home.warn.c1.title": "Hidden costs: Gartner predicts 500% to 1000% underestimation",
    "home.warn.c1.body": "Token price is only one layer of real cost. <strong>Total cost of ownership (TCO)</strong> includes orchestration, integration, governance, human oversight, evaluation, verification, escalation handling, and organizational redesign (Tomer 2026). Gartner predicts that by 2030, GenAI cost per resolution in customer service will exceed $3, more expensive than B2C offshore human agents. Three structural drivers: exploding data center costs, end of subsidized pricing toward profitability, and rising use case complexity. <strong>72% of CIOs surveyed by Gartner report breakeven or losses on AI investments.</strong> 50% of GenAI projects are abandoned after PoC. 90% of CIOs say cost management now limits the value extracted from AI.",
    "home.warn.c1.source": "Sources · Gartner Predicts 2026 · Singh Tomer 2026 · IBM",

    "home.warn.c2.title": "Sovereignty: where your data lives, who judges it",
    "home.warn.c2.body": "For a European organization, choosing an LLM vendor is no longer just technical or economic. It is a governance decision. US hyperscalers cannot guarantee European-jurisdiction infrastructure, creating regulatory risk (GDPR, NIS2, EU AI Act) and vendor lock-in risk. <strong>Mistral AI</strong> raised $830 million in debt from 7 European banks in March 2026 for 200 MW of European compute capacity by 2027. On the Swiss side, <strong>Apertus</strong> (EPFL, ETH Zurich, CSCS, September 2025) is the first public fully open LLM compliant with the EU AI Act and Swiss data protection law, hosted by Swisscom. The European sovereign ecosystem 2026 (Mistral, Aleph Alpha, Apertus, Minerva, PhariaAI, LightOn) has become a credible option, and for regulated industries, a prerequisite.",
    "home.warn.c2.source": "Sources · European Business Magazine · EPFL · ETH Zurich · Index.dev",

    "home.warn.footer": "<strong>Concrete consequence for executive committees and HR leadership.</strong> Today's arbitrages on AI position substitution must integrate the real 36-month TCO and sovereignty risk from the framing stage. The sectoral Dispatches of observatoire[s]·ia address these two dimensions on concrete perimeters (banking, executives, premium watchmaking). Source resources are openly accessible.",

    "home.debate.eyebrow": "The structuring debate of 2026",
    "home.debate.title": "Apocalypse or refutation: <em>two narratives, two evidence corpora</em>.",
    "home.debate.lede": "In 2026, the public debate on AI and employment crystallizes around two irreconcilable theses. AI CEOs announce massive and imminent elimination. Labor economists and empirical data tell another story. Both corpora exist, are verifiable, and reach contradictory conclusions. Here is how the observatory places them side by side.",

    "home.debate.t.tag": "Thesis · The jobs apocalypse",
    "home.debate.t.title": "« 50% of junior white-collar jobs gone in 1 to 5 years »",
    "home.debate.t.quote": "<em>« Most white collar work, where you're sitting down at a computer, either being a lawyer or an accountant or a project manager or a marketing person, most of those tasks will be fully automated by an AI within the next 12 to 18 months. »</em>",
    "home.debate.t.p1": "<strong>Dario Amodei (Anthropic, May 2025 then Davos January 2026)</strong> announced on Fox News that AI will eliminate up to 50% of junior white-collar jobs in finance, consulting, law and tech within 1 to 5 years, with unemployment potentially reaching 10 to 20%.",
    "home.debate.t.p2": "<strong>Mustafa Suleyman (Microsoft AI, FT 2026)</strong> goes further: « most white collar tasks will be fully automated within the next 12 to 18 months ». The moat argument: previous automation waves offered adjacent sectors to absorb displaced workers. AI hits all cognitive sectors simultaneously.",
    "home.debate.t.p3": "<strong>Jamie Dimon (JPMorgan, February 2026)</strong> compares AI's impact to electricity and warns: 150,000 JPMorgan employees already use LLMs weekly. <strong>Jack Dorsey (Block, February 2026)</strong> lays off 4,000 people (40% of headcount), explicitly attributing to AI. <strong>Writer & Workplace Intelligence (April 2026, 2,400 respondents including France)</strong> documents the empirical flipside on the corporate side: <strong>69% announce AI-related layoffs</strong>, including <strong>60% specifically for non-adopters</strong>, and <strong>48% consider AI adoption a massive disappointment</strong> (vs 34% a year earlier).",
    "home.debate.t.source": "Sources · Axios, Fox News, Financial Times, CEO conferences 2025-2026",

    "home.debate.a.tag": "Antithesis · The task is not the job",
    "home.debate.a.title": "Empirical data contradicts the Silicon Valley narrative",
    "home.debate.a.quote": "<em>« Almost every company that does layoffs is blaming AI, whether or not it really is about AI. »</em>",
    "home.debate.a.p1": "<strong>Luis Garicano (LSE, April 2026)</strong> formalizes the bundles framework. Canonical case: travel agents. Employment -60% since 2000, yet average weekly earnings rose from 87% to 99% of private-sector average. Frey & Osborne 2013 predicted 94% accountant automation: BLS now counts 1.6 million working accountants with projected +5% growth.",
    "home.debate.a.p2": "<strong>Washington Post (May 1, 2026)</strong> and <strong>NYT Opinion (May 3, 2026)</strong> document that Amazon, Google, and Meta today have roughly the same headcount as in 2022, despite $700 billion in AI CapEx. Marc Andreessen (Meta board) and Sam Altman (OpenAI CEO) publicly acknowledge AI-washing.",
    "home.debate.a.p3": "<strong>Goldfarb (Toronto Rotman, NBER WP 34639, April 2026)</strong> formalizes O-ring tasks: automating a complementary task INCREASES the value of remaining human tasks. <strong>Microsoft AI Diffusion Q1 2026</strong> documents US developers at 2.2 million (+8.5% in 2025, historic record). <strong>Trammell (Stanford Digital Economy Lab, March 2026)</strong> theorizes the durable share of human labor via human-intrinsic goods. <strong>Oxford Economics (January 2026)</strong> calls AI disruption evidence « patchy at best ». US unemployment at 4.4%, far below European 1990s peaks. <em>The Economist (leader, May 14, 2026)</em> publishes a counterpoint alarmist call to prepare for a white-collar jobs apocalypse, mainly built on the documented 13% drop in employment for 22-25 year-olds in exposed jobs (Stanford via Dallas Fed). The cartography treats this divergence not as a contradiction to arbitrate, but as two complementary readings of the same reality: aggregate US market stability, recomposition for young graduates.",
    "home.debate.a.source": "Sources · Garicano (Silicon Continent), Trammell (Stanford), WaPo, NYT, Oxford Economics, Wharton · Goldfarb NBER 34639 · Imas/Shukla · Microsoft AI Diffusion · Gallup Workforce",

    "home.debate.takeaway": "<strong>The observatory's posture on this debate.</strong> Both corpora matter. But they are not methodologically equivalent. The announcements of AI CEOs are strategic predictions (and sometimes product communication tools). The work of Garicano, Trammell, Yale Budget Lab, and NBER w35110 are contradictory empirical analyses subject to peer review. For an executive committee, calibrating a transformation plan on the first category without confronting the second is arbitrage in the noise. The vocation of this cartography is to provide the comparison ground. <strong>Writer & Workplace Intelligence (April 2026)</strong> adds a decisive nuance: the current disorder is not a jobs apocalypse, it is <strong>generalized organizational disorder</strong>. 79% of companies struggle to adopt AI, 75% of executives acknowledge their AI strategy is more for show than actual guidance, 67% report a data leak via unauthorized AI, and 29% of employees (44% Gen Z) admit actively sabotaging AI strategy. The cartography treats this finding as a governance signal · not as evidence of job destruction.",

    "home.frame.d4.tag": "04 · Total cost of ownership",
    "home.frame.d4.title": "The token price is not the real cost.",
    "home.frame.d4.body": "Comparing token price to human salary is the most common error in 2026 executive committees. <strong>Gartner</strong> measures that organizations underestimate their real GenAI costs by a factor of 5 to 10. Total cost includes orchestration, integration, governance, monitoring and organizational redesign. For French-speaking organizations, the « linguistic tax » adds up: French consumes +60% tokens vs English.",

d Korea deploys <strong>over 100 industrial robots per 1,000 workers</strong> with unemployment below 3%. <em>McKinsey Global Institute (Agents, robots, and us · Europe, May 2026)</em> documents that <strong>58% of European work hours</strong> are theoretically automatable, but <strong>70% of skills remain relevant</strong> in partnership with agents and robots. <em>OBVIA Quebec (Parent-Rocheleau et al., April 2026 · 4,595 union members)</em> confirms the gap between individual use (60%) and organizational deployment (41%), with only <strong>15% full trust</strong> in AI and 60% low or medium AI literacy · the issue is not apocalypse, it is governance. <em>Writer & Workplace Intelligence (April 2026, 2,400 respondents including France)</em> extends this framework on the corporate side: the gap between adoption (97% of executives deployed AI agents) and actual transformation (only 29% see significant ROI) confirms that <strong>the decade's challenge is governance, not deployment</strong>.",

let veilleData = [];

async function loadVeille() {
  veilleData = window.VEILLE_DATA || [];
  renderVeille();
}

function renderVeille() {
  const grid = document.getElementById("fieldGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const lang = window.CURRENT_LANG;
  veilleData.slice(0, 3).forEach((v) => {
    const card = document.createElement("a");
    card.className = "field-card";
    card.href = v.url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
    card.style.textDecoration = "none";
    card.style.color = "inherit";
    card.style.display = "block";

    const meta = document.createElement("div");
    meta.className = "field-card-meta";
    const dateSpan = document.createElement("span");
    const flag = v.country === "CH" ? "🇨🇭" : v.country === "FR" ? "🇫🇷" : "🌍";
    dateSpan.textContent = flag + " · " + v.date;
    meta.appendChild(dateSpan);
    const sourceSpan = document.createElement("span");
    sourceSpan.textContent = v.source;
    meta.appendChild(sourceSpan);
    card.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "field-card-title";
    title.textContent = v.title[lang];
    card.appendChild(title);

    const excerpt = document.createElement("p");
    excerpt.className = "field-card-excerpt";
    excerpt.textContent = (v.summary && v.summary[lang]) ? v.summary[lang] : v.excerpt[lang];
    card.appendChild(excerpt);

    const link = document.createElement("span");
    link.className = "field-card-link mono";
    link.textContent = lang === "fr" ? "Lire le rapport →" : "Read the report →";
    card.appendChild(link);

    grid.appendChild(card);
  });
}

window.onLangChange = renderVeille;

initSite("home");
loadVeille();
</script>
