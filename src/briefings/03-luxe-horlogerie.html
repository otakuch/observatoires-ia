    "b3.act.c1.desc": "Automatisation tolérée sur les fonctions purement administratives (logistique, comptabilité, traduction). <strong>Précaution maximale</strong> sur les fonctions où l'engagement humain produit la prime de marque · ateliers, clienteling VIP, direction artistique, storytelling.",
    "b3.act.c2.tag": "Investir",
    "b3.act.c2.title": "Renforcer les fonctions d'incarnation humaine",
    "b3.act.c2.desc": "À mesure que l'IA enrichit la société, la prime de l'<strong>human-intrinsic</strong> augmente structurellement. Investir dans les artisans, le clienteling VIP et la direction artistique n'est pas un coût défensif · c'est un investissement offensif sur la prime que l'IA va créer pour le luxe humain.",
    "b3.act.c3.tag": "Auditer",
    "b3.act.c3.title": "Surveiller la qualité narrative des contenus IA",
    "b3.act.c3.desc": "L'IA générative sur le marketing et le CRM peut éroder lentement la <strong>qualité narrative</strong> que les clients VIP perçoivent comme authentique. Mettre en place un audit semestriel des contenus IA produits par les équipes pour détecter la dérive avant que les clients VIP ne la signalent.",
    "b3.act.followup": "Pour aller plus loin sur ces 3 priorités, le format Veille Métiers IA peut produire un diagnostic personnalisé pour votre Maison.",

    "b3.title": "Horlogerie premium et IA : l'épreuve de la <em>désirabilité</em>.",
    "b3.sub": "Le marché du luxe traverse en 2026 son trimestre le plus rude depuis 2008. Pour les maisons horlogères premium suisses, la gouvernance IA n'est plus un sujet de conformité : c'est désormais un sujet de désirabilité. Trois fronts s'ouvrent simultanément. Voici ce qu'un comité de direction doit savoir avant le prochain Watches & Wonders.",
    "b3.by.author": "Naully Nicolas",
    "b3.by.read": "7 minutes de lecture",
    "b3.by.sources": "12 sources primaires",
    "b3.crit.eyebrow": "Lecture critique · trois objections au récit alarmiste",
    "b3.crit.title": "Pourquoi le récit « disparition massive des emplois » <em>ne tient pas l'analyse</em>.",
    "b3.crit.lede": "Les annonces d'Amodei (50% des cols blancs juniors disparus en 1-5 ans) et de Suleyman (12-18 mois pour automatiser le travail de bureau) circulent abondamment. Cinq objections empiriques et théoriques structurent une lecture plus prudente, articulées ci-dessous pour les Maisons d'horlogerie premium et le luxe.",
    "b3.crit.t1.title": "Effectifs Big Tech 2026 ≈ 2022 · malgré 700 milliards de CapEx IA",
    "b3.crit.t1.body": "Les quatre plus grandes firmes tech ont engagé plus de <strong>700 milliards de dollars de CapEx IA</strong> pour l'exercice en cours. Pourtant, Amazon, Google et Meta emploient aujourd'hui à peu près le même nombre de salariés qu'en 2022. Les dépenses R&D rapportées au chiffre d'affaires ont <strong>augmenté</strong> chez Meta, Google et Amazon depuis 2022. Les dirigeants tech reconnaissent eux-mêmes que les licenciements reflètent surtout le surrecrutement pandémique, pas une substitution IA.<br><br><strong>Conséquence pour les Maisons horlogères premium et le luxe</strong> : les annonces tech américaines ne sont pas un référentiel pour calibrer une stratégie IA. Les Maisons qui imitent la rhétorique d'efficacité Silicon Valley risquent de fragiliser leur récit de marque, qui repose précisément sur la valorisation du travail humain et de l'artisanat.",
    "b3.crit.t1.source": "Sources · Washington Post 1er mai 2026 · NYT Opinion 3 mai 2026 · Andreessen et Altman · Microsoft AI Diffusion Report Q1 2026 (Suisse 37,8% adoption, rang 14)",
    "b3.crit.t2.title": "Un métier d'horlogerie premium est un paquet d'autorité, pas une somme de tâches automatisables",
    "b3.crit.t2.body": "L'argument task-exposure suppose qu'un métier se réduit à la somme de ses tâches mesurables. Or l'horlogerie premium repose sur des paquets très denses : un horloger combine geste technique, jugement esthétique, arbitrage qualité, transmission et exercice d'autorité (validation de pièce, signature). L'IA peut aider sur certaines tâches isolées (CAO, simulation) sans remplacer la <em>responsabilité</em> de l'ensemble.<br><br><strong>Conséquence pour le luxe</strong> : l'IA ne supprime pas les métiers d'autorité (maître horloger, directeur artistique, conseiller VIP), elle les augmente. La transformation passe par la recomposition des bundles autour des décisions à plus haute valeur d'autorité et de signature de marque. Les fonctions support sont concernées par l'IA, les fonctions d'autorité sont structurellement protégées.",
    "b3.crit.t2.source": "Source · Luis Garicano · Silicon Continent · 22 avril 2026 · réponse à Amodei et Suleyman · Avi Goldfarb · NBER WP 34639 · avril 2026 (O-ring tasks) · Imas & Shukla · 23 mars 2026 (dimensionnalité)",
    "b3.crit.t3.title": "Théoriquement, l'enrichissement IA augmente la valeur du luxe humain à long terme",
    "b3.crit.t3.body": "Sous des préférences de consommation hiérarchisées, le travail humain devient un bien à forte élasticité-revenu, autrement dit un luxe. Quand le capital devient abondant, sa part dans la consommation diminue et celle du travail rendu par des humains augmente. Si capital et travail sont des complémentaires bruts, l'accumulation infinie de capital ne suffit pas à la croissance · le travail humain reste structurellement nécessaire.<br><br><strong>Conséquence pour le luxe et l'horlogerie premium</strong> : c'est le scénario long terme le plus favorable. À mesure que l'IA enrichit la société, la part du budget consommateur consacrée à des biens et services à forte composante humaine (artisanat, signature, expérience VIP) augmente structurellement. Le luxe devient un bénéficiaire indirect de la transition IA, pas une victime.",
    "b3.crit.t3.source": "Source · Philip Trammell · Stanford Digital Economy Lab · 27 mars 2026 · modèle économique formel",
    "b3.crit.t4.title": "Toutes les prédictions chiffrées IA-emploi sont systématiquement <em>wildly inaccurate</em>",
    "b3.crit.t4.body": "Une analyse méta-épistémologique compile <strong>10 prédictions absolues, 9 prédictions en pourcentage et 19 prédictions sectorielles</strong> publiées entre 2013 et 2025. Constat structurant : toutes ces prédictions sont systématiquement <em>wildly inaccurate</em>. L'évaluation tâche par tâche · méthode dominante depuis 2013 · est démontrée inefficace parce qu'elle ignore les facteurs contextuels d'adoption et la création d'emplois adjacents. Cette critique est <em>particulièrement pertinente pour le luxe</em>, parce que la valeur du secteur ne se réduit pas à une somme de tâches mesurables · l'incarnation humaine, le geste artisan, l'expérience boutique sont précisément ce qu'aucune méthodologie task-based ne capture.<br><br><strong>Conséquence pour les Maisons</strong> : un plan RH calibré sur des prédictions chiffrées globales risque de couper précisément les fonctions humaines qui produisent la prime structurelle du human-intrinsic. L'arbitrage 2026-2030 doit s'appuyer sur les conditions sectorielles locales (KOF/ETH artisans hors top 10 exposé, prime d'exclusivité humaine).",
    "b3.crit.t4.source": "Sources · Davenport et Paredes · Harvard Data Science Review · MIT Press · Issue 7.4 · automne 2025 · CC BY 4.0 · Arntz, Gregory, Zierahn · OCDE WP 189 · 2016 · Frey et Osborne · Oxford Martin · 2013/2017",
    "b3.crit.t5.title": "Le coût psychologique mesurable de l'IA générative est <em>structurellement incompatible avec la fabrique de l'attention luxe</em>",
    "b3.crit.t5.body": "Une étude expérimentale sur <strong>4 études en ligne avec 3 562 participants</strong> documente que l'IA générative produit un effet dual mesurable. Effet d'augmentation de performance : qualité et efficience immédiates accrues. Effet de privation psychologique : <strong>-11% motivation intrinsèque, +20% ennui</strong> lors du retour aux tâches en autonomie (taille d'effet medium d=-0,44). Mécanisme : la collaboration IA contourne les parties les plus stimulantes cognitivement, qui sont celles qui rendent le travail intrinsèquement satisfaisant. Convergence avec une étude sur 319 knowledge workers documentant la sédation cognitive.<br><br><strong>Conséquence pour les Maisons d'horlogerie premium et le luxe</strong> : la valeur de marque luxe se construit précisément sur l'opposé de ce que produit l'IA générative · attention soutenue, présence incarnée, maîtrise artisanale visible. La politique d'augmentation IA pour les Maisons doit être <em>asymétrique par fonction</em> · automatisation tolérée sur les tâches purement administratives, précaution maximale sur les fonctions où l'engagement intrinsèque produit la prime de marque.",
    "b3.crit.t5.source": "Sources · Champniss · Harvard Business Review · mai-juin 2026 · Wu, Liu, Ruan, Chen, Xie · Scientific Reports · Nature Portfolio · 29 avril 2025 · DOI 10.1038/s41598-025-98385-2 · Microsoft Research et Carnegie Mellon University · CHI 2025",










    "b3.src.eyebrow": "Annexe · Sources & traçabilité",
    "b3.src.title": "Les chiffres cités, ouverts à la <em>vérification</em>.",
    "b3.src.intro": "Une dépêche n'a de valeur que si ses chiffres sont vérifiables. Chaque indicateur de cette dépêche renvoie ci-dessous à sa publication d'origine. Sources primaires intégralement citées, sans paywall ni rétention.",
    "b3.src.s1.label": "Fédération de l'industrie horlogère suisse (FH) · Statistiques 2025 · janvier 2026",
    "b3.src.s1.cited": "Citée pour le chiffre <strong>-1,7% des exportations horlogères suisses en 2025 (25,6 Md CHF)</strong>, deuxième année consécutive de repli. Volumes -4,8% (-740 000 unités). Source officielle des douanes fédérales.",
    "b3.src.s2.label": "Le Temps · Résultats trimestriels Richemont · 15 janvier 2026",
    "b3.src.s2.cited": "Citée pour le chiffre <strong>+7% pour les spécialités horlogères Richemont</strong> (IWC, Jaeger-LeCoultre, Vacheron Constantin, A. Lange & Söhne, Panerai, Piaget, Roger Dubuis). Premier rebond significatif depuis 18 mois.",
    "b3.src.s3.label": "Kearney · 2026 Global Luxury Industry Outlook · janvier 2026",
    "b3.src.s3.cited": "Citée pour le chiffre <strong>+16,2% / an d'investissement IA dans le luxe sur dix ans</strong>, et 90% des dirigeants considérant l'IA comme essentielle. Échantillon : 200+ dirigeants luxe interrogés.",
    "b3.src.primary": "Source primaire ↗",
    "b3.src.note": "Note. Les chiffres présentés ici sont arrondis. Les marges d'incertitude et les méthodologies détaillées de chaque source sont accessibles sur la page Méthodologie. Sources complémentaires citées : Bain-Altagamma, Deloitte Global Powers of Luxury 2026, Reuters, Reed Smith, France-Épargne, Carnets du Luxe, ORIGYN, Arianee, WiseKey.",

    "b3.bcg.eyebrow": "Cartographie BCG · 6 segments AI Labor Disruption",
    "b3.bcg.title": "<em>50 à 55%</em> des emplois remodelés en 2-3 ans, <em>10 à 15%</em> éliminés en 4-5 ans.",
    "b3.bcg.lede": "L'étude microéconomique BCG d'avril 2026 sur 1 500 rôles Revelio Labs / 165M emplois US fournit le cadre quantitatif de référence pour les décisions RH 2026-2030. Pour les Maisons horlogères premium, la cartographie en 6 segments est particulièrement utile : elle permet de chiffrer combien de fonctions sont structurellement protégées (l'horlogerie reste majoritairement Limited-Exposure) et d'identifier les fonctions à transformer prioritairement.",
    "b3.bcg.h1.label": "Emplois remodelés en 2-3 ans (substantiellement transformés sans disparaître)",
    "b3.bcg.h2.label": "Emplois éliminés en 4-5 ans (vulnérabilité concentrée sur 2 segments)",
    "b3.bcg.h3.label": "Emplois à exposition limitée (peu de transformation à court terme)",
    "b3.bcg.s1.name": "Amplified · IA augmente, demande extensible",
    "b3.bcg.s1.body": "5% des emplois US. <strong>Pour le luxe horloger :</strong> directeurs créatifs sur projets globaux multi-marchés, designers seniors avec accompagnement IA générative pour mood boards et exploration formelle. L'IA accélère la production des concepts, le savoir-faire humain reste l'arbitre final.",
    "b3.bcg.s2.name": "Rebalanced · IA augmente, demande bornée",
    "b3.bcg.s2.body": "14% des emplois US. <strong>Pour le luxe horloger :</strong> responsables marketing premium qui deviennent des spécialistes omnicanal, chefs de projet collection, gestionnaires CRM VIP qui passent à un suivi plus dense par client. L'effectif reste stable, le contenu évolue vers une personnalisation augmentée.",
    "b3.bcg.s3.name": "Divergent · IA substitue, demande extensible",
    "b3.bcg.s3.body": "12% des emplois US. <strong>Pour le luxe horloger :</strong> conseillers de boutique flagship sur services standardisés (recommandation produit, comparaison technique), gestionnaires CRM de premier niveau, analystes marketing juniors. La couche junior est exposée, la couche senior croît avec l'expansion de la clientèle internationale. Risque réel d'écart entre boutiques flagship et boutiques régionales.",
    "b3.bcg.s4.name": "Substituted · IA substitue, demande bornée",
    "b3.bcg.s4.body": "12% des emplois US. <strong>Pour le luxe horloger :</strong> support client de premier niveau, gestionnaires de stocks et logistique standardisée, opérateurs back-office. Coupes ciblées probables. C'est le segment où le redéploiement vers les fonctions à forte valeur de marque (artisanat visible, accompagnement VIP) est l'option stratégique cohérente avec la promesse Swiss Made.",
    "b3.bcg.s5.name": "Enabled · IA s'intègre sans transformer la structure",
    "b3.bcg.s5.body": "23% des emplois US. <strong>Pour le luxe horloger :</strong> conseillers de boutique de réseau régional, responsables d'événements clients, agents de service après-vente. Maîtrise IA devient compétence de base mais le cœur du métier reste la relation incarnée.",
    "b3.bcg.s6.name": "Limited-Exposure · faible impact technique",
    "b3.bcg.s6.body": "34% des emplois US, mais probablement plus pour l'horlogerie premium qui est paradigmatiquement un secteur Limited-Exposure. <strong>Pour le luxe horloger :</strong> maîtres horlogers et artisans, formateurs internes en savoir-faire, conseillers VIP en relation patrimoniale, ambassadeurs de marque face aux collectionneurs. Position structurellement protégée par la nature human-intrinsic du bien.",
    "b3.bcg.takeaway": "<strong>Pour les comités exécutifs des Maisons horlogères premium</strong>, la cartographie BCG confirme quantitativement le cadre Trammell sur les biens human-intrinsic : le luxe a une exposition Limited-Exposure et Amplified disproportionnée par rapport à la moyenne US (BCG estime 34% Limited-Exposure tous secteurs confondus, l'horlogerie premium est probablement à 45-50% sur ce segment selon une analyse propre par fonction). Cela confirme que la prime de marque est défensible, à condition que l'investissement RH se concentre sur les segments Amplified et Limited-Exposure (artisans visibles, conseillers VIP, formateurs internes). <em>L'erreur stratégique majeure</em> serait de couper les segments Substituted et Enabled au prétexte qu'ils ne portent pas la marque, alors qu'ils financent la couverture distribution qui permet à la marque d'exister.",
    "b3.che.eyebrow": "Empirie suisse · contexte horloger 2025-2026",
    "b3.che.title": "<em>La pénurie démographique suisse change la nature de la décision RH</em> dans le luxe horloger.",
    "b3.che.lede": "Deux publications majeures de 2025-2026 fournissent un cadrage CH spécifique pour les Maisons horlogères premium. La première (Sturm/Deloitte CH) chiffre la pénurie démographique structurelle qui rend l'IA non plus optionnelle mais nécessaire. La seconde (KOF/ETH) mesure les effets distributionnels sur les fonctions exposées, dont peu touchent l'horloger directement, mais qui concernent les fonctions support (paie, comptabilité, marketing digital). Pour les directions des Maisons horlogères, ces données changent l'arbitrage entre artisans visibles et fonctions support.",
    "b3.che.s1.label": "Pénurie de travailleurs en Suisse anticipée d'ici 2050 · Deloitte CH",
    "b3.che.s2.label": "Productivité requise par an pour combler le déficit (4× le rythme actuel) · Deloitte CH",
    "b3.che.s3.label": "Croissance de l'emploi total CH Q3 2020-Q2 2025 malgré IA · KOF/ETH",
    "b3.che.src1.name": "SWI swissinfo · Sturm KOF + Deloitte CH · mai 2026",
    "b3.che.src1.body": "Article de synthèse intégrant trois voix d'autorité suisses sur l'avenir de l'IA. <strong>Jan-Egbert Sturm (directeur KOF/ETH Zurich)</strong> identifie quatre risques majeurs pour la Suisse · vieillissement démographique, changement climatique, déglobalisation, IA · et souligne que <strong>l'IA est le seul de ces quatre risques qui est aussi une opportunité</strong>. <strong>Étude Deloitte CH : pénurie de 300 000 travailleurs d'ici 2050</strong>, productivité requise <strong>+1,2% par an (4× le rythme actuel)</strong>. <strong>Implication directe pour l'horlogerie premium :</strong> la pénurie d'artisans qualifiés (horlogers, polisseurs, gemmologues, designers techniques) est déjà une réalité documentée dans le secteur. Dans ce contexte, l'IA n'est pas un substitut au savoir-faire humain, c'est un outil pour démultiplier la capacité productive d'une base humaine vieillissante et structurellement déficitaire.",
    "b3.che.src2.name": "KOF/ETH Zurich · Kläui & Siegenthaler · Étude #186 · octobre 2025",
    "b3.che.src2.body": "Première étude académique rigoureuse mesurant empiriquement l'impact de l'IA sur le marché du travail suisse, financée par le Fonds national suisse de la recherche. <strong>+27% de chômeurs dans les métiers très exposés</strong>, mais l'horlogerie premium ne figure pas dans le top 10 des métiers exposés. <strong>Les fonctions support des Maisons horlogères sont en revanche concernées</strong> : bureau de la paie (β 0,84), comptabilité (β 0,78), marketing digital, recrutement, communication. La même période (Q3 2020-Q2 2025) a vu l'emploi total CH augmenter de +7,4%. Lecture pour l'horlogerie : les artisans visibles restent dans la zone Limited-Exposure (cadre BCG), mais la transformation des fonctions support est inéluctable et a déjà commencé.",
    "b3.che.syn.tag": "Synthèse pour les comités exécutifs des Maisons horlogères premium",
    "b3.che.syn.title": "<em>L'arbitrage stratégique 2026-2030</em> n'est pas entre artisans et IA, c'est entre fonctions support et redéploiement du temps libéré.",
    "b3.che.syn.body": "Pour les Maisons horlogères premium, la convergence Sturm/Deloitte + KOF/ETH donne un cadre actionnable et différenciant. <strong>Le cœur du métier (artisans visibles, designers seniors, conseillers VIP)</strong> est structurellement protégé · confirmé par la KOF qui ne classe aucun métier horloger dans le top 10 exposé, par BCG qui les positionne en Amplified et Limited-Exposure, et par Trammell qui les caractérise comme paradigmatiquement human-intrinsic. <strong>Les fonctions support exposées (paie, comptabilité, marketing digital, premier niveau CRM)</strong> doivent être recomposées avec l'IA, mais le temps libéré doit être stratégiquement réalloué vers les fonctions à forte intensité de marque (formation interne, accompagnement long client VIP, narration de fabrique). <em>Dans le contexte de la pénurie démographique CH chiffrée par Deloitte (300 000 travailleurs manquants d'ici 2050)</em>, la décision n'est pas de couper, c'est de redéployer le temps humain disponible vers ce qui produit la prime de marque.",

    "b3.debate.eyebrow": "Le débat IA et travail · trois positions structurantes",
    "b3.debate.title": "Trois lectures du même phénomène, <em>trois plans de transformation</em>.",
    "b3.debate.lede": "Le débat sur l'IA et l'emploi est traversé par trois positions intellectuelles solides qui ne disent pas la même chose. Pour les Maisons horlogères premium, la position retenue change radicalement la décision RH, le calendrier d'investissement et la stratégie de marque. La page Veille de l'observatoire référence chacune de ces sources avec lien primaire. <em>Cadre de lecture transverse</em> · AI Frontiers · Anton Shenk (RAND, 11 mai 2026) cartographie ce désaccord comme un écart de 1 quadrillion $ entre prévisions économiques IA 2026-2035, ramené à trois questions testables : automatisation des tâches (Acemoglu vs Korinek), friction institutionnelle (OECD vs Goldman Sachs), automatisation de l'innovation (level effect GPT vs singularité Epoch AI). Pour le luxe horloger, où les hard tasks d'artisanat dominent et où la valeur perçue est tributaire de l'humain, le bear case d'Acemoglu est structurellement plus pertinent que le scénario singularité.",

    "b3.debate.p1.tag": "Position pessimiste",
    "b3.debate.p1.author": "Dario Amodei (Anthropic) · Mustafa Suleyman (Microsoft AI)",
    "b3.debate.p1.claim": "L'IA va éliminer 50% des cadres entrants en 1 à 5 ans.",
    "b3.debate.p1.body": "Pour Amodei, l'IA progresse simultanément dans tous les secteurs cognitifs, ce qui supprime les bassins d'emploi adjacents qui absorbaient historiquement les travailleurs déplacés. Suleyman va plus loin en estimant que la plupart des tâches de cadres seront automatisées en 12 à 18 mois. Si cette position est correcte appliquée au luxe, elle implique une suppression massive des postes de relation client junior, des analystes marketing et des designers produits assistés. Les dirigeants horlogers qui retiennent cette lecture <strong>gèlent les recrutements entry-level dès maintenant</strong>, restructurent les équipes de stylisme autour d'un seuil senior, et préparent une bascule rapide vers des architectures IA-first.",

    "b3.debate.p2.tag": "Position empirique",
    "b3.debate.p2.author": "Pieter Garicano (Silicon Continent) · Brynjolfsson (Stanford) · NY Fed",
    "b3.debate.p2.claim": "La tâche n'est pas le job. Le bundle survit, recomposé.",
    "b3.debate.p2.body": "Garicano développe un argument structurel : un job est un bundle de tâches, pas une somme de tâches automatisables. Quand l'IA prend la tâche faible du bundle, elle laisse au travailleur la tâche forte, qui était souvent celle qui produisait la vraie valeur. L'exemple historique central est précisément <strong>l'horlogerie suisse face au quartz dans les années 1980</strong> : la survie n'est pas venue d'une meilleure précision technique, mais d'une redéfinition complète du bundle de valeur (mécanique d'art, héritage, statut, savoir-faire incarné). Les données NY Fed avril 2026 confirment empiriquement cette logique : la majorité des firmes adoptant l'IA forment leur personnel existant plutôt que de couper. Brynjolfsson 2025 observe un gain +15% concentré sur les juniors, signal d'augmentation et non de substitution.",

    "b3.debate.p3.tag": "Position macroéconomique",
    "b3.debate.p3.author": "Philip Trammell (Stanford) · Korinek (NBER) · Papanikolaou (Northwestern)",
    "b3.debate.p3.claim": "Les biens human-intrinsic protègent structurellement la part travail.",
    "b3.debate.p3.body": "Trammell formalise pourquoi la part travail peut rester élevée même dans un scénario de pleine automatisation. La thèse repose sur la notion de biens human-intrinsic : concerts, performances, soin, accompagnement, où la présence humaine fait partie de la définition même du bien. <strong>L'horlogerie premium est un cas paradigmatique</strong> de bien human-intrinsic : ce que vend une Patek Philippe ou un mouvement Greubel Forsey, ce n'est pas la précision (qu'une Apple Watch dépasse), c'est la trace incarnée d'un savoir-faire humain rare. Une préférence même légère pour ces biens humains-intrinsèques, partagée par les ménages riches, peut maintenir la part travail à un niveau élevé voire la pousser vers 1, indépendamment de la capacité technique des machines. Papanikolaou (Northwestern) confirme empiriquement les effets compensatoires.",

    "b3.debate.p4.tag": "Position bull historique-allocateur",
    "b3.debate.p4.author": "David George (Andreessen Horowitz · a16z) · NBER WP 34984 · Atlanta Fed WP 2026-3 · Census CES 26-25 · Yale Budget Lab",
    "b3.debate.p4.claim": "L'IA va massivement augmenter la valeur perçue des biens et services à exclusivité humaine · le luxe est précisément le secteur qui en bénéficie.",
    "b3.debate.p4.body": "George (a16z, mai 2026) défend pour le luxe et l'horlogerie premium la thèse bull historique-allocateur, avec un angle particulièrement fort pour ce secteur. (1) <strong>Argument central pour le luxe</strong> : quand l'IA rend la production de biens standardisés moins coûteuse, les revenus réels augmentent, et la consommation se réoriente vers des biens à élasticité-revenu supérieure à 1, c'est-à-dire massivement non automatisables (artisanat, expérience humaine personnalisée, performance live, exclusivité). C'est le cadre Imas (Chicago Booth, avril 2026) confirmé par George : la rareté ne disparaît pas, elle se déplace vers ce que le luxe produit déjà. (2) <strong>Précédents historiques sectoriels</strong> : agents de voyage Tedeschi/Stripe (effectifs divisés par 2 mais salaires de 87% à 99% de la moyenne 2000-2025) · les services à valeur ajoutée humaine voient leurs salaires augmenter en valeur relative, exactement le pattern attendu pour les artisans horlogers. (3) <strong>Données académiques 2026</strong> : NBER WP 34984, Atlanta Fed WP 2026-3, Census CES 26-25, Yale Budget Lab avril 2026 convergent sur la stabilité de l'emploi total. (4) <strong>Données positives sectorielles</strong> : nouvelle formation d'entreprises corrélée à l'adoption IA, ratio augmentation/substitution 8:1, +60% YoY apps store · l'écosystème de services premium qui entoure le luxe (conciergerie, expérience client, événementiel haut de gamme) est en expansion structurelle. <strong>Pour les Maisons d'horlogerie, cette position implique</strong> non seulement de protéger les fonctions artisanales (qui ne sont pas dans les top 10 KOF exposés), mais d'investir dans l'expansion des fonctions clienteling, expérience boutique, après-vente premium, où la valeur unitaire va augmenter avec la richesse globale générée par l'IA. La thèse a16z renforce le cadre Trammell sur la persistance de la part travail et confirme empiriquement Imas sur la prime d'exclusivité humaine.",
    "b3.debate.sec.tag": "Implication sectorielle · luxe et horlogerie premium",
    "b3.debate.sec.title": "Le luxe est <em>structurellement protégé</em>, mais pas équitablement réparti.",
    "b3.debate.sec.body": "Pour les Maisons horlogères premium, la convergence des quatre positions donne une lecture nuancée. La position pessimiste d'Amodei <em>est probablement fausse appliquée au luxe</em>, parce que la valeur du luxe ne vient pas d'une efficacité de production que l'IA pourrait commoditiser. La position empirique de Garicano <em>est directement vérifiée</em> par l'histoire récente du secteur : le quartz devait tuer l'horlogerie suisse, qui a doublé en valeur en redéfinissant son bundle. La position macro de Trammell <em>donne le cadre théorique</em> : le luxe vend un bien human-intrinsic au sens technique du terme. <strong>Mais cette protection structurelle n'est pas équitablement répartie dans le secteur</strong>. Les Maisons qui restent dans la course à la précision pure et au scoring algorithmique des clients VIP perdent leur prime. Celles qui doublent leur investissement sur l'incarnation humaine (artisans visibles, ateliers ouverts, accompagnement long, narration de fabrique) capturent la prime du human-intrinsic. La décision RH 2026 n'est pas <em>combien de juniors couper</em>, c'est <em>quels postes humains augmenter pour défendre le bundle</em>. <strong>La position bull historique-allocateur (George/a16z, mai 2026)</strong> est particulièrement forte pour le luxe parce qu'elle valide empiriquement le mécanisme prédit par Imas (Chicago Booth) : quand l'IA rend la production de biens standardisés moins coûteuse, les revenus réels augmentent et la consommation se réoriente massivement vers ce que le luxe produit déjà · l'expérience humaine personnalisée, l'artisanat visible, l'exclusivité. Les agents de voyage Tedeschi/Stripe ont vu leurs effectifs divisés par 2 mais leurs salaires passer de 87% à 99% de la moyenne privée 2000-2025 · ce pattern de hausse de la valeur unitaire des fonctions à valeur ajoutée humaine est précisément celui qui devrait s'appliquer aux artisans horlogers et au personnel boutique d'ici 2030. Pour les Maisons, cela signifie que <em>l'investissement dans l'incarnation humaine n'est pas un coût défensif, c'est un investissement offensif</em> sur la prime que l'IA va créer pour le human-intrinsic. <strong>Cadre méta-épistémologique de lecture (Davenport et Paredes, Harvard Data Science Review automne 2025)</strong> : les quatre positions du débat produisent toutes des chiffres globaux qui ne sont jamais calibrés sur le luxe et l'horlogerie premium spécifiquement. La revue HDSR 7.4 (peer-reviewed MIT Press) démontre que toutes les prédictions task-based sont systématiquement inexactes parce que la valeur du luxe ne se réduit pas à une somme de tâches mesurables. <em>Pour les directions des Maisons, la conséquence pratique est triple</em> : (1) ne pas adopter unilatéralement la position pessimiste qui couperait précisément les fonctions d'incarnation humaine, (2) ne pas adopter unilatéralement la position bull qui sous-estimerait le déplacement nécessaire des fonctions support, (3) traiter les quatre lectures comme des hypothèses à confronter aux conditions sectorielles locales (KOF/ETH artisans hors top 10 exposé, Imas prime d'exclusivité humaine, Trammell biens human-intrinsic, Sturm/Deloitte pénurie 300 000 travailleurs CH 2050). La décision RH 2026-2030 d'une Maison horlogère se construit sur la triangulation entre les scénarios contradictoires et les indicateurs locaux, pas sur l'adoption d'un seul chiffre prédictif.",

    "b3.tco.eyebrow": "Économie des coûts · le facteur ignoré",
    "b3.tco.title": "Le coût réel de l'IA dans le luxe et l'horlogerie premium, <em>au-delà du prix par token</em>.",
    "b3.tco.lede": "Les expériences clients VIP, les recommandations personnalisées et l'authentification de produits par IA exigent une qualité d'inférence et une supervision humaine que les budgets POC sous-estiment systématiquement. Pour le luxe, le coût d'un mauvais output peut détruire en un instant un capital de marque construit en décennies.",
    "b3.tco.s1.label": "Erreur potentielle de calcul des coûts GenAI selon Gartner si le passage à l'échelle n'est pas anticipé",
    "b3.tco.s1.source": "Gartner · oct 2024",
    "b3.tco.s2.label": "Des CIO indiquent un breakeven ou une perte sur leurs investissements IA en 2024",
    "b3.tco.s2.source": "Gartner · oct 2024",
    "b3.tco.s3.label": "Coût par résolution GenAI prédit dans le service client en 2030, supérieur aux agents offshore",
    "b3.tco.s3.source": "Gartner · janv 2026",
    "b3.tco.s4.label": "Comparaisons RLM où le modèle moins cher coûte plus en pratique · jusqu'à 28× d'inversion",
    "b3.tco.s4.source": "Chen et al. · Stanford / UC Berkeley / CMU / MSR · arXiv 2603.23971 · mars 2026",
    "b3.tco.takeaway": "<strong>Pour les directions des marques d'horlogerie premium et de luxe</strong>, l'enjeu spécifique : les expériences clients VIP, les recommandations personnalisées et l'authentification de produits par IA exigent une qualité d'inférence et une supervision humaine que le prix par token publié ne reflète pas. Le coût total par interaction haut de gamme peut atteindre 10 à 20 fois le coût POC. <strong>Chen et al. (Stanford / Berkeley / CMU / MSR · arXiv 2603.23971 · mars 2026)</strong> apportent la démonstration académique de ce décalage : 21,8% des comparaisons de modèles de raisonnement montrent une inversion de prix, jusqu'à 28× · le prix listé n'est pas un proxy fiable du coût d'usage réel. Pour le luxe, où chaque interaction client engage le capital de marque, sélectionner un modèle sur la seule base de son prix listé est une erreur économique structurelle. Le pivot stratégique de <em>Quinlan (Gartner, janvier 2026)</em> s'applique parfaitement au luxe : utiliser l'IA pour augmenter la valeur perçue de la relation, jamais pour rogner sur l'expérience client. Le cadre TCO de Tomer (avril 2026) et notre <a href=\"../methodologie.html#tco\">section méthodologique 07</a> formalisent les composantes à modéliser.",
    "b3.disc.tag": "Disclosure",
    "b3.disc.body": "Ce dossier a été produit avec l'assistance d'une intelligence artificielle (Claude Opus 4.7, en modes Research et Web Search), puis soumis à une vérification factuelle contre les sources primaires. L'IA a servi d'outil de documentation, de synthèse et de mise en forme visuelle, pas de source autonome ni d'autorité scientifique. Détails méthodologiques en <a href=\"../methodologie.html\">section 03 de la page Méthodologie</a>.",

    "b3.back": "Toutes les dépêches"
  },

    "b3.title": "Premium watchmaking and AI: the test of <em>desirability</em>.",
    "b3.sub": "The luxury market is going through its toughest quarter since 2008 in 2026. For Swiss premium watchmaking houses, AI governance is no longer a compliance issue: it is now a desirability issue. Three fronts open simultaneously. Here is what an executive committee needs to know before the next Watches & Wonders.",
    "b3.by.author": "Naully Nicolas",
    "b3.by.read": "7 minute read",
    "b3.by.sources": "12 primary sources",
    "b3.crit.eyebrow": "Critical reading · three objections to the alarmist narrative",
    "b3.crit.title": "Why the « massive job disappearance » narrative <em>does not hold up</em>.",
    "b3.crit.lede": "Statements from Amodei (50% of junior white-collar jobs gone in 1-5 years) and Suleyman (12-18 months to automate office work) circulate widely. Five empirical and theoretical objections structure a more cautious reading, articulated below for premium watchmaking houses and luxury.",
    "b3.crit.t1.title": "Big Tech headcount 2026 ≈ 2022 · despite $700 billion in AI CapEx",
    "b3.crit.t1.body": "The four largest tech firms have committed over <strong>$700 billion in AI CapEx</strong> for the current fiscal year. Yet Amazon, Google and Meta employ roughly the same number of staff as in 2022. R&D spending as a share of revenue has <strong>increased</strong> at Meta, Google and Amazon since 2022. Tech leaders themselves acknowledge that layoffs primarily reflect pandemic overhiring, not AI substitution.<br><br><strong>Implication for premium watchmaking houses and luxury</strong>: US tech announcements are not a reference point for calibrating an AI strategy. Maisons that imitate Silicon Valley efficiency rhetoric risk weakening their brand narrative, which rests precisely on the valorization of human work and craftsmanship.",
    "b3.crit.t1.source": "Sources · Washington Post 1 May 2026 · NYT Opinion 3 May 2026 · Andreessen and Altman · Microsoft AI Diffusion Report Q1 2026 (Switzerland 37.8% adoption, rank 14)",
    "b3.crit.t2.title": "A premium watchmaking job is a bundle of authority, not a sum of automatable tasks",
    "b3.crit.t2.body": "The task-exposure argument assumes a profession reduces to the sum of its measurable tasks. But premium watchmaking rests on very dense bundles: a watchmaker combines technical gesture, aesthetic judgment, quality arbitration, transmission and exercise of authority (piece validation, signature). AI can help on some isolated tasks (CAD, simulation) without replacing the <em>responsibility</em> of the whole.<br><br><strong>Implication for luxury</strong>: AI does not eliminate authority roles (master watchmaker, artistic director, VIP advisor), it augments them. Transformation runs through recomposition of bundles around higher-authority decisions and brand signature. Support functions are affected by AI, authority functions are structurally protected.",
    "b3.crit.t2.source": "Source · Luis Garicano · Silicon Continent · 22 April 2026 · response to Amodei and Suleyman · Avi Goldfarb · NBER WP 34639 · April 2026 (O-ring tasks) · Imas & Shukla · March 23 2026 (dimensionality)",
    "b3.crit.t3.title": "Theoretically, AI enrichment raises the value of human luxury in the long run",
    "b3.crit.t3.body": "Under hierarchical consumption preferences, human labor becomes a high income-elasticity good, in other words a luxury. When capital becomes abundant, its share in consumption decreases and that of human-rendered work increases. If capital and labor are gross complements, infinite capital accumulation does not suffice for growth · human labor remains structurally necessary.<br><br><strong>Implication for luxury and premium watchmaking</strong>: this is the most favorable long-term scenario. As AI enriches society, the share of consumer budget allocated to goods and services with strong human components (craftsmanship, signature, VIP experience) structurally increases. Luxury becomes an indirect beneficiary of the AI transition, not a victim.",
    "b3.crit.t3.source": "Source · Philip Trammell · Stanford Digital Economy Lab · 27 March 2026 · formal economic model",
    "b3.crit.t4.title": "All quantified AI-employment predictions are systematically <em>wildly inaccurate</em>",
    "b3.crit.t4.body": "A meta-epistemological analysis compiles <strong>10 absolute predictions, 9 percentage predictions and 19 sectoral predictions</strong> published between 2013 and 2025. Structuring finding: all these predictions are systematically <em>wildly inaccurate</em>. Task-by-task assessment · the dominant method since 2013 · is demonstrated as ineffective because it ignores contextual adoption factors and adjacent job creation. This critique is <em>particularly relevant for luxury</em>, because the sector's value does not reduce to a sum of measurable tasks · human embodiment, artisan gesture, boutique experience are precisely what no task-based methodology captures.<br><br><strong>Implication for Maisons</strong>: an HR plan calibrated on global quantified predictions risks cutting precisely the human functions that produce the structural human-intrinsic premium. 2026-2030 arbitrage must rest on local sectoral conditions (KOF/ETH craftsmen outside the top 10 exposed, human exclusivity premium).",
    "b3.crit.t4.source": "Sources · Davenport and Paredes · Harvard Data Science Review · MIT Press · Issue 7.4 · Fall 2025 · CC BY 4.0 · Arntz, Gregory, Zierahn · OECD WP 189 · 2016 · Frey and Osborne · Oxford Martin · 2013/2017",
    "b3.crit.t5.title": "The measurable psychological cost of generative AI is <em>structurally incompatible with the manufacture of luxury attention</em>",
    "b3.crit.t5.body": "An experimental study across <strong>4 online studies with 3,562 participants</strong> documents that generative AI produces a measurable dual effect. Performance augmentation: increased immediate quality and efficiency. Psychological deprivation: <strong>-11% intrinsic motivation, +20% boredom</strong> when returning to solo tasks (medium effect size d=-0.44). Mechanism: AI collaboration bypasses the most cognitively stimulating parts, which are what makes work intrinsically satisfying. Convergence with a study on 319 knowledge workers documenting cognitive sedation.<br><br><strong>Implication for premium watchmaking houses and luxury</strong>: luxury brand value is built precisely on the opposite of what generative AI produces · sustained attention, embodied presence, visible artisan mastery. AI augmentation policy for Maisons must be <em>asymmetric by function</em> · automation tolerated on purely administrative tasks, maximum caution on functions where intrinsic engagement produces brand premium.",
    "b3.crit.t5.source": "Sources · Champniss · Harvard Business Review · May-June 2026 · Wu, Liu, Ruan, Chen, Xie · Scientific Reports · Nature Portfolio · 29 April 2025 · DOI 10.1038/s41598-025-98385-2 · Microsoft Research and Carnegie Mellon University · CHI 2025",

    "b3.src.intro": "A dispatch is only worth its verifiable figures. Every indicator in this dispatch is linked below to its original publication. Primary sources fully cited, no paywall, no withholding.",
    "b3.src.s1.label": "Federation of the Swiss Watch Industry (FH) · 2025 Statistics · January 2026",
    "b3.src.s1.cited": "Cited for the figure <strong>-1.7% in Swiss watch exports in 2025 (CHF 25.6 billion)</strong>, second consecutive year of decline. Volumes -4.8% (-740,000 units). Official source: Swiss federal customs.",
    "b3.src.s2.label": "Le Temps · Richemont quarterly results · 15 January 2026",
    "b3.src.s2.cited": "Cited for the figure <strong>+7% for Richemont specialist watchmakers</strong> (IWC, Jaeger-LeCoultre, Vacheron Constantin, A. Lange & Söhne, Panerai, Piaget, Roger Dubuis). First significant rebound in 18 months.",
    "b3.src.s3.label": "Kearney · 2026 Global Luxury Industry Outlook · January 2026",
    "b3.src.s3.cited": "Cited for the figure <strong>+16.2%/year of luxury AI investment over ten years</strong>, and 90% of executives considering AI essential. Sample: 200+ luxury executives interviewed.",
    "b3.src.primary": "Primary source ↗",
    "b3.src.note": "Note. Figures presented here are rounded. Uncertainty margins and detailed methodologies for each source are accessible on the Methodology page. Complementary sources cited: Bain-Altagamma, Deloitte Global Powers of Luxury 2026, Reuters, Reed Smith, France-Épargne, Carnets du Luxe, ORIGYN, Arianee, WiseKey.",
    "b3.disc.tag": "Disclosure",
    "b3.disc.body": "This dossier was produced with the assistance of artificial intelligence (Claude Opus 4.7, in Research and Web Search modes), then submitted to factual verification against primary sources. The AI was used as a tool for documentation, synthesis and visual formatting, not as an autonomous source or scientific authority. Methodological details in <a href=\"../methodologie.html\">section 03 of the Methodology page</a>.",

    "b3.bcg.eyebrow": "BCG Mapping · 6 AI Labor Disruption segments",
    "b3.bcg.title": "<em>50 to 55%</em> of jobs reshaped in 2-3 years, <em>10 to 15%</em> eliminated in 4-5 years.",
    "b3.bcg.lede": "The April 2026 BCG microeconomic study on 1,500 Revelio Labs roles / 165M US jobs provides the reference quantitative framework for 2026-2030 HR decisions. For premium watchmaking houses, the 6-segment mapping is particularly useful: it allows quantifying how many functions are structurally protected (watchmaking remains predominantly Limited-Exposure) and identifying functions to transform as priority.",
    "b3.bcg.h1.label": "Jobs reshaped in 2-3 years (substantially transformed without disappearing)",
    "b3.bcg.h2.label": "Jobs eliminated in 4-5 years (vulnerability concentrated in 2 segments)",
    "b3.bcg.h3.label": "Limited-exposure jobs (little near-term transformation)",
    "b3.bcg.s1.name": "Amplified · AI augments, expandable demand",
    "b3.bcg.s1.body": "5% of US jobs. <strong>For luxury watchmaking:</strong> creative directors on global multi-market projects, senior designers with generative AI accompaniment for mood boards and formal exploration. AI accelerates concept production, human savoir-faire remains the final arbiter.",
    "b3.bcg.s2.name": "Rebalanced · AI augments, bounded demand",
    "b3.bcg.s2.body": "14% of US jobs. <strong>For luxury watchmaking:</strong> premium marketing managers becoming omnichannel specialists, collection project leaders, VIP CRM managers moving to denser per-client follow-up. Headcount stays stable, content evolves toward augmented personalization.",
    "b3.bcg.s3.name": "Divergent · AI substitutes, expandable demand",
    "b3.bcg.s3.body": "12% of US jobs. <strong>For luxury watchmaking:</strong> flagship boutique advisors on standardized services (product recommendation, technical comparison), first-level CRM managers, junior marketing analysts. Junior layer exposed, senior layer grows with expansion of international clientele. Real risk of gap between flagship and regional boutiques.",
    "b3.bcg.s4.name": "Substituted · AI substitutes, bounded demand",
    "b3.bcg.s4.body": "12% of US jobs. <strong>For luxury watchmaking:</strong> first-level customer support, standardized stock and logistics managers, back-office operators. Targeted cuts probable. The segment where redeployment to high brand-value functions (visible craft, VIP accompaniment) is the strategic option consistent with the Swiss Made promise.",
    "b3.bcg.s5.name": "Enabled · AI integrates without transforming structure",
    "b3.bcg.s5.body": "23% of US jobs. <strong>For luxury watchmaking:</strong> regional network boutique advisors, client event managers, after-sales service agents. AI mastery becomes a baseline skill but the heart of the profession remains embodied relationship.",
    "b3.bcg.s6.name": "Limited-Exposure · low technical impact",
    "b3.bcg.s6.body": "34% of US jobs, but probably more for premium watchmaking which is paradigmatically a Limited-Exposure sector. <strong>For luxury watchmaking:</strong> master watchmakers and artisans, internal savoir-faire trainers, VIP wealth-relationship advisors, brand ambassadors facing collectors. Position structurally protected by the human-intrinsic nature of the good.",
    "b3.bcg.takeaway": "<strong>For premium watchmaking executive committees</strong>, the BCG mapping quantitatively confirms the Trammell framework on human-intrinsic goods: luxury has a disproportionately high Limited-Exposure and Amplified exposure compared to US average (BCG estimates 34% Limited-Exposure all sectors, premium watchmaking is probably at 45-50% on this segment per proprietary function analysis). This confirms the brand premium is defensible, provided HR investment concentrates on Amplified and Limited-Exposure segments (visible artisans, VIP advisors, internal trainers). <em>The major strategic error</em> would be cutting Substituted and Enabled segments on the pretext they don't carry the brand, when they finance the distribution coverage that allows the brand to exist.",
    "b3.che.eyebrow": "Swiss empirical evidence · watchmaking context 2025-2026",
    "b3.che.title": "<em>Swiss demographic shortage changes the nature of HR decisions</em> in luxury watchmaking.",
    "b3.che.lede": "Two major 2025-2026 publications provide CH-specific framing for premium watchmaking houses. The first (Sturm/Deloitte CH) quantifies the structural demographic shortage making AI not optional but necessary. The second (KOF/ETH) measures distributional effects on exposed functions, few of which directly touch watchmaking, but which concern support functions (payroll, accounting, digital marketing). For watchmaking leadership, these data change the arbitrage between visible artisans and support functions.",
    "b3.che.s1.label": "Worker shortage anticipated in Switzerland by 2050 · Deloitte CH",
    "b3.che.s2.label": "Required productivity per year to fill the deficit (4× current pace) · Deloitte CH",
    "b3.che.s3.label": "Swiss total employment growth Q3 2020-Q2 2025 despite AI · KOF/ETH",
    "b3.che.src1.name": "SWI swissinfo · Sturm KOF + Deloitte CH · May 2026",
    "b3.che.src1.body": "Synthesis article integrating three Swiss authoritative voices on AI's future. <strong>Jan-Egbert Sturm (KOF/ETH Zurich director)</strong> identifies four major risks for Switzerland · aging, climate, deglobalization, AI · and emphasizes <strong>AI is the only one of these four risks that is also an opportunity</strong>. <strong>Deloitte CH study: shortage of 300,000 workers by 2050</strong>, required productivity <strong>+1.2% per year (4× current pace)</strong>. <strong>Direct implication for premium watchmaking:</strong> the shortage of skilled artisans (watchmakers, polishers, gemologists, technical designers) is already a documented reality in the sector. In this context, AI is not a substitute for human savoir-faire, it is a tool to multiply the productive capacity of an aging and structurally deficit human base.",
    "b3.che.src2.name": "KOF/ETH Zurich · Kläui & Siegenthaler · Study #186 · October 2025",
    "b3.che.src2.body": "First rigorous academic study empirically measuring AI's impact on the Swiss labor market, funded by the Swiss National Science Foundation. <strong>+27% unemployed in highly exposed occupations</strong>, but premium watchmaking does not appear in the top 10 exposed occupations. <strong>Support functions of watchmaking houses are however concerned</strong>: payroll office (β 0.84), accounting (β 0.78), digital marketing, recruitment, communication. The same period (Q3 2020-Q2 2025) saw Swiss total employment grow +7.4%. Reading for watchmaking: visible artisans remain in the Limited-Exposure zone (BCG framework), but the transformation of support functions is inevitable and has already begun.",
    "b3.che.syn.tag": "Synthesis for premium watchmaking executive committees",
    "b3.che.syn.title": "<em>The 2026-2030 strategic arbitrage</em> is not between artisans and AI, it is between support functions and redeployment of freed time.",
    "b3.che.syn.body": "For premium watchmaking houses, the Sturm/Deloitte + KOF/ETH convergence provides an actionable and differentiating framework. <strong>The core of the profession (visible artisans, senior designers, VIP advisors)</strong> is structurally protected · confirmed by KOF which classifies no watchmaking occupation in the top 10 exposed, by BCG which positions them in Amplified and Limited-Exposure, and by Trammell who characterizes them as paradigmatically human-intrinsic. <strong>Exposed support functions (payroll, accounting, digital marketing, first-level CRM)</strong> must be recomposed with AI, but freed time must be strategically reallocated toward high brand-intensity functions (internal training, long-form VIP client accompaniment, factory storytelling). <em>In the context of CH demographic shortage quantified by Deloitte (300,000 missing workers by 2050)</em>, the decision is not to cut, it is to redeploy available human time toward what produces the brand premium.",

    "b3.debate.eyebrow": "The AI-and-work debate · three structuring positions",
    "b3.debate.title": "Three readings of the same phenomenon, <em>three transformation plans</em>.",
    "b3.debate.lede": "The debate on AI and employment is shaped by three solid intellectual positions that do not say the same thing. For premium watchmaking houses, the position retained radically changes the HR decision, the investment timeline, and the brand strategy. The observatory's veille page references each of these sources with a primary link. <em>Cross-cutting reading framework</em> · AI Frontiers · Anton Shenk (RAND, May 11, 2026) maps this disagreement as a $1 quadrillion gap between AI economic forecasts 2026-2035, reduced to three testable questions: task automation (Acemoglu vs Korinek), institutional friction (OECD vs Goldman Sachs), innovation automation (GPT level effect vs Epoch AI singularity). For luxury watchmaking, where artisanal hard tasks dominate and perceived value is tributary to human craft, Acemoglu's bear case is structurally more relevant than the singularity scenario.",

    "b3.debate.p1.tag": "Pessimistic position",
    "b3.debate.p1.author": "Dario Amodei (Anthropic) · Mustafa Suleyman (Microsoft AI)",
    "b3.debate.p1.claim": "AI will eliminate 50% of entry-level white-collar jobs in 1 to 5 years.",
    "b3.debate.p1.body": "For Amodei, AI advances simultaneously across all cognitive sectors, eliminating the adjacent employment basins that historically absorbed displaced workers. Suleyman goes further by estimating that most white-collar tasks will be automated within 12 to 18 months. Applied to luxury, this position implies a massive suppression of junior client relationship roles, marketing analysts and AI-assisted product designers. Watchmaking executives retaining this reading <strong>freeze entry-level recruitment now</strong>, restructure styling teams around a senior threshold, and prepare a rapid pivot to AI-first architectures.",

    "b3.debate.p2.tag": "Empirical position",
    "b3.debate.p2.author": "Pieter Garicano (Silicon Continent) · Brynjolfsson (Stanford) · NY Fed",
    "b3.debate.p2.claim": "The task is not the job. The bundle survives, recomposed.",
    "b3.debate.p2.body": "Garicano develops a structural argument: a job is a bundle of tasks, not a sum of automatable tasks. When AI takes the weak task of the bundle, it leaves the worker with the strong task, which was often the one producing the real value. The central historical example is precisely <strong>Swiss watchmaking facing quartz in the 1980s</strong>: survival did not come from better technical precision, but from a complete redefinition of the value bundle (mechanical art, heritage, status, embodied savoir-faire). NY Fed April 2026 data empirically confirms this logic: the majority of AI-adopting firms retrain existing staff rather than cutting. Brynjolfsson 2025 observes a +15% gain concentrated on juniors, signaling augmentation rather than substitution.",

    "b3.debate.p3.tag": "Macroeconomic position",
    "b3.debate.p3.author": "Philip Trammell (Stanford) · Korinek (NBER) · Papanikolaou (Northwestern)",
    "b3.debate.p3.claim": "Human-intrinsic goods structurally protect the labor share.",
    "b3.debate.p3.body": "Trammell formalizes why the labor share can stay high even in a full-automation scenario. The thesis rests on the notion of human-intrinsic goods: concerts, performances, care, accompaniment, where human presence is part of the very definition of the good. <strong>Premium watchmaking is a paradigmatic case</strong> of human-intrinsic good: what a Patek Philippe or a Greubel Forsey movement sells is not precision (which an Apple Watch surpasses), it is the embodied trace of a rare human savoir-faire. Even a mild preference for these human-intrinsic goods, shared by wealthy households, can keep the labor share at a high level or push it toward 1, regardless of machine technical capability. Papanikolaou (Northwestern) empirically confirms the offsetting effects.",

    "b3.debate.p4.tag": "Historical-allocator bull position",
    "b3.debate.p4.author": "David George (Andreessen Horowitz · a16z) · NBER WP 34984 · Atlanta Fed WP 2026-3 · Census CES 26-25 · Yale Budget Lab",
    "b3.debate.p4.claim": "AI will massively augment the perceived value of goods and services with human exclusivity · luxury is precisely the sector that benefits.",
    "b3.debate.p4.body": "George (a16z, May 2026) defends for luxury and premium watchmaking the historical-allocator bull thesis, with a particularly strong angle for this sector. (1) <strong>Central argument for luxury</strong>: when AI makes standardized goods production less expensive, real incomes rise, and consumption reorients toward goods with income elasticity above 1, i.e. massively non-automatable (craft, personalized human experience, live performance, exclusivity). This is the Imas framework (Chicago Booth, April 2026) confirmed by George: scarcity does not disappear, it shifts to what luxury already produces. (2) <strong>Sectoral historical precedents</strong>: travel agents Tedeschi/Stripe (workforce halved but wages from 87% to 99% of average 2000-2025) · human-added-value services see their wages rise in relative terms, exactly the expected pattern for watchmaking craftsmen. (3) <strong>2026 academic data</strong>: NBER WP 34984, Atlanta Fed WP 2026-3, Census CES 26-25, Yale Budget Lab April 2026 converge on total employment stability. (4) <strong>Positive sectoral data</strong>: new business formation correlated with AI adoption, 8:1 augmentation/substitution ratio, +60% YoY app store · the premium services ecosystem surrounding luxury (concierge, customer experience, high-end events) is in structural expansion. <strong>For watchmaking Maisons, this position implies</strong> not only protecting artisan functions (which are not in the KOF top 10 exposed), but investing in the expansion of clienteling, boutique experience, premium after-sales, where unit value will increase with overall AI-generated wealth. The a16z thesis reinforces the Trammell framework on labor share persistence and empirically confirms Imas on the human exclusivity premium.",
    "b3.debate.sec.tag": "Sectoral implication · luxury and premium watchmaking",
    "b3.debate.sec.title": "Luxury is <em>structurally protected</em>, but not equitably distributed.",
    "b3.debate.sec.body": "For premium watchmaking houses, the convergence of the four positions yields a nuanced reading. Amodei's pessimistic position <em>is probably wrong applied to luxury</em>, because luxury value does not come from a production efficiency that AI could commoditize. Garicano's empirical position <em>is directly verified</em> by the recent history of the sector: quartz was supposed to kill Swiss watchmaking, which doubled in value by redefining its bundle. Trammell's macro position <em>provides the theoretical framework</em>: luxury sells a human-intrinsic good in the technical sense. <strong>But this structural protection is not equitably distributed in the sector.</strong> Houses staying in the race for pure precision and algorithmic VIP client scoring lose their premium. Those that double down on human embodiment (visible artisans, open ateliers, long-form accompaniment, factory storytelling) capture the human-intrinsic premium. The 2026 HR decision is not <em>how many juniors to cut</em>, it is <em>which human roles to scale up to defend the bundle</em>. <strong>The historical-allocator bull position (George/a16z, May 2026)</strong> is particularly strong for luxury because it empirically validates the mechanism predicted by Imas (Chicago Booth): when AI makes standardized goods production less expensive, real incomes rise and consumption reorients massively toward what luxury already produces · personalized human experience, visible craft, exclusivity. Travel agents Tedeschi/Stripe saw their workforce halved but their wages move from 87% to 99% of private sector average 2000-2025 · this rising-unit-value pattern for human-added-value functions is precisely the one that should apply to watchmaking craftsmen and boutique staff by 2030. For Maisons, this means <em>investment in human embodiment is not a defensive cost, it is an offensive investment</em> on the premium AI will create for human-intrinsic goods. <strong>Meta-epistemological reading framework (Davenport and Paredes, Harvard Data Science Review Fall 2025)</strong>: the four debate positions all produce global figures that are never calibrated on luxury and premium watchmaking specifically. The peer-reviewed HDSR 7.4 review (MIT Press) demonstrates that all task-based predictions are systematically inaccurate because luxury value does not reduce to a sum of measurable tasks. <em>For Maison leadership, the practical consequence is threefold</em>: (1) do not unilaterally adopt the pessimistic position which would cut precisely the human embodiment functions, (2) do not unilaterally adopt the bull position which would underestimate the necessary redeployment of support functions, (3) treat the four readings as hypotheses to confront with local sectoral conditions (KOF/ETH craftsmen outside the top 10 exposed, Imas human exclusivity premium, Trammell human-intrinsic goods, Sturm/Deloitte 300,000 worker shortage CH 2050). The 2026-2030 HR decision for a watchmaking Maison is built on triangulation between contradictory scenarios and local indicators, not on the adoption of a single predictive figure.",

    /* TCO section · cost economics */
    "b3.tco.eyebrow": "Cost economics · the ignored factor",
    "b3.tco.title": "Premium watchmaking · <em>when real AI cost reinforces the value of the human gesture</em>.",
    "b3.tco.lede": "Luxury and premium watchmaking have a singular production economics where human scarcity and the artisan gesture are precisely what customers value. For these sectors, AI's TCO question is not only budgetary, it is strategic: integrating AI poorly or too visibly can erode the brand value the sector has meticulously protected for three centuries.",
    "b3.tco.s1.label": "Potential GenAI cost calculation error per Gartner",
    "b3.tco.s1.source": "Gartner · Oct 2024",
    "b3.tco.s2.label": "Of CIOs report break-even or losses on AI investments",
    "b3.tco.s2.source": "Gartner · Oct 2024",
    "b3.tco.s3.label": "Predicted GenAI cost per resolution in customer service by 2030",
    "b3.tco.s3.source": "Gartner · Jan 2026",
    "b3.tco.s4.label": "RLM comparisons where the cheaper model costs more in practice · reversal magnitude up to 28x",
    "b3.tco.s4.source": "Chen et al. · Stanford / UC Berkeley / CMU / MSR · arXiv 2603.23971 · March 2026",
    "b3.tco.takeaway": "<strong>For Swiss watchmaking leaders</strong>, this factor converges with your historical value proposition. The <em>human presence and attention</em> that your customers value are precisely what AI does not do better at comparable cost. <strong>Chen et al. (Stanford / Berkeley / CMU / MSR · arXiv 2603.23971 · March 2026)</strong> bring the academic demonstration of the listed-price gap: 21.8% of reasoning model comparisons show price inversion · up to 28x · listed prices are not a reliable proxy for real usage cost. For luxury, where every customer interaction engages brand capital, selecting a model based solely on listed price is a structural economic error. Tomer (April 2026) formalizes it: humans remain superior on ambiguous, contextual, accountability-intensive work. For Richemont, Swatch Group, or independents, the optimal AI strategy is not the one that automates most, but the one that frees the most human gesture time for differentiating added value. See <a href=\"../methodologie.html#tco\">methodology section 07</a> for the full TCO framework."
