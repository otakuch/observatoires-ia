    "b2.land.p1": "Le marché français de l'emploi cadre traverse en 2026 sa première vraie fracture liée à l'IA. Les chiffres globaux restent stables : volume d'offres APEC en légère hausse, taux d'emploi toujours supérieur à 95% pour les diplômés grandes écoles. Mais sous cette stabilité de surface, la composition change profondément.",
    "b2.land.p2": "Les fonctions à forte intensité de jugement (arbitrage, négociation, lecture politique d'un dossier) tirent les rémunérations vers le haut. Les fonctions à forte intensité de procédure (production de notes, rapports standardisés, suivi de processus formels) voient leur volume reculer ou leur niveau d'expérience requis monter. La repolarisation est mesurable secteur par secteur, fonction par fonction.",

    "b2.land.up.title": "Ce qui se valorise",
    "b2.land.up.li1": "<strong>Direction stratégique et arbitrage.</strong> Comités de direction, ce que l'IA ne peut pas remplacer faute de mandat politique.",
    "b2.land.up.li2": "<strong>Relation client à forte valeur.</strong> Comptes grands groupes, négociation complexe, sales B2B haut de gamme.",
    "b2.land.up.li3": "<strong>Métiers de la conformité augmentée.</strong> Hommes-clés capables d'arbitrer entre cadre légal, technique et opérationnel.",
    "b2.land.up.li4": "<strong>Encadrement et management opérationnel.</strong> Conduire une équipe humaine reste une compétence rare et premium.",

    "b2.land.down.title": "Ce qui se contracte",
    "b2.land.down.li1": "<strong>Production de notes et reporting.</strong> Les premières versions sont désormais générées, l'humain édite. Volume et niveau d'expérience requis évoluent.",
    "b2.land.down.li2": "<strong>Analyses de marché standardisées.</strong> Synthèses concurrentielles, études sectorielles génériques, benchmarks récurrents.",
    "b2.land.down.li3": "<strong>Junior consulting et audit.</strong> L'effet de levier des cabinets sur les profils en début de carrière s'effrite mécaniquement.",
    "b2.land.down.li4": "<strong>Relation client de masse.</strong> Centres d'expertise délestés sur les sujets transactionnels et de premier niveau.",

    "b2.num.eyebrow": "Par les chiffres",
    "b2.num.title": "Trois indicateurs qui résument le moment.",
    "b2.num.s1.label": "des offres d'emploi cadres mentionnent désormais une compétence IA explicite, pour la première fois au-delà du tiers.",
    "b2.num.s1.source": "APEC · Q1 2026",
    "b2.num.s2.label": "de baisse des entrées en poste des diplômés grandes écoles 2024 par rapport à 2022, à structure constante.",
    "b2.num.s2.source": "CGE · Enquête insertion 2025",
    "b2.num.s3.label": "des emplois français présentent une exposition forte à l'IA générative selon la première mesure officielle.",
    "b2.num.s3.source": "DARES · Mars 2026",

    "b2.q.eyebrow": "Le verdict expert",
    "b2.q.text": "Nous ne recrutons plus pour des compétences génériques de cadre. Nous recrutons pour deux choses : la capacité à manier l'IA comme un instrument, et la capacité à arbitrer là où l'IA refuse de le faire. Les profils qui ne couvrent ni l'un ni l'autre sont mécaniquement déclassés.",
    "b2.q.author": "DRH",
    "b2.q.role": "groupe industriel français · entretien anonymisé · février 2026",

    "b2.dec.eyebrow": "Décision · 4 questions à instruire",
    "b2.dec.title": "Ce qu'une <em>direction RH</em> doit traiter d'ici la rentrée 2026.",
    "b2.dec.intro": "Quatre arbitrages opérationnels par ordre de criticité. Aucun ne peut être délégué entièrement aux managers de proximité ni à un cabinet externe. Tous engagent l'organisation sur sa pyramide d'expérience pour cinq à dix ans.",

    "b2.dec.li1": "<strong>Pyramide d'expérience.</strong> Si la production de notes et reporting bascule vers l'IA, le ratio juniors / seniors hérité doit être repensé. Comment former les futurs seniors si on ne recrute plus de juniors. Question stratégique de continuité de compétences.",
    "b2.dec.li2": "<strong>Politique salariale.</strong> Les fonctions à forte valeur de jugement vont continuer à inflation forte. Les fonctions de procédure vont stagner. Comment gérer cet écart sans casser la cohésion interne.",
    "b2.dec.li3": "<strong>Formation continue.</strong> Massification (tous les cadres aux outils IA, base commune) ou ciblage (parcours approfondi pour 20 à 30% des effectifs). Les deux logiques sont défendables, mais incompatibles à budget contraint.",
    "b2.dec.li4": "<strong>Gouvernance des outils IA.</strong> Cadre d'usage, data shared avec quelles plateformes, qui peut décider d'intégrer un nouvel outil dans le poste de travail. Trois rôles à clarifier : DSI, RH, métiers.",

    "b2.roles.eyebrow": "Au niveau des métiers",
    "b2.roles.title": "Ce que la repolarisation signifie pour <em>cinq fonctions cadres</em>.",
    "b2.roles.intro": "La polarisation du marché ne se lit pas dans les statistiques agrégées : elle se lit dans la transformation concrète de chaque fonction. Cinq métiers concentrent l'essentiel de la population cadre concernée par les bascules en cours en France. Pour chacun, ce que l'IA déplace dans le quotidien, et la trajectoire de pivot la plus défendable selon les sources de l'observatoire.",
    "b2.roles.pivotLabel": "Pivot recommandé",
    "b2.roles.footer": "<strong>Total France : 285 000 cadres concernés sur les cinq fonctions ci-dessus</strong>. Les chiffres d'effectifs proviennent de l'APEC et de la DARES (notes T1 2026), les scores d'exposition combinent ILO WP140, Brynjolfsson/Stanford 2025 et Felten-Brynjolfsson. Les 200 métiers cadres et non-cadres analysés sont accessibles dans le <a href=\"../observatoires/france.html\" style=\"color: var(--signal); text-decoration: underline;\">dashboard France</a>.",

    "b2.roles.r1.domain": "Finance et contrôle",
    "b2.roles.r1.name": "Contrôleur de gestion",
    "b2.roles.r1.exp": "7,5/10",
    "b2.roles.r1.expLabel": "exposition",
    "b2.roles.r1.head": "72 000",
    "b2.roles.r1.headLabel": "actifs FR",
    "b2.roles.r1.shift": "Fonction emblématique de la polarisation. Le reporting standard, le calcul d'écarts, la consolidation budgétaire de premier niveau s'automatisent rapidement avec les copilotes BI et les LLMs sur les datasets structurés. La valeur résiduelle se déplace vers l'analyse stratégique, le partenariat business avec les directions opérationnelles, et la maîtrise des nouveaux périmètres extra-financiers (CSRD, taxonomie verte).",
    "b2.roles.r1.pivot": "Business Intelligence architect (datawarehouses, Power BI, dashboards augmentés). Contrôleur RSE et impact (reporting extra-financier, durabilité). Finance partner et DAF adjoint en rôle hybride finance-stratégie.",

    "b2.roles.r2.domain": "Juridique et conformité",
    "b2.roles.r2.name": "Juriste d'entreprise",
    "b2.roles.r2.exp": "7/10",
    "b2.roles.r2.expLabel": "exposition",
    "b2.roles.r2.head": "65 000",
    "b2.roles.r2.headLabel": "actifs FR",
    "b2.roles.r2.shift": "La rédaction de contrats standards, la veille jurisprudentielle, le screening de NDA et la première analyse documentaire bénéficient des LLMs juridiques entraînés sur le droit français. Ce qui résiste : la négociation contractuelle stratégique, la gestion de contentieux complexes, et la nouvelle expertise sur la gouvernance IA elle-même (AI Act, RGPD, responsabilités sur les sorties algorithmiques).",
    "b2.roles.r2.pivot": "Chief Legal Officer IA (pilotage juridique des projets IA, conformité AI Act). Juriste spécialisé RGPD et cybersécurité (DPO externalisé, audit conformité). Contract manager IA-assisté sur portefeuilles contractuels.",

    "b2.roles.r3.domain": "Marketing et croissance",
    "b2.roles.r3.name": "Responsable marketing digital",
    "b2.roles.r3.exp": "8/10",
    "b2.roles.r3.expLabel": "exposition",
    "b2.roles.r3.head": "72 000",
    "b2.roles.r3.headLabel": "actifs FR",
    "b2.roles.r3.shift": "L'une des fonctions les plus exposées du marché cadre. La production de contenus, le ciblage publicitaire, l'optimisation SEA-SEO, la personnalisation à l'échelle deviennent des workflows IA pilotés. Le métier monte en gamme sur l'orchestration des outils, la stratégie de marque qui ne s'automatise pas, et l'arbitrage éditorial entre quantité IA et signal humain.",
    "b2.roles.r3.pivot": "CMO IA-augmenté (orchestration des outils IA, personnalisation à l'échelle). Expert Product-Led Growth (activation produit, virality loops). Consultant brand strategy et positioning, irremplaçable parce que différenciant.",

    "b2.roles.r4.domain": "Conformité et risques",
    "b2.roles.r4.name": "Chargé de conformité",
    "b2.roles.r4.exp": "7/10",
    "b2.roles.r4.expLabel": "exposition",
    "b2.roles.r4.head": "18 000",
    "b2.roles.r4.headLabel": "actifs FR",
    "b2.roles.r4.shift": "Population restreinte mais en très forte tension. La veille réglementaire, le monitoring des transactions, le screening anti-blanchiment de premier niveau s'automatisent. Ce qui explose : le besoin d'auditeurs humains pour les systèmes IA à haut risque que l'AI Act impose explicitement. La fonction se professionnalise sur des spécialisations rares (DORA, IA Act, CSRD).",
    "b2.roles.r4.pivot": "Expert conformité IA Act (auditeur humain pour systèmes IA à haut risque, en très forte demande). Auditeur systèmes IA et risk officer DORA. Responsable conformité RGPD et DPO externalisé PME.",

    "b2.roles.r5.domain": "Direction financière",
    "b2.roles.r5.name": "Directeur financier PME (DAF)",
    "b2.roles.r5.exp": "7/10",
    "b2.roles.r5.expLabel": "exposition",
    "b2.roles.r5.head": "58 000",
    "b2.roles.r5.headLabel": "actifs FR",
    "b2.roles.r5.shift": "La fonction garde sa place stratégique mais sa charge opérationnelle se transforme. Reporting, prévision de trésorerie, dashboards de pilotage passent à des copilotes prédictifs. Ce qui résiste et monte en valeur : les opérations de haut de cycle (LBO, cession, refinancement), la finance d'impact, et le rôle de partenaire stratégique du dirigeant. La fonction devient plus rare et plus chère.",
    "b2.roles.r5.pivot": "CFO IA-augmenté avec pilotage temps réel (forecasting IA, décision augmentée). Expert restructuration et financement d'entreprise sur opérations LBO. Directeur administratif et financier impact (CSRD, reporting ESG, taxonomie verte).",

    "b2.tools.eyebrow": "L'IA comme levier",
    "b2.tools.title": "Six <em>usages</em> qui distinguent les organisations qui avancent.",
    "b2.tools.intro": "Sélection observée dans les déploiements RH de huit grands groupes français interrogés. La maturité ne se voit pas dans la sophistication de l'outil, mais dans la qualité du cadre d'usage et la capacité à former vite.",

    "b2.tools.t1.cat": "Recrutement",
    "b2.tools.t1.name": "Tri d'offres et appariement",
    "b2.tools.t1.desc": "Plusieurs ATS intègrent désormais des modèles d'appariement profil-offre. Vigilance forte sur les biais et la conformité CNIL et AI Act sur les usages à haut risque.",

    "b2.tools.t2.cat": "Évaluation et entretiens",
    "b2.tools.t2.name": "Synthèse d'entretiens",
    "b2.tools.t2.desc": "Transcription audio, structuration des comptes-rendus, comparaison entre candidats. Réduit le temps administratif, ne remplace pas la décision RH.",

    "b2.tools.t3.cat": "Mobilité interne",
    "b2.tools.t3.name": "Cartographie des compétences",
    "b2.tools.t3.desc": "Inférence de compétences détenues à partir des historiques poste, formations et projets. Aide à identifier des viviers internes pour des postes ouverts.",

    "b2.tools.t4.cat": "Formation",
    "b2.tools.t4.name": "Parcours adaptatifs",
    "b2.tools.t4.desc": "Modules personnalisés selon le niveau initial, le poste et les objectifs. ROI mesurable sur la complétion et le transfert d'apprentissage.",

    "b2.tools.t5.cat": "Conformité sociale",
    "b2.tools.t5.name": "Veille réglementaire augmentée",
    "b2.tools.t5.desc": "Suivi automatisé des évolutions du droit du travail, conventions collectives, jurisprudences. Synthèse adaptée à l'organisation.",

    "b2.tools.t6.cat": "Pilotage RH",
    "b2.tools.t6.name": "Tableaux de bord prédictifs",
    "b2.tools.t6.desc": "Analyse du turn-over, prédiction des risques de départ, anticipation des tensions de recrutement. Toujours en complément du jugement managérial.",

    "b2.act.eyebrow": "Aller plus loin",
    "b2.act.title": "Du diagnostic à <em>l'action</em>.",
    "b2.act.lede": "Cette dépêche pose le cadre. Pour passer du constat à la décision, deux passerelles selon votre besoin.",
    "b2.act.c1.tag": "Dispatch sur mesure",
    "b2.act.c1.title": "Une dépêche dédiée à votre groupe",
    "b2.act.c1.desc": "Format Le Dispatch·iA appliqué à votre périmètre RH exact : cartographie des fonctions cadres concernées, exposition IA par poste, scénarios chiffrés sur la pyramide d'expérience à dix ans, benchmark anonymisé de pairs sectoriels, matrice de gouvernance recommandée. Livré sous quinze jours. Devis sur demande.",
    "b2.act.c1.cta": "Demander un devis →",
    "b2.act.c2.tag": "Mise en œuvre opérationnelle",
    "b2.act.c2.title": "De la cartographie à la transformation",
    "b2.act.c2.desc": "Accompagnement de la DRH ou du COMEX : cadrage des plans de formation, design des parcours d'évolution, gouvernance des compétences IA, conduite du changement, dispositifs de mobilité interne. Intervention en demi-journées ou en mission cadrée. Premier échange gratuit.",
    "b2.act.c2.cta": "Échanger sur la mise en œuvre →",

    "b2.src.eyebrow": "Annexe · Sources & traçabilité",
    "b2.src.title": "Les chiffres cités, ouverts à la <em>vérification</em>.",
    "b2.src.intro": "Une dépêche n'a de valeur que si ses chiffres sont vérifiables. Chaque indicateur de cette dépêche renvoie ci-dessous à sa publication d'origine. Sources primaires intégralement citées, sans paywall ni rétention.",
    "b2.src.s1.label": "APEC · Baromètre des intentions de recrutement cadres · Q1 2026",
    "b2.src.s1.cited": "Citée pour le chiffre <strong>38% des offres cadres mentionnent explicitement une compétence IA</strong>. Périmètre national, environ 95 000 offres analysées par mois.",
    "b2.src.s2.label": "CGE · Enquête insertion des diplômés · 2025",
    "b2.src.s2.cited": "Citée pour le chiffre <strong>−14 points sur le taux d'embauche en CDI à 6 mois pour les diplômés tech 2024</strong>, comparé à la promotion 2022. Cohorte de 56 000 diplômés répondants.",
    "b2.src.s3.label": "DARES · Note tension de recrutement · Mars 2026",
    "b2.src.s3.cited": "Citée pour le chiffre <strong>3,2× plus de tension sur les métiers de la donnée</strong> par rapport à la moyenne ROME. Indicateur composite trimestriel.",
    "b2.src.primary": "Source primaire ↗",
    "b2.src.note": "Note. Les chiffres présentés ici sont arrondis. Les méthodologies détaillées de chaque indicateur (Felten-Brynjolfsson pour l'exposition, indice composite France Travail pour la tension) et les marges d'incertitude sont accessibles sur la page Méthodologie.",


    "b2.tco.eyebrow": "Économie des coûts · le facteur ignoré",
    "b2.tco.title": "Le coût réel de l'IA pour les fonctions cadres en France, <em>au-delà du prix par token</em>.",
    "b2.tco.lede": "Les budgets POC d'IA des grandes entreprises françaises reposent souvent sur le prix d'inférence affiché. Mais en production, les coûts d'orchestration, de gouvernance, de supervision et d'évaluation des outputs font basculer l'équation. Pour les fonctions cadres traitées par IA (analyse RH, scoring, synthèse), les coûts cachés sont structurels.",
    "b2.tco.s1.label": "Erreur potentielle de calcul des coûts GenAI selon Gartner si le passage à l'échelle n'est pas anticipé",
    "b2.tco.s1.source": "Gartner · oct 2024",
    "b2.tco.s2.label": "Des CIO indiquent un breakeven ou une perte sur leurs investissements IA en 2024",
    "b2.tco.s2.source": "Gartner · oct 2024",
    "b2.tco.s3.label": "Coût par résolution GenAI prédit dans le service client en 2030, supérieur aux agents offshore",
    "b2.tco.s3.source": "Gartner · janv 2026",
    "b2.tco.takeaway": "<strong>Pour les directions RH et les équipes formation des grandes entreprises françaises</strong>, le risque pratique : les comités exécutifs voient le prix par token publié par OpenAI ou Anthropic et déduisent qu'on peut substituer du juniorat à coût marginal. La réalité Brynjolfsson 2025 (gain +15% concentré sur les juniors) et Becker 2025 (-19% pour les seniors expérimentés sur codebases familières) impose une nuance que le TCO seul ne capture pas : l'IA augmente les juniors et freine les seniors. Avant tout plan de réduction d'effectif sur la base d'un POC IA, le cadre TCO de Tomer (avril 2026) et notre <a href=\"../methodologie.html#tco\">section méthodologique 07</a> sont indispensables.",

    "b2.sov.eyebrow": "Souveraineté numérique · juridiction et résidence des données",
    "b2.sov.title": "Pour les cadres et les DRH français, <em>la souveraineté n'est pas un luxe, c'est un actif</em>.",
    "b2.sov.lede": "Le RGPD, la directive NIS2 et le futur EU AI Act imposent aux organisations françaises une rigueur sur la résidence des données et la traçabilité des décisions automatisées. Pour les fonctions cadres traitées par IA (analyse RH, scoring de candidats, synthèse stratégique, accompagnement de carrière), le choix d'un fournisseur LLM est devenu un acte de conformité.",
    "b2.sov.s1.tag": "France",
    "b2.sov.s1.name": "Mistral AI · La Plateforme + Le Chat Pro",
    "b2.sov.s1.body": "Mistral AI (FR, Paris) traite toutes les requêtes API dans des data centers européens. SOC 2 Type II, alignement EU AI Act, garantie contractuelle de non-utilisation des données client pour l'entraînement. Levée de 830 M$ de dette en mars 2026 auprès de 7 banques européennes pour un data center souverain à Bruyères-le-Châtel (44 MW Q2 2026, 200 MW européens d'ici 2027). Pour une entreprise française qui veut traiter ses données RH ou stratégiques sans risque CLOUD Act, c'est aujourd'hui l'option la plus mature.",
    "b2.sov.s2.tag": "Europe",
    "b2.sov.s2.name": "Aleph Alpha (DE) · PhariaAI · LightOn (FR) · Apertus (CH)",
    "b2.sov.s2.body": "L'écosystème souverain européen 2026 dépasse Mistral. Aleph Alpha (DE) a pivoté vers PhariaAI, un OS souverain pour le secteur public allemand. LightOn (FR) excelle en raisonnement long-contexte sur documents. H Company (FR) pousse les modèles d'usage informatique. Apertus (CH, EPFL/ETH/CSCS) est le premier LLM public fully open conforme à l'EU AI Act. Pour des cas d'usage spécifiques (recherche documentaire massive, conformité publique, transparence totale), ces alternatives sont opérationnelles.",
    "b2.sov.s3.tag": "Risque",
    "b2.sov.s3.name": "Le coût caché de la dépendance aux hyperscalers US",
    "b2.sov.s3.body": "Le CLOUD Act américain peut s'appliquer aux données stockées chez un opérateur US même hébergées en Europe. Pour une grande entreprise française qui traite des données RH sensibles ou des informations stratégiques par IA, le risque réglementaire (RGPD, NIS2, futur AI Act) et le risque de vendor lock-in deviennent des composantes du TCO réel. 90% des CIO interrogés par Gartner indiquent que la gestion des coûts limite la valeur tirée de l'IA : ajouter le coût d'une violation de conformité change l'arbitrage.",
    "b2.sov.takeaway": "<strong>Pour les comités exécutifs et les DRH français</strong>, la grille de décision intègre désormais quatre dimensions : capacité technique, TCO réel à 36 mois, juridiction de la donnée, et risque de lock-in. La question n'est plus seulement « combien coûte le token » mais « combien coûte le ticket de sortie en cas de pivot réglementaire ». Pour les fonctions cadres et la formation continue, l'option Mistral + Apertus offre une couverture sovereign-first qui mérite d'être évaluée dès la phase de POC, pas après.",
    "b2.disc.tag": "Disclosure",
    "b2.disc.body": "Ce dossier a été produit avec l'assistance d'une intelligence artificielle (Claude Opus 4.7, en modes Research et Web Search), puis soumis à une vérification factuelle contre les sources primaires. L'IA a servi d'outil de documentation, de synthèse et de mise en forme visuelle, pas de source autonome ni d'autorité scientifique. Détail méthodologique en <a href=\"../methodologie.html\">section 09 de la page Méthodologie</a>.",

    "b2.back": "Toutes les dépêches"
  },
  en: {
    "b2.meta.num": "The Dispatch·iA #002",
    "b2.meta.sector": "HR & Executive market",
    "b2.meta.country": "🇫🇷 France",
    "b2.meta.date": "Q2 2026",
    "b2.meta.edition": "Open Intelligence",

    "b2.title": "French executives facing AI: the decade of <em>repolarisation</em>.",
    "b2.sub": "The French executive market is not collapsing. It is polarising. Strategic functions that rely on judgement and arbitration are gaining value. Those that formalised processes are contracting. Here is the cartography HR leaders need.",
    "b2.by.author": "Naully Nicolas",
    "b2.by.read": "8 minute read",
    "b2.by.sources": "14 primary sources",

    "b2.land.eyebrow": "The landscape",
    "b2.land.title": "How the executive market is being redrawn in 2026.",
    "b2.land.p1": "The French executive market is going through its first real AI-related fracture in 2026. Aggregate figures remain stable: APEC posting volume slightly up, employment rate still above 95% for grandes écoles graduates. But beneath this surface stability, the composition is changing deeply.",
    "b2.land.p2": "Functions with high judgement intensity (arbitration, negotiation, political reading of a file) are pulling compensation upward. Functions with high procedural intensity (note production, standardised reports, formal process tracking) are seeing their volume decline or their experience requirements rise. The repolarisation is measurable sector by sector, function by function.",

    "b2.land.up.title": "What gains value",
    "b2.land.up.li1": "<strong>Strategic leadership and arbitration.</strong> Executive committees, what AI cannot replace for lack of political mandate.",
    "b2.land.up.li2": "<strong>High-value client relationships.</strong> Major group accounts, complex negotiation, premium B2B sales.",
    "b2.land.up.li3": "<strong>Augmented compliance roles.</strong> Key people able to arbitrate between legal, technical and operational frameworks.",
    "b2.land.up.li4": "<strong>Operational management.</strong> Leading a human team remains a rare and premium skill.",

    "b2.land.down.title": "What is contracting",
    "b2.land.down.li1": "<strong>Note and report production.</strong> First drafts are now generated, humans edit. Both volume and required experience level shift.",
    "b2.land.down.li2": "<strong>Standardised market analysis.</strong> Competitive synthesis, generic sector studies, recurring benchmarks.",
    "b2.land.down.li3": "<strong>Junior consulting and audit.</strong> Firms' leverage on early-career profiles is mechanically eroding.",
    "b2.land.down.li4": "<strong>Mass client relationships.</strong> Expertise centres offloaded on transactional and first-level matters.",

    "b2.num.eyebrow": "By the numbers",
    "b2.num.title": "Three indicators that capture the moment.",
    "b2.num.s1.label": "of executive job postings now mention an explicit AI skill, crossing the one-third threshold for the first time.",
    "b2.num.s1.source": "APEC · Q1 2026",
    "b2.num.s2.label": "drop in job entries for 2024 grandes écoles graduates compared to 2022, at constant structure.",
    "b2.num.s2.source": "CGE · 2025 insertion survey",
    "b2.num.s3.label": "of French jobs show high exposure to generative AI according to the first official measure.",
    "b2.num.s3.source": "DARES · March 2026",

    "b2.q.eyebrow": "The expert verdict",
    "b2.q.text": "We no longer recruit for generic executive skills. We recruit for two things: the ability to wield AI as an instrument, and the ability to arbitrate where AI declines to. Profiles covering neither are mechanically downgraded.",
    "b2.q.author": "Chief HR Officer",
    "b2.q.role": "French industrial group · anonymised interview · February 2026",

    "b2.dec.eyebrow": "Decision · 4 questions to settle",
    "b2.dec.title": "What an <em>HR leadership team</em> must address by autumn 2026.",
    "b2.dec.intro": "Four operational trade-offs in order of criticality. None can be fully delegated to line managers or to an external consultancy. All commit the organisation's experience pyramid for five to ten years.",

    "b2.dec.li1": "<strong>Experience pyramid.</strong> If note production and reporting shift to AI, the inherited junior / senior ratio must be rethought. How do we train tomorrow's seniors if we no longer recruit juniors. Strategic skill continuity question.",
    "b2.dec.li2": "<strong>Compensation policy.</strong> Functions with high judgement value will keep inflating. Procedural functions will stagnate. How to manage this gap without breaking internal cohesion.",
    "b2.dec.li3": "<strong>Continuous training.</strong> Mass approach (all executives on AI tools, common base) or targeted (deep-dive path for 20 to 30% of staff). Both are defensible, but incompatible under budget constraints.",
    "b2.dec.li4": "<strong>AI tool governance.</strong> Usage framework, data shared with which platforms, who can decide to integrate a new tool into the workplace. Three roles to clarify: IT, HR, business.",

    "b2.roles.eyebrow": "At the role level",
    "b2.roles.title": "What repolarisation means for <em>five executive functions</em>.",
    "b2.roles.intro": "Market polarisation does not show in aggregate statistics: it shows in the concrete transformation of each function. Five occupations concentrate the bulk of the executive population affected by ongoing shifts in France. For each, what AI displaces in daily work, and the most defensible pivot path according to the observatory's sources.",
    "b2.roles.pivotLabel": "Recommended pivot",
    "b2.roles.footer": "<strong>France total: 285,000 executives affected across the five functions above</strong>. Headcount figures come from APEC and DARES (Q1 2026 notes); exposure scores combine ILO WP140, Brynjolfsson/Stanford 2025 and Felten-Brynjolfsson. The 200 executive and non-executive occupations analysed are accessible in the <a href=\"../observatoires/france.html\" style=\"color: var(--signal); text-decoration: underline;\">France dashboard</a>.",

    "b2.roles.r1.domain": "Finance and control",
    "b2.roles.r1.name": "Management controller",
    "b2.roles.r1.exp": "7.5/10",
    "b2.roles.r1.expLabel": "exposure",
    "b2.roles.r1.head": "72,000",
    "b2.roles.r1.headLabel": "active FR",
    "b2.roles.r1.shift": "Emblematic function of polarisation. Standard reporting, variance calculation and first-tier budget consolidation automate quickly with BI copilots and LLMs on structured datasets. Residual value moves toward strategic analysis, business partnership with operational departments, and mastery of new extra-financial perimeters (CSRD, green taxonomy).",
    "b2.roles.r1.pivot": "Business Intelligence architect (data warehouses, Power BI, augmented dashboards). CSR and impact controller (extra-financial reporting, sustainability). Finance partner and deputy CFO in hybrid finance-strategy role.",

    "b2.roles.r2.domain": "Legal and compliance",
    "b2.roles.r2.name": "Corporate counsel",
    "b2.roles.r2.exp": "7/10",
    "b2.roles.r2.expLabel": "exposure",
    "b2.roles.r2.head": "65,000",
    "b2.roles.r2.headLabel": "active FR",
    "b2.roles.r2.shift": "Standard contract drafting, case-law monitoring, NDA screening and first-pass document analysis benefit from legal LLMs trained on French law. What resists: strategic contract negotiation, complex litigation management, and the new expertise on AI governance itself (AI Act, GDPR, liability for algorithmic outputs).",
    "b2.roles.r2.pivot": "Chief Legal Officer for AI (legal steering of AI projects, AI Act compliance). GDPR and cybersecurity legal specialist (outsourced DPO, compliance audits). AI-assisted contract manager on contractual portfolios.",

    "b2.roles.r3.domain": "Marketing and growth",
    "b2.roles.r3.name": "Digital marketing lead",
    "b2.roles.r3.exp": "8/10",
    "b2.roles.r3.expLabel": "exposure",
    "b2.roles.r3.head": "72,000",
    "b2.roles.r3.headLabel": "active FR",
    "b2.roles.r3.shift": "One of the most exposed executive functions on the market. Content production, ad targeting, SEA-SEO optimisation, scaled personalisation become AI-piloted workflows. The role moves up to tool orchestration, brand strategy that does not automate, and editorial arbitration between AI volume and human signal.",
    "b2.roles.r3.pivot": "AI-augmented CMO (AI tool orchestration, personalisation at scale). Product-Led Growth expert (product activation, virality loops). Brand strategy and positioning consultant, irreplaceable because differentiating.",

    "b2.roles.r4.domain": "Compliance and risk",
    "b2.roles.r4.name": "Compliance officer",
    "b2.roles.r4.exp": "7/10",
    "b2.roles.r4.expLabel": "exposure",
    "b2.roles.r4.head": "18,000",
    "b2.roles.r4.headLabel": "active FR",
    "b2.roles.r4.shift": "Restricted population but in very strong tension. Regulatory monitoring, transaction monitoring, first-tier anti-money-laundering screening automate. What explodes: the need for human auditors for high-risk AI systems that the AI Act explicitly mandates. The function professionalises around rare specialisations (DORA, AI Act, CSRD).",
    "b2.roles.r4.pivot": "AI Act compliance expert (human auditor for high-risk AI systems, very strong demand). AI systems auditor and DORA risk officer. GDPR compliance lead and outsourced DPO for SMEs.",

    "b2.roles.r5.domain": "Financial direction",
    "b2.roles.r5.name": "SME CFO",
    "b2.roles.r5.exp": "7/10",
    "b2.roles.r5.expLabel": "exposure",
    "b2.roles.r5.head": "58,000",
    "b2.roles.r5.headLabel": "active FR",
    "b2.roles.r5.shift": "The function keeps its strategic place but its operational load transforms. Reporting, cash forecasting, steering dashboards move to predictive copilots. What resists and gains value: top-cycle operations (LBO, divestiture, refinancing), impact finance, and the strategic partnership role with the executive. The function becomes rarer and more expensive.",
    "b2.roles.r5.pivot": "AI-augmented CFO with real-time steering (AI forecasting, augmented decision). Restructuring and corporate finance expert on LBO operations. Impact CFO (CSRD, ESG reporting, green taxonomy).",

    "b2.tools.eyebrow": "AI as leverage",
    "b2.tools.title": "Six <em>uses</em> that set apart the organisations moving forward.",
    "b2.tools.intro": "Selection observed in HR deployments at eight major French groups interviewed. Maturity does not show in tool sophistication but in the quality of the usage framework and the speed of training.",

    "b2.tools.t1.cat": "Recruitment",
    "b2.tools.t1.name": "Posting screening and matching",
    "b2.tools.t1.desc": "Several ATS now integrate profile-posting matching models. Strong vigilance on biases and CNIL and AI Act compliance for high-risk uses.",

    "b2.tools.t2.cat": "Evaluation and interviews",
    "b2.tools.t2.name": "Interview synthesis",
    "b2.tools.t2.desc": "Audio transcription, structured minutes, candidate comparison. Reduces administrative time, does not replace the HR decision.",

    "b2.tools.t3.cat": "Internal mobility",
    "b2.tools.t3.name": "Skills mapping",
    "b2.tools.t3.desc": "Inference of held skills from job, training and project histories. Helps identify internal pools for open positions.",

    "b2.tools.t4.cat": "Training",
    "b2.tools.t4.name": "Adaptive learning paths",
    "b2.tools.t4.desc": "Personalised modules based on initial level, position and goals. Measurable ROI on completion and learning transfer.",

    "b2.tools.t5.cat": "Social compliance",
    "b2.tools.t5.name": "Augmented regulatory monitoring",
    "b2.tools.t5.desc": "Automated tracking of labour law evolution, collective agreements, case law. Synthesis adapted to the organisation.",

    "b2.tools.t6.cat": "HR steering",
    "b2.tools.t6.name": "Predictive dashboards",
    "b2.tools.t6.desc": "Turnover analysis, departure risk prediction, anticipation of recruitment tensions. Always in complement to managerial judgement.",

    "b2.act.eyebrow": "Going further",

    "b2.sov.eyebrow": "Digital sovereignty · jurisdiction and data residency",
    "b2.sov.title": "For French executives and HR leaders, <em>sovereignty is not a luxury, it is an asset</em>.",
    "b2.sov.lede": "GDPR, the NIS2 directive, and the upcoming EU AI Act impose on French organizations rigorous standards on data residency and traceability of automated decisions. For executive functions handled by AI (HR analysis, candidate scoring, strategic synthesis, career coaching), choosing an LLM vendor has become a compliance act.",
    "b2.sov.s1.tag": "France",
    "b2.sov.s1.name": "Mistral AI · La Plateforme + Le Chat Pro",
    "b2.sov.s1.body": "Mistral AI (FR, Paris) processes all API requests in European data centers. SOC 2 Type II, EU AI Act alignment, contractual guarantee of non-use of customer data for training. $830M debt raise in March 2026 from 7 European banks for a sovereign data center at Bruyères-le-Châtel (44 MW Q2 2026, 200 MW European by 2027). For a French company processing HR or strategic data without CLOUD Act risk, this is today's most mature option.",
    "b2.sov.s2.tag": "Europe",
    "b2.sov.s2.name": "Aleph Alpha (DE) · PhariaAI · LightOn (FR) · Apertus (CH)",
    "b2.sov.s2.body": "The European sovereign ecosystem 2026 extends beyond Mistral. Aleph Alpha (DE) pivoted to PhariaAI, a sovereign OS for the German public sector. LightOn (FR) excels in long-context document reasoning. H Company (FR) pushes computer-use models. Apertus (CH, EPFL/ETH/CSCS) is the first public fully open LLM compliant with the EU AI Act. For specific use cases (massive document search, public sector compliance, full transparency), these alternatives are operational.",
    "b2.sov.s3.tag": "Risk",
    "b2.sov.s3.name": "The hidden cost of US hyperscaler dependence",
    "b2.sov.s3.body": "The US CLOUD Act can apply to data stored with a US operator even hosted in Europe. For a large French company processing sensitive HR data or strategic information via AI, regulatory risk (GDPR, NIS2, upcoming AI Act) and vendor lock-in become components of real TCO. 90% of CIOs surveyed by Gartner say cost management limits the value extracted from AI: adding the cost of a compliance violation changes the trade-off.",
    "b2.sov.takeaway": "<strong>For French executive committees and HR leaders</strong>, the decision grid now integrates four dimensions: technical capability, real 36-month TCO, data jurisdiction, and lock-in risk. The question is no longer just « how much does the token cost » but « how much does the exit ticket cost in case of a regulatory pivot ». For executive functions and continuing education, the Mistral + Apertus option offers sovereign-first coverage worth evaluating from the POC stage, not later.",
    "b2.disc.tag": "Disclosure",
    "b2.disc.body": "This dossier was produced with the assistance of artificial intelligence (Claude Opus 4.7, in Research and Web Search modes), then submitted to factual verification against primary sources. The AI was used as a tool for documentation, synthesis and visual formatting, not as an autonomous source or scientific authority. Methodological details in <a href=\"../methodologie.html\">section 09 of the Methodology page</a>.",

    "b2.back": "All dispatches",

    /* TCO section · cost economics */
    "b2.tco.eyebrow": "Cost economics · the ignored factor",
    "b2.tco.title": "For French executives, <em>total cost determines the employment trajectory</em>.",
    "b2.tco.lede": "Coface has estimated French executives' employment exposure at 16.3% for the Special Agent phase. But this estimate assumes AI's economic viability in production. Yet total cost of ownership diverges significantly from the advertised inference price, and it is this cost that determines whether a function is actually automated or simply better assisted.",
    "b2.tco.s1.label": "Potential GenAI cost calculation error if CIOs don't master scaling",
    "b2.tco.s1.source": "Gartner · Oct 2024",
    "b2.tco.s2.label": "Of French CIOs say cost management limits their ability to extract AI value",
    "b2.tco.s2.source": "Gartner · Oct 2024",
    "b2.tco.s3.label": "Predicted GenAI cost per resolution for 2030, above B2C offshore agents",
    "b2.tco.s3.source": "Gartner · Jan 2026",
    "b2.tco.takeaway": "<strong>For French executives</strong>, this factor reshapes the reading of Coface figures. High-TCO functions (compliance, expert advisory, negotiation) will see more augmentation than replacement, because total AI cost remains above total human cost. Low-TCO functions (data entry, standardized content generation, first-line support) will see faster substitution. <em>Tomer (April 2026)</em> formalizes: AI is better on narrow, high-volume, moderate-risk tasks; humans remain superior on ambiguous, accountable, contextual work. See <a href=\"../methodologie.html#tco\">methodology section 07</a> for the full framework."
