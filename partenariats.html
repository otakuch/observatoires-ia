<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partenariats · observatoire[s]·ia</title>
<meta name="description" content="Rapports sectoriels personnalisés pour associations, fédérations, institutions publiques et écoles. Veille IA et emploi sur mesure, sous licence ouverte.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2EEE5;
  --paper-2: #ECE7DC;
  --ink: #11110F;
  --ink-2: #2A2A26;
  --muted: #8B8579;
  --rule: #D9D2C2;
  --signal: #D03C2F;
  --teal: #1F3A3D;
  --highlight: #F7E27D;
  --max-w: 1280px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: "Instrument Sans", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  background-image: radial-gradient(circle at 1px 1px, rgba(17,17,15,0.04) 1px, transparent 0);
  background-size: 22px 22px;
}
::selection { background: var(--signal); color: var(--paper); }
a { color: inherit; text-decoration: none; }
.mono { font-family: "JetBrains Mono", monospace; font-size: 0.78em; letter-spacing: 0.02em; }
.serif { font-family: "Fraunces", serif; font-variation-settings: "opsz" 96, "SOFT" 50; }

/* ───────── NAV ───────── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(242, 238, 229, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
}
.nav-inner {
  max-width: var(--max-w); margin: 0 auto;
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.logo {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 24, "SOFT" 0;
  font-weight: 500; font-size: 19px;
  letter-spacing: -0.01em; color: var(--ink); white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: opacity 0.15s ease;
}
.logo:hover { opacity: 0.7; }
.logo:hover .bracket { color: var(--signal); }
.logo .bracket { color: var(--signal); font-weight: 600; transition: color 0.15s ease; }
.logo .dot { color: var(--muted); margin: 0 0.15em; }

.nav-links {
  display: flex; gap: 22px; align-items: center;
  font-size: 13.5px; font-weight: 500;
}
.nav-links a {
  color: var(--ink-2); position: relative; padding: 4px 0;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.current { color: var(--signal); }
.nav-links a.current::after {
  content: ""; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1.5px; background: var(--signal);
}

.nav-actions { display: flex; gap: 14px; align-items: center; }
.lang-toggle {
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  background: transparent; border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 14px; cursor: pointer;
  display: flex; gap: 8px; color: var(--ink);
  transition: border-color 0.2s;
}
.lang-toggle:hover { border-color: var(--ink); }
.lang-toggle span.active { color: var(--signal); font-weight: 500; }
.lang-toggle span:not(.active) { color: var(--muted); }

.menu-btn {
  display: none; background: transparent;
  border: 1px solid var(--rule);
  width: 38px; height: 38px; border-radius: 8px;
  cursor: pointer; align-items: center; justify-content: center;
}
.menu-btn span { display: block; width: 16px; height: 1.5px; background: var(--ink); position: relative; }
.menu-btn span::before, .menu-btn span::after {
  content: ""; position: absolute; left: 0; width: 16px; height: 1.5px; background: var(--ink);
}
.menu-btn span::before { top: -5px; }
.menu-btn span::after { top: 5px; }

.mobile-menu {
  display: none; position: fixed; inset: 0;
  background: var(--paper); z-index: 100;
  padding: 80px 32px 32px;
  flex-direction: column; gap: 28px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-family: "Fraunces", serif; font-size: 32px; font-weight: 400; color: var(--ink);
}
.mobile-menu .close-btn {
  position: absolute; top: 18px; right: 18px;
  background: transparent; border: 1px solid var(--rule);
  width: 38px; height: 38px; border-radius: 8px;
  cursor: pointer; font-size: 20px; color: var(--ink);
}

/* ───────── HERO ───────── */
.hero {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px 60px; position: relative;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 28px;
}
.hero-eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--signal); }

.hero-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(44px, 7vw, 96px);
  line-height: 0.96; letter-spacing: -0.025em;
  margin-bottom: 28px; max-width: 980px;
}
.hero-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.hero-title .accent-bracket { color: var(--signal); font-weight: 500; }

.hero-pitch {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 28, "SOFT" 0;
  font-style: italic;
  font-size: clamp(18px, 1.5vw, 22px);
  line-height: 1.4;
  max-width: 720px;
  color: var(--ink);
  margin: 0 0 28px 0;
  letter-spacing: -0.01em;
}

.hero-lede {
  font-size: clamp(17px, 1.6vw, 21px); line-height: 1.5;
  max-width: 640px; color: var(--ink-2); margin-bottom: 40px;
}

.btn {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 16px 28px; border-radius: 999px;
  font-weight: 500; font-size: 15px;
  transition: background 0.2s, transform 0.2s, color 0.2s, border-color 0.2s;
  cursor: pointer; font-family: inherit; border: none;
}
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--signal); transform: translateY(-1px); }
.btn-secondary {
  background: transparent; border: 1px solid var(--ink); color: var(--ink);
}
.btn-secondary:hover { background: var(--ink); color: var(--paper); }
.btn .arrow { transition: transform 0.2s; }
.btn:hover .arrow { transform: translateX(4px); }

.cta-row { display: flex; gap: 14px; flex-wrap: wrap; }

/* ───────── COUNTRY TEASERS (Home) ───────── */
.country-teasers {
  max-width: var(--max-w); margin: 60px auto;
  padding: 0 32px;
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px;
}
.country-card {
  border: 1px solid var(--rule);
  background: var(--paper);
  padding: 40px;
  display: flex; flex-direction: column; gap: 20px;
  transition: background 0.2s, border-color 0.2s;
  position: relative; overflow: hidden;
  cursor: pointer;
}
.country-card:hover { background: var(--paper-2); border-color: var(--ink); }
.country-card-flag {
  font-size: 32px;
  display: flex; align-items: center; gap: 14px;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted);
}
.country-card-flag .emoji { font-size: 28px; }
.country-card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(36px, 4.5vw, 56px);
  line-height: 1; letter-spacing: -0.02em;
}
.country-card-num {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink-2);
  display: flex; gap: 18px; flex-wrap: wrap;
}
.country-card-num strong {
  font-family: "Fraunces", serif;
  font-size: 28px; font-weight: 500; color: var(--signal);
  margin-right: 4px;
}
.country-card-cta {
  margin-top: auto;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px;
  transition: gap 0.2s, color 0.2s;
}
.country-card:hover .country-card-cta { gap: 14px; color: var(--signal); }

/* ───────── STATS ───────── */
.stats {
  max-width: var(--max-w); margin: 40px auto 0;
  padding: 0 32px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat {
  padding: 36px 24px;
  border-right: 1px solid var(--rule);
  position: relative;
}
.stat:last-child { border-right: none; }
.stat-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-weight: 500;
  font-size: clamp(48px, 6vw, 76px);
  line-height: 1; letter-spacing: -0.03em;
  display: flex; align-items: baseline; gap: 6px;
}
.stat-num .unit { font-size: 0.45em; color: var(--signal); font-weight: 400; }
.stat-num .sign { color: var(--signal); font-size: 0.6em; }
.stat-label {
  margin-top: 14px; font-size: 14px; line-height: 1.4; max-width: 280px;
}
.stat-source {
  margin-top: 14px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* ───────── MANIFESTO ───────── */
.manifesto {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
  display: grid; grid-template-columns: 200px 1fr; gap: 60px;
}
.manifesto-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
  padding-top: 8px;
}
.manifesto-text {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 60;
  font-weight: 300;
  font-size: clamp(22px, 2.6vw, 32px);
  line-height: 1.35; letter-spacing: -0.01em;
  max-width: 880px;
}
.manifesto-text p { margin-bottom: 0.6em; }
.manifesto-text p:last-child { margin-bottom: 0; }
.manifesto-text strong {
  font-weight: 500;
  background: linear-gradient(180deg, transparent 60%, var(--highlight) 60%);
  padding: 0 2px;
}

/* ───────── SECTION HEADS ───────── */
.section-head {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px 32px;
  border-top: 1px solid var(--rule);
}
.section-head.no-border { border-top: none; padding-top: 60px; }
.section-eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--signal);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 12px;
}
.section-eyebrow::before {
  content: "§"; font-family: "Fraunces", serif;
  font-size: 18px; color: var(--ink);
}
.section-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(34px, 5vw, 58px);
  line-height: 1; letter-spacing: -0.02em;
  margin-bottom: 24px;
}
.section-sub {
  font-size: 17px; color: var(--ink-2);
  max-width: 640px; line-height: 1.5;
}

/* ───────── FILTERS ───────── */
.filters {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 32px;
  display: flex; gap: 32px; flex-wrap: wrap; align-items: center;
}
.filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.filter-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-right: 8px;
}
.chip {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; border: 1px solid var(--rule);
  background: transparent; padding: 7px 13px;
  border-radius: 999px; cursor: pointer;
  color: var(--ink-2); transition: all 0.18s;
}
.chip:hover { border-color: var(--ink); }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ───────── CARDS GRID ───────── */
.cards-grid {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 100px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
  border-top: 1px solid var(--rule);
  border-left: 1px solid var(--rule);
}
.card {
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 32px 28px 28px; background: var(--paper);
  position: relative;
  display: flex; flex-direction: column; gap: 14px;
  min-height: 280px;
  transition: background 0.2s; cursor: pointer;
}
.card:hover { background: var(--paper-2); }
.card-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.flag { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.flag-dot { width: 8px; height: 8px; border-radius: 50%; }
.flag-ch .flag-dot { background: var(--signal); }
.flag-fr .flag-dot { background: var(--teal); }
.card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500; font-size: 24px;
  line-height: 1.1; letter-spacing: -0.01em;
}
.card-org { font-size: 13px; color: var(--muted); font-style: italic; }
.card-desc { font-size: 14px; line-height: 1.5; color: var(--ink-2); flex: 1; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.card-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  background: var(--paper-2); padding: 4px 8px;
  border-radius: 4px; color: var(--ink-2);
}
.card-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 8px; padding-top: 14px;
  border-top: 1px dashed var(--rule);
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.card-footer .visit { color: var(--signal); }
.card-empty-state {
  grid-column: 1 / -1;
  padding: 80px 32px; text-align: center;
  font-family: "Fraunces", serif; font-style: italic;
  color: var(--muted);
}

/* ───────── KPI ROW (country dashboards) ───────── */
.kpi-row {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 60px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.kpi {
  background: var(--paper);
  padding: 32px 28px;
  display: flex; flex-direction: column; gap: 10px;
}
.kpi-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
}
.kpi-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-weight: 500;
  font-size: clamp(40px, 5vw, 60px);
  line-height: 1; letter-spacing: -0.02em;
  display: flex; align-items: baseline; gap: 6px;
}
.kpi-num .unit { font-size: 0.45em; color: var(--signal); font-weight: 400; }
.kpi-num .sign { color: var(--signal); font-size: 0.6em; }
.kpi-label { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.kpi-source {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-top: auto;
}

/* ───────── CONTEXT BLOCK (institutional context on country pages) ───────── */
.context-block {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 70px 32px 90px;
  border-top: 1px solid var(--rule);
}
.context-grid {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 60px;
}
.context-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding-top: 8px;
}
.context-content h3 {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(30px, 3.6vw, 44px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 30px;
}
.context-content h3 em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.context-content p {
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink-2);
  max-width: 760px;
  margin-bottom: 18px;
}
.context-content p:last-of-type {
  margin-bottom: 0;
}
.context-key-facts {
  margin-top: 40px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  max-width: 760px;
}
.kf-item {
  background: var(--paper);
  padding: 22px 22px;
}
.kf-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 20;
  font-size: 28px;
  font-weight: 500;
  color: var(--signal);
  line-height: 1;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}
.kf-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  line-height: 1.4;
}

/* CTA row inside dash-header */
.dash-cta-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 32px;
}
.dash-header {
  max-width: var(--max-w); margin: 0 auto;
  padding: 70px 32px 30px;
}
.dash-flag {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 12px;
}
.dash-flag .emoji { font-size: 28px; }
.dash-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(48px, 7vw, 84px);
  line-height: 0.95; letter-spacing: -0.025em;
  margin-bottom: 24px;
}
.dash-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.dash-lede {
  font-size: clamp(17px, 1.5vw, 19px);
  max-width: 720px; color: var(--ink-2);
}

/* ───────── CHART (mini sparkline / bar) ───────── */
.chart-block {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 80px;
}
.bar-chart { display: flex; flex-direction: column; gap: 14px; }
.bar-row {
  display: grid;
  grid-template-columns: 200px 1fr 60px;
  align-items: center; gap: 16px;
  font-size: 14px;
}
.bar-track {
  height: 28px; background: var(--paper-2);
  position: relative; overflow: hidden;
  border: 1px solid var(--rule);
}
.bar-fill {
  height: 100%; background: var(--ink);
  position: relative;
  transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.bar-fill.signal { background: var(--signal); }
.bar-fill.teal { background: var(--teal); }
.bar-value {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink); text-align: right;
}

/* ───────── COMPARISON TABLE ───────── */
.compare-table-wrap {
  max-width: var(--max-w); margin: 0 auto;
  padding: 0 32px 100px;
  overflow-x: auto;
}
table.compare {
  width: 100%; border-collapse: collapse;
  font-size: 14px; min-width: 720px;
  border: 1px solid var(--rule);
}
table.compare th {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); text-align: left;
  padding: 16px 20px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--rule);
  font-weight: 500;
}
table.compare th.country-ch { color: var(--signal); }
table.compare th.country-fr { color: var(--teal); }
table.compare td {
  padding: 18px 20px;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
}
table.compare tr:last-child td { border-bottom: none; }
table.compare td.dim {
  font-family: "Fraunces", serif;
  font-size: 16px; font-weight: 500;
}
table.compare td.gap {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--signal); font-weight: 500;
}

/* ───────── SYNTHESE (dark) ───────── */
.synthese {
  background: var(--ink); color: var(--paper);
  padding: 100px 0;
}
.synthese-inner { max-width: var(--max-w); margin: 0 auto; padding: 0 32px; }
.synthese .section-eyebrow { color: var(--signal); }
.synthese .section-eyebrow::before { color: var(--paper); }
.synthese .section-title { color: var(--paper); }
.synthese .section-sub { color: rgba(242, 238, 229, 0.7); }
.table-wrap {
  margin-top: 48px; overflow-x: auto;
  border: 1px solid rgba(242, 238, 229, 0.15);
}
table.synth {
  width: 100%; border-collapse: collapse;
  font-size: 14px; min-width: 720px;
}
table.synth th {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--signal); text-align: left;
  padding: 16px 20px;
  background: rgba(242, 238, 229, 0.03);
  border-bottom: 1px solid rgba(242, 238, 229, 0.15);
  font-weight: 500;
}
table.synth td {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(242, 238, 229, 0.08);
  vertical-align: top;
}
table.synth tr:hover td { background: rgba(242, 238, 229, 0.03); }
table.synth td.name {
  font-family: "Fraunces", serif;
  font-size: 16px; font-weight: 500;
}
table.synth td .pill {
  display: inline-block;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; padding: 3px 8px;
  border-radius: 3px;
  background: rgba(242, 238, 229, 0.1);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* ───────── FIELD REPORT ───────── */
.field-report {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
}
.field-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 32px; margin-top: 48px;
}
.field-card {
  border-top: 2px solid var(--ink);
  padding-top: 24px;
  display: flex; flex-direction: column; gap: 12px;
  cursor: pointer; transition: opacity 0.2s;
}
.field-card:hover { opacity: 0.75; }
.field-card-meta {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  display: flex; justify-content: space-between;
}
.field-card-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 40;
  font-weight: 400; font-size: 26px;
  line-height: 1.15; letter-spacing: -0.01em;
}
.field-card-excerpt { font-size: 15px; line-height: 1.5; color: var(--ink-2); }
.field-card-link {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--signal); margin-top: 8px;
}

/* ───────── ABOUT ───────── */
.about {
  max-width: var(--max-w); margin: 0 auto;
  padding: 100px 32px;
  border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr 1fr; gap: 80px;
}
.about-text {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 60;
  font-weight: 300;
  font-size: clamp(20px, 2.2vw, 28px);
  line-height: 1.4; letter-spacing: -0.01em;
}
.about-text .accent-bracket { color: var(--signal); font-weight: 500; }
.about-actions {
  display: flex; flex-direction: column;
  gap: 14px; align-items: flex-start; padding-top: 12px;
}

/* ───────── CROSS LINK (bottom of country page) ───────── */
.cross-link {
  max-width: var(--max-w); margin: 0 auto;
  padding: 80px 32px;
  border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 32px;
}
.cross-link h3 {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(28px, 3.5vw, 42px);
  line-height: 1.1; letter-spacing: -0.02em;
}
.cross-link h3 em {
  font-style: italic;
  font-variation-settings: "opsz" 60, "SOFT" 100;
  color: var(--signal);
}

/* ───────── BRIEF·iA · LIGHT (magazine-inspired) ───────── */
.brief-hero {

}
.brief-hero-meta {

  font-size: 11px;

  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 24px;
}
.brief-hero-meta .meta-num {
  color: var(--signal);
  font-weight: 500;
}
.brief-hero-meta .meta-edition {
  color: var(--ink);
  border: 1px solid var(--rule);
  padding: 3px 10px;
  border-radius: 999px;
}
.brief-hero-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 30;

  letter-spacing: -0.025em;
  margin-bottom: 24px;

}
.brief-hero-title em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  color: var(--signal);
}
.brief-hero-sub {
  font-size: clamp(18px, 2vw, 24px);
  line-height: 1.4;
  color: var(--ink-2);

  font-weight: 300;
}
.brief-byline {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;

  text-transform: uppercase;

.brief-section {

}
.brief-section-eyebrow {

  font-size: 12px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 16px;
}
.brief-section-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 40;
  font-weight: 400;
  font-size: clamp(30px, 4.5vw, 52px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 28px;
  max-width: 800px;
}
.brief-section-title em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.brief-section p {
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink-2);

  margin-bottom: 18px;
}

.brief-twocol {

}
.brief-twocol-block h4 {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  text-transform: uppercase;

  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule);
}
.brief-twocol-block ul { list-style: none; padding: 0; }
.brief-twocol-block li {
  font-size: 15px;
  line-height: 1.5;

  padding: 10px 0;
  border-bottom: 1px dashed var(--rule);
}

.brief-twocol-block li strong {
  color: var(--ink);

  margin-bottom: 2px;
}
.brief-numbers-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);

  margin-top: 32px;
}
.brief-stat {
  background: var(--paper);
  padding: 36px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.brief-stat-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-size: clamp(60px, 8vw, 96px);
  line-height: 0.95;
  letter-spacing: -0.03em;
  color: var(--ink);
  font-weight: 500;
}
.brief-stat-num .unit {
  font-size: 0.4em;
  color: var(--signal);
  vertical-align: super;
  margin-left: 2px;
}
.brief-stat-num .sign { color: var(--signal); font-size: 0.7em; }
.brief-stat-label {
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink-2);
  flex: 1;
}
.brief-stat-source {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding-top: 14px;
  border-top: 1px dashed var(--rule);
}
.brief-quote {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 60;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(24px, 3.2vw, 38px);
  line-height: 1.3;
  letter-spacing: -0.01em;
  max-width: 920px;
  color: var(--ink);
  margin-bottom: 24px;
  margin-top: 24px;
}
.brief-quote::before {
  content: "“";
  font-size: 1.4em;
  color: var(--signal);
  vertical-align: -0.1em;
}
.brief-quote::after {
  content: "”";
  font-size: 1.4em;
  color: var(--signal);
  vertical-align: -0.1em;
}
.brief-quote-author {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;

}
.brief-quote-author strong {
  color: var(--ink);
  font-weight: 500;
}
.brief-quote-author span { color: var(--muted); margin-left: 8px; }
.brief-checklist {
  margin-top: 40px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.brief-checklist-item {
  background: var(--paper);
  padding: 28px;
  display: flex;
  gap: 18px;
}
.brief-checklist-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 20;
  font-size: 36px;
  line-height: 1;
  color: var(--signal);
  font-weight: 500;
  flex-shrink: 0;
}
.brief-checklist-text {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-2);
}
.brief-checklist-text strong {
  display: block;
  color: var(--ink);
  font-weight: 500;
  margin-bottom: 6px;
  font-family: "Fraunces", serif;
  font-size: 18px;
}
.brief-toolkit-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 40px;
}
.brief-tool {
  background: var(--paper);
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: background 0.2s;
}
.brief-tool:hover { background: var(--paper-2); }
.brief-tool-cat {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.brief-tool-name {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500;
  font-size: 22px;
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.brief-tool-desc {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
}

/* DISPATCH SOURCES - traceability block */
.brief-sources {
  background: var(--paper-2);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding-top: 60px;
  padding-bottom: 60px;
  margin-top: 40px;
}
.brief-sources-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 40px;
}
.brief-source-card {
  background: var(--paper);
  padding: 24px 28px;
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 24px;
  align-items: start;
  transition: background 0.2s;
}
.brief-source-card:hover { background: var(--paper-2); }
.brief-source-num {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 60, "SOFT" 60;
  font-weight: 400;
  font-size: 32px;
  color: var(--signal);
  line-height: 1;
  padding-top: 4px;
}
.brief-source-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.brief-source-label {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 36, "SOFT" 30;
  font-weight: 500;
  font-size: 18px;
  line-height: 1.3;
  color: var(--ink);
}
.brief-source-cited {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
  font-style: italic;
}
.brief-source-cited strong {
  font-style: normal;
  color: var(--ink);
  font-weight: 500;
}
.brief-source-links {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 6px;
}
.brief-source-links a {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 6px 10px;
  border: 1px solid var(--rule);
  background: var(--paper);
  transition: border-color 0.2s, background 0.2s;
}
.brief-source-links a:hover {
  border-color: var(--signal);
  background: var(--paper-2);
}
@media (max-width: 720px) {
  .brief-source-card {
    grid-template-columns: 40px 1fr;
    gap: 16px;
    padding: 20px;
  }
  .brief-source-num { font-size: 24px; }
}

.brief-paywall {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 90px 32px;
  border-top: 1px solid var(--rule);
}

  background: var(--ink);
  color: var(--paper);
  padding: 60px 50px;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 60px;
  position: relative;
  overflow: hidden;
}
.brief-paywall-inner::before {
  content: "EXECUTIVE";
  position: absolute;
  top: 24px;
  right: 30px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--signal);
}
.brief-paywall-eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--signal);
  margin-bottom: 18px;
}
.brief-paywall-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 96, "SOFT" 30;
  font-weight: 400;
  font-size: clamp(28px, 3.6vw, 42px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 24px;
  color: var(--paper);
}
.brief-paywall-title em {
  font-style: italic;
  font-variation-settings: "opsz" 96, "SOFT" 100;
  color: var(--signal);
}
.brief-paywall-desc {
  font-size: 16px;
  line-height: 1.6;
  color: rgba(242, 238, 229, 0.75);
  margin-bottom: 24px;

}
.brief-paywall ul { list-style: none; padding: 0; margin: 0; }
.brief-paywall ul li {
  font-size: 14px;
  line-height: 1.5;

}
.brief-paywall ul li::before {
  content: "→";

  color: var(--signal);
}
.brief-paywall ul li:last-child { border-bottom: none; }
.brief-paywall-price {
  background: rgba(242, 238, 229, 0.05);
  border: 1px solid rgba(242, 238, 229, 0.15);
  padding: 32px 28px;

  flex-direction: column;
  gap: 14px;
  align-self: start;
}
.brief-paywall-price-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;

.brief-paywall-price-value {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 144, "SOFT" 20;
  font-size: 64px;

  font-weight: 500;
  color: var(--paper);
  letter-spacing: -0.02em;
}
.brief-paywall-price-value .currency {
  font-size: 0.4em;
  color: var(--signal);
  margin-right: 6px;
  vertical-align: top;
  letter-spacing: 0;
}
.brief-paywall-price-alt {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(242, 238, 229, 0.6);
  padding-bottom: 14px;
  border-bottom: 1px dashed rgba(242, 238, 229, 0.15);
}
.brief-paywall-buy {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--signal);
  color: var(--paper);
  padding: 14px 18px;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;

}
.brief-paywall-buy:hover { background: #ED5448; color: var(--paper); }
.brief-paywall-note {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;

}
.brief-back {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 32px 80px;
  text-align: center;
}
@media (max-width: 960px) {
  .brief-hero { padding: 40px 20px 32px; }
  .brief-section, .brief-numbers, .brief-quote-section, .brief-checklist-section, .brief-toolkit-section { padding: 50px 20px; }

  .brief-checklist { grid-template-columns: 1fr; }

  .brief-paywall-inner {

    padding: 40px 28px;
  }
  .brief-paywall-inner::before { top: 16px; right: 20px; }
  .brief-back { padding: 0 20px 50px; }

/* ───────── FOOTER ───────── */
footer {
  border-top: 1px solid var(--rule);
  margin-top: 40px;
  font-family: "JetBrains Mono", monospace;

}

.foot-col-brand .foot-brand {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 28, "SOFT" 0;
  font-weight: 500;
  font-size: 22px;
  color: var(--ink);
  letter-spacing: -0.01em;
}

  color: var(--signal);
}

  color: var(--signal);
}
.foot-tagline {
  font-family: "Instrument Sans", sans-serif;
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.5;

}
.foot-col-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  margin-bottom: 4px;

.foot-col-links a {
  font-family: "Instrument Sans", sans-serif;

  color: var(--ink-2);

.foot-col-meta {
  font-size: 12px;

}

  flex-direction: column;
  gap: 2px;
  margin-bottom: 12px;

.foot-update strong {

  font-family: "Instrument Sans", sans-serif;
  letter-spacing: 0;
  text-transform: none;

.foot-license { margin-bottom: 6px; color: var(--teal); }
.foot-version { color: var(--ink-3); }

.foot-bottom {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 20px 32px 32px;
  border-top: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;

}
.briefing-title {

}
.briefing-action-line a:hover { color: var(--signal); border-color: var(--signal); }

.briefing-section {

}

}
.briefing-section-title {

.briefing-sources {

/* CONTACT FORM */

.contact-form-section {

.contact-form {

    gap: 14px;
  }
  .filter-group { flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 6px 12px; }

  /* Foot mobile is handled by the dedicated @media (max-width: 720px) block at the end of this file */

  /* Context block tighter */
  .context-content h3 { font-size: 22px; }
  .context-content p { font-size: 15px; }

  /* KPI numbers smaller on phone */
  .kpi-num { font-size: 36px; }
  .kpi-label { font-size: 12px; }

  /* Bar charts stay readable */
  .bar-row { grid-template-columns: 1fr; gap: 4px; padding: 8px 0; }
  .bar-row > span:first-child { font-size: 12px; font-weight: 500; }
  .bar-row .bar-bar { margin: 4px 0; }
  .bar-row > span:last-child { text-align: left; font-size: 11px; }
}

@media (max-width: 480px) {
  /* Phone · most aggressive tightening */
  body { font-size: 15px; }
  .hero-title, .dash-title { font-size: 30px; }
  .stat-num { font-size: 36px; }
  .stat-label { font-size: 12px; }
  .nav-inner { padding: 12px 16px; }
  .logo { font-size: 16px; }
  .lang-toggle { font-size: 11px; }

  /* Mobile menu text larger */
  .mobile-menu a { font-size: 22px; padding: 14px 20px; }

  /* Brief hero numbers wrap better */
  .brief-stat-num { font-size: 44px; }
  .brief-stat-label { font-size: 12px; }

  /* Cards stack and tighten */
  .card { min-height: auto; padding: 20px 16px; }
  .field-card { padding: 18px 16px; }

  /* Method grid extra tight */
  .method-content h3 { font-size: 22px; }
  .method-content h4 { font-size: 16px; }
  .method-content p { font-size: 14px; }
  .method-content li { font-size: 14px; }

  /* About actions full-width on phone */
  .about-actions {
    flex-direction: column;
    align-items: stretch;
  }
  .about-actions .btn { text-align: center; justify-content: center; }
}

/* Improve touch targets on touch devices */
@media (hover: none) and (pointer: coarse) {
  .btn, .chip, .menu-btn, .lang-toggle button {
    min-height: 44px;
  }
  .nav-links a { padding: 10px 12px; }
  .field-card-link { padding: 4px 0; }
}

/* Prevent horizontal scroll on any page */
html, body { overflow-x: hidden; max-width: 100vw; }

/* Ensure long words break gracefully on narrow screens */
.field-card-title, .card-title, .brief-source-label,
.method-content p, .method-content h3, .method-content h4 {

  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: var(--signal);
}
.debate-col-antithesis {
  background: var(--paper-2, #ECE7DA);
}
.debate-col-antithesis::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: var(--teal, #1F3A3D);
}
.debate-col-tag {
  font-size: 11px;

.debate-col-antithesis .debate-col-quote {

/* ============================================== */
/* BRIEF ACTIONS · top bar with PDF, Mail, Copy   */
/* ============================================== */
.brief-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px dashed var(--rule);
}
.brief-action {
  font-family: "Instrument Sans", sans-serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.01em;
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--ink);
  padding: 9px 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.18s, color 0.18s, transform 0.12s;
  line-height: 1.2;
}
.brief-action:hover {
  background: var(--signal);
  border-color: var(--signal);
  transform: translateY(-1px);
}
.brief-action:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
}
.brief-action--ghost {
  background: transparent;
  color: var(--ink);
}
.brief-action--ghost:hover {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
  transform: translateY(-1px);
}
@media (max-width: 600px) {
  .brief-actions { flex-direction: column; align-items: stretch; }
  .brief-action { text-align: center; }
}

/* ============================================== */
/* BRIEF MODAL · PDF preview popup                */
/* ============================================== */
.brief-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: stretch;
  justify-content: center;
}
.brief-modal[aria-hidden="false"] {
  display: flex;
}
.brief-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(17, 17, 15, 0.62);
  backdrop-filter: blur(2px);
  cursor: pointer;
}
.brief-modal-window {
  position: relative;
  width: min(900px, 100%);
  max-width: 900px;
  margin: 24px;
  background: var(--paper);
  border: 1px solid var(--ink);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 48px);
  box-shadow: 0 20px 60px rgba(17, 17, 15, 0.4);
}
.brief-modal-bar {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--ink);
  background: var(--paper);
}
.brief-modal-bar-left {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-3);
}
.brief-modal-bar-right {
  display: flex;
  gap: 10px;
  align-items: center;
}
.brief-modal-print {
  font-family: "Instrument Sans", sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: var(--signal);
  color: var(--paper);
  border: 1px solid var(--signal);
  padding: 8px 16px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.18s, transform 0.12s;
}
.brief-modal-print:hover {
  background: var(--ink);
  border-color: var(--ink);
  transform: translateY(-1px);
}
.brief-modal-close {
  background: transparent;
  border: none;
  font-size: 28px;
  line-height: 1;
  color: var(--ink);
  cursor: pointer;
  padding: 0 4px;
  font-family: serif;
}
.brief-modal-close:hover { color: var(--signal); }
.brief-modal-scroll {
  flex: 1 1 auto;
  overflow: auto;
  background: #FAFAF7;
  padding: 36px 24px;
}

/* ============================================== */
/* BRIEF PDF · concise printable layout           */
/* ============================================== */
.brief-pdf {
  background: white;
  max-width: 760px;

  padding: 56px 56px;

.brief-pdf .pdf-head {

}
.brief-pdf .pdf-eyebrow {

  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  margin-bottom: 8px;
}
.brief-pdf .pdf-eyebrow .b { color: var(--signal); }
.brief-pdf .pdf-eyebrow .dot { color: var(--signal); margin: 0 4px; }
.brief-pdf .pdf-title {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 56, "SOFT" 0;
  font-size: 24px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: -0.015em;
  margin: 0 0 12px 0;
  color: var(--ink);
}
.brief-pdf .pdf-title em {
  font-style: italic;
  font-variation-settings: "opsz" 56, "SOFT" 50;
  color: var(--signal);
}
.brief-pdf .pdf-meta {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  margin-bottom: 6px;

}
.brief-pdf .pdf-byline {
  font-size: 11px;
  color: var(--ink-3);
  font-family: "JetBrains Mono", monospace;
}
.brief-pdf .pdf-byline .dot { margin: 0 6px; }
.brief-pdf .pdf-section {
  margin: 22px 0;
  page-break-inside: avoid;
}
.brief-pdf .pdf-section h2 {
  font-family: "Fraunces", serif;
  font-variation-settings: "opsz" 18, "SOFT" 0;
  font-size: 14px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--signal);
  margin: 0 0 8px 0;
  border-bottom: 1px dashed var(--rule);
  padding-bottom: 5px;
}
.brief-pdf .pdf-section p {
  font-size: 12.5px;
  margin: 0 0 8px 0;
  color: var(--ink-2);
  line-height: 1.55;
}
.brief-pdf .pdf-section p strong { color: var(--ink); font-weight: 600; }
.brief-pdf .pdf-section p em {
  font-style: italic;
  color: var(--signal);
}
.brief-pdf .pdf-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.brief-pdf .pdf-list li {
  font-size: 12.5px;
  color: var(--ink-2);
  padding: 4px 0 4px 18px;
  position: relative;
  line-height: 1.5;
}
.brief-pdf .pdf-list li::before {
  content: "›";
  position: absolute;
  left: 0;
  color: var(--signal);
  font-weight: 600;
}
.brief-pdf .pdf-list li strong { color: var(--ink); font-weight: 600; }
.brief-pdf .pdf-tag {
  font-size: 9.5px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-left: 6px;
  font-family: "JetBrains Mono", monospace;
}
.brief-pdf .pdf-callout {
  margin-top: 10px !important;
  padding: 10px 14px;
  background: #F2EEE5;
  border-left: 3px solid var(--signal);
  font-size: 12px !important;
  font-style: italic;
}
.brief-pdf .pdf-foot {
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid var(--ink);
  font-size: 10.5px;

  line-height: 1.6;
}
.brief-pdf .pdf-foot-url { margin-bottom: 4px; }

  color: var(--ink);

}

/* ============================================== */
/* BRIEF TOAST · feedback after copy              */
/* ============================================== */
.brief-toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--paper);
  padding: 12px 20px;
  font-size: 13px;
  font-family: "Instrument Sans", sans-serif;
  border-radius: 999px;
  z-index: 1100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  box-shadow: 0 8px 24px rgba(17, 17, 15, 0.3);
}
.brief-toast.is-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============================================== */
/* PRINT STYLES · isolate #brief-pdf              */
/* When body has .printing-pdf, only #brief-pdf prints */
/* ============================================== */
@media print {
  body.printing-pdf > *:not(.brief-modal) { display: none !important; }
  body.printing-pdf .brief-modal-backdrop,
  body.printing-pdf .brief-modal-bar { display: none !important; }
  body.printing-pdf .brief-modal {
    position: static !important;
    display: block !important;
  }
  body.printing-pdf .brief-modal-window {
    position: static !important;
    margin: 0 !important;
    border: none !important;
    max-height: none !important;
    box-shadow: none !important;
  }
  body.printing-pdf .brief-modal-scroll {
    overflow: visible !important;
    padding: 0 !important;
    background: white !important;
  }
  body.printing-pdf .brief-pdf {
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
    max-width: none !important;
  }
  body.printing-pdf .brief-pdf .pdf-section h2 { color: black !important; }
  body.printing-pdf .brief-pdf .pdf-list li::before { color: black !important; }
  body.printing-pdf .brief-pdf .pdf-title em { color: black !important; }
  body.printing-pdf .brief-pdf .pdf-section p em { color: black !important; }
  @page {
    size: A4;
    margin: 18mm 16mm;
  }
}

window.VEILLE_DATA = [{"date":"2026-05-06","source":"David George (Andreessen Horowitz) · a16z newsletter","country":"INT","title":{"fr":"The AI Job Apocalypse Is a Complete Fantasy · thèse bull historique-allocateur de a16z · 4 sources académiques 2026","en":"The AI Job Apocalypse Is a Complete Fantasy · a16z Historical-Allocator Bull Thesis · 4 Academic Sources 2026"},"excerpt":{"fr":"Article de David George (associé Andreessen Horowitz) publié le 6 mai 2026 sur le newsletter a16z. Position contre-narrative articulée et sourcée face au récit médiatique de l'apocalypse IA-emploi. Thèse centrale : le récit du chômage permanent IA est l'erreur dite du lump-of-labor (volume fixe de travail à effectuer), corrigée systématiquement par l'histoire économique depuis Keynes. Quatre arguments structurants. (1) Précédents historiques : agriculture US (33% emploi 1900 à 2% en 2017, output triplé), électrification (5% factories en 1900 à 80% en 1930, productivité doublée pendant des décennies), VisiCalc/Excel et comptables (perte ~1M de bookkeepers, gain ~1,5M d'analystes financiers, création FP&A), agents de voyage Tedeschi/Stripe (effectifs divisés par 2 mais salaires de 87% à 99% de la moyenne privée 2000-2025). (2) Cadre conceptuel : Jevons Paradox (quand le coût d'un input puissant baisse, la demande s'étend, pas l'inverse), travail économique de Carlota Perez sur les phases des révolutions technologiques. (3) Données empiriques académiques 2026 récentes : NBER WP 34984 (l'adoption IA n'a pas encore mené à des changements significatifs d'emploi total), Atlanta Fed WP 2026-3 (plus de 90% des entreprises sur 4 enquêtes estiment aucun impact sur les 3 dernières années), Census CES 26-25 (5% des entreprises utilisatrices d'IA rapportent un impact sur les effectifs, distribué quasi équitablement entre hausses 2,3% et baisses 2,0%), Yale Budget Lab avril 2026 (tableau d'ensemble en stabilité, pas de disruption majeure au niveau économie globale). (4) Données positives émergentes : ratio augmentation/substitution 8:1 dans les earnings calls, embauches développeurs en hausse depuis début 2025, postes PM revenus à leur plus haut depuis 2022, formation de nouvelles entreprises explose corrélée à l'adoption IA, +60% YoY apps store. Position sur les juniors : exception documentée par Stanford, Dallas Fed, Census sur les rôles d'entrée à forte exposition IA, mais ces mêmes recherches montrent une hausse des rôles d'entrée où l'IA est augmentative ou neutre. Pour les COMEX et CFO, c'est l'argument optimiste académiquement défendu qui équilibre Amodei et Suleyman, ancré dans 4 papers académiques 2026 et un appareil historique solide. Convergence avec Trammell sur la persistance de la part travail et avec Imas sur l'économie post-commodité.","en":"Article by David George (Andreessen Horowitz partner) published 6 May 2026 on the a16z newsletter. Articulated and sourced counter-narrative position to the media narrative of AI-employment apocalypse. Central thesis: the permanent unemployment AI narrative is the lump-of-labor fallacy (fixed amount of work to do), systematically corrected by economic history since Keynes. Four structuring arguments. (1) Historical precedents: US agriculture (33% employment 1900 to 2% in 2017, output tripled), electrification (5% factories in 1900 to 80% in 1930, productivity doubled for decades), VisiCalc/Excel and bookkeepers (loss ~1M bookkeepers, gain ~1.5M financial analysts, FP&A industry creation), travel agents Tedeschi/Stripe (workforce halved but wages from 87% to 99% of private sector average 2000-2025). (2) Conceptual framework: Jevons Paradox (when the cost of a powerful input falls, demand expands, not the opposite), Carlota Perez's economic work on technological revolution phases. (3) Recent 2026 academic empirical data: NBER WP 34984 (AI adoption has not yet led to meaningful changes in total employment), Atlanta Fed WP 2026-3 (over 90% of firms across 4 surveys estimate no impact over the last 3 years), Census CES 26-25 (5% of AI-using firms report headcount impact, distributed nearly equally between increases 2.3% and decreases 2.0%), Yale Budget Lab April 2026 (overall picture is stability, not major disruption at economy-wide level). (4) Positive emerging data: augmentation/substitution ratio 8:1 in earnings calls, developer hiring up since early 2025, PM postings back to highest since 2022, new business formation explodes correlated with AI adoption, +60% YoY app store. Position on juniors: exception documented by Stanford, Dallas Fed, Census on entry-level roles with high AI exposure, but these same studies show an increase in entry-level roles where AI is augmentative or neutral. For CFOs and CEOs, this is the academically defended optimistic argument that balances Amodei and Suleyman, anchored in 4 academic papers from 2026 and a solid historical apparatus. Convergence with Trammell on labor share persistence and with Imas on post-commodity economics."},"url":"https://www.a16z.news/p/the-ai-job-apocalypse-is-a-complete","ai_type":"generative"},{"date":"2026-03-25","source":"Chen, Zhang, He, Stoica, Zaharia, Zou · Stanford / UC Berkeley / CMU / Microsoft Research · arXiv 2603.23971","country":"INT","title":{"fr":"The Price Reversal Phenomenon · le prix listé des modèles de raisonnement n'est pas un proxy fiable du coût réel · 21,8% d'inversions, magnitude jusqu'à 28×","en":"The Price Reversal Phenomenon · Listed Prices of Reasoning Models Are Not a Reliable Proxy of Actual Cost · 21.8% Reversals, Magnitude Up to 28x"},"excerpt":{"fr":"Première étude systématique académique mesurant l'écart entre prix listés et coûts d'inférence réels des modèles de raisonnement (RLM). Auteurs : Lingjiao Chen (Stanford et Microsoft Research), Chi Zhang (CMU), Yeye He (Microsoft Research), Ion Stoica (UC Berkeley), Matei Zaharia (UC Berkeley), James Zou (Stanford). Méthodologie : évaluation de 8 modèles de raisonnement frontière sur 9 tâches diverses · math compétition, science QA, génération de code, raisonnement multi-domaine. Découverte centrale : le phénomène d'inversion de prix. Dans 21,8% des comparaisons par paires de modèles, le modèle au prix listé le plus bas génère en pratique un coût total supérieur, avec une magnitude d'inversion atteignant jusqu'à 28×. Cas emblématique documenté : Gemini 3 Flash, listé 78% moins cher que GPT-5.2, coûte en réalité 22% plus cher sur l'ensemble des tâches évaluées. Cause racine : hétérogénéité massive de la consommation de tokens de raisonnement. Sur une même requête, un modèle peut utiliser 900% de tokens de réflexion en plus qu'un autre. Ces tokens, invisibles pour l'utilisateur, sont facturés au tarif des tokens de sortie. Démonstration empirique : en retirant le coût des tokens de raisonnement, les inversions de classement chutent de 70%, et la corrélation Kendall τ entre prix listés et coûts réels passe de 0,563 à 0,873. Conclusion : la prédiction du coût par requête est fondamentalement difficile parce que la consommation de tokens varie fortement selon la tâche et le modèle. Pour les directions financières et les directions des achats, c'est la première démonstration académique rigoureuse que le prix listé d'un modèle n'est pas un instrument fiable de comparaison économique. Implication directe : tout TCO IA qui s'appuie sur les prix listés sans modéliser explicitement la consommation de tokens de raisonnement par cas d'usage sous-estime structurellement les coûts réels.","en":"First systematic academic study measuring the gap between listed prices and actual inference costs of reasoning language models (RLM). Authors: Lingjiao Chen (Stanford and Microsoft Research), Chi Zhang (CMU), Yeye He (Microsoft Research), Ion Stoica (UC Berkeley), Matei Zaharia (UC Berkeley), James Zou (Stanford). Methodology: evaluation of 8 frontier reasoning models on 9 diverse tasks · competition math, science QA, code generation, multi-domain reasoning. Central finding: the pricing reversal phenomenon. In 21.8% of model pair comparisons, the model with the lower listed price actually incurs a higher total cost, with reversal magnitude reaching up to 28x. Canonical documented case: Gemini 3 Flash, listed 78% cheaper than GPT-5.2, actually costs 22% more across all evaluated tasks. Root cause: vast heterogeneity in thinking token consumption. On the same query, one model can use 900% more thinking tokens than another. These tokens, invisible to users, are billed at the output token rate. Empirical demonstration: removing thinking token costs reduces ranking reversals by 70%, and the Kendall τ rank correlation between listed prices and actual costs rises from 0.563 to 0.873. Conclusion: per-query cost prediction is fundamentally difficult because token consumption varies sharply across tasks and models. For CFOs and CPOs, this is the first rigorous academic demonstration that listed pricing is not a reliable instrument for economic model comparison. Direct implication: any AI TCO based on listed prices without explicitly modeling reasoning token consumption per use case structurally underestimates actual costs."},"url":"https://arxiv.org/abs/2603.23971","ai_type":"generative"},{"date":"2026-04-15","source":"Alegria.group · Premier baromètre maturité IA des PME françaises 2026","country":"FR","title":{"fr":"Baromètre maturité IA des PME françaises 2026 · 9% des PME ont intégré l'IA dans la majorité de leurs processus, 68% ont un budget IA ≤ 5 000 €","en":"French SME AI Maturity Barometer 2026 · 9% of SMEs Have Integrated AI in Most Processes, 68% Have an AI Budget ≤ €5,000"},"excerpt":{"fr":"Premier baromètre Alegria.group sur la maturité IA des PME françaises, publié en avril 2026 sur un panel de 100 répondants représentatif du tissu économique français : 60% structures de moins de 20 salariés, 18% entre 20 et 49, 9% entre 50 et 249, 13% entre 250 et 499. 43% des répondants sont DG, Président ou CEO. Apport critique : seule source FR qui mesure spécifiquement la maturité d'adoption IA dans les PME, là où Kelio/OpinionWay mesure des DRH d'entreprises 20+ salariés et où Coface/OEM mesure l'exposition macroéconomique tous secteurs confondus. Résultats structurants. Intégration : seulement 9% des PME ont intégré l'IA dans la majorité de leurs processus clés, 40% restent en usage individuel sans intégration aux processus collectifs, 23% en intégration partielle. Connexion aux outils métiers : 58% n'ont aucune connexion IA-outils métiers (CRM, ERP, RH), 19% connexion partielle, 10% connexion large. Usage : 29% utilisateurs isolés, 18% usage généralisé non encadré, 22% aucun usage. Stratégie : 21% ont une stratégie IA structurée et formalisée, 30% approche opportuniste ou ponctuelle, 28% n'ont pas encore de stratégie mais la prévoient, 8% n'envisagent pas du tout. Maturité auto-évaluée moyenne 5/10, médiane 5/10. ROI : 17% voient un ROI important, 33% le jugent possible mais incertain, 20% non mesurable, 17% aucun ROI perçu. Mesure d'impact : 29% n'ont pas mesuré, 23% n'ont aucun indicateur adapté, 17% ont mesuré clairement. Budgets 2025 : 27% budget nul, 41% moins de 5 000 €, 16% entre 5 000 et 20 000 €, 3% plus de 20 000 €. Préoccupations : 55% confidentialité des données, 43% fiabilité des résultats, 36% conformité réglementaire, 27% perte de contrôle, 19% seulement emploi et confiance des équipes. Climat interne : 46% enthousiasme, 25% prudence, 9% indifférence, 7% résistance. Compétences IA déclarées : 5% très avancé, 11% avancé, 21% intermédiaire, 24% faible, 19% très faible, 7% inexistant. Formation : 7% déjà formé la majorité des collaborateurs, 24% en cours, 22% prévue prochainement, 34% aucun plan. Horizon perçu de l'impact majeur de l'IA : 24% aujourd'hui, 35% dès 2026, 21% en 2027-2028. Constat éditorial : décalage central entre discours dominant (plans massifs, gains de productivité, menace sur l'emploi) et réalité PME (budgets modestes, ROI difficile à mesurer, gouvernance artisanale, préoccupations centrées sur la donnée plutôt que sur l'emploi).","en":"First Alegria.group barometer on French SME AI maturity, published in April 2026 on a panel of 100 respondents representative of the French economic fabric: 60% structures under 20 employees, 18% between 20 and 49, 9% between 50 and 249, 13% between 250 and 499. 43% of respondents are CEO, President or DG. Critical contribution: only FR source specifically measuring AI adoption maturity in SMEs, where Kelio/OpinionWay measures HR directors of 20+ employee companies and Coface/OEM measures macroeconomic exposure across all sectors. Structuring results. Integration: only 9% of SMEs have integrated AI in most key processes, 40% remain in individual use without integration into collective processes, 23% in partial integration. Connection to business tools: 58% have no AI-business tool connection (CRM, ERP, HR), 19% partial connection, 10% broad connection. Usage: 29% isolated users, 18% generalized unframed use, 22% no use. Strategy: 21% have a structured and formalized AI strategy, 30% opportunistic or punctual approach, 28% no strategy yet but planned, 8% don't envision one at all. Self-assessed maturity average 5/10, median 5/10. ROI: 17% see significant ROI, 33% judge it possible but uncertain, 20% not measurable, 17% no ROI perceived. Impact measurement: 29% haven't measured, 23% have no suitable indicator, 17% have clearly measured. 2025 budgets: 27% zero budget, 41% less than €5,000, 16% between €5,000 and €20,000, 3% more than €20,000. Concerns: 55% data confidentiality, 43% result reliability, 36% regulatory compliance, 27% loss of control, only 19% employment and team trust. Internal climate: 46% enthusiasm, 25% caution, 9% indifference, 7% resistance. Self-declared AI skills: 5% very advanced, 11% advanced, 21% intermediate, 24% low, 19% very low, 7% nonexistent. Training: 7% have already trained most collaborators, 24% in progress, 22% planned soon, 34% no plan. Perceived horizon for major AI impact: 24% today, 35% by 2026, 21% in 2027-2028. Editorial finding: central gap between dominant discourse (massive plans, productivity gains, employment threat) and SME reality (modest budgets, ROI difficult to measure, artisanal governance, concerns centered on data rather than employment)."},"url":"https://cdn.jaimelesstartups.fr/wp-content/uploads/2026/04/Barometre-maturite-IA-des-PME-francaises.pdf","ai_type":"generative"},{"date":"2025-06-15","source":"Colombus Consulting · Oracle · HEG-Genève · Observatoire Data & IA en Suisse 2025","country":"CH","title":{"fr":"Observatoire Data et IA en Suisse 2025 · 52% des entreprises déploient l'IA à l'échelle, mais 70% identifient la culture comme premier frein","en":"Swiss Data and AI Observatory 2025 · 52% of Companies Deploy AI at Scale, but 70% Identify Culture as the Primary Barrier"},"excerpt":{"fr":"Étude longitudinale de référence menée entre janvier et avril 2025 par Colombus Consulting, Oracle et la Haute École de gestion de Genève auprès d'un panel de plus de 100 organisations suisses (tous secteurs, toutes tailles, couverture géographique nationale). Méthodologie reproduite à l'identique de l'édition 2024 pour permettre une mesure rigoureuse des évolutions sur 12 mois. C'est la seule source CH qui mesure la maturité organisationnelle réelle de l'adoption IA en entreprise, complémentaire des sources sur les effets de substitution (KOF/ETH) et sur la création d'emplois IA (HSLU). Résultats structurants : 52% des entreprises CH ont déployé des assistants ou modules de génération de contenu à l'échelle (vs 21% en 2024, +31 points), tandis que les pilotes reculent de 28 points, signe que la phase exploratoire cède la place à une adoption opérationnelle. 62% des dirigeants se déclarent désormais bons à très bons sur les concepts IA (vs 37% en 2024, +25 points). 62% jugent leur qualité de données bonne à excellente (vs 48%, +14 points). Mais 70% identifient encore la culture et l'organisation comme principal frein, pas la technique. 58% reconnaissent une mesure du ROI IA basique ou inexistante (vs 74%, -16 points), preuve que la maturité financière progresse moins vite que la maturité technique. 35% seulement intègrent l'IA au plan stratégique long-terme. 77% des usages restent concentrés sur le client et le marketing, 33% touchent les fonctions support. 80% des entreprises avec données imparfaites tirent quand même un avantage tangible de l'IA. 64% ambitionnent de suivre l'AI Act européen (vs 56%). Légère avance pour le secteur des services financiers et assurances. Constat éditorial : aucune différence significative entre secteurs sur la capacité de l'IA à résoudre des problèmes complexes, ce qui montre que la maturité interne et les compétences sont les véritables moteurs.","en":"Reference longitudinal study conducted between January and April 2025 by Colombus Consulting, Oracle and the Geneva School of Business Administration (HEG) on a panel of over 100 Swiss organizations (all sectors, all sizes, national geographic coverage). Methodology identically reproduced from the 2024 edition to enable rigorous measurement of 12-month evolution. This is the only CH source measuring the real organizational maturity of AI adoption in companies, complementary to sources on substitution effects (KOF/ETH) and AI job creation (HSLU). Structuring results: 52% of Swiss companies have deployed AI assistants or content generation modules at scale (vs 21% in 2024, +31pp), while pilots dropped 28pp, sign that the exploratory phase is giving way to operational adoption. 62% of executives now declare themselves good to very good on AI concepts (vs 37% in 2024, +25pp). 62% rate their data quality as good to excellent (vs 48%, +14pp). But 70% still identify culture and organization as the main barrier, not technique. 58% acknowledge a basic or nonexistent AI ROI measure (vs 74%, -16pp), evidence that financial maturity progresses slower than technical maturity. Only 35% integrate AI into the long-term strategic plan. 77% of uses remain concentrated on customer and marketing, 33% touch support functions. 80% of companies with imperfect data still derive a tangible advantage from AI. 64% aim to follow the European AI Act (vs 56%). Slight lead for the financial services and insurance sector. Editorial finding: no significant difference between sectors in AI's ability to solve complex problems, showing that internal maturity and skills are the real drivers."},"url":"https://www.colombus-consulting.com/en/observatoire-data-ia-en-suisse-2025/","ai_type":"generative"},{"date":"2026-03-15","source":"OpinionWay pour Kelio · Baromètre IA et RH 2026 · 3e vague","country":"FR","title":{"fr":"Baromètre IA et RH 2026 · 33% des DRH français utilisent l'IA · 42% des actifs se sentent menacés","en":"AI and HR Barometer 2026 · 33% of French HR Leaders Use AI · 42% of Workers Feel Threatened"},"excerpt":{"fr":"Étude OpinionWay pour Kelio publiée en mars 2026 (3e vague longitudinale, ISO 20252). Double échantillon représentatif : 306 DRH d'entreprises privées de 20 salariés et plus, et 1 071 Français représentatifs. Source FR la plus complète sur la perception croisée IA-RH-grand public. Résultats DRH : 33% utilisent l'IA dans leurs fonctions RH (vs 24% en 2025, 9% en 2024, soit +24 points en 2 ans). 42% utilisent ou aimeraient utiliser, mais seulement 6% en usage important. Adoption fortement corrélée à la taille : 22% pour les entreprises de 20 à 49 salariés, 44% pour 250 et plus, 9% dans la construction. Freins principaux : confidentialité 39%, incompatibilité 19%, manque de formation 17%. Confiance DRH dans la qualité de l'IA : 47% (stable depuis 2024). Confiance dans le recrutement : seulement 4% (le recrutement doit rester humain pour 51% des DRH). Résultats actifs : 42% se sentent menacés à long terme, dont 30% plutôt menacés et 12% très menacés. Écart de perception majeur DRH/équipes : 22% des DRH se sentent menacés vs 42% des actifs.","en":"OpinionWay study for Kelio published in March 2026 (3rd longitudinal wave, ISO 20252). Dual representative sample: 306 HR directors from private companies with 20+ employees, and 1,071 representative French citizens. Most complete FR source on cross-perception AI-HR-general public. HR results: 33% use AI in their HR functions (vs 24% in 2025, 9% in 2024, i.e. +24pp in 2 years). 42% use or would like to use, but only 6% in significant use. Adoption strongly correlated with size: 22% for 20-49 employee companies, 44% for 250+, 9% in construction. Main barriers: confidentiality 39%, incompatibility 19%, lack of training 17%. HR confidence in AI quality: 47% (stable since 2024). Confidence in recruitment: only 4% (recruitment must remain human for 51% of HR). Worker results: 42% feel threatened long-term, of which 30% rather threatened and 12% very threatened. Major DRH/teams perception gap: 22% of HR feel threatened vs 42% of workers."},"url":"https://www.kelio.com/fr/blog/barometre-ia-rh-2026","ai_type":"generative"},{"date":"2026-04-15","source":"Assemblée nationale · Commission des affaires sociales · Table ronde RH-IA","country":"FR","title":{"fr":"Table ronde IA et GRH · Ferguson, Goulard, Lamri · clivage 30%/70% shadow IA · sens du travail","en":"AI and HRM Round Table · Ferguson, Goulard, Lamri · 30%/70% Shadow AI Divide · Meaning at Work"},"excerpt":{"fr":"Table ronde de la Commission des affaires sociales de l'Assemblée nationale (15 avril 2026). Trois intervenants : Yann Ferguson (LaborIA, Inria), Enora Goulard (Ascend Partners, cabinet RH), Jérémy Lamri (Lab-RH, docteur en psychologie). Trois apports majeurs. (1) Clivage shadow IA : environ 30% des salariés combinent usage officiel et shadow IA (profils agentifs qui percutent et adoptent naturellement), environ 70% restent bloqués dans un réflexe Google sans usage formé. Ce clivage est corrélé à l'agentivité, pas à l'âge · observation contre-intuitive face aux idées reçues sur les générations. (2) Sens du travail : les compétences 4C (créativité, communication, coopération, esprit critique) deviennent le différenciateur structurel. (3) Cadre transversal : la transformation IA est un défi managérial avant d'être technologique. Implication directe pour les directions RH : la formation à l'IA n'est pas un sujet outillage mais un sujet d'équipement cognitif des équipes pour qu'elles puissent développer une posture critique face aux outputs IA.","en":"Round table of the Social Affairs Committee of the French National Assembly (15 April 2026). Three speakers: Yann Ferguson (LaborIA, Inria), Enora Goulard (Ascend Partners, HR consultancy), Jérémy Lamri (Lab-RH, PhD in psychology). Three major contributions. (1) Shadow AI divide: approximately 30% of employees combine official use and shadow AI (agentic profiles who push through and adopt naturally), approximately 70% remain stuck in a Google reflex without trained use. This divide is correlated with agency, not age · counter-intuitive observation against prevailing ideas on generations. (2) Meaning at work: 4C skills (creativity, communication, cooperation, critical thinking) become the structural differentiator. (3) Cross-cutting framework: AI transformation is a managerial challenge before being a technological one. Direct implication for HR leadership: AI training is not a tooling subject but a cognitive equipment subject for teams to develop a critical posture toward AI outputs."},"url":"https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/cion-soc/l17cion-soc2526017","ai_type":"generative"},{"date":"2025-04-15","source":"Assemblée nationale · Commission des affaires sociales · Audition économistes","country":"FR","title":{"fr":"Audition Marquier/Bunel/Baquero · cadre 2 forces IA · risque effet ciseaux finances publiques","en":"Marquier/Bunel/Baquero Hearing · 2-Force AI Framework · Public Finance Scissors Risk"},"excerpt":{"fr":"Audition de la Commission des affaires sociales de l'Assemblée nationale (avril 2025) avec trois économistes : Axelle Marquier (INSEE/ENS), Simon Bunel (INC/ENS), Lor Baquero (UNEDIC). Cadre analytique structurant en 2 forces : automatisation (la machine substitue l'humain sur des tâches cognitives complexes · rupture nette par rapport aux vagues précédentes) et émergence de nouveaux métiers (destruction créatrice schumpétérienne). Constat clé : aucun consensus chiffré entre économistes (Acemoglu Nobel 2024 estime ~5% d'impact net, OCDE 27% emplois à risque élevé en France, FMI 60% emplois exposés en définition large, Goldman Sachs 17-30%). Apport majeur de Marquier : risque d'effet ciseaux sur les finances publiques françaises. Le modèle social français est financé sur les cotisations salariales, en particulier sur les hauts salaires. Si les emplois les mieux rémunérés (cadres) disparaissent même temporairement (2-5 ans de transition), l'État subit une double pression : hausse simultanée des dépenses indemnisation chômage et baisse des recettes hauts salaires. Cadre directement actionnable pour les politiques publiques 2026-2030.","en":"Hearing of the Social Affairs Committee of the French National Assembly (April 2025) with three economists: Axelle Marquier (INSEE/ENS), Simon Bunel (INC/ENS), Lor Baquero (UNEDIC). Structuring analytical framework with 2 forces: automation (machine substitutes human on complex cognitive tasks · clear break from previous waves) and emergence of new occupations (Schumpeterian creative destruction). Key finding: no quantified consensus among economists (Acemoglu Nobel 2024 estimates ~5% net impact, OECD 27% high-risk jobs in France, IMF 60% exposed jobs in broad definition, Goldman Sachs 17-30%). Marquier's major contribution: scissors-effect risk on French public finances. The French social model is financed on wage contributions, particularly on high salaries. If best-paid jobs (executives) disappear even temporarily (2-5 years transition), the State faces double pressure: simultaneous rise in unemployment benefits expenses and fall in high-salary revenues. Framework directly actionable for 2026-2030 public policies."},"url":"https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/cion-soc","ai_type":"generative"},{"date":"2026-04-08","source":"Coface · Observatoire des Métiers · Arquié, Duthoit, Subileau","country":"FR","title":{"fr":"Coface/OEM · 3,8% des emplois français exposés aujourd'hui · 16,3% à 2-5 ans · 5 millions d'emplois menacés","en":"Coface/OEM · 3.8% of French Jobs Exposed Today · 16.3% in 2-5 Years · 5 Million Jobs Threatened"},"excerpt":{"fr":"Rapport Coface (assureur-crédit français) en partenariat avec l'Observatoire des Métiers : « Emplois, compétences, valeur : ce que l'IA est en train de bouleverser » (avril 2026). Auteurs : Axelle Arquié (Centre d'études prospectives et d'informations internationales), Aurélien Duthoit (Coface), Pierre Subileau. Méthodologie task-based la plus rigoureuse disponible sur la France : 923 professions, 12 pays comparés, décomposition en actions élémentaires reproductible. Deux horizons documentés : aujourd'hui 3,8% des emplois français significativement exposés, à 2-5 ans 16,3% (passage à l'IA agentique), soit environ 5 millions d'emplois menacés en France. Spécificité française : l'IA agentique cible le haut de l'échelle salariale (top 10%), à la différence des vagues d'automatisation précédentes qui touchaient les bas salaires. France à 1/3 de l'intensité IA américaine selon les chiffres comparables (St. Louis Fed Bick/Blandin/Deming, mars 2026). Cadre quantitatif central pour la décision RH 2026-2030 en France.","en":"Coface report (French credit insurer) in partnership with the Observatoire des Métiers: 'Jobs, skills, value: what AI is disrupting' (April 2026). Authors: Axelle Arquié (Centre for Prospective Studies and International Information), Aurélien Duthoit (Coface), Pierre Subileau. Most rigorous task-based methodology available on France: 923 occupations, 12 compared countries, reproducible elementary action decomposition. Two documented horizons: today 3.8% of French jobs significantly exposed, at 2-5 years 16.3% (transition to agentic AI), i.e. approximately 5 million jobs threatened in France. French specificity: agentic AI targets the top of the salary scale (top 10%), unlike previous automation waves that hit low salaries. France at 1/3 of US AI intensity per comparable figures (St. Louis Fed Bick/Blandin/Deming, March 2026). Central quantitative framework for 2026-2030 HR decisions in France."},"url":"https://www.coface.com/news-publications/business-risk-dashboard/emplois-competences-valeur-ce-que-l-ia-est-en-train-de-bouleverser","ai_type":"generative"},{"date":"2026-04-14","source":"Alex Imas · Chicago Booth · Substack Ghosts of Electricity","country":"INT","title":{"fr":"What will be scarce? · économie post-commodité · secteur relationnel et prime d'exclusivité humaine","en":"What Will Be Scarce? · Post-Commodity Economics · Relational Sector and Human Exclusivity Premium"},"excerpt":{"fr":"Article majeur d'Alex Imas (Chicago Booth, économiste comportemental) publié sur Substack le 14 avril 2026. S'appuie sur l'économie du changement structurel (Comin, Lashkari et Mestieri, Econometrica 2021). Thèse centrale : quand l'IA automatise la production de biens standardisés (commodités), les prix baissent et les revenus réels des ménages augmentent. Ces ménages réorientent leur consommation vers des biens et services à élasticité-revenu supérieure à 1, c'est-à-dire des biens dont la part dans la dépense croît avec le revenu. Or ces biens sont massivement non automatisables : expérience humaine personnalisée, accompagnement long, performance live, soin, éducation directe, hospitalité haut de gamme, artisanat. Conclusion : la rareté ne disparaît pas avec l'IA, elle se déplace de la production de commodités vers la production d'exclusivité humaine. Cadre théorique direct pour comprendre pourquoi le luxe, le conseil patrimonial, l'enseignement direct et le soin résistent structurellement à l'automatisation. Convergent avec Trammell (Stanford 2026) sur la persistance de la part travail.","en":"Major article by Alex Imas (Chicago Booth, behavioral economist) published on Substack on 14 April 2026. Based on the economics of structural change (Comin, Lashkari and Mestieri, Econometrica 2021). Central thesis: when AI automates production of standardized goods (commodities), prices fall and household real incomes rise. These households reorient consumption toward goods and services with income elasticity greater than 1, i.e. goods whose share in spending grows with income. Yet these goods are massively non-automatable: personalized human experience, long-form accompaniment, live performance, care, direct education, premium hospitality, craft. Conclusion: scarcity does not disappear with AI, it shifts from commodity production to human exclusivity production. Direct theoretical framework to understand why luxury, wealth advisory, direct teaching and care structurally resist automation. Converges with Trammell (Stanford 2026) on the persistence of the labor share."},"url":"https://aimas.substack.com/p/what-will-be-scarce","ai_type":"generative"},{"date":"2025-06-15","source":"PwC · AI Jobs Barometer 2025 · France","country":"FR","title":{"fr":"PwC AI Jobs Barometer 2025 · France numéro 1 en Europe · +273% d'offres IA · prime salariale +56%","en":"PwC AI Jobs Barometer 2025 · France Number 1 in Europe · +273% AI Job Listings · +56% Salary Premium"},"excerpt":{"fr":"Baromètre annuel PwC sur les emplois IA en France (juin 2025). La France ressort en première position européenne sur la dynamique de création d'emplois IA. 166 000 offres d'emploi liées à l'IA recensées en France en 2025. Croissance impressionnante : +273% d'offres IA depuis 2022 (sortie publique de ChatGPT). Prime salariale documentée : +56% d'écart entre les emplois exigeant des compétences IA et leurs équivalents sans IA, écart le plus élevé d'Europe. Cette dynamique positive coexiste avec les chiffres Coface/OEM 2026 sur l'exposition (3,8% à 16
