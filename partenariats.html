-based exposure scores.","en":"Burn-Murdoch shows through historical BLS data and James Bessen's research that the productivity-employment relationship depends on demand/supply dynamics within each sector, not on AI's technical capability alone. Software and professional services saw both productivity and employment rise (pent-up demand), while manufacturing saw employment fall (satiated demand). Radiology and healthcare remain protected by regulation. Radical critique of predictions based solely on task-based exposure scores."},"url":"https://www.ft.com/content/8d3b02a3-c929-46a1-b79e-dbcdb1d10e15","ai_type":"generative"},{"date":"2026-04-23","source":"Focaldata · Financial Times Workforce AI Tracker · Wave 1","country":"INT","title":{"fr":"Two-Tier Transformation : comment l'IA change le travail au Royaume-Uni et aux États-Unis","en":"Two-Tier Transformation: How AI is Changing Work in the UK and US"},"excerpt":{"fr":"Première vague d'un tracker mensuel UK+US (n=4 119, février-mars 2026). 65% des actifs ont utilisé l'IA au moins une fois, mais moins de 1/5 quotidiennement. Distribution L-shape : grande majorité d'usagers rares + petite minorité de power users. Productivité IA marché : +3,5% (Tech +7,8%, Finance +5,1%). Effet formation +37 pts d'usage quotidien, mais seulement 14% ont reçu une formation formelle. Managers UK pessimistes (-25% prévoient réduction) vs US optimistes (+28% prévoient hausse). Scénarios ABC : Augmentation, Bifurcation (probable), Crash.","en":"First wave of monthly UK+US tracker (n=4,119, February-March 2026). 65% of workers have used AI at least once, but fewer than 1/5 daily. L-shaped distribution: large majority of rare users + small minority of power users. Market AI productivity: +3.5% (Tech +7.8%, Finance +5.1%). Training effect +37 pts daily usage, but only 14% have received formal training. UK managers pessimistic (-25% expect reduction) vs US optimistic (+28% expect increase). ABC scenarios: Augmentation, Bifurcation (likely), Crash."},"url":"https://focaldata.com","ai_type":"generative"},{"date":"2026-04-23","source":"Angestellte Schweiz · DemoSCOPE","country":"CH","title":{"fr":"Insécurité de l'emploi perçue et responsabilités · enquête nationale","en":"Perceived job insecurity and responsibilities · national survey"},"excerpt":{"fr":"Enquête représentative auprès de 1 028 actifs des trois régions linguistiques (23-30 mars 2026). 75% se sentent en sécurité, mais 24% perçoivent une dégradation sur 12 mois. L'IA est citée comme cause individuelle #1 d'insécurité (catégorie technologique 22%). Introduction d'outils IA déclarée dans 17% des environnements de travail, avec un écart frappant : 9% dans les TPE de moins de 10 salariés contre 24% dans les entreprises de 250+. La formation continue reste la mesure jugée la plus efficace (M=3.27/4).","en":"Representative survey of 1,028 active workers across the three language regions (23-30 March 2026). 75% feel secure, but 24% perceive a deterioration over 12 months. AI is cited as the #1 individual cause of insecurity (technology category 22%). AI tool introduction reported in 17% of work environments, with a striking gap: 9% in SMEs under 10 employees vs 24% in companies of 250+. Continuing education remains the measure deemed most effective (M=3.27/4)."},"url":"https://www.angestellte.ch","ai_type":"generative"},{"date":"2026-04-15","source":"NBER · Yin, Vu, Persico (w35110)","country":"INT","title":{"fr":"Quelle (in)stabilité des scores d'exposition LLM ? Evidence d'une réplication multi-modèles","en":"How (un)Stable Are LLM Occupational Exposure Scores? Evidence from Multi-Model Replication"},"excerpt":{"fr":"Démonstration que les mesures d'exposition à l'IA basées sur les LLM auto-évaluatifs sont hautement fragiles. Trois modèles frontière appliquant la même rubrique sur les mêmes tâches produisent une divergence d'un facteur 3,6 sur l'exposition moyenne, avec un accord descendant à 57%. Cette instabilité altère les conclusions empiriques en aval : les coefficients en panel diff-in-diff varient d'un facteur 2,4 selon l'annotateur, et les estimations county-level passent d'un effet négatif significatif à un effet positif non significatif selon le modèle utilisé. Conclusion radicale : traiter les LLM en évolution comme des instruments statiques est risqué.","en":"Demonstration that LLM-based self-assessed AI exposure measures are highly fragile. Three frontier models applying the same rubric on identical tasks produce a 3.6-fold divergence in mean exposure, with agreement as low as 57%. This instability alters downstream empirical conclusions: difference-in-differences coefficients vary 2.4-fold across annotators, and county-level estimates flip from significant negative to insignificant positive depending on the model. Radical conclusion: treating evolving LLMs as static instruments is risky."},"url":"https://www.nber.org/papers/w35110","ai_type":"generative"},{"date":"2026-04-15","source":"British Progress · Pedro Serôdio","country":"INT","title":{"fr":"L'IA et le marché du travail britannique : l'état des preuves","en":"AI and the UK labour market: the evidence so far"},"excerpt":{"fr":"Rapport synthétisant les données disponibles sur l'impact de l'IA sur l'emploi au Royaume-Uni. Conclusion : peu de signes d'effets agrégés massifs, malgré 54% des PME britanniques utilisant l'IA selon BCC. Les prédictions Goldman Sachs (+7% PIB mondial) et McKinsey (12 millions de transitions) reposent sur ce que l'IA pourrait faire si toutes les organisations l'adoptaient pleinement. La réalité observée est plus étroite et plus collaborative. Divergence frappante entre exposition prédite (forte chez les professionnels et managers) et usage réel (en retard).","en":"Report synthesizing available data on AI's impact on UK employment. Conclusion: few signs of massive aggregate effects, despite 54% of UK SMEs using AI per BCC. Goldman Sachs (+7% world GDP) and McKinsey (12 million transitions) predictions rest on what AI could do if all organizations adopted it fully. Observed reality is narrower and more collaborative. Striking divergence between predicted exposure (high for professionals and managers) and actual usage (lagging)."},"url":"https://britishprogress.org/reports/ai-and-the-uk-labour-market-the-evidence-so-far","ai_type":"generative"},{"date":"2026-04-15","source":"APEC","country":"FR","title":{"fr":"Perspectives 2026 du recrutement cadre·IT en redémarrage","en":"2026 executive recruitment outlook·IT picking up"},"excerpt":{"fr":"305 800 recrutements cadres prévus en 2026 (+4%). Cadres IT : 61 160 recrutements (+4%). Reprise relative·encore loin du sommet 2023 (330 400). Trois moteurs explicites : transformation numérique, cybersécurité, montée en puissance de l'IA. Profils juniors peu favorisés (+1%).","en":"305,800 executive recruitments expected in 2026 (+4%). IT executives: 61,160 hirings (+4%). Relative pickup·still below the 2023 peak (330,400). Three explicit drivers: digital transformation, cybersecurity, AI ramp-up. Junior profiles disadvantaged (+1%)."},"url":"https://corporate.apec.fr/home/nos-etudes/toutes-nos-etudes/les-cadres-et-l'ia.html","ai_type":"generative"},{"date":"2026-04-12","source":"PwC","country":"INT","title":{"fr":"AI Jobs Barometer 2025·France 1ère en Europe","en":"AI Jobs Barometer 2025·France 1st in Europe"},"excerpt":{"fr":"Analyse de près d'un milliard d'offres d'emploi sur six continents. France : 166 000 offres IA en 2024, devant l'Allemagne (147 000) et le Royaume-Uni (125 000). Offres IA × 10 en Suisse entre 2018 et 2024 (2 000 → 20 000). Prime salariale IA : jusqu'à +56% par rapport aux postes équivalents.","en":"Analysis of nearly one billion job postings across six continents. France: 166,000 AI postings in 2024, ahead of Germany (147,000) and UK (125,000). AI postings × 10 in Switzerland between 2018 and 2024 (2,000 → 20,000). AI salary premium: up to +56% versus equivalent positions."},"url":"https://www.pwc.fr/fr/publications/series/ai-jobs-barometer.html","ai_type":"generative"},{"date":"2026-04-10","source":"Roboto · Analyse fournisseurs LLM","country":"FR","title":{"fr":"La taxe linguistique française : +60% de tokens vs anglais sur les principaux LLM","en":"The French linguistic tax: +60% tokens vs English on major LLMs"},"excerpt":{"fr":"Analyse comparative documentée : pour une tâche d'agent identique (message utilisateur 100 mots + prompt système 500 mots + réponse 200 mots), le contenu en anglais consomme 1 040 tokens contre 1 664 tokens en français, soit +60%. Cette « taxe linguistique » provient du Byte Pair Encoding utilisé par les LLM, optimisé sur des corpus majoritairement anglophones. À l'échelle de millions d'appels d'agents par mois, cette surcharge devient un facteur de coût majeur pour les organisations francophones (France et Suisse romande). L'écart tarifaire entre modèles a aussi explosé : entre GPT-5.2 Pro à 168$/M tokens en sortie et Gemini Flash-Lite à 0,40$/M, l'écart atteint 420×, pour des modèles tous deux commercialisés comme « assistants IA ». Conséquence stratégique : les organisations francophones doivent maîtriser la sélection de modèles encore plus rigoureusement que les anglophones.","en":"Documented comparative analysis: for an identical agent task (100-word user message + 500-word system prompt + 200-word response), English content consumes 1,040 tokens vs 1,664 in French, a +60% increase. This « linguistic tax » comes from the Byte Pair Encoding used by LLMs, optimized on predominantly English corpora. At scale of millions of agent calls per month, this overhead becomes a major cost factor for French-speaking organizations (France and Romandie). The pricing spread between models has also exploded: between GPT-5.2 Pro at $168/M output tokens and Gemini Flash-Lite at $0.40/M, the gap reaches 420×, for models both marketed as « AI assistants ». Strategic consequence: French-speaking organizations must master model selection even more rigorously than English-speaking ones."},"url":"https://www.roboto.fr/blog/tokens-ia-comment-les-fournisseurs-vous-font-payer-60-de-plus","ai_type":"generative"},{"date":"2026-04-10","source":"Coface · OEM","country":"FR","title":{"fr":"Emplois, compétences, valeur : ce que l'IA est en train de bouleverser","en":"Jobs, skills, value: what AI is disrupting"},"excerpt":{"fr":"Étude conjointe Coface / Observatoire des Emplois Menacés et Émergents. 16,3% des emplois français exposés à 2-5 ans (≈ 5 millions). 3,8% déjà fragilisés par l'IA générative actuelle. Méthodologie tâche par tâche sur 923 professions. Métiers qualifiés en première ligne, contrairement aux vagues précédentes.","en":"Joint Coface / OEM study. 16.3% of French jobs exposed within 2-5 years (≈ 5 million). 3.8% already weakened by current generative AI. Task-by-task methodology on 923 occupations. Qualified jobs on the front line, unlike previous waves."},"url":"https://www.coface.fr/actualites-economie-conseils/emplois-competences-valeur-ce-que-l-ia-est-en-train-de-bouleverser","ai_type":"agentic"},{"date":"2026-04-08","source":"France Stratégie · DARES","country":"FR","title":{"fr":"Les Métiers en 2030·révision post-IA générative","en":"Jobs in 2030·post-generative AI revision"},"excerpt":{"fr":"Mise à jour du rapport prospectif coréalisé par France Stratégie et la DARES. 800 000 postes à pourvoir par an d'ici 2030, dont 90% liés aux départs en retraite. 115 000 postes d'ingénieurs informatiques nets supplémentaires (+26%). Métiers de la santé en première ligne des recrutements.","en":"Update to the prospective report co-authored by France Stratégie and DARES. 800,000 positions to be filled per year by 2030, 90% linked to retirements. 115,000 additional net IT engineering positions (+26%). Healthcare occupations on the front line of recruitment."},"url":"https://www.strategie-plan.gouv.fr/publications/metiers-2030","ai_type":"automation_broad"},{"date":"2026-04-02","source":"Swiss AI Center · HES-SO","country":"CH","title":{"fr":"Adoption de l'IA dans les PME suisses·bilan 2026","en":"AI adoption in Swiss SMEs·2026 review"},"excerpt":{"fr":"Centre dédié à l'accélération de l'adoption IA par les PME. PME = 3 millions d'emplois dans 590 000 entreprises (60% population active). Obstacles documentés : manque de connaissances, accès aux compétences locales, sécurité des données. AI Days 23-25 mars 2026 à Martigny et Fribourg.","en":"Centre dedicated to accelerating AI adoption by SMEs. SMEs = 3 million jobs in 590,000 companies (60% of the active population). Documented barriers: lack of knowledge, access to local skills, data security. AI Days 23-25 March 2026 in Martigny and Fribourg."},"url":"https://www.hes-so.ch/swiss-ai-center","ai_type":"generative"},{"date":"2026-04-01","source":"OFS · Statistique de l'emploi","country":"CH","title":{"fr":"STATEM Q1 2026·places vacantes et prévisions d'emploi","en":"STATEM Q1 2026·vacancies and employment forecasts"},"excerpt":{"fr":"Statistique trimestrielle officielle. Recul des places vacantes (-16,4% sur un an au T1 2025). Indicateur de prévision d'emploi à 1,042 (vs 1,05 l'an précédent). Chômage BIT 4,7% (vs 4,3%). Source de référence pour les indicateurs Suisse de l'observatoire.","en":"Official quarterly statistics. Vacancies declining (-16.4% year-on-year in Q1 2025). Employment forecast indicator at 1.042 (vs 1.05 the previous year). ILO unemployment 4.7% (vs 4.3%). Reference source for the observatory's Swiss indicators."},"url":"https://www.bfs.admin.ch/bfs/fr/home/statistiques/industrie-services/entreprises-emplois/statistique-emploi/places-vacantes.html","ai_type":"automation_broad"},{"date":"2026-03-25","source":"Gartner · Will Sommer","country":"INT","title":{"fr":"Le LLM Cost Paradox : tokens -90% d'ici 2030, mais coûts d'inférence en hausse","en":"The LLM Cost Paradox: tokens -90% by 2030, but inference costs rising"},"excerpt":{"fr":"Gartner prédit que d'ici 2030, l'inférence sur un LLM de 1 trillion de paramètres coûtera aux fournisseurs plus de 90% de moins qu'en 2025. Mais cette baisse de coût unitaire ne sera PAS répercutée sur les clients enterprise. Les modèles agentiques consomment 5 à 30 fois plus de tokens par tâche qu'un chatbot standard. Conclusion : la consommation de tokens augmentera plus vite que le prix unitaire ne baissera, et les coûts globaux d'inférence augmenteront. Citation directe : « Les CPO ne doivent pas confondre la déflation des tokens commodity avec la démocratisation du raisonnement frontière. Tandis que l'intelligence commoditisée tend vers un coût quasi nul, le compute nécessaire au raisonnement avancé reste rare. »","en":"Gartner predicts that by 2030, inference on a 1-trillion-parameter LLM will cost providers over 90% less than in 2025. But this unit-cost decline will NOT be passed on to enterprise customers. Agentic models consume 5-30x more tokens per task than a standard chatbot. Conclusion: token consumption will rise faster than unit prices fall, and overall inference costs will rise. Direct quote: « CPOs should not confuse the deflation of commodity tokens with the democratization of frontier reasoning. As commoditized intelligence trends toward near-zero cost, the compute and systems needed to support advanced reasoning remain scarce. »"},"url":"https://www.gartner.com/en/newsroom/press-releases/2026-03-25-gartner-predicts-that-by-2030-performing-inference-on-an-llm-with-1-trillion-parameters-will-cost-genai-providers-over-90-percent-less-than-in-2025","ai_type":"generative"},{"date":"2026-03-25","source":"TrueFoundry · cost of generative AI guide","country":"INT","title":{"fr":"Les coûts cachés de la GenAI et comment les contrôler","en":"The Hidden Costs of GenAI and How to Control Them"},"excerpt":{"fr":"Guide opérationnel publié en mars 2026 qui décompose les coûts cachés de la GenAI en plusieurs strates invisibles dans les modèles financiers initiaux. Citant la recherche IBM : les coûts informatiques devraient augmenter de 89% entre 2023 et 2025, dont 70% des dirigeants citent la GenAI comme moteur principal. Tous les dirigeants interrogés ont déjà annulé ou reporté au moins une initiative GenAI pour des raisons de coûts. Près de 10% des prompts envoyés aux modèles GenAI publics contiennent des informations sensibles d'entreprise, créant un risque de conformité financièrement matériel rarement modélisé. Les coûts de gouvernance ne sont pas une checklist ponctuelle mais un coût opérationnel continu, fortement sous-estimé en production.","en":"Operational guide published March 2026 that decomposes the hidden costs of GenAI into multiple strata invisible in initial financial models. Citing IBM research: computing costs are expected to rise 89% between 2023 and 2025, with 70% of executives citing GenAI as the primary driver. Every executive surveyed had already cancelled or postponed at least one GenAI initiative due to costs. Nearly 10% of prompts sent to public GenAI models contain sensitive enterprise information, creating a materially financial compliance risk rarely modeled. Governance costs are not a one-time checklist but a continuous operational cost, largely underestimated in production."},"url":"https://www.truefoundry.com/blog/cost-of-generative-ai","ai_type":"generative"},{"date":"2026-03-25","source":"DARES · LaborIA","country":"FR","title":{"fr":"Comment l'IA transforme les pratiques de recrutement","en":"How AI transforms recruitment practices"},"excerpt":{"fr":"Travaux du LaborIA (Ministère du Travail × Inria) sur l'usage des algorithmes dans le recrutement. Biais documentés, équité dans les recommandations d'emploi, hommes vs femmes. Régulation et encadrement des solutions IA en RH. Études de cas sur 250 décideurs RH.","en":"LaborIA (Ministry of Labour × Inria) work on algorithm use in recruitment. Documented biases, fairness in job recommendations, men vs women. Regulation and oversight of HR AI solutions. Case studies on 250 HR decision-makers."},"url":"https://dares.travail-emploi.gouv.fr/evenement/comment-lintelligence-artificielle-transforme-les-pratiques-de-recrutement","ai_type":"generative"},{"date":"2026-03-16","source":"AISuperior · LLM Inference Cost 2026","country":"INT","title":{"fr":"Le LLM Cost Paradox : prix unitaire -10×, consommation +100×","en":"The LLM Cost Paradox: unit price -10×, consumption +100×"},"excerpt":{"fr":"Documentation empirique du paradoxe d'inflation des coûts. Le prix par token a baissé de 10× entre 2022 et 2026 (de 60$/M à 0,06$/M pour des modèles équivalents à GPT-3 sur MMLU), mais la consommation de tokens par requête a augmenté de 100× pour certains usages. Mécanisme principal : les reasoning models cachent leur consommation interne. Une question simple peut consommer 10 000 tokens de raisonnement pour une réponse de 200 tokens, soit 50× plus que ce que la sortie visible suggère. Cas extrême documenté : 600 tokens consommés pour générer 2 mots de sortie. Conclusion : les startups dont les modèles de pricing reposent sur l'économie traditionnelle des tokens font face à une compression de marge ; un client à 20$/mois peut générer 18-25$ de coûts d'inférence en pic.","en":"Empirical documentation of the cost inflation paradox. Per-token price dropped 10× between 2022 and 2026 (from $60/M to $0.06/M for GPT-3-equivalent models on MMLU), but token consumption per request rose 100× for some workloads. Main mechanism: reasoning models hide internal consumption. A simple question can consume 10,000 reasoning tokens for a 200-token response, 50× more than visible output suggests. Documented extreme case: 600 tokens to generate 2 words of output. Conclusion: startups whose pricing relies on traditional token economics face margin compression; a $20/month customer can generate $18-25 in peak inference costs."},"url":"https://aisuperior.com/llm-token-cost/","ai_type":"generative"},{"date":"2026-02-26","source":"Financial Times · Burn-Murdoch & O'Connor","country":"INT","title":{"fr":"Sait-on vraiment quels métiers sont les plus exposés à l'IA ?","en":"Do we really know which jobs are most at risk from AI?"},"excerpt":{"fr":"Critique méthodologique majeure : les sept mesures d'exposition par tâches (Eloundou OpenAI, Anthropic Economic Index, AIOE, Yale Budget Lab, etc.) s'accordent sur les métiers peu exposés mais divergent fortement sur les plus exposés. Au-delà de la capacité technique, trois facteurs pèsent : autonomie du travailleur, régulation institutionnelle (radiologie, thérapie), et effets de second ordre sur la demande. Citation centrale de David Autor (2003) : les technologies remplacent les exécutants de specs, complémentent les définisseurs.","en":"Major methodological critique: the seven task-based exposure measures (Eloundou OpenAI, Anthropic Economic Index, AIOE, Yale Budget Lab, etc.) agree on low-exposure jobs but diverge sharply on the most exposed. Beyond technical capability, three factors matter: worker autonomy, institutional regulation (radiology, therapy), and second-order demand effects. Central citation from David Autor (2003): technologies replace those who execute specs, complement those who define them."},"url":"https://www.ft.com/content/f55c4eba-6e10-4283-8eae-e9f475048b37","ai_type":"generative"},{"date":"2026-02-19","source":"Yale Budget Lab · Gimbel, Kendall, Kulsakdinun","country":"INT","title":{"fr":"L'exposition à l'IA sur le marché du travail : que sait-on vraiment ?","en":"Labor Market AI Exposure: What Do We Know?"},"excerpt":{"fr":"Étude systématique comparant 7 métriques d'exposition à l'IA (Eloundou OpenAI, Felten AIOE, Webb, Eisfeldt, Tomlinson Microsoft Copilot, etc.) sur 867 métiers SOC 2018. Conclusion en trois points : les métriques s'accordent largement, mais elles divergent davantage sur les métiers fortement exposés. Le désaccord porte sur l'ampleur de l'exposition, pas sur le fait qu'un métier soit exposé. L'exposition n'indique pas qu'un métier sera automatisé, seulement qu'il pourrait être impacté. Exemples canoniques : les plombiers ont une variance de 0,03 (consensus total sur faible exposition), les programmeurs informatiques ont 0,48 (désaccord majeur sur l'ampleur). Données ouvertes téléchargeables.","en":"Systematic study comparing 7 AI exposure metrics (Eloundou OpenAI, Felten AIOE, Webb, Eisfeldt, Tomlinson Microsoft Copilot, etc.) across 867 SOC 2018 occupations. Three key takeaways: metrics broadly agree, but disagree more on highly exposed occupations. Disagreement is about magnitude, not whether an occupation is exposed. Exposure does not indicate which jobs AI will automate, only where AI could have an impact. Canonical examples: plumbers have variance 0.03 (full consensus on low exposure), computer programmers have 0.48 (major disagreement on magnitude). Open data downloadable."},"url":"https://budgetlab.yale.edu/research/labor-market-ai-exposure-what-do-we-know","ai_type":"generative"},{"date":"2025-11-20","source":"Gartner · Hung LeHong","country":"INT","title":{"fr":"Coûts GenAI : les organisations sous-estiment de 500% à 1000% le coût total réel","en":"GenAI costs: organizations underestimate true total cost by 500% to 1000%"},"excerpt":{"fr":"Mesure structurante : les organisations qui ne maîtrisent pas la mise à l'échelle de leurs coûts GenAI font des erreurs de calcul de l'ordre de 500% à 1000%. 72% des CIO interrogés rapportent que leur organisation a fait du break-even ou perdu de l'argent sur ses investissements IA. La moitié des organisations abandonnent leurs efforts pour cause de dérapage des coûts. Ces erreurs ne portent pas sur le prix du token mais sur la combinaison consommation × intégration × gouvernance × supervision humaine × conformité. Recommandation Gartner : créer des proofs of concept qui testent la mise à l'échelle des coûts, pas seulement le fonctionnement de la technologie.","en":"Structural finding: organizations that don't master the scaling of their GenAI costs make calculation errors of 500% to 1000%. 72% of surveyed CIOs report their organization has broken even or lost money on AI investments. Half of organizations abandon their efforts due to cost overruns. These errors are not about token pricing but about the combination of consumption × integration × governance × human oversight × compliance. Gartner recommendation: create proofs of concept that test how costs will scale, not just how the technology works."},"url":"https://www.gartner.com/en/articles/ai-value","ai_type":"generative"},{"date":"2025-11-19","source":"Gartner · Arun Chandrasekaran","country":"INT","title":{"fr":"Les angles morts critiques de la GenAI que les CIO doivent traiter en urgence","en":"Critical GenAI Blind Spots That CIOs Must Urgently Address"},"excerpt":{"fr":"Gartner identifie en novembre 2025 dix angles morts de l'adoption GenAI, dont la dette technique générée par l'IA, le shadow AI (69% des organisations en ont des indices), le verrouillage fournisseur, et l'érosion des compétences. Prédiction marquante : d'ici 2030, 50% des entreprises feront face à des retards d'upgrades IA et/ou des coûts de maintenance croissants à cause d'une dette technique GenAI non gérée. « Le coût punitif élevé de maintenance, correction ou remplacement des artefacts générés par IA, qu'il s'agisse de code, contenu ou design, peut éroder le ROI promis par la GenAI. »","en":"Gartner identifies in November 2025 ten GenAI adoption blind spots, including AI-generated technical debt, shadow AI (69% of organizations show signs), vendor lock-in, and skills erosion. Notable prediction: by 2030, 50% of enterprises will face delayed AI upgrades and/or rising maintenance costs due to unmanaged GenAI technical debt. 'The punitively high cost of maintaining, fixing or replacing AI-generated artifacts such as code, content and design can erode GenAI's promised ROI.'"},"url":"https://www.gartner.com/en/newsroom/press-releases/2025-11-19-gartner-identifies-critical-genai-blind-spots-that-cios-must-urgently-address0","ai_type":"generative"},{"date":"2024-10-21","source":"Gartner · Mary Mesaglio & Hung LeHong","country":"INT","title":{"fr":"Erreur de calcul de coûts IA de 500% à 1000% : le risque que les CIO sous-estiment","en":"500% to 1000% AI Cost Calculation Error: The Risk CIOs Underestimate"},"excerpt":{"fr":"Source primaire de la statistique la plus citée sur les coûts cachés de l'IA. Sur la base d'une enquête Gartner de 451 leaders technologiques senior puis 300 CIO en juin-juillet 2024 : 90% des CIO déclarent que la gestion des coûts limite leur capacité à dégager de la valeur de l'IA, 72% rapportent que leur organisation a fait du break-even ou perdu de l'argent sur ses investissements IA. Citation décisive de l'analyste Hung LeHong : « si les CIO ne comprennent pas comment leurs coûts GenAI vont scaler, Gartner estime qu'ils peuvent faire une erreur de 500% à 1000% dans leurs calculs de coûts. » Cette statistique est devenue la référence pour parler des coûts cachés de l'IA en entreprise.","en":"Primary source for the most-cited statistic on AI hidden costs. Based on a Gartner survey of 451 senior tech leaders and then 300 CIOs in June-July 2024: 90% of CIOs say cost management limits their ability to extract value from AI, 72% report that their organization has broken even or lost money on AI investments. Decisive quote from analyst Hung LeHong: 'if CIOs don't understand how their GenAI costs will scale, Gartner estimates they could make a 500% to 1000% error in their cost calculations.' This statistic has become the reference for enterprise AI hidden costs."},"url":"https://www.gartner.com/en/newsroom/press-releases/2024-10-21-gartner-identifies-four-emerging-challenges-to-delivering-value-from-ai-safely-and-at-scale","ai_type":"generative"}];

// Page-level translations are merged in by each page before init()
window.PAGE_I18N = window.PAGE_I18N || { fr: {}, en: {} };

let CURRENT_LANG = localStorage.getItem("obs-lang") || "fr";

function t(key) {
  const merged = {
    ...I18N[CURRENT_LANG],
    ...(window.PAGE_I18N[CURRENT_LANG] || {})
  };
  return merged[key] || key;
}

function applyI18n() {
  document.documentElement.lang = CURRENT_LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    const html = el.hasAttribute("data-i18n-html");
    const value = t(key);
    if (html) el.innerHTML = value;
    else el.textContent = value;
  });
  document.querySelectorAll(".lang-toggle span").forEach((s) => {
    s.classList.toggle("active", s.getAttribute("data-lang") === CURRENT_LANG);
  });
  // Re-render dynamic sections if the page has a hook
  if (typeof window.onLangChange === "function") window.onLangChange(CURRENT_LANG);
}

function setupLangToggle() {
  const toggle = document.getElementById("langToggle");
  if (!toggle) return;
  toggle.addEventListener("click", () => {
    CURRENT_LANG = CURRENT_LANG === "fr" ? "en" : "fr";
    localStorage.setItem("obs-lang", CURRENT_LANG);
    applyI18n();
  });
}

function setupMobileMenu() {
  const menuBtn = document.getElementById("menuBtn");
  const closeBtn = document.getElementById("closeMenu");
  const mobileMenu = document.getElementById("mobileMenu");
  if (!menuBtn || !mobileMenu) return;
  menuBtn.addEventListener("click", () => mobileMenu.classList.add("open"));
  if (closeBtn) closeBtn.addEventListener("click", () => mobileMenu.classList.remove("open"));
  mobileMenu.querySelectorAll("a").forEach((a) => {
    a.addEventListener("click", () => mobileMenu.classList.remove("open"));
  });
}

function setupReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add("visible");
    });
  }, { threshold: 0.1 });
  document.querySelectorAll(".manifesto-text, .section-title, .stat, .kpi, .card, .field-card, .country-card, .dash-title")
    .forEach((el) => {
      el.classList.add("reveal");
      observer.observe(el);
    });
}

// Detect if we're in a subfolder (observatoires/ or briefings/) and build relative root
function rootPath() {
  // Pages in /observatoires/ or /briefings/ have one extra path segment
  const path = window.location.pathname;
  return (path.includes("/observatoires/") || path.includes("/briefings/")) ? "../" : "";
}

function setupBriefActions() {
  const actionsBar = document.getElementById("brief-actions");
  if (!actionsBar) return; // not a briefing page

  const modal = document.getElementById("brief-modal");
  const pdfContainer = document.getElementById("brief-pdf");
  if (!modal || !pdfContainer) return;

  // ---------- Helpers ----------
  function getText(key) {
    return window.t ? window.t(key) : key;
  }
  function getEl(selector) {
    return document.querySelector(selector);
  }
  function safeText(selector) {
    const el = getEl(selector);
    return el ? el.textContent.trim() : "";
  }
  function safeHtml(selector) {
    const el = getEl(selector);
    return el ? el.innerHTML : "";
  }

  // Detect prefix from page (b1, b2, b3) by scanning data-i18n keys
  function detectPrefix() {
    const t = document.querySelector("[data-i18n^='b1.']") ? "b1" :
              document.querySelector("[data-i18n^='b2.']") ? "b2" :
              document.querySelector("[data-i18n^='b3.']") ? "b3" : null;
    return t;
  }

  const prefix = detectPrefix();

  // ---------- Build concise PDF body ----------
  function buildPdfHtml() {
    const today = new Date();
    const dateStr = today.toLocaleDateString(
      window.CURRENT_LANG === "en" ? "en-US" : "fr-FR",
      { year: "numeric", month: "long", day: "numeric" }
    );

    const heroTitle = safeText(".brief-hero-title");
    const heroSub = safeText(".brief-hero-sub");
    const meta = Array.from(document.querySelectorAll(".brief-hero-meta span"))
      .map(s => s.textContent.trim()).filter(Boolean).join(" · ");

    // ROLES: collect role names (h3 inside .brief-role)
    const roles = Array.from(document.querySelectorAll(".brief-role h3, .brief-role-title"))
      .slice(0, 6)
      .map(h => h.textContent.trim())
      .filter(Boolean);

    // ARCHETYPES: collect arch-name + arch-tag
    const archetypes = Array.from(document.querySelectorAll(".brief-arch-card"))
      .map(card => {
        const name = card.querySelector(".brief-arch-name");
        const tag = card.querySelector(".brief-arch-tag");
        return name ? { name: name.textContent.trim(), tag: tag ? tag.textContent.trim() : "" } : null;
      })
      .filter(Boolean);

    // DEBATE: collect 3 positions
    const debatePositions = Array.from(document.querySelectorAll(".brief-debate-pos"))
      .map(pos => {
        const tag = pos.querySelector(".brief-debate-pos-tag");
        const claim = pos.querySelector(".brief-debate-pos-claim");
        return claim ? {
          tag: tag ? tag.textContent.trim() : "",
          claim: claim.textContent.trim()
        } : null;
      })
      .filter(Boolean);
    const debateSector = safeText(".brief-debate-sector-title");

    // TCO + Sovereignty takeaways (keep them short)
    const tcoTakeaway = safeText(".brief-tco-takeaway");
    const sovTakeaway = safeText(".brief-sov-takeaway");

    // Final action takeaway
    const archTakeaway = safeText(".brief-archetypes-takeaway");

    // Build URL canonical
    const url = window.location.origin + window.location.pathname;

    let html = `
      <header class="pdf-head">
        <div class="pdf-eyebrow">observatoire<span class="b">[s]</span>·ia <span class="dot">·</span> ${getText("brief.pdf.heading")}</div>
        <h1 class="pdf-title">${heroTitle}</h1>
        <div class="pdf-meta">${meta}</div>
        <div class="pdf-byline">${getText("brief.pdf.author")} <span class="dot">·</span> ${getText("brief.pdf.published")} ${dateStr}</div>
      </header>

      <section class="pdf-section">
        <h2>${getText("brief.pdf.summary")}</h2>
        <p>${heroSub}</p>
      </section>
    `;

    if (roles.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.roles")}</h2>
        <ul class="pdf-list">
          ${roles.map(r => `<li>${r}</li>`).join("")}
        </ul>
      </section>
      `;
    }

    if (archetypes.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.archetypes")}</h2>
        <ul class="pdf-list">
          ${archetypes.map(a => `<li><strong>${a.name}</strong>${a.tag ? ` <span class="pdf-tag">${a.tag}</span>` : ""}</li>`).join("")}
        </ul>
      </section>
      `;
    }

    if (debatePositions.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.debate")}</h2>
        <ul class="pdf-list">
          ${debatePositions.map(p => `<li><strong>${p.tag}</strong> · ${p.claim}</li>`).join("")}
        </ul>
        ${debateSector ? `<p class="pdf-callout">${debateSector}</p>` : ""}
      </section>
      `;
    }

    if (tcoTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.tco")}</h2>
        <p>${tcoTakeaway}</p>
      </section>
      `;
    }

    if (sovTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.sov")}</h2>
        <p>${sovTakeaway}</p>
      </section>
      `;
    }

    if (archTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.action")}</h2>
        <p>${archTakeaway}</p>
      </section>
      `;
    }

    html += `
      <footer class="pdf-foot">
        <div class="pdf-foot-url">${getText("brief.pdf.url")}: <a href="${url}">${url}</a></div>
        <div class="pdf-foot-license">${getText("brief.pdf.foot")}</div>
      </footer>
    `;

    return html;
  }

  // ---------- Modal control ----------
  function openModal() {
    pdfContainer.innerHTML = buildPdfHtml();
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  // ---------- Print ----------
  function doPrint() {
    // Use browser native print with a print-only stylesheet that hides everything except #brief-pdf
    document.body.classList.add("printing-pdf");
    window.print();
    setTimeout(() => document.body.classList.remove("printing-pdf"), 500);
  }

  // ---------- Mail ----------
  function sendByMail() {
    const heroTitle = safeText(".brief-hero-title");
    const heroSub = safeText(".brief-hero-sub");
    const url = window.location.origin + window.location.pathname;
    const isFr = (window.CURRENT_LANG !== "en");

    const subject = isFr
      ? `observatoire[s]·ia · ${heroTitle}`
      : `observatoire[s]·ia · ${heroTitle}`;

    const bodyLines = isFr ? [
      `Bonjour,`,
      ``,
      `Je vous transmets ce briefing sectoriel publié par observatoire[s]·ia :`,
      ``,
      heroTitle,
      ``,
      heroSub,
      ``,
      `Lecture intégrale : ${url}`,
      ``,
      `Données ouvertes (CC BY 4.0) et méthodologie sur observatoire.naullynicolas.ch`,
      ``,
      `Bien cordialement,`
    ] : [
      `Hello,`,
      ``,
      `Sharing this sectoral briefing published by observatoire[s]·ia:`,
      ``,
      heroTitle,
      ``,
      heroSub,
      ``,
      `Full reading: ${url}`,
      ``,
      `Open data (CC BY 4.0) and methodology on observatoire.naullynicolas.ch`,
      ``,
      `Best regards,`
    ];

    const mailto = "mailto:?subject=" + encodeURIComponent(subject)
                 + "&body=" + encodeURIComponent(bodyLines.join("\n"));
    window.location.href = mailto;
  }

  // ---------- Copy link ----------
  function copyLink() {
    const url = window.location.origin + window.location.pathname;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        showToast(getText("brief.copy.ok"));
      }).catch(() => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast(getText("brief.copy.ok")); } catch(e) {}
    document.body.removeChild(ta);
  }
  function showToast(message) {
    let toast = document.getElementById("brief-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "brief-toast";
      toast.className = "brief-toast";
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add("is-visible");
    setTimeout(() => toast.classList.remove("is-visible"), 2000);
  }

  // ---------- Wire up ----------
  const btnPdf = document.getElementById("btn-preview-pdf");
  const btnMail = document.getElementById("btn-send-mail");
  const btnCopy = document.getElementById("btn-copy-link");
  const btnPrint = document.getElementById("btn-do-print");

  if (btnPdf) btnPdf.addEventListener("click", openModal);
  if (btnMail) btnMail.addEventListener("click", sendByMail);
  if (btnCopy) btnCopy.addEventListener("click", copyLink);
  if (btnPrint) btnPrint.addEventListener("click", doPrint);

  // Close modal handlers
  modal.querySelectorAll("[data-modal-close]").forEach(el => {
    el.addEventListener("click", closeModal);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.getAttribute("aria-hidden") === "false") {
      closeModal();
    }
  });
}

window.setupBriefActions = setupBriefActions;

</script>

    "pt.f.submit": "Send my request",
    "pt.f.note": "Submitting the form opens your mail client with a pre-filled message to <strong>sayhi@naullynicolas.ch</strong>. No data is stored by this site. Reply within 48 working hours."
  }
};

function buildMailto() {
  const data = new FormData(document.getElementById("partnerForm"));
  const lang = window.CURRENT_LANG || "fr";
  const i18n = window.PAGE_I18N[lang];

  const typeLabels = {
    "association": i18n["pt.f.type.association"],
    "federation": i18n["pt.f.type.federation"],
    "public": i18n["pt.f.type.public"],
    "education": i18n["pt.f.type.education"],
    "ong": i18n["pt.f.type.ong"],
    "autre": i18n["pt.f.type.autre"]
  };
  const formatLabels = {
    "rapport": i18n["pt.f.format.rapport"],
    "serie": i18n["pt.f.format.serie"],
    "conference": i18n["pt.f.format.conference"],
    "atelier": i18n["pt.f.format.atelier"],
    "cartographie": i18n["pt.f.format.carto"],
    "discussion": i18n["pt.f.format.discussion"]
  };

  const subject = lang === "fr"
    ? "[Partenariat] Demande de " + (formatLabels[data.get("format")] || "")
    : "[Partnership] Request for " + (formatLabels[data.get("format")] || "");

  const lines = [
    lang === "fr" ? "Bonjour Naully," : "Hello Naully,",
    "",
    lang === "fr" ? "Je vous contacte au nom de mon organisation au sujet d'un partenariat." : "I'm writing on behalf of my organization regarding a partnership.",
    "",
    "===",
    (lang === "fr" ? "Nom : " : "Name: ") + data.get("name"),
    (lang === "fr" ? "Email : " : "Email: ") + data.get("email"),
    (lang === "fr" ? "Organisation : " : "Organization: ") + data.get("org"),
    (lang === "fr" ? "Fonction : " : "Role: ") + (data.get("role") || "==="),
    (lang === "fr" ? "Type : " : "Type: ") + (typeLabels[data.get("type")] || ""),
    (lang === "fr" ? "Format souhaité : " : "Desired format: ") + (formatLabels[data.get("format")] || ""),
    "===",
    "",
    data.get("message"),
    "",
    "===",
    (lang === "fr" ? "Envoyé depuis observatoire.naullynicolas.ch/partenariats" : "Sent from observatoire.naullynicolas.ch/partenariats")
  ];
  const body = lines.join("\n");
  return "mailto:sayhi@naullynicolas.ch?subject=" + encodeURIComponent(subject) +
         "&body=" + encodeURIComponent(body);
}

function handleSubmit(e) {
  e.preventDefault();
  const form = document.getElementById("partnerForm");
  const feedback = document.getElementById("formFeedback");
  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }
  const lang = window.CURRENT_LANG || "fr";
  feedback.textContent = lang === "fr"
    ? "Ouverture de votre client mail…"
    : "Opening your mail client…";
  feedback.classList.add("visible");
  feedback.style.borderColor = "var(--ink)";
  window.location.href = buildMailto();
}

initSite("partenariats");

document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("partnerForm");
  if (form) form.addEventListener("submit", handleSubmit);
});
</script>
</body>
</html>
