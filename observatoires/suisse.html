function setupBriefActions() {
  const actionsBar = document.getElementById("brief-actions");
  if (!actionsBar) return; // not a briefing page

  const modal = document.getElementById("brief-modal");
  const pdfContainer = document.getElementById("brief-pdf");
  if (!modal || !pdfContainer) return;

  // ---------- Helpers ----------
  function getText(key) {
    return window.t ? window.t(key) : key;
  }
  function getEl(selector) {
    return document.querySelector(selector);
  }
  function safeText(selector) {
    const el = getEl(selector);
    return el ? el.textContent.trim() : "";
  }
  function safeHtml(selector) {
    const el = getEl(selector);
    return el ? el.innerHTML : "";
  }

  // Detect prefix from page (b1, b2, b3) by scanning data-i18n keys
  function detectPrefix() {
    const t = document.querySelector("[data-i18n^='b1.']") ? "b1" :
              document.querySelector("[data-i18n^='b2.']") ? "b2" :
              document.querySelector("[data-i18n^='b3.']") ? "b3" : null;
    return t;
  }

  const prefix = detectPrefix();

  // ---------- Build concise PDF body ----------
  function buildPdfHtml() {
    const today = new Date();
    const dateStr = today.toLocaleDateString(
      window.CURRENT_LANG === "en" ? "en-US" : "fr-FR",
      { year: "numeric", month: "long", day: "numeric" }
    );

    const heroTitle = safeText(".brief-hero-title");
    const heroSub = safeText(".brief-hero-sub");
    const meta = Array.from(document.querySelectorAll(".brief-hero-meta span"))
      .map(s => s.textContent.trim()).filter(Boolean).join(" · ");

    // ROLES: collect role names (h3 inside .brief-role)
    const roles = Array.from(document.querySelectorAll(".brief-role h3, .brief-role-title"))
      .slice(0, 6)
      .map(h => h.textContent.trim())
      .filter(Boolean);

    // ARCHETYPES: collect arch-name + arch-tag
    const archetypes = Array.from(document.querySelectorAll(".brief-arch-card"))
      .map(card => {
        const name = card.querySelector(".brief-arch-name");
        const tag = card.querySelector(".brief-arch-tag");
        return name ? { name: name.textContent.trim(), tag: tag ? tag.textContent.trim() : "" } : null;
      })
      .filter(Boolean);

    // DEBATE: collect 3 positions
    const debatePositions = Array.from(document.querySelectorAll(".brief-debate-pos"))
      .map(pos => {
        const tag = pos.querySelector(".brief-debate-pos-tag");
        const claim = pos.querySelector(".brief-debate-pos-claim");
        return claim ? {
          tag: tag ? tag.textContent.trim() : "",
          claim: claim.textContent.trim()
        } : null;
      })
      .filter(Boolean);
    const debateSector = safeText(".brief-debate-sector-title");

    // TCO + Sovereignty takeaways (keep them short)
    const tcoTakeaway = safeText(".brief-tco-takeaway");
    const sovTakeaway = safeText(".brief-sov-takeaway");

    // Final action takeaway
    const archTakeaway = safeText(".brief-archetypes-takeaway");

    // Build URL canonical
    const url = window.location.origin + window.location.pathname;

    let html = `
      <header class="pdf-head">
        <div class="pdf-eyebrow">observatoire<span class="b">[s]</span>·ia <span class="dot">·</span> ${getText("brief.pdf.heading")}</div>
        <h1 class="pdf-title">${heroTitle}</h1>
        <div class="pdf-meta">${meta}</div>
        <div class="pdf-byline">${getText("brief.pdf.author")} <span class="dot">·</span> ${getText("brief.pdf.published")} ${dateStr}</div>
      </header>

      <section class="pdf-section">
        <h2>${getText("brief.pdf.summary")}</h2>
        <p>${heroSub}</p>
      </section>
    `;

    if (roles.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.roles")}</h2>
        <ul class="pdf-list">
          ${roles.map(r => `<li>${r}</li>`).join("")}
        </ul>
      </section>
      `;
    }

    if (archetypes.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.archetypes")}</h2>
        <ul class="pdf-list">
          ${archetypes.map(a => `<li><strong>${a.name}</strong>${a.tag ? ` <span class="pdf-tag">${a.tag}</span>` : ""}</li>`).join("")}
        </ul>
      </section>
      `;
    }

    if (debatePositions.length > 0) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.debate")}</h2>
        <ul class="pdf-list">
          ${debatePositions.map(p => `<li><strong>${p.tag}</strong> · ${p.claim}</li>`).join("")}

        ${debateSector ? `<p class="pdf-callout">${debateSector}</p>` : ""}
      </section>
      `;
    }

    if (tcoTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.tco")}</h2>
        <p>${tcoTakeaway}</p>
      </section>
      `;
    }

    if (sovTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.sov")}</h2>
        <p>${sovTakeaway}</p>
      </section>
      `;
    }

    if (archTakeaway) {
      html += `
      <section class="pdf-section">
        <h2>${getText("brief.pdf.action")}</h2>
        <p>${archTakeaway}</p>
      </section>
      `;
    }

    html += `
      <footer class="pdf-foot">
        <div class="pdf-foot-url">${getText("brief.pdf.url")}: <a href="${url}">${url}</a></div>
        <div class="pdf-foot-license">${getText("brief.pdf.foot")}</div>
      </footer>
    `;

    return html;
  }

  // ---------- Modal control ----------
  function openModal() {
    pdfContainer.innerHTML = buildPdfHtml();
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  // ---------- Print ----------
  function doPrint() {
    // Use browser native print with a print-only stylesheet that hides everything except #brief-pdf
    document.body.classList.add("printing-pdf");
    window.print();
    setTimeout(() => document.body.classList.remove("printing-pdf"), 500);
  }

  // ---------- Mail ----------
  function sendByMail() {
    const heroTitle = safeText(".brief-hero-title");
    const heroSub = safeText(".brief-hero-sub");
    const url = window.location.origin + window.location.pathname;
    const isFr = (window.CURRENT_LANG !== "en");

    const subject = isFr
      ? `observatoire[s]·ia · ${heroTitle}`
      : `observatoire[s]·ia · ${heroTitle}`;

    const bodyLines = isFr ? [
      `Bonjour,`,
      ``,
      `Je vous transmets ce briefing sectoriel publié par observatoire[s]·ia :`,
      ``,
      heroTitle,
      ``,
      heroSub,
      ``,
      `Lecture intégrale : ${url}`,
      ``,
      `Données ouvertes (CC BY 4.0) et méthodologie sur observatoire.naullynicolas.ch`,
      ``,
      `Bien cordialement,`
    ] : [
      `Hello,`,
      ``,
      `Sharing this sectoral briefing published by observatoire[s]·ia:`,
      ``,
      heroTitle,
      ``,
      heroSub,
      ``,
      `Full reading: ${url}`,
      ``,
      `Open data (CC BY 4.0) and methodology on observatoire.naullynicolas.ch`,
      ``,
      `Best regards,`
    ];

    const mailto = "mailto:?subject=" + encodeURIComponent(subject)
                 + "&body=" + encodeURIComponent(bodyLines.join("\n"));
    window.location.href = mailto;
  }

  // ---------- Copy link ----------
  function copyLink() {
    const url = window.location.origin + window.location.pathname;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        showToast(getText("brief.copy.ok"));
      }).catch(() => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast(getText("brief.copy.ok")); } catch(e) {}
    document.body.removeChild(ta);
  }
  function showToast(message) {
    let toast = document.getElementById("brief-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "brief-toast";
      toast.className = "brief-toast";
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add("is-visible");
    setTimeout(() => toast.classList.remove("is-visible"), 2000);
  }

  // ---------- Wire up ----------
  const btnPdf = document.getElementById("btn-preview-pdf");
  const btnMail = document.getElementById("btn-send-mail");
  const btnCopy = document.getElementById("btn-copy-link");
  const btnPrint = document.getElementById("btn-do-print");

  if (btnPdf) btnPdf.addEventListener("click", openModal);
  if (btnMail) btnMail.addEventListener("click", sendByMail);
  if (btnCopy) btnCopy.addEventListener("click", copyLink);
  if (btnPrint) btnPrint.addEventListener("click", doPrint);

  // Close modal handlers
  modal.querySelectorAll("[data-modal-close]").forEach(el => {
    el.addEventListener("click", closeModal);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.getAttribute("aria-hidden") === "false") {
      closeModal();
    }
  });
}

window.setupBriefActions = setupBriefActions;

</script>

const SECTOR_ADOPTION = [
  { fr: "Finance & Banque", en: "Finance & Banking", value: 68 },
  { fr: "Conseil & Services", en: "Consulting & Services", value: 54 },
  { fr: "Industrie pharma", en: "Pharma industry", value: 49 },
  { fr: "Horlogerie & Luxe", en: "Watchmaking & Luxury", value: 31 },
  { fr: "Construction", en: "Construction", value: 18 },
  { fr: "Hôtellerie", en: "Hospitality", value: 12 }
];

let observatoires = [];
let activeFilters = { type: "all", domain: "all" };

async function loadData() {
  observatoires = window.OBSERVATOIRES_DATA.filter((o) => o.country === "CH");
  renderCards();
  renderChart();
}

function renderCards() {
  const grid = document.getElementById("cardsGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const lang = window.CURRENT_LANG;

  const filtered = observatoires.filter((o) => {
    const ty = activeFilters.type === "all" || o.type === activeFilters.type;
    const d = activeFilters.domain === "all" || o.domains.includes(activeFilters.domain);
    return ty && d;
  });

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "card-empty-state";
    empty.textContent = window.t("empty");
    grid.appendChild(empty);
    return;
  }

  filtered.forEach((o) => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = o.url;
    card.target = "_blank";
    card.rel = "noopener";

    const meta = document.createElement("div");
    meta.className = "card-meta mono";
    const flag = document.createElement("span");
    flag.className = "flag flag-ch";
    const dot = document.createElement("span");
    dot.className = "flag-dot";
    flag.appendChild(dot);
    flag.appendChild(document.createTextNode("Suisse"));
    meta.appendChild(flag);
    const typeSpan = document.createElement("span");
    typeSpan.textContent = window.t("type." + o.type);
    meta.appendChild(typeSpan);
    card.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = o.nom;
    card.appendChild(title);

    const org = document.createElement("div");
    org.className = "card-org";
    org.textContent = o.org[lang];
    card.appendChild(org);

    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = o.desc[lang];
    card.appendChild(desc);

    const tags = document.createElement("div");
    tags.className = "card-tags";
    o.domains.forEach((d) => {
      const tag = document.createElement("span");
      tag.className = "card-tag";
      tag.textContent = window.t("domain." + d);
      tags.appendChild(tag);
    });
    card.appendChild(tags);

    const footer = document.createElement("div");
    footer.className = "card-footer";
    const lastSpan = document.createElement("span");
    lastSpan.textContent = window.t("card.last") + " · " + o.last;
    footer.appendChild(lastSpan);
    const linkSpan = document.createElement("span");
    linkSpan.className = "visit";
    linkSpan.textContent = window.t("card.visit");
    footer.appendChild(linkSpan);
    card.appendChild(footer);

    grid.appendChild(card);
  });
}

function renderChart() {
  const chart = document.getElementById("chBarChart");
  if (!chart) return;
  chart.innerHTML = "";
  const lang = window.CURRENT_LANG;
  const max = 100;

  SECTOR_ADOPTION.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "bar-row";

    const label = document.createElement("div");
    label.textContent = s[lang];
    row.appendChild(label);

    const track = document.createElement("div");
    track.className = "bar-track";
    const fill = document.createElement("div");
    fill.className = "bar-fill" + (i < 2 ? " signal" : "");
    fill.style.width = "0%";
    track.appendChild(fill);
    row.appendChild(track);

    const value = document.createElement("div");
    value.className = "bar-value";
    value.textContent = s.value + "%";
    row.appendChild(value);

    chart.appendChild(row);

    // Animate after a tick
    setTimeout(() => {
      fill.style.width = (s.value / max * 100) + "%";
    }, 100 + i * 80);
  });
}

document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const filter = chip.getAttribute("data-filter");
    const value = chip.getAttribute("data-value");
    activeFilters[filter] = value;
    document.querySelectorAll(".chip[data-filter=\"" + filter + "\"]").forEach((c) => c.classList.remove("active"));
    chip.classList.add("active");
    renderCards();
  });
});

window.onLangChange = function() {
  renderCards();
  renderChart();
};

// Accordion toggle for reinvent section
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll("#chReinventList .reinvent-trigger").forEach(function(trigger) {
    trigger.addEventListener("click", function() {
      var item = trigger.closest(".reinvent-item");
      item.classList.toggle("open");
    });
  });
});

initSite("suisse");
loadData();
